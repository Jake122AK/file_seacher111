    let c = [r / total, g / total, b / total];

    }

};

    const lg = c.createGain(); lg.gain.value = 600;

        o.type = 'sawtooth';

        const g = c.createGain(); g.gain.setValueAtTime(.2, t); g.gain.exponentialRampToValueAtTime(.001, t + .18);
        n.connect(f); f.connect(g); g.connect(this.sfxGain); n.start(t); n.stop(t + .2);
        break;
      }
      case 'ignition': {
        const o = c.createOscillator(), g = c.createGain();
        o.type = 'sawtooth';
        o.frequency.setValueAtTime(30, t);
        o.frequency.linearRampToValueAtTime(140, t + .55);
        o.frequency.linearRampToValueAtTime(72, t + 1.1);

        g.gain.linearRampToValueAtTime(.10, t + 1.2);
        g.gain.exponentialRampToValueAtTime(.001, t + 1.5);
        o.connect(f); f.connect(g); g.connect(this.sfxGain); o.start(t); o.stop(t + 1.6);

        const f = c.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 2;
        f.frequency.setValueAtTime(300, t); f.frequency.exponentialRampToValueAtTime(4000, t + .7);
        const g = c.createGain(); g.gain.setValueAtTime(.001, t);

/* ===== src/input.js ===== */
/* =====================================================================
   input.js — 片手ドラッグステアリング / タップ / ジャイロ(オプション)
   ---------------------------------------------------------------------
   ・画面のどこを触っても良いが、下部 45% は「ハンドル領域」として扱い
     指の横移動量がそのままステアリングに乗る（実車シムではなく音ゲー感）。
   ・タップ（短時間・小移動）は tap イベントとして通知（キノコ等）。
   ===================================================================== */
(function (PX) {
'use strict';
const M = PX.M;

class Input {
  constructor(el, pixel) {
    this.el = el; this.pixel = pixel;
    this.raw = 0;          // -1..1 目標ステア
    this.steer = 0;        // 平滑化後
    this.vel = 0;
    this.active = false;
    this.touchX = 0; this.touchY = 0;
    this.startX = 0; this.startY = 0; this.startT = 0;
    this.anchor = 0;
    this.taps = [];        // {x,y} 内部解像度座標
    this.gyro = false; this.gyroBase = null; this.gyroVal = 0;
    this.sensitivity = 1.55;
    this.lastMoveT = 0;
    this.wheelKick = 0;    // 演出用: 急な操作量

    const opts = { passive: false };
    el.addEventListener('touchstart', e => this._down(e.changedTouches[0], e), opts);
    el.addEventListener('touchmove', e => this._move(e.changedTouches[0], e), opts);
    el.addEventListener('touchend', e => this._up(e.changedTouches[0], e), opts);
    el.addEventListener('touchcancel', e => this._up(e.changedTouches[0], e), opts);
    el.addEventListener('mousedown', e => this._down(e, e));
    window.addEventListener('mousemove', e => { if (this.active) this._move(e, e); });
    window.addEventListener('mouseup', e => this._up(e, e));
    window.addEventListener('keydown', e => this._key(e, 1));
    window.addEventListener('keyup', e => this._key(e, 0));
    this.keyL = 0; this.keyR = 0;
  }

  _pt(t) {
    const r = this.el.getBoundingClientRect();
    return {
      x: (t.clientX - r.left) / r.width * this.pixel.w,
      y: (t.clientY - r.top) / r.height * this.pixel.h
    };
  }

  _down(t, e) {
    if (e.preventDefault) e.preventDefault();
    const p = this._pt(t);
    this.active = true;
    this.touchX = p.x; this.touchY = p.y;
    this.startX = p.x; this.startY = p.y;
    this.startT = performance.now();
    this.anchor = p.x - this.raw * (this.pixel.w * .34);
  }

  _move(t, e) {
    if (e.preventDefault) e.preventDefault();
    if (!this.active) return;
    const p = this._pt(t);
    this.touchX = p.x; this.touchY = p.y;
    const prev = this.raw;
    // アンカー相対 + 絶対位置のブレンド → どこを持っても直感的
    const rel = (p.x - this.anchor) / (this.pixel.w * .34);
    const abs = (p.x - this.pixel.w * .5) / (this.pixel.w * .42);
    this.raw = M.clamp(M.lerp(rel, abs, .35) * this.sensitivity, -1.35, 1.35);
    const d = Math.abs(this.raw - prev);
    if (d > .09) this.wheelKick = Math.min(1, this.wheelKick + d);
    this.lastMoveT = performance.now();
  }

  _up(t, e) {
    if (!this.active) return;
    if (e.preventDefault) e.preventDefault();
    const p = this._pt(t);
    const dt = performance.now() - this.startT;
    const dist = Math.hypot(p.x - this.startX, p.y - this.startY);
    if (dt < 320 && dist < 6) this.taps.push({ x: p.x, y: p.y });
    this.active = false;
  }

  _key(e, v) {
    if (e.key === 'ArrowLeft' || e.key === 'a') { this.keyL = v; e.preventDefault(); }
    if (e.key === 'ArrowRight' || e.key === 'd') { this.keyR = v; e.preventDefault(); }
    if (v && (e.key === ' ' || e.key === 'Enter')) this.taps.push({ x: this.pixel.w / 2, y: this.pixel.h / 2 });
  }

  enableGyro() {
    const start = () => {
      this.gyro = true;
      window.addEventListener('deviceorientation', ev => {
        if (ev.gamma == null) return;
        if (this.gyroBase === null) this.gyroBase = ev.gamma;
        this.gyroVal = M.clamp((ev.gamma - this.gyroBase) / 22, -1.2, 1.2);
      });
    };
    const DOE = window.DeviceOrientationEvent;
    if (DOE && typeof DOE.requestPermission === 'function') {
      DOE.requestPermission().then(r => { if (r === 'granted') start(); }).catch(() => {});
    } else if (DOE) start();
  }
  disableGyro() { this.gyro = false; this.gyroBase = null; }

  takeTaps() { const t = this.taps; this.taps = []; return t; }

  update(dt) {
    let target = this.raw;
    if (this.keyL || this.keyR) target = M.clamp(target + (this.keyR - this.keyL) * 1.15, -1.2, 1.2);
    if (this.gyro) target = M.clamp(target + this.gyroVal, -1.3, 1.3);
    if (!this.active && !this.keyL && !this.keyR && !this.gyro) {
      // 指を離したら緩やかにセンターへ（完全には戻さない = 音ゲー的追従）
      this.raw = M.approach(this.raw, 0, 1.1, dt);
      target = this.raw;
    }
    const prev = this.steer;
    this.steer = M.approach(this.steer, M.clamp(target, -1.15, 1.15), 17, dt);
    this.vel = (this.steer - prev) / Math.max(.0001, dt);
    this.wheelKick = M.approach(this.wheelKick, 0, 3.5, dt);
  }
}

PX.Input = Input;
})(window.PX);

/*
  drawTree — 街路樹 ↔ ヤシの木 ↔ 星 のモーフィング
  m : 0 = 広葉樹(住宅街) / 1 = ヤシ / 2 = 星化(先端が星になる)
*/
P.tree = function (p, x, base, hgt, m, sway, col, colB, alpha, hue) {
  const palm = M.sat(m), star = M.sat(m - 1);
  const trunkW = Math.max(1, Math.round(M.lerp(hgt * .11, hgt * .055, palm)));
  const th = hgt * M.lerp(.55, .78, palm);
  const trunkCol = C.mix(col, [120, 86, 54], .0);
  const a = alpha === undefined ? 1 : alpha;
  const ctx = p.ctx;
  ctx.globalAlpha = a;

  // 幹（ヤシほど反る）
  let px_ = x, topX = x;
  const seg = Math.max(3, Math.round(th / 2));
  for (let i = 0; i < seg; i++) {
    const t = i / (seg - 1);
    const bend = Math.sin(t * 1.5) * palm * hgt * .14 + sway * t * t;
    const y = base - th * t;
    const w = M.lerp(trunkW, trunkW * M.lerp(1, .6, palm), t);
    px_ = x + bend;
    ctx.fillStyle = C.css(C.mix(trunkCol, colB, t * .25 * (1 - palm)));
    ctx.fillRect(Math.round(px_ - w / 2), Math.round(y), Math.max(1, Math.round(w)), 2);
    if (palm > .35 && i % 3 === 0) {
      ctx.fillStyle = C.css(C.scale(trunkCol, .78));
      ctx.fillRect(Math.round(px_ - w / 2), Math.round(y), Math.max(1, Math.round(w)), 1);
    }
    topX = px_;
  }
  const topY = base - th;

  if (star < .999) {
    if (palm < .5) {
      // 広葉樹: 塊の葉
      const r = hgt * M.lerp(.30, .16, palm * 2);
      const k = 1 - palm * 2;
      p.circle(topX, topY - r * .5, r * .95, C.css(col), a * k);
      p.circle(topX - r * .6, topY - r * .1, r * .62, C.css(colB), a * k);
      p.circle(topX + r * .62, topY - r * .18, r * .58, C.css(colB), a * k);
      p.circle(topX + r * .1, topY - r * 1.1, r * .55, C.css(C.scale(col, 1.14)), a * k);
    }
    if (palm > .3) {
      // ヤシ: 葉を放射状に
      const k = M.sat((palm - .3) / .55) * (1 - star);
      const n = 7;
      const fl = hgt * .38;
      for (let i = 0; i < n; i++) {
        const ang = Math.PI + (i / (n - 1)) * Math.PI + Math.sin(i * 2.1) * .12;
        const droop = .55 + M.hash(i * 3.1) * .4;
        const c = i % 2 ? col : colB;
        ctx.fillStyle = C.css(c);
        let fx = topX, fy = topY;
        const steps = Math.max(3, Math.round(fl / 1.6));
        for (let s = 0; s < steps; s++) {
          const t = s / steps;
          const aa = ang + t * droop * (Math.cos(ang) > 0 ? .9 : -.9);
          fx += Math.cos(aa) * 1.7;
          fy += Math.sin(aa) * 1.7 * .9;
          const w = Math.max(1, Math.round(M.lerp(3, 1, t) * k));
          ctx.globalAlpha = a * k;
          ctx.fillRect(Math.round(fx), Math.round(fy - w / 2), 2, w);
        }
      }
      ctx.globalAlpha = a;
      // ココナッツ
      if (k > .6) { p.circle(topX - 2, topY + 2, 1.6, C.css([90, 60, 30]), a); p.circle(topX + 2, topY + 3, 1.4, C.css([90, 60, 30]), a); }
    }
  }
  if (star > .01) {
    // 先端が星になる（宇宙への入口）
    const r = hgt * .18 * star;
    P.star(p, topX, topY - r * .4, r, C.css([255, 255, 240]), a * star);
    p.circle(topX, topY - r * .4, r * .35, '#ffffff', a * star);
  }
  ctx.globalAlpha = 1;
};

/*
  carRear — 後方から見た自車。三人称の主役なので手を入れてある。
  halfW: 画面上の半車幅(px)。すべての寸法をこれ基準にするので
  遠近で拡大縮小しても比率が崩れない。
  o: {bank, bounce, brake, beat, body, glass, hue}
*/
P.carRear = function (p, x, base, halfW, o) {
  o = o || {};
  const ctx = p.ctx;
  const u = halfW / 9;                       // 基本単位
  if (u < .18) return;
  const W = Math.round(halfW * 2);
  const bank = o.bank || 0;
  const bounce = Math.round((o.bounce || 0) * u * .9);
  const body = o.body || [190, 60, 90];
  const dark = C.scale(body, .55);
  const dark2 = C.scale(body, .34);
  const hi = C.scale(body, 1.28);
  const glass = o.glass || [70, 92, 130];
  const x0 = Math.round(x - halfW);
  const y = Math.round(base) + bounce;
  const R = (dx, dy, w2, h2, c, a) => {
    if (a === undefined) p.rect(x0 + dx * u, y + dy * u, Math.max(1, w2 * u), Math.max(1, h2 * u), c);
    else p.rectA(x0 + dx * u, y + dy * u, Math.max(1, w2 * u), Math.max(1, h2 * u), c, a);
  };

  /* 影（接地感） */
  ctx.globalAlpha = .38;
  ctx.fillStyle = '#000';
  for (let i = 0; i < Math.max(1, Math.round(u * 1.6)); i++) {
    const k = i / Math.max(1, u * 1.6);
    const ww = W * (1.06 - k * .3);
    ctx.fillRect(Math.round(x - ww / 2), y - i, Math.round(ww), 1);
  }
  ctx.globalAlpha = 1;

  /* タイヤ */
  R(-0.4, -3.2, 2.6, 3.2, [22, 20, 28]);
  R(15.8, -3.2, 2.6, 3.2, [22, 20, 28]);
  R(-0.2, -2.6, 2.2, 1.1, [58, 56, 70]);
  R(16.0, -2.6, 2.2, 1.1, [58, 56, 70]);

  /* 車体下部 → 上部 */
  R(0.6, -4.2, 16.8, 1.2, dark2);                    // バンパー下
  R(0.2, -7.0, 17.6, 2.9, dark);                     // バンパー
  R(0.8, -10.4, 16.4, 3.5, body);                    // ボディ
  R(0.8, -10.4, 16.4, .8, hi);                       // ハイライト
  R(1.0, -7.6, 16.0, .6, C.scale(body, .8));         // プレスライン

  /* キャビン（バンクでわずかにずれる = 車が傾いて見える） */
  const bx = bank * 1.1;
  R(3.2 + bx, -15.6, 11.6, 5.4, C.mix(body, dark, .28));
  R(3.2 + bx, -15.6, 11.6, .7, C.scale(body, 1.12));
  R(4.2 + bx, -14.8, 9.6, 3.7, glass);               // リアガラス
  R(4.2 + bx, -14.8, 9.6, .8, C.mix(glass, [255, 255, 255], .35));
  R(8.6 + bx, -14.8, .7, 3.7, C.mix(body, dark, .5)); // ガラスの桟
  // ルーフ
  R(3.6 + bx, -16.4, 10.8, .9, C.scale(body, .92));
  // スポイラー
  R(2.2, -11.2, 13.6, .9, dark);
  R(2.2, -11.9, 1.4, .9, dark);
  R(14.4, -11.9, 1.4, .9, dark);

  /* テールランプ（ビートで光る） */
  const glow = M.sat(.45 + (o.beat || 0) * .8 + (o.brake || 0));
  const lamp = C.mix([210, 40, 50], [255, 170, 150], glow * .55);
  R(1.4, -9.6, 3.4, 1.9, lamp);
  R(13.2, -9.6, 3.4, 1.9, lamp);
  if (glow > .5 && u > .5) {
    p.circle(x0 + 3.1 * u, y - 8.6 * u, u * 2.4, C.cssa(lamp, .16 * glow));
    p.circle(x0 + 14.9 * u, y - 8.6 * u, u * 2.4, C.cssa(lamp, .16 * glow));
  }
  // ナンバー灯
  R(7.6, -6.4, 2.8, 1.3, C.mix([230, 226, 210], body, .25));
  // 排気
  R(2.0, -4.6, 1.6, .8, [40, 38, 48]);
  R(13.8, -4.6, 1.6, .8, [40, 38, 48]);
};


/* =====================================================================
   遠近のある建物 / 立体感のある樹木
   ここが「オブジェクトが荒い・遠近法が働いていない」への回答。
   ===================================================================== */

/*
  building2 — 正面 + 側面（消失点へ後退する面）+ 屋根で立体に見せる。
  x は「道路側の内側エッジ」の位置。建物は必ず外側へ伸びるので、
  どれだけ巨大化しても道路にはみ出さない。
  o: {vx, vy, k, w, h, tall, seed, alpha, melt, breathe, win, winOff, body, roof, beatWin, blink, dir}
     dir : +1 = 画面右側にある（左面が見える） / -1 = 左側（右面が見える）
     k   : 側面の後退量 0..1（奥行き / (距離+奥行き)）
*/
P.building2 = function (p, x, base, o) {
  const ctx = p.ctx;
  const a = o.alpha === undefined ? 1 : o.alpha;
  if (a <= .01) return;
  const w = Math.max(3, Math.round(o.w));
  const h = Math.max(4, Math.round(o.h * (1 + (o.breathe || 0) * .04)));
  const dir = o.dir >= 0 ? 1 : -1;
  const k = M.clamp(o.k === undefined ? .3 : o.k, .04, .78);
  const vx = o.vx, vy = o.vy;
  const tall = M.sat(o.tall || 0);
  const melt = M.sat(o.melt || 0);
  const body = o.body || [60, 54, 82];
  const side = C.scale(body, .62);
  const roofC = o.roof || C.scale(body, .8);
  const winOn = o.win || [255, 214, 140];
  const winOff = o.winOff || C.scale(body, .55);
  const seed = o.seed || 1;

  // 正面の矩形（内側エッジ x から外側 dir 方向へ）
  const xIn = Math.round(x);
  const xOut = Math.round(x + dir * w);
  const fx0 = Math.min(xIn, xOut), fx1 = Math.max(xIn, xOut);
  const yTop = Math.round(base - h), yBase = Math.round(base);
  ctx.globalAlpha = a;

  /* --- 側面（内側エッジから消失点へ後退） --- */
  const xf = xIn + (vx - xIn) * k;
  const yTopF = yTop + (vy - yTop) * k;
  const yBaseF = yBase + (vy - yBase) * k;
  const step = xf >= xIn ? 1 : -1;
  const nCols = Math.abs(Math.round(xf - xIn));
  if (nCols > 0) {
    for (let i = 0; i <= nCols; i++) {
      const t = i / nCols;
      const cx2 = xIn + step * i;
      const ty = Math.round(M.lerp(yTop, yTopF, t));
      const by = Math.round(M.lerp(yBase, yBaseF, t));
      if (by <= ty) continue;
      ctx.fillStyle = C.css(C.mix(side, C.scale(side, .72), t));
      ctx.fillRect(cx2, ty, 1, by - ty);
    }
    // 側面の窓（奥行きが伝わる）
    const sc2 = Math.max(2, Math.round(h / 9));
    for (let i = 2; i < nCols - 1; i += Math.max(3, Math.round(nCols / 3))) {
      const t = i / nCols;
      for (let r = 0; r < Math.max(1, Math.floor(h / (sc2 * 2))); r++) {
        const ty = M.lerp(yTop, yTopF, t) + sc2 * (1 + r * 2);
        if (ty > M.lerp(yBase, yBaseF, t) - 2) break;
        const on = M.hash2(i * 1.7 + seed, r * 2.3) > .45;
        ctx.fillStyle = C.css(C.mix(on ? winOn : winOff, side, .45));
        ctx.fillRect(xIn + step * i, Math.round(ty), Math.max(1, Math.round(sc2 * .7)), Math.max(1, Math.round(sc2 * .8)));
      }
    }
  }

  /* --- 屋根 --- */
  if (tall < .65) {
    const rh = Math.max(2, Math.round(h * .26 * (1 - tall)));
    ctx.fillStyle = C.css(roofC);
    for (let i = 0; i < rh; i++) {
      const t = i / Math.max(1, rh - 1);
      const ww = Math.round(w * (.12 + .88 * t)) + 2;
      const rx = dir > 0 ? xIn - 1 : xIn + 1 - ww;
      ctx.fillStyle = C.css(C.mix(C.scale(roofC, 1.18), roofC, t));
      ctx.fillRect(rx, yTop - rh + i, ww, 1);
    }
    // 屋根の側面
    if (nCols > 0) {
      ctx.fillStyle = C.css(C.scale(roofC, .68));
      for (let i = 0; i <= nCols; i++) {
        const t = i / nCols;
        const ty = Math.round(M.lerp(yTop - rh, yTopF - rh * (1 - t * .5), t));
        ctx.fillRect(xIn + step * i, ty, 1, Math.max(1, Math.round(rh * (1 - t * .5))));
      }
    }
  } else {
    // 屋上（上面が見える）
    ctx.fillStyle = C.css(C.scale(body, 1.2));
    ctx.fillRect(fx0, yTop - 2, w, 2);
    if (nCols > 0) {
      for (let i = 0; i <= nCols; i++) {
        const t = i / nCols;
        ctx.fillStyle = C.css(C.mix(C.scale(body, 1.1), C.scale(body, .8), t));
        ctx.fillRect(xIn + step * i, Math.round(M.lerp(yTop - 2, yTopF - 2, t)), 1, 2);
      }
    }
    ctx.fillStyle = C.css(o.antenna || [255, 70, 100]);
    ctx.fillRect(Math.round((fx0 + fx1) / 2), yTop - 8, 1, 7);
    if (o.blink) ctx.fillRect(Math.round((fx0 + fx1) / 2) - 1, yTop - 9, 3, 2);
  }

  /* --- 正面 --- */
  ctx.fillStyle = C.css(body);
  ctx.fillRect(fx0, yTop, w, h);
  ctx.fillStyle = C.css(C.scale(body, 1.14));
  ctx.fillRect(fx0, yTop, w, 1);
  ctx.fillStyle = C.css(C.scale(body, .78));
  ctx.fillRect(dir > 0 ? fx1 - 1 : fx0, yTop, 1, h);

  /* --- 正面の窓 --- */
  const ws = Math.max(2, Math.round(Math.min(w / 3.2, h / 6)));
  const cols = Math.max(1, Math.floor((w - 2) / (ws + 2)));
  const rowsN = Math.max(1, Math.floor((h - 2) / (ws + 3)));
  for (let r = 0; r < rowsN; r++) {
    for (let c = 0; c < cols; c++) {
      const wx = fx0 + 2 + c * (ws + 2);
      const wy = yTop + 3 + r * (ws + 3);
      if (wy + ws > yBase - 1 || wx + ws > fx1 - 1) continue;
      const hsh = M.hash2(c + seed * 7.3, r + seed * 2.1);
      if (melt > .3 && hsh > .55) {
        P.star(p, wx + ws / 2, wy + ws / 2, 1 + melt * 2, '#ffffff', a * M.sat((melt - .3) / .5));
        continue;
      }
      let on = hsh > .38;
      if (o.beatWin !== undefined) on = hsh > .38 - o.beatWin * .35;
      const blink = o.blink && M.hash2(c * 3.1 + seed, r * 1.7) < o.blink;
      ctx.fillStyle = C.css(on ? winOn : winOff);
      if (blink) ctx.fillRect(wx, wy + Math.floor(ws / 2), ws, 1);
      else {
        ctx.fillRect(wx, wy, ws, ws);
        if (on && ws >= 3) {
          ctx.fillStyle = C.css(C.mix(winOn, [255, 255, 255], .4));
          ctx.fillRect(wx, wy, ws, 1);
        }
      }
    }
  }
  // 1階のドア（低層のみ）
  if (tall < .5 && h > 10) {
    const dw = Math.max(2, Math.round(ws * 1.1)), dh = Math.max(3, Math.round(ws * 1.8));
    const dx = Math.round((fx0 + fx1) / 2 - dw / 2);
    ctx.fillStyle = C.css(C.scale(body, .5));
    ctx.fillRect(dx, yBase - dh, dw, dh);
    ctx.fillStyle = C.css(C.mix(winOn, body, .4));
    ctx.fillRect(dx + dw - 1, yBase - Math.round(dh * .55), 1, 1);
  }
  ctx.globalAlpha = 1;
};

/*
  tree2 — 立体感のある樹木。species で見た目を変える。
  0: 広葉樹（丸） / 1: 針葉樹（円錐） / 2: 細長い樹（ポプラ）
  m: 0=通常樹 1=ヤシ 2=星化（従来の tree と同じモーフ軸）
*/
P.tree2 = function (p, x, base, h, o) {
  const m = o.m || 0;
  const palm = M.sat(m), star = M.sat(m - 1);
  if (palm > .35 || star > .01) { P.tree(p, x, base, h, m, o.sway || 0, o.colA, o.colB, o.alpha); return; }
  const ctx = p.ctx;
  const a = o.alpha === undefined ? 1 : o.alpha;
  const sp = o.species | 0;
  const sway = o.sway || 0;
  const colA = o.colA || [92, 162, 78];        // 明部
  const colB = o.colB || [52, 110, 58];        // 暗部
  const rim = C.mix(colA, [255, 255, 230], .28);
  const trunk = o.trunk || [78, 56, 42];
  ctx.globalAlpha = a;

  // 幹
  const th = h * (sp === 1 ? .22 : sp === 2 ? .30 : .40);
  const tw = Math.max(1, Math.round(h * .075));
  for (let i = 0; i < th; i++) {
    const t = i / th;
    const ww = Math.max(1, Math.round(tw * (1 - t * .35)));
    const bx = x + sway * t * t * .5;
    ctx.fillStyle = C.css(C.mix(trunk, C.scale(trunk, 1.3), t * .4));
    ctx.fillRect(Math.round(bx - ww / 2), Math.round(base - i), ww, 1);
    ctx.fillStyle = C.css(C.scale(trunk, .7));
    ctx.fillRect(Math.round(bx - ww / 2), Math.round(base - i), 1, 1);
  }
  const topX = x + sway * .5, topY = base - th;

  if (sp === 1) {
    // 針葉樹: 段重ねの三角
    const tiers = 3;
    for (let s2 = 0; s2 < tiers; s2++) {
      const ft = s2 / tiers;
      const cy = topY - h * (.10 + ft * .52);
      const rw = h * (.34 - ft * .10);
      const hh = h * .30;
      for (let i = 0; i < hh; i++) {
        const t = i / hh;
        const ww = rw * (1 - t);
        const off = sway * (ft + t * .3) * .6;
        ctx.fillStyle = C.css(C.mix(colB, colA, t * .5 + .18));
        ctx.fillRect(Math.round(topX - ww + off), Math.round(cy - i), Math.max(1, Math.round(ww * 2)), 1);
      }
      ctx.fillStyle = C.css(rim);
      ctx.fillRect(Math.round(topX - rw * .5 + sway * ft * .6), Math.round(cy - hh * .55), Math.max(1, Math.round(rw * .5)), 1);
    }
  } else {
    // 広葉樹 / ポプラ: 塊を重ねて陰影をつける
    const rx = h * (sp === 2 ? .17 : .30);
    const ry = h * (sp === 2 ? .40 : .28);
    const cy = topY - ry * .72;
    const blobs = sp === 2
      ? [[0, 0, 1], [0, -.5, .8], [0, .45, .85]]
      : [[0, 0, 1], [-.62, .22, .66], [.64, .16, .62], [-.2, -.6, .6], [.3, -.52, .56]];
    // 暗部を先に置く
    for (const bl of blobs) {
      const bx = topX + bl[0] * rx + sway * .8, by = cy + bl[1] * ry;
      p.circle(bx, by + ry * .16, rx * bl[2], C.css(colB), a);
    }
    // 明部
    for (const bl of blobs) {
      const bx = topX + bl[0] * rx + sway * .8, by = cy + bl[1] * ry;
      p.circle(bx - rx * .1, by - ry * .12, rx * bl[2] * .82, C.css(colA), a);
    }
    // 左上のリムライト
    p.circle(topX - rx * .42 + sway * .8, cy - ry * .5, rx * .34, C.css(rim), a * .85);
    // 葉のディザ（輪郭を柔らかく）
    ctx.fillStyle = C.css(colA);
    for (let i = 0; i < 10; i++) {
      const ang = M.hash(i * 3.1 + h) * 6.28;
      const rr = rx * (.85 + M.hash(i * 7.7) * .3);
      ctx.fillRect(Math.round(topX + Math.cos(ang) * rr + sway * .8),
                   Math.round(cy + Math.sin(ang) * rr * (ry / rx)), 1, 1);
    }
  }
  ctx.globalAlpha = 1;
};

/* 4方向の星 */
P.star = function (p, x, y, r, col, a) {
  const ctx = p.ctx;
  ctx.globalAlpha = a === undefined ? 1 : a;
  ctx.fillStyle = typeof col === 'string' ? col : C.css(col);
  x = Math.round(x); y = Math.round(y); r = Math.max(1, Math.round(r));
  for (let i = -r; i <= r; i++) {
    const w = Math.max(1, Math.round((1 - Math.abs(i) / r) * 2.2));
    ctx.fillRect(x - Math.round(w / 2), y + i, w, 1);
    ctx.fillRect(x + i, y - Math.round(w / 2), 1, w);
  }
  ctx.globalAlpha = 1;
};

/*
  drawBuilding — 家 ↔ ビル ↔ 溶ける ↔ 木 のモーフ
  m : 0 = 一軒家 / 1 = 高層ビル
  melt : 溶け具合 (窓が星になる → 宇宙へ)

P.building = function (p, x, base, w, h, m, opt) {
  opt = opt || {};
  const ctx = p.ctx;
  const a = opt.alpha === undefined ? 1 : opt.alpha;
  if (a <= .01) return;
  ctx.globalAlpha = a;
  const body = opt.body || [40, 36, 60];
  const roof = opt.roof || [70, 40, 50];
  const winOn = opt.win || [255, 214, 140];
  const winOff = opt.winOff || [40, 40, 60];
  const tall = M.sat(m);
  const melt = M.sat(opt.melt || 0);
  const breathe = opt.breathe || 0;
  const bw = Math.max(3, Math.round(w * (1 + breathe * .06)));
  const bh = Math.max(4, Math.round(h * (1 + breathe * .04)));
  const x0 = Math.round(x - bw / 2), y0 = Math.round(base - bh);

  // 屋根（低層のみ三角屋根）
  if (tall < .7) {
    const rh = Math.round(bh * .28 * (1 - tall));
    ctx.fillStyle = C.css(roof);
    for (let i = 0; i < rh; i++) {
      const t = i / Math.max(1, rh - 1);
      const ww = Math.round(bw * (0.15 + .85 * t)) + 2;
      ctx.fillRect(Math.round(x - ww / 2), y0 - rh + i, ww, 1);
    }
  } else {
    ctx.fillStyle = C.css(C.scale(body, 1.25));
    ctx.fillRect(x0, y0 - 2, bw, 2);
    // アンテナ
    ctx.fillStyle = C.css(opt.antenna || [255, 60, 90]);
    ctx.fillRect(Math.round(x), y0 - 7, 1, 6);
    if (opt.blink) ctx.fillRect(Math.round(x) - 1, y0 - 8, 3, 2);
  }

  ctx.fillStyle = C.css(body);
  ctx.fillRect(x0, y0, bw, bh);

  // 窓（音楽で明滅 / 目のようにまばたき / 星化）
  const cols = Math.max(1, Math.floor(bw / 4));
  const rowsN = Math.max(1, Math.floor(bh / 5));
  const seed = opt.seed || 1;
  for (let r = 0; r < rowsN; r++) {
    for (let c = 0; c < cols; c++) {
      const wx = x0 + 2 + c * 4, wy = y0 + 3 + r * 5;
      if (wy + 2 > base - 1) continue;
      const hsh = M.hash2(c + seed * 7.3, r + seed * 2.1);
      let on = hsh > .38;
      if (opt.beatWin !== undefined) on = hsh > .38 - opt.beatWin * .35;
      const blink = opt.blink && M.hash2(c * 3.1 + seed, r * 1.7) < opt.blink;
      const col = on ? winOn : winOff;
      if (melt > .3 && hsh > .55) {
        // 窓が星になる
        P.star(p, wx + 1, wy + 1, 1 + melt * 2, '#ffffff', a * M.sat((melt - .3) / .5));
        continue;
      }
      ctx.fillStyle = C.css(col);
      if (blink) ctx.fillRect(wx, wy + 1, 2, 1);
      else ctx.fillRect(wx, wy, 2, 3);
    }
  }
  ctx.globalAlpha = 1;
};

/* 街灯（ビートで明滅する） */
P.streetlight = function (p, x, base, h, col, glow, glowAmt) {
  const ctx = p.ctx;
  ctx.fillStyle = C.css(col);
  ctx.fillRect(Math.round(x), Math.round(base - h), 1, Math.round(h));
  const armDir = x < p.w / 2 ? 1 : -1;
  ctx.fillRect(Math.round(x), Math.round(base - h), armDir > 0 ? 4 : -4 + 1, 1);
  const lx = x + armDir * 3.5, ly = base - h + 1;
  if (glowAmt > .02) {
    p.circle(lx, ly + 1, 1.5 + glowAmt * 3.2, C.cssa(glow, .30 + glowAmt * .5));
    p.circle(lx, ly + 1, 1 + glowAmt, C.css(glow));
  }
};

/* 電柱 */
P.pole = function (p, x, base, h, col, breathe) {
  const ctx = p.ctx;
  const w = 1 + (breathe > .5 ? 1 : 0);
  ctx.fillStyle = C.css(col);
  ctx.fillRect(Math.round(x), Math.round(base - h), w, Math.round(h));
  ctx.fillRect(Math.round(x - 3), Math.round(base - h + 3), 7, 1);
  ctx.fillRect(Math.round(x - 2), Math.round(base - h + 6), 5, 1);

/* 標識（文字が化ける） */
P.sign = function (p, x, base, h, text, colBg, colFg, colPole) {
  const ctx = p.ctx;
  ctx.fillStyle = C.css(colPole);
  ctx.fillRect(Math.round(x), Math.round(base - h), 1, Math.round(h));
  const w = PX.textWidth(text, 1, 1) + 4;
  const bx = Math.round(x - w / 2), by = Math.round(base - h - 9);
  ctx.fillStyle = C.css(colBg);
  ctx.fillRect(bx, by, w, 9);
  ctx.fillStyle = C.css(colFg);
  ctx.fillRect(bx, by, w, 1); ctx.fillRect(bx, by + 8, w, 1);
  ctx.fillRect(bx, by, 1, 9); ctx.fillRect(bx + w - 1, by, 1, 9);
  p.text(text, bx + 2, by + 2, colFg, 1, 1);
};

/* 雲（巨大な顔になれる） */
P.cloud = function (p, x, y, w, h, col, face, alpha) {
  const a = alpha === undefined ? 1 : alpha;
  p.circle(x, y, h, C.css(col), a);
  p.circle(x - w * .32, y + h * .22, h * .72, C.css(col), a);
  p.circle(x + w * .34, y + h * .18, h * .78, C.css(col), a);
  p.circle(x - w * .12, y - h * .35, h * .66, C.css(col), a);
  p.circle(x + w * .14, y - h * .3, h * .6, C.css(col), a);
  const ctx = p.ctx;
  ctx.globalAlpha = a;
  ctx.fillStyle = C.css(C.scale(col, .82));
  ctx.fillRect(Math.round(x - w * .5), Math.round(y + h * .55), Math.round(w), 1);
  ctx.globalAlpha = 1;
  if (face > .01) {
    const dark = C.scale(col, .35);
    const ey = y - h * .12, ex = w * .26;
    p.circle(x - ex, ey, h * .17, C.cssa(dark, face));
    p.circle(x + ex, ey, h * .17, C.cssa(dark, face));
    // 口
    const my = y + h * .28;
    ctx.globalAlpha = face;
    ctx.fillStyle = C.css(dark);
    for (let i = -3; i <= 3; i++) {
      const yy = my + Math.round(Math.cos(i / 3 * 1.4) * -h * .1 + h * .1);
      ctx.fillRect(Math.round(x + i * w * .07), Math.round(yy), 2, 2);
    }
    ctx.globalAlpha = 1;
  }
};

/* 水面のきらめき（帯状） */
P.water = function (p, y0, y1, cx, colA, colB, t, amp) {
  const ctx = p.ctx;
  for (let y = y0; y < y1; y++) {
    const d = (y - y0) / Math.max(1, y1 - y0);
    const c = C.mix(colA, colB, d);
    ctx.fillStyle = C.css(c);
    ctx.fillRect(0, y, p.w, 1);
    // ハイライト
    const n = 3 + Math.floor(d * 8);
    ctx.fillStyle = C.css(C.scale(c, 1.5));
    for (let i = 0; i < n; i++) {
      const ph = M.hash2(y * .7, i * 3.3);
      const x = M.mod(ph * p.w + Math.sin(t * (0.6 + ph) + y * .3) * (6 + amp * 14), p.w);
      const w = 1 + Math.round(d * 3);
      ctx.fillRect(Math.round(x), y, w, 1);
    }
  }
};

/* 山脈シルエット */
P.mountains = function (p, y, h, col, seed, scroll, alpha) {
  const ctx = p.ctx;
  ctx.globalAlpha = alpha === undefined ? 1 : alpha;
  ctx.fillStyle = C.css(col);
  for (let x = 0; x < p.w; x++) {
    const u = (x + scroll) * .035;
    const e = (M.fbm(u + seed, 3) * .8 + M.fbm(u * 2.7 + seed * 3, 2) * .2);
    const hh = Math.round(e * h);
    ctx.fillRect(x, y - hh, 1, hh + 2);
  }
  ctx.globalAlpha = 1;
};

/* ヤシ以外の「踊る植物」（ジャングル用シダ） */
P.fern = function (p, x, base, h, sway, colA, colB, alpha) {
  const ctx = p.ctx;
  ctx.globalAlpha = alpha === undefined ? 1 : alpha;
  const n = 6;
  for (let i = 0; i < n; i++) {
    const ang = -Math.PI / 2 + (i / (n - 1) - .5) * 1.9;
    let fx = x, fy = base;
    const steps = Math.round(h / 1.8);
    for (let s = 0; s < steps; s++) {
      const t = s / steps;
      const aa = ang + Math.sin(t * 2.2) * .5 * (ang < -Math.PI / 2 ? -1 : 1) + sway * t * .06;
      fx += Math.cos(aa) * 1.8;
      fy += Math.sin(aa) * 1.8;
      ctx.fillStyle = C.css(i % 2 ? colA : colB);
      const w = Math.max(1, Math.round(M.lerp(2.6, 1, t)));
      ctx.fillRect(Math.round(fx), Math.round(fy), w, w);

  }
  ctx.globalAlpha = 1;

/* 浮遊島 */
P.island = function (p, x, y, w, colTop, colRock, alpha) {
  const ctx = p.ctx;
  ctx.globalAlpha = alpha === undefined ? 1 : alpha;
  const h = w * .35;
  ctx.fillStyle = C.css(colTop);
  ctx.fillRect(Math.round(x - w / 2), Math.round(y), Math.round(w), 2);
  ctx.fillStyle = C.css(colRock);
  for (let i = 0; i < h; i++) {
    const t = i / h;
    const ww = Math.round(w * (1 - t * t) * (1 - t * .3));
    ctx.fillRect(Math.round(x - ww / 2), Math.round(y + 2 + i), Math.max(1, ww), 1);
  }
  ctx.globalAlpha = 1;
};

   ・パレットは重み平均 → 色が連続的に溶ける
   ・背景レイヤーは重みをアルファに → 山が溶けてビル群が浮かぶ

/* 各ワールドの路肩オブジェクト出現テーブル（kind: 重み） */

  night:    { house: 36, flora: 24, pole: 16, light: 18, sign: 4, figure: 2 },
  weird:    { house: 28, flora: 26, pole: 14, light: 16, sign: 10, figure: 6 },
  tropical: { flora: 34, figure: 46, rock: 8, sign: 4, light: 8 },
  space:    { crystal: 34, flora: 16, island: 22, figure: 14, monolith: 14 },
  city:     { house: 52, light: 16, sign: 10, figure: 12, crystal: 10 },
  jungle:   { flora: 54, figure: 14, rock: 14, monolith: 18 },
  ocean:    { coral: 46, flora: 18, rock: 18, figure: 18 },
  abstract: { monolith: 30, crystal: 28, figure: 22, flora: 20 },
  climax:   { figure: 44, flora: 20, crystal: 14, house: 10, island: 12 },

    if (ab > .25 || cl > .3) want.push('eye');
    if (cl > .3 || ab > .3) want.push('record', 'record');
    if (sp > .25 || ab > .2) want.push('island', 'island');

    // 足りない分を足す
    const counts = {};
    for (const p of this.props) counts[p.kind] = (counts[p.kind] || 0) + 1;
    const need = {};
    for (const k of want) need[k] = (need[k] || 0) + 1;
    for (const k in need) {
      while ((counts[k] || 0) < need[k]) {
        this.props.push({
          kind: k,
          x: this.rng() * 1.3 - .15,
          y: .06 + this.rng() * .34,
          v: (this.rng() < .5 ? -1 : 1) * (.012 + this.rng() * .035),
          s: .7 + this.rng() * .9,
          ph: this.rng(),
          life: 0
        });
        counts[k] = (counts[k] || 0) + 1;
      }
    }
    for (let i = this.props.length - 1; i >= 0; i--) {
      const p = this.props[i];
      p.life += dt;
      p.x += p.v * dt;
      p.y += Math.sin(this.time * .5 + p.ph * 9) * .00035;
      if (p.x < -.35 || p.x > 1.35) { p.x = p.v > 0 ? -.3 : 1.3; p.y = .05 + this.rng() * .35; }
      if (!need[p.kind]) { if (this.rng() < dt * .5) this.props.splice(i, 1); }
    }
  }

  /* ================================================== 背景レンダリング */
  render(p, pal, cond, trip, road) {
    const hz = road.horizonY(p);
    this._sky(p, pal, cond, trip, hz, road);
    this._farLayer(p, pal, cond, trip, hz, road);
    this._midLayer(p, pal, cond, trip, hz, road);
    this._props(p, pal, cond, trip, hz);
  }

  /* ------ 空 ------------------------------------------------------- */
  _sky(p, pal, cond, trip, hz, road) {
    const ctx = p.ctx;
    const env = cond.env;
    const skyH = Math.max(1, hz + 2);
    // グラデーション（ビートで少しだけ持ち上がる）
    const lift = env.kick * .06 * M.sat(trip.level / 4);
    const top = C.mix(pal.skyTop, pal.skyMid, lift);
    const bot = pal.skyLow;
    p.vgrad(0, 0, p.w, skyH, top, bot, true);

    // 星
    const starA = M.sat(this.w.space * 1.2 + this.w.night * .8 + this.w.weird * .5 + this.w.climax * .5 + trip.starBoost);
    if (starA > .02) {
      const sc = road.z * .012;
      for (let i = 0; i < this.starField.length; i++) {
        const s = this.starField[i];
        const x = M.mod(s.x + sc * (.2 + s.s * .5), 1) * p.w;
        const y = s.y * skyH * .92;
        const tw = .5 + .5 * Math.sin(this.time * (1 + s.p * 3) + s.p * 30 + cond.beat * Math.PI * (s.s > .7 ? 1 : .25));
        const a = starA * (.35 + tw * .65) * (.4 + s.s * .6);
        if (a < .05) continue;
        const col = s.s > .85 ? pal.accentB : (s.s > .6 ? pal.accentA : [255, 255, 255]);
        if (s.s > .93 && starA > .5) D.star(p, x, y, 1 + s.s * 2, C.css(col), a);
        else { ctx.globalAlpha = a; ctx.fillStyle = C.css(col); ctx.fillRect(x | 0, y | 0, 1, 1); ctx.globalAlpha = 1; }
      }
    }

    // 太陽 / 月
    const sunA = M.sat(this.w.suburb + this.w.tropical + this.w.weird * .6);
    const moonA = M.sat(this.w.night + this.w.weird * .5 + this.w.space * .5 + this.w.climax * .4);
    const sx = p.w * .68, sy = hz - p.h * .10;
    if (sunA > .03) {
      const r = p.w * (.085 + this.w.tropical * .05) * (1 + env.kick * .05 * trip.level / 10);
      if (this.sunGlasses > .5 && PX.SPR.sunGlasses) {
        p.sprite(PX.SPR.sunGlasses, sx, sy + r, { scale: Math.max(1, Math.round(r / 5)), ax: .5, ay: .5, alpha: sunA });
      } else {
        p.circle(sx, sy, r * 1.5, C.cssa(pal.sun, .10 * sunA));
        p.circle(sx, sy, r, C.cssa(pal.sun, sunA));
        // レトロな横縞
        ctx.globalAlpha = sunA * .6;
        ctx.fillStyle = C.css(pal.skyLow);
        for (let i = 0; i < 6; i++) {
          const yy = sy + r * (i / 6) * 1.0;
          ctx.fillRect(Math.round(sx - r), Math.round(yy), Math.round(r * 2), Math.max(1, Math.round(1 + i * .35)));
        }
        ctx.globalAlpha = 1;
      }
    }
    if (moonA > .03) {
      const mx = p.w * .26, my = hz - p.h * .22;
      const r = p.w * (.055 + trip.moonSize * .05);
      if (this.moonFace > .5 && PX.SPR.moonFace) {
        p.sprite(PX.SPR.moonFace, mx, my + r, { scale: Math.max(1, Math.round(r / 5)), ax: .5, ay: .5, alpha: moonA, hue: trip.hueSpin });
      } else {
        p.circle(mx, my, r * 1.7, C.cssa(pal.lightGlow, .07 * moonA));
        p.circle(mx, my, r, C.cssa(pal.sun, moonA));
        p.circle(mx - r * .35, my - r * .2, r * .22, C.cssa(C.scale(pal.sun, .86), moonA));
        p.circle(mx + r * .3, my + r * .3, r * .16, C.cssa(C.scale(pal.sun, .88), moonA));
      }
    }

    // 雲（顔になる）
    const cloudA = M.sat(this.w.suburb + this.w.tropical * 1.1 + this.w.weird + this.w.night * .5 + this.w.climax * .6);
    if (cloudA > .03) {
      for (const c of this.clouds) {
        c.x += c.v * .016 + road.z * 0;
        if (c.x > 1.3) c.x = -.3;
        const face = M.sat(trip.cloudFace) * (c.s > .8 ? 1 : .3);
        D.cloud(p, c.x * p.w, c.y * skyH, p.w * .22 * c.s, p.h * .028 * c.s,
          C.mix(pal.cloud, pal.accentA, trip.level / 22), face, cloudA * .85);
      }
    }

    // 万華鏡的な幾何オーバーレイ（抽象/クライマックス）
    const geo = M.sat(this.w.abstract * 1.2 + this.w.climax * .8);
    if (geo > .03) this._geoOverlay(p, pal, cond, trip, hz, geo);

    // 逆さまの都市（抽象ゾーン）
    if (this.w.abstract > .3) {
      const a = M.sat((this.w.abstract - .3) / .5) * .5;
      ctx.save();
      ctx.globalAlpha = a;
      for (let i = 0; i < 9; i++) {
        const x = M.mod(i * 23 - road.z * .35, p.w + 40) - 20;
        const h = 12 + M.hash(i * 5.3) * 26;
        D.building(p, x, -1 + h, 9 + M.hash(i) * 6, h, 1,
          { alpha: a, body: pal.near, win: pal.accentA, winOff: pal.mid, seed: i + 3, beatWin: cond.env.hat * .4 });
      }
      ctx.restore();
      ctx.globalAlpha = 1;
    }
  }

  _geoOverlay(p, pal, cond, trip, hz, amt) {
    const ctx = p.ctx;
    const cx = p.w * .5, cy = hz * .62;
    const n = 5;
    ctx.globalAlpha = amt * (.18 + cond.env.kick * .22);
    for (let i = 0; i < n; i++) {
      const r = ((this.time * 26 + i * 40) % 190) * (.4 + trip.level / 22);
      const col = C.rainbow(i * .17 + this.time * .12, .6);
      p.ring(cx, cy, r, C.css(col), amt * (1 - r / 200) * .5, 1 + (i % 2));
    }
    // 六角の格子
    ctx.globalAlpha = amt * .16;
    const seg = 6;
    for (let i = 0; i < seg; i++) {
      const a = i / seg * Math.PI * 2 + this.time * .12;
      const L = p.w * .8;
      p.line(cx, cy, cx + Math.cos(a) * L, cy + Math.sin(a) * L, C.css(C.rainbow(i / seg + this.time * .2, .65)), amt * .3);
    }
    ctx.globalAlpha = 1;
  }

  /* ------ 遠景 ---------------------------------------------------- */
  _farLayer(p, pal, cond, trip, hz, road) {
    const ctx = p.ctx;
    const scroll = road.z * 1.1;
    const wSub = this.w.suburb + this.w.night + this.w.weird;
    const wTro = this.w.tropical, wCity = this.w.city, wJun = this.w.jungle,
          wOc = this.w.ocean, wSp = this.w.space, wAb = this.w.abstract, wCl = this.w.climax;

    // 海の水平線（南国/海底）
    if (wTro + wOc > .04) {
      const a = M.sat(wTro + wOc);
      const y0 = hz - Math.round(p.h * .012);
      ctx.globalAlpha = a;
      D.water(p, y0, hz + 2, p.w / 2, C.mix(pal.far, pal.accentA, .25), pal.near, this.time, cond.env.bass);
      ctx.globalAlpha = 1;
    }
    // 山（住宅街の遠景）
    if (wSub > .04) D.mountains(p, hz + 1, p.h * .05, C.mix(pal.far, pal.fog, .4), 0, scroll * .05, M.sat(wSub) * .9);
    // ジャングルの樹冠
    if (wJun > .04) D.mountains(p, hz + 2, p.h * .085, C.mix(pal.far, [20, 60, 40], .3), 3.7, scroll * .07, M.sat(wJun));
    // 巨大都市のスカイライン
    if (wCity > .04) {
      const a = M.sat(wCity);
      for (let i = 0; i < 26; i++) {
        const bx = M.mod(i * 15.5 - scroll * .06, p.w + 60) - 30;
        const h = 10 + M.hash(i * 3.1) * p.h * .22;
        D.building(p, bx, hz + 2, 8 + M.hash(i * 7.7) * 9, h, 1, {
          alpha: a * .85, body: C.mix(pal.far, pal.fog, .35), win: pal.accentA, winOff: C.mix(pal.far, [0, 0, 0], .3),
          seed: i + 1, beatWin: cond.env.hat * .5, blink: (i % 5 === 0) ? .1 : 0, antenna: pal.accentC
        });
      }
    }
    // 星雲（宇宙）
    if (wSp > .05) {
      const a = M.sat(wSp);
      ctx.globalAlpha = a * .30;
      for (let i = 0; i < 5; i++) {
        const x = M.mod(i * 47 - scroll * .02, p.w + 90) - 45;
        const y = hz * (.25 + M.hash(i * 2.7) * .5);
        const r = 16 + M.hash(i * 5.1) * 26;
        p.circle(x, y, r, C.cssa(C.rainbow(i * .21 + this.time * .03, .4), .10 * a));
        p.circle(x + 4, y - 3, r * .6, C.cssa(C.rainbow(i * .21 + .3, .45), .10 * a));
      }
      ctx.globalAlpha = 1;
    }
    // 抽象: 巨大な目
    if (wAb > .18 && PX.SPR.eye) {
      const a = M.sat((wAb - .18) / .4);
      const s = Math.max(1, Math.round(p.w / 60 + trip.level * .25));
      const blink = (Math.sin(this.time * .7) > .96) ? .25 : 1;
      p.sprite(PX.SPR.eye, p.w * .5, hz * .55, {
        scale: s, ax: .5, ay: .5, alpha: a * .85, squash: blink, hue: trip.hueSpin
      });
    }
    // クライマックス: 全部の地平線が重なる
    if (wCl > .1) {
      const a = M.sat(wCl);
      D.mountains(p, hz + 1, p.h * .06, C.mix(pal.far, pal.accentB, .3), 1.3, scroll * .05, a * .5);
      for (let i = 0; i < 16; i++) {
        const bx = M.mod(i * 22 - scroll * .05, p.w + 50) - 25;
        const h = 8 + M.hash(i * 4.4) * p.h * .16;
        D.building(p, bx, hz + 2, 7 + M.hash(i * 2.2) * 7, h, 1,
          { alpha: a * .45, body: C.mix(pal.mid, pal.accentC, .2), win: [255, 255, 255], winOff: pal.near, seed: i + 9, beatWin: cond.env.kick });
      }
    }
  }

  /* ------ 中景（地平線に沿う帯） ------------------------------------ */
  _midLayer(p, pal, cond, trip, hz, road) {
    const ctx = p.ctx;
    const scroll = road.z * 2.6;
    // 群衆バンド: 南国/クライマックスで地平線までフラダンサー
    const crowd = M.sat((this.w.tropical + this.w.climax) * (0.4 + trip.groove * .9) * (trip.level / 6));
    if (crowd > .06 && PX.SPR.hula1) {
      const rows = 1 + Math.floor(crowd * 2.4);
      for (let r = 0; r < rows; r++) {
        const yy = hz + 1 + r * 2;
        const sc = 1;
        const a = crowd * (1 - r * .18);
        const count = Math.floor(p.w / 7) + 3;
        const beatOff = (cond.env.kick > .4 ? 1 : 0);
        for (let i = 0; i < count; i++) {
          const x = M.mod(i * 5 - scroll * (.02 + r * .004) + r * 2.5, p.w + 12) - 6;
          const ph = M.hash2(i * 1.7, r * 3.1);
          const f = (Math.floor(cond.beat * 2 + ph * 2) % 2) ? PX.SPR.hula2 : PX.SPR.hula1;
          // 地平線の群衆は 1px スケール。sway は使わず描画コールを 1 回に抑える
          p.sprite(f, x, yy + 1 - beatOff, {
            scale: sc, ax: .5, ay: 1, alpha: a * .9, hue: trip.hueSpin + ph * .3
          });
        }
      }
    }
    // ヤシ並木のシルエット（地平線）
    const tro = M.sat(this.w.tropical);
    if (tro > .08) {
      for (let i = 0; i < 14; i++) {
        const x = M.mod(i * 17 - scroll * .012, p.w + 40) - 20;
        const h = 14 + M.hash(i * 6.1) * 10;
        D.tree(p, x, hz + 2, h, 1, Math.sin(this.time * 1.3 + i) * 1.6,
          C.mix(pal.near, [0, 0, 0], .18), C.mix(pal.mid, [0, 0, 0], .12), tro * .8);
      }
    }
  }

  /* ------ 空の漂流物（魚・クジラ・UFO・レコード・浮島） -------------- */
  _props(p, pal, cond, trip, hz) {
    const S = PX.SPR;
    for (const q of this.props) {
      const x = q.x * p.w, y = q.y * hz;
      const flip = q.v < 0;
      const bob = Math.sin(this.time * 2 + q.ph * 12) * 2;
      const hue = trip.hueSpin + q.ph * .25;
      switch (q.kind) {
        case 'fish':
          p.sprite((q.ph > .5 ? S.fish2 : S.fish), x, y + bob, {
            scale: Math.max(1, Math.round(1 + q.s)), ax: .5, ay: .5, flip, hue,
            alpha: .9, sway: Math.sin(this.time * 6 + q.ph * 9) * 1.4
          });
          break;
        case 'whale':
          p.sprite(S.whale, x, y + bob * 1.6, {
            scale: Math.max(1, Math.round(1 + q.s * 1.6)), ax: .5, ay: .5, flip, hue, alpha: .82,
            sway: Math.sin(this.time * 1.2 + q.ph * 5) * 2
          });
          break;
        case 'ufo': {
          const s = Math.max(1, Math.round(1 + q.s));
          p.sprite(S.ufo, x, y + bob, { scale: s, ax: .5, ay: .5, flip, hue, alpha: .9 });
          if (cond.env.kick > .3) p.circle(x, y + 6 * s, 3 * s * cond.env.kick, C.cssa(pal.accentA, .18 * cond.env.kick));
          break;
        }
        case 'record':
          p.sprite(S.record, x, M.mod(q.life * 26 + q.ph * 200, hz + 30) - 10, {
            scale: Math.max(1, Math.round(1 + q.s)), ax: .5, ay: .5, hue, alpha: .9,
            squash: .6 + .4 * Math.abs(Math.sin(this.time * 4 + q.ph * 8))
          });
          break;
        case 'island':
          D.island(p, x, y, 14 + q.s * 22, C.mix(pal.accentA, pal.mid, .4), C.mix(pal.near, [0, 0, 0], .2), .8);
          if (q.ph > .5) D.tree(p, x + 3, y + 1, 9 + q.s * 6, 1, Math.sin(this.time + q.ph * 7) * 1.2, pal.accentA, pal.accentC, .8);
          break;
        case 'eye':
          p.sprite(S.eye, x, y, { scale: Math.max(1, Math.round(1 + q.s * 2)), ax: .5, ay: .5, hue, alpha: .7 });
          break;
      }
    }
  }

  /* ================================================ 路肩オブジェクト */
  renderObjects(p, pal, cond, trip, road) {
    const S = PX.SPR;
    const hz = road.horizonY(p);
    const q = {};
    const env = cond.env;
    // objects は z 昇順（先頭が最も近い）。描画は近い順に上限を設けて打ち切る。
    let end = 0;
    const far = road.z + 86;
    while (end < this.objects.length && this.objects[end].z <= far) end++;
    if (end > MAX_DRAW) end = MAX_DRAW;
    // 遠 → 近（ペインターズ）
    for (let i = end - 1; i >= 0; i--) {
      const o = this.objects[i];
      const dz = o.z - road.z;
      if (dz < .6) continue;
      road.project(p, dz, o.side, q);
      if (q.sy < hz - 60 || q.sy > p.h + 40) continue;
      if (q.sx < -130 || q.sx > p.w + 130) continue;
      const unit = q.sc * p.w * .58;               // 1 world unit あたりのピクセル数
      if (unit < .6) continue;
      /* 近距離フェード。大きい物ほど早く消す。
         これが無いと、巨大化した建物が至近距離で画面を塞ぐ「壁」になる。 */
      const big = (o.kind === 'house' || o.kind === 'island' || o.kind === 'monolith');
      const nearFade = big ? M.smooth((dz - 3.1) / 2.4) : M.smooth((dz - 1.3) / 1.3);
      if (nearFade <= .01) continue;
      const fade = M.sat((86 - dz) / 26) * nearFade;
      const beat = env.kick, hat = env.hat;
      const ph = o.phase;
      const groove = trip.groove;
      const dance = Math.sin(cond.beat * Math.PI + ph * 6.28) * (0.5 + groove) * M.sat(trip.level / 3);

      this._drawObject(p, pal, cond, trip, o, q, unit, fade, dance, dz);
    }
  }

  _drawObject(p, pal, cond, trip, o, q, unit, fade, dance, dz) {
    const S = PX.SPR, env = cond.env;
    const x = q.sx, base = q.sy;
    const lvl = trip.level;
    const hue = trip.hueSpin + o.phase * .2;
    const breathe = M.sat(lvl / 4) * (0.5 + .5 * Math.sin(this.time * 2.2 + o.phase * 8));
    const sway = dance * unit * .05;

    switch (o.kind) {
      case 'flora': {
        // 街路樹 → ヤシ → 星（世界の重みで連続変形）
        const palm = M.sat(this.w.tropical * 1.3 + this.w.climax * .6 + this.w.jungle * .4);
        const star = M.sat(this.w.space * 1.4 + this.w.abstract * .8);
        const m = palm + star;
        const h = unit * (1.35 + o.sc * .75);
        // 葉の色: サイケでない間はちゃんと緑にする（普通の街路樹に見せる）
        const natural = 1 - M.sat(this.w.abstract + this.w.climax + this.w.space * .7);
        const lit = M.sat((pal.skyLow[0] + pal.skyLow[1] + pal.skyLow[2]) / 520);
        const colA = C.mix(C.mix(pal.accentA, pal.mid, .3), C.mix(C.scale([92, 162, 78], .42 + lit * .5), pal.fog, .22), natural * .88);
        const colB = C.mix(C.mix(pal.accentC, pal.near, .3), C.mix(C.scale([52, 110, 58], .42 + lit * .5), pal.fog, .25), natural * .88);
        if (this.w.jungle > .3 && o.seed % 2 < 1) {
          D.fern(p, x, base, h * .8, sway * 2, C.mix(pal.accentA, [30, 120, 60], .5), C.mix(pal.accentC, [20, 90, 50], .5), fade);
        } else {
          D.tree2(p, x, base, h, {
            m, species: Math.floor(o.seed * 1.7) % 3,
            sway: sway * (1 + palm), colA, colB,
            trunk: C.mix([78, 56, 42], pal.near, .35),
            alpha: fade
          });
        }
        break;
      }
      case 'house': {
        const tall = M.sat(this.w.city * 1.4 + this.w.climax * .25);
        const melt = M.sat(this.w.space * 1.2 + this.w.abstract * .9);
        // 建物の種類でシルエットを変える（同じ箱の羅列にしない）
        const type = Math.floor(o.seed) % 3;
        const wMul = type === 0 ? .95 : type === 1 ? 1.35 : .70;
        const hMul = type === 0 ? 1.0 : type === 1 ? .78 : 1.45;
        const w = unit * (.80 + o.sc * .45) * wMul * (1 + tall * .1);
        const h = unit * (1.45 + o.sc * .75) * hMul * M.lerp(1, 3.2, tall);
        const bodyTint = C.mix(C.mix(pal.near, pal.mid, .3), pal.accentC, (o.seed % 7) / 7 * .18);
        D.building2(p, x, base, {
          w, h, tall, melt, alpha: fade,
          vx: p.w * .5, vy: this.road.horizonY(p),
          k: M.sat((w / unit * .85) / (dz + w / unit * .85)),
          dir: o.side > 0 ? 1 : -1,
          body: bodyTint,
          roof: C.mix(pal.accentC, pal.near, .35 + (o.seed % 5) / 5 * .3),
          win: C.mix(pal.lightGlow, pal.accentA, .3),
          winOff: C.mix(pal.mid, [0, 0, 0], .4),
          seed: o.seed,
          beatWin: env.hat * .7 * M.sat(lvl / 3),
          blink: M.sat((lvl - 2) / 5) * .35,      // 窓が目のようにまばたき
          breathe: breathe * M.sat(lvl / 3),
          antenna: pal.accentB
        });
        break;
      }
      case 'pole': {
        const h = unit * (1.5 + o.sc * .5) * (1 + breathe * .04);
        D.pole(p, x, base, h, C.mix(pal.near, pal.mid, .3), breathe);
        break;
      }
      case 'light': {
        const h = unit * (1.6 + o.sc * .4);

        ctx.fillRect(Math.round(sx + sw + rw * .9), y, Math.max(1, Math.round(rw * 1.2)), 1);

        ctx.fillRect(Math.round(sx - sw - rw), y, Math.max(1, Math.round(sw * 2 + rw * 2)), 1);

class HouseScene {
  constructor(p, input) {

    this.t = 0;

    this.st = 0;
    this.mushroom = 1;      // 1 = まだ卓上にある
    this.hint = 0;
    this.personX = 0;
    this.doorOpen = 0;
    this.headlights = 0;
    this.camY = 0;
    this.zoom = 1;
    this.done = false;
    this.eatFlash = 0;
    this.tvPhase = 0;
    this.fade = 0;
  }

  _go(s) { this.state = s; this.st = 0; }

  update(dt) {
    this.t += dt; this.st += dt;
    const p = this.p;
    const taps = this.input.takeTaps();

    switch (this.state) {
      case 'idle': {
        this.hint = M.approach(this.hint, this.st > 3.5 ? 1 : 0, 1.5, dt);
        const mx = this.mushX === undefined ? p.w * .46 : this.mushX;
        const my = this.mushY === undefined ? p.h * .72 : this.mushY;
        for (const tp of taps) {
          if (Math.abs(tp.x - mx) < 28 && Math.abs(tp.y - my) < 30) {
            PX.Audio.init();
            PX.Audio.sfx('eat');
            this.mushroom = 0;
            this.eatFlash = 1;
            this._go('eaten');
            break;
          }
        }
        break;
      }
      case 'eaten':
        // ★ここが肝: 数秒間、本当に何も起きない
        this.eatFlash = M.approach(this.eatFlash, 0, 3, dt);
        if (this.st > 4.2) this._go('stand');
        break;
      case 'stand':
        if (this.st > 1.4) { PX.Audio.sfx('door'); this._go('leave'); }
        break;
      case 'leave':
        this.fade = M.sat(this.st / .8);
        if (this.st > 1.1) { this.fade = 0; this._go('outside'); }
        break;
      case 'outside':
        this.personX = M.lerp(p.w * .58, p.w * .34, M.smooth(this.st / 2.6));
        this.doorOpen = M.sat(1.2 - this.st) * .8;
        if (this.st > 2.9) { PX.Audio.sfx('door'); this._go('enter'); }
        break;
      case 'enter':
        if (this.st > .9) {
          PX.Audio.init();
          PX.Audio.sfx('ignition');
          PX.Audio.startEngine();
          this._go('ignition');
        }
        break;
      case 'ignition':
        this.headlights = M.sat(this.st / 1.1);
        PX.Audio.setEngine(.15 + M.sat(this.st / 2) * .2, .12);
        if (this.st > 2.2) this._go('board');

    }
    PX.Audio.fadeMusic(1, .8);

    // 導入シーンからの遷移では update より先に render が走るフレームがある。
    // パレット・世界の重み・道路を1回分だけ先に確定させ、
    // どの入り方でも1フレーム目から描画可能な状態にしておく。
    this.updateDrive(0);
  }

  /* ------------------------------------------------------- ループ */
  start() {
    const step = (ts) => {
      if (!this.last) this.last = ts;
      let dt = (ts - this.last) / 1000;
      this.last = ts;
      if (dt > .06) dt = .06;
      this.frame++;
      this.frameMs += (Math.min(60, dt * 1000) - this.frameMs) * .05;
      this.input.update(dt);
      // 実処理時間を測る。rAF の間隔は vsync で 16.7ms に張り付くので
      // フレーム間隔では「余裕があるか」が判定できない。
      const w0 = performance.now();
      this.update(dt);
      this.render();
      this.workMs += (Math.min(80, performance.now() - w0) - this.workMs) * .06;
      this.autoQuality(dt);
      requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }

  /* 重い端末では解像度を1段ずつ落とし、余裕が戻れば1段ずつ戻す */
  autoQuality(dt) {
    const heavy = this.workMs > 14.0;      // 1フレームの予算 16.7ms に対して余裕なし
    const light = this.workMs < 8.5;       // 余裕あり
    if (heavy) this.qual = M.clamp(this.qual - dt * .9, .6, 1);
    else if (light) this.qual = M.clamp(this.qual + dt * .3, .6, 1);
    this.resCool -= dt;
    if (this.resCool > 0) return;
    if (heavy && this.resStep < this.resLadder.length - 1) {
      this.resStep++;
      this.p.setBaseWidth(this.resLadder[this.resStep]);
      this.resCool = 3.0;
    } else if (this.workMs < 9.0 && this.resStep > 0) {
      this.resStep--;
      this.p.setBaseWidth(this.resLadder[this.resStep]);
      this.resCool = 7.0;
    }
  }

  update(dt) {
    switch (this.scene) {
      case 'house':
        this.house.update(dt);
        if (this.house.done) this.startDrive();
        break;
      case 'drive':
        this.updateDrive(dt);
        break;
      case 'outro':
        this.outro.update(dt);
        if (this.outro.done) {
          const taps = this.input.takeTaps();
          if (taps.length) this.restart();
        }
        break;
    }
  }

  /* 任意の時刻へ移動（プレビュー用） */
  seek(t) { PX.Audio.stop(); this.p.clearHistory(); this.startDrive(t); }

  restart() {
    PX.Audio.stop();
    PX.Audio.stopEngine(.3);
    this.p.clearHistory();
    this.house = new PX.HouseScene(this.p, this.input);
    this.scene = 'house';
  }

  /* =============================================== DRIVE UPDATE */
  updateDrive(dt) {
    const p = this.p;
    // 音楽時計（音源があればそれが正、無ければ内部時計）
    if (PX.Audio.ready && PX.Audio.playing) this.songTime = PX.Audio.now();
    else this.songTime += dt;
    const t = this.songTime;

    this.cond.set(t);
    const K = this.tl.sample(t);

    /* --- グルーヴ → トリップ強度 --------------------------------- */
    this.road.setTiming(this.track.bpm, this.cond.beat);
    const judged = this.chart.update(this.cond.beat, this.input.steer);
    for (const j of judged) this.onJudge(j);

    // 連続的なライン精度も少しだけ効かせる（“ノっている”感）
    const laneNow = this.chart.laneAt(this.cond.beat);
    const lineAcc = M.sat(1 - Math.abs(this.input.steer - laneNow) / .5);
    this.grooveRaw = M.clamp(this.grooveRaw + (lineAcc - .5) * dt * .12, 0, 1);
    this.trip.groove = M.approach(this.trip.groove, this.grooveRaw, 1.6, dt);
    const gb = this.trip.grooveBoost = M.sat((this.trip.groove - .42) / .48);

    /* --- トリップレベル ------------------------------------------ */
    const base = K.level;
    const gate = M.sat(base / 1.5);                 // 序盤は絶対に普通のまま
    const bonus = (this.trip.groove - .45) * 3.2 * gate;
    this.trip.level = M.clamp(base + M.clamp(bonus, -1.3, 1.7), 0, 10);
    this.deepest = Math.max(this.deepest, this.trip.level);

    this.trip.hueSpin += dt * this.trip.level * .012;
    this.trip.moonSize = K.v.moonSize;
    this.trip.cloudFace = K.v.cloudFace;
    this.trip.starBoost = K.v.starBoost;
    this.trip.signWords = this.stage.signSets[K.v.signSet] || this.stage.signSets.normal;

    /* --- ワールド重み（グルーヴで deep 側へ分岐） ------------------ */
    const wts = {};
    for (const k of PX.WORLD_LIST) wts[k] = M.lerp(K.worlds[k] || 0, K.deep[k] || 0, gb);
    this.world.setTarget(wts);
    this.world.moonFace = K.v.moonFace;
    this.world.sunGlasses = K.v.sunGlasses;

    /* --- 道路 ---------------------------------------------------- */
    this.road.speed = K.v.speed * M.lerp(.94, 1.06, this.trip.groove);
    this.road.horizon = K.v.horizon;
    for (const k in WARP_DEF) {
      const boost = (k === 'widen') ? 1 : M.lerp(.85, 1.18, gb);
      this.road.warp[k] = (k === 'widen') ? K.warp[k] : K.warp[k] * boost;
    }
    // 低音で路面がうねる / ビートで幅が脈動
    this.road.warp.wave += this.cond.env.bass * .05 * M.sat(this.trip.level / 4);
    this.road.warp.breathe += this.cond.env.kick * .3 * M.sat(this.trip.level / 5);
    this.road.pitch = Math.sin(this.cond.beat * Math.PI) * this.cond.env.kick * 1.4 * M.sat(this.trip.level / 6)
                    - this.cond.env.bass * 1.2 * M.sat(this.trip.level / 8);
    this.road.roll = Math.sin(t * .21) * .05 * M.sat((this.trip.level - 5) / 5)
                   + this.input.steer * .012;
    this.road.update(dt, this.input.steer, this.cond);
    this.world.update(dt, this.cond, this.trip);

    /* --- イベント ------------------------------------------------ */
    for (const e of this.tl.events(t)) this.onEvent(e);
    // カメラ: 通常は定位置。closeUp イベント中だけ車に寄って見上げる
    this.camTimer -= dt;
    this.camZoom = M.approach(this.camZoom, this.camTimer > 0 ? 1 : 0, 2.2, dt);
    const CD = PX.ROAD_CONST.CAR_DZ, CH = PX.ROAD_CONST.CAM_H;
    this.road.carDz = M.lerp(CD, CD * .62, this.camZoom);
    this.road.camH = M.lerp(CH, CH * .72, this.camZoom);
    this.road.camFollow = M.lerp(.58, .34, this.camZoom);

    /* --- エンジン音 ---------------------------------------------- */
    PX.Audio.setEngine(.25 + M.sat(this.road.speed / 50) * .55 + Math.abs(this.input.steer) * .1,
      .085 * (1 - M.sat(this.trip.level / 14)));

    /* --- パレット ------------------------------------------------ */
    const nw = this.world.normWeights();
    // 色相は「累積回転」させない（作り込んだパレットが台無しになる）。
    // レベルに応じた有界な揺らぎ + 一瞬のブリップだけにする。
    const hueWobble = Math.sin(t * .19) * .035 * M.sat(this.trip.level / 10)
                    + Math.sin(t * .047) * .025 * M.sat((this.trip.level - 6) / 4);
    PX.blendPalette(nw, hueWobble + this.hueBlip,
      M.sat(this.trip.level / 10) * .30 + this.trip.groove * .08, this.pal);

    /* --- 減衰系 -------------------------------------------------- */
    this.distort = M.approach(this.distort, 0, 1.8, dt);
    this.hueBlip = M.approach(this.hueBlip, 0, 3.5, dt);
    this.flash = M.approach(this.flash, 0, 2.2, dt);
    this.shake = M.approach(this.shake, 0, 5, dt);
    if (this.judgeText) { this.judgeText.life -= dt; if (this.judgeText.life <= 0) this.judgeText = null; }
    this.updateParticles(dt);

    /* --- 終了 ---------------------------------------------------- */
    if (t >= this.stage.driveEnd) {
      this.outro = new PX.OutroScene(p);
      this.outro.stats = this.stats();
      this.scene = 'outro';
      PX.Audio.stop(1.0);
      this.p.clearHistory();
    }
  }

  stats() {
    const s = this.chart.stats;
    return {
      perfect: s.perfect, groovy: s.groovy, good: s.good, miss: s.miss,
      maxCombo: this.maxCombo, score: this.score,
      depth: Math.round(this.deepest * 10) / 10
    };
  }

  /* ------------------------------------------------------- 判定 */
  onJudge(j) {
    const g = j.grade;
    const mul = Math.min(4, 1 + this.combo / 50);
    if (g === 'MISS') {
      this.combo = 0;
      this.grooveRaw = M.clamp(this.grooveRaw - .11, 0, 1);
      this.distort = Math.min(1.4, this.distort + .9);
      this.road.kickOff(j.note.lane > this.input.steer ? -1 : 1);
      PX.Audio.sfx('miss');
    } else {
      this.combo++;
      this.maxCombo = Math.max(this.maxCombo, this.combo);
      const pts = g === 'PERFECT' ? 300 : g === 'GROOVY' ? 180 : 70;
      this.score += Math.round(pts * mul);
      this.grooveRaw = M.clamp(this.grooveRaw + (g === 'PERFECT' ? .052 : g === 'GROOVY' ? .026 : -.004), 0, 1);
      if (g === 'PERFECT') {
        PX.Audio.sfx('perfect', Math.min(8, this.combo / 8));
        if (this.combo % 8 === 0) this.burst(this.p.w * .5, this.p.h * .52, 14 + this.combo / 4);
        if (this.trip.level > 7 && this.combo % 4 === 0) this.burst(this.p.w * (.2 + Math.random() * .6), this.p.h * .3, 8);
      }
    }
    this.judgeText = { g, life: .42, x: this.p.w * .5 };
  }

  /* ----------------------------------------------------- イベント */
  onEvent(e) {
    switch (e.type) {
      case 'cat':
        this.world.forceSpawn('cat', 46, (M.hash(e.t) < .5 ? -1 : 1) * 2.2, { sit: true });
        break;
      case 'hueBlip': this.hueBlip = e.amount; break;
      case 'shimmer': PX.Audio.sfx('shimmer'); break;
      case 'whoosh': PX.Audio.sfx('whoosh'); break;
      case 'tunnelIn': PX.Audio.fadeMusic(.25, 1.2); this.shake = .6; break;
      case 'tunnelOut':
        PX.Audio.fadeMusic(1, .25); PX.Audio.sfx('shimmer');
        this.flash = 1; this.burst(this.p.w * .5, this.p.h * .45, 46);
        break;
      case 'closeUp': this.camTimer = e.dur; break;
      case 'fireworks':
        for (let i = 0; i < 6; i++) this.burst(this.p.w * (.15 + Math.random() * .7), this.p.h * (.15 + Math.random() * .4), 26);
        break;
      case 'whiteout': this.flash = 1.6; PX.Audio.sfx('shimmer'); break;
      case 'musicOut': PX.Audio.fadeMusic(0, 3.0); break;
    }
  }

  /* --------------------------------------------------- パーティクル */
  burst(x, y, n) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, s = 20 + Math.random() * 90;
      this.particles.push({
        x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 20,
        life: .5 + Math.random() * .9, max: 1.4,
        c: C.rainbow(Math.random(), .62)
      });
    }
    if (this.particles.length > 460) this.particles.splice(0, this.particles.length - 460);
  }
  updateParticles(dt) {
    for (let i = this.particles.length - 1; i >= 0; i--) {
      const q = this.particles[i];
      q.x += q.vx * dt; q.y += q.vy * dt; q.vy += 42 * dt;
      q.vx *= (1 - dt * 1.1); q.life -= dt;
      if (q.life <= 0) this.particles.splice(i, 1);
    }
  }

  /* ================================================== RENDER */
  render() {
    const p = this.p;
    switch (this.scene) {
      case 'house': this.house.render(); break;
      case 'drive': this.renderDrive(); break;
      case 'outro': this.outro.render(this.outro.stats); break;
    }
    p.time = performance.now() / 1000;
    p.present();
  }

  renderDrive() {
    const p = this.p, pal = this.pal, cond = this.cond, trip = this.trip, road = this.road;
    p.clear(pal.skyTop);

    this.world.render(p, pal, cond, trip, road);
    road.render(p, pal, cond.env, trip);
    this.world.renderObjects(p, pal, cond, trip, road);
    road.renderGuide(p, pal, M.sat(1.2 - trip.level / 6) * .8, cond.env);

    // ドットの花火
    for (const q of this.particles) {
      const a = M.sat(q.life / q.max) * 1.2;
      p.rectA(q.x, q.y, 1 + (q.life > .8 ? 1 : 0), 1 + (q.life > .8 ? 1 : 0), q.c, a);
    }

    // トンネル（世界が一度閉じる。ここが南国への切り替え点）
    const tun = this.tl.out.v.tunnelDark;
    if (tun > .02) this.drawTunnel(tun);

    this.drawCar();
    this.drawHUD();
    this.applyFx();
  }

  /* トンネル: 暗い壁と天井灯が流れる */
  drawTunnel(a) {
    const p = this.p, road = this.road, pal = this.pal;
    const hz = road.horizonY(p);
    const wall = C.mix(pal.near, [6, 5, 10], .8);
    const q = {};
    for (let y = 0; y < p.h; y++) {
      const t = M.sat((y - hz + 24) / (p.h - hz + 24));
      const open = M.lerp(.10, .62, Math.pow(t, .7)) * M.lerp(1.6, 1, a);
      const half = p.w * open;
      const x0 = Math.round(p.w * .5 - half), x1 = Math.round(p.w * .5 + half);
      if (x0 > 0) p.rectA(0, y, x0, 1, wall, a);
      if (x1 < p.w) p.rectA(x1, y, p.w - x1, 1, wall, a);
      if (x0 > 0) p.rectA(x0 - 1, y, 2, 1, C.mix(wall, pal.lightGlow, .18), a * .8);
      if (x1 < p.w) p.rectA(x1 - 1, y, 2, 1, C.mix(wall, pal.lightGlow, .18), a * .8);
    }
    for (let i = 0; i < 12; i++) {
      const dz = M.mod(i * 5 - road.z * .55, 60) + 1.2;
      road.project(p, dz, 0, q);
      const y = Math.round(hz - (q.sy - hz) * .75);
      if (y < 0 || y > hz + 10) continue;
      const w = Math.max(1, q.sw * .5);
      p.rectA(q.sx - w / 2, y, w, Math.max(1, q.sc * 3), pal.lightGlow, a * .9);
    }
  }

  /* ------------------------------------------------ 自車（三人称） */
  drawCar() {
    const p = this.p, road = this.road, pal = this.pal, cond = this.cond;
    const pose = road.carPose(p);
    if (pose.sy < -40 || pose.sy > p.h + 80) return;
    const beat = cond.env.kick;
    // 排気煙（速度とビートで吹く）
    const u = pose.w / 9;
    if (u > .5) {
      for (let i = 0; i < 3; i++) {
        const q = this.exhaust[i] || (this.exhaust[i] = { t: Math.random() });
        q.t += .02 + beat * .03;
        if (q.t > 1) q.t -= 1;
        const a = (1 - q.t) * .22 * (.4 + beat * .6);
        const r = u * (1.2 + q.t * 3.4);
        p.circle(pose.sx - pose.w * .74 + (i - 1) * u * .6, pose.sy - u * 4 + q.t * u * 3,
          r, C.cssa(C.mix(pal.fog, [220, 220, 230], .5), a));
      }
    }
    PX.draw.carRear(p, pose.sx, pose.sy, pose.w, {
      bank: road.bank,
      bounce: -beat * 1.1 - cond.env.bass * .5,
      brake: this.distort * .5,
      beat,
      body: C.mix([206, 62, 96], pal.accentC, .30 + M.sat(this.trip.level / 10) * .35),
      glass: C.mix([64, 88, 128], pal.accentB, .35)
    });
  }

  /* ---------------------------------------------------------- HUD */
  drawHUD() {
    const p = this.p, pal = this.pal;
    // 進行ゲージ（極細）
    const prog = M.sat(this.songTime / this.stage.driveEnd);
    p.rectA(0, 0, p.w, 1, [0, 0, 0], .35);
    p.rect(0, 0, Math.round(p.w * prog), 1, C.mix(pal.line, pal.accentA, .5));

    // スコア / コンボ
    p.text(String(this.score), 4, 4, C.cssa(pal.line, .70), 1, 1);
    if (this.combo > 2) {
      const s = this.combo >= 50 ? 2 : 1;
      const col = this.combo >= 50 ? C.rainbow(performance.now() / 900, .65) : pal.line;
      const txt = this.combo + 'x';
      p.text(txt, p.w - PX.textWidth(txt, s, 1) - 4, 4, C.cssa(col, .8), s, 1);
    }

    // 判定表示（小さく、一瞬だけ）
    if (this.judgeText) {
      const j = this.judgeText;
      const a = M.sat(j.life / .42);
      const col = j.g === 'PERFECT' ? [255, 240, 140] : j.g === 'GROOVY' ? [140, 255, 220]
        : j.g === 'GOOD' ? [200, 200, 220] : [255, 130, 150];
      const y = Math.round(p.h * .78 - (1 - a) * 5);
      p.textC(j.g, p.w * .5, y, C.cssa(col, a * .85), 1, 1);
    }
  }

  /* ------------------------------------------------ ポストエフェクト
     stage データの fx 値は 0..1 の「許容範囲のうちどれだけ使うか」。
     実際の振れ幅は下の FX_MAX がエンジン側の責任として決める。
     これがあるので data 側は思い切り 1.0 と書ける。 */
  applyFx() {
    const p = this.p, K = this.tl.out, trip = this.trip, cond = this.cond;
    const fx = p.fx;
    p.resetFx();
    const lv = M.sat(trip.level / 10);
    const gK = M.lerp(.84, 1.16, trip.grooveBoost);
    const Q = this.qual;   // 自動品質（重い端末では静かに下がる）
    const beat = cond.env.kick, bass = cond.env.bass;
    const X = FX_MAX;
    const now = performance.now();

    // 走行ライン保護: トリップが深いほど「空で暴れて道路は守る」
    fx.protectY = this.road.horizon + .02;
    fx.protect = M.lerp(.40, .90, lv);

    fx.wave = Math.min(X.wave, (K.fx.wave * X.wave + this.distort * .12) * gK);
    fx.waveFreq = 1 + lv * 1.4;
    fx.waveSpeed = .8 + lv;
    fx.vwave = K.fx.vwave * X.vwave + this.distort * .06;
    fx.ripple = Math.min(X.ripple * 1.6, (K.fx.ripple * X.ripple + this.distort * .22) * gK);
    fx.rippleCX = .5; fx.rippleCY = this.road.horizon;
    fx.rgb = K.fx.rgb * X.rgb * (.72 + beat * .5) * gK;
    fx.hue = K.fx.hue * X.hue * Math.sin(now / 4200) + this.hueBlip * .5;
    fx.sat = K.fx.sat * X.sat * gK;
    fx.bright = K.fx.bright * (1 + beat * .04 * lv);
    fx.invert = K.fx.invert * X.invert * (.4 + .6 * Math.abs(Math.sin(now / 3300)));
    fx.posterize = K.fx.posterize * X.posterize;
    fx.trails = K.fx.trails * X.trails * (.85 + this.trip.groove * .25) * Q;
    fx.melt = K.fx.melt * X.melt * gK * Q;
    fx.kaleido = K.fx.kaleido * X.kaleido * gK * (.88 + beat * .14) * Q;
    fx.kaleidoSeg = 4 + Math.floor(lv * 4);
    fx.kaleidoRot = now / 11000;
    fx.tunnel = K.fx.tunnel * X.tunnel * gK * Q;
    fx.vignette = K.fx.vignette + (1 - lv) * .10;
    fx.scan = .09 + lv * .10;
    fx.zoom = 1 + beat * .010 * lv + bass * .006;
    fx.rot = Math.sin(now / 5200) * .014 * lv;
    fx.shakeX = (Math.random() - .5) * this.shake * 6 + this.input.wheelKick * (Math.random() - .5) * 1.6;
    fx.shakeY = (Math.random() - .5) * this.shake * 4;
    fx.flash = M.sat(this.flash * .9 + K.fx.flash * this.flash);
    fx.flashColor = [255, 252, 245];
  }
}

/* --------------------------------------------------------- boot */
function boot() {
  const cv = document.getElementById('view');
  const g = new PX.Game(cv);
  PX.game = g;
  g.start();
  /* デバッグ/プレビュー用: ?t=225 で任意の時刻から、?skip=1 で導入を飛ばす
     （PX.game.seek(秒) でもいつでも移動できる） */
  const q = new URLSearchParams(location.search);
  const t0 = parseFloat(q.get('t'));
  if (q.get('skip') || !isNaN(t0)) g.startDrive(isNaN(t0) ? 0 : t0);
  // 初回タッチで AudioContext を起こす
  const unlock = () => { PX.Audio.init(); };
  document.addEventListener('touchstart', unlock, { once: true });
  document.addEventListener('mousedown', unlock, { once: true });
}
PX.Game = Game;
if (document.readyState === 'complete' || document.readyState === 'interactive') setTimeout(boot, 0);
else window.addEventListener('DOMContentLoaded', boot);

})(window.PX);

</script>
