<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RULE//BREAK - STAGE EDITOR</title>
<style>
/* RULE//BREAK -- near-black, high contrast, everything squared off. */

:root {
  --bg: #050505;
  --fg: #e8e8e8;
  --dim: #7a7a7a;
  --line: #262626;
  --panel: #0d0d0d;
  --accent: #7ad1ff;
  --gold: #d8c23a;
  --red: #e04a5a;
  --font: ui-monospace, SFMono-Regular, "DejaVu Sans Mono", Menlo, Consolas, monospace;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0; padding: 0; height: 100%;
  background: var(--bg); color: var(--fg);
  font-family: var(--font);
  font-size: 14px; letter-spacing: 0.08em;
  overflow: hidden;
  overscroll-behavior: none;
  touch-action: manipulation;
  user-select: none; -webkit-user-select: none;
}

#app { position: fixed; inset: 0; }

.screen {
  position: absolute; inset: 0;
  display: none; flex-direction: column;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
.screen.active { display: flex; }
.hidden { display: none !important; }

/* ---------------------------------------------------------------- title */

#screen-title { align-items: center; justify-content: center; gap: 4vh; }

.logo { font-size: clamp(28px, 9vw, 52px); font-weight: 700; letter-spacing: 0.12em; }
.logo-slash { color: var(--dim); transition: color .2s; }
.logo-slash.live {
  color: var(--red); cursor: pointer;
  animation: blink 1s steps(1) infinite;
  padding: 0 2px;
}
.logo-slash.gone { display: none; }
@keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: .15; } }

.logo-sub { color: var(--dim); font-size: 11px; min-height: 1.2em; text-align: center; }
.title-menu { display: flex; flex-direction: column; gap: 10px; width: min(280px, 70vw); }
.title-foot { position: absolute; bottom: 14px; color: #3a3a3a; font-size: 10px; text-align: center; width: 100%; }

.root-panel {
  border: 1px solid var(--line); background: var(--panel);
  padding: 10px 12px; width: min(320px, 84vw);
}
.root-head { color: var(--red); font-size: 11px; margin-bottom: 8px; }
.root-rule {
  display: flex; justify-content: space-between; align-items: center;
  padding: 6px 0; border-bottom: 1px solid #161616; font-size: 12px; cursor: pointer;
}
.root-rule .state { color: var(--dim); }
.root-rule.off .txt { text-decoration: line-through; color: #4a4a4a; }
.root-rule.off .state { color: var(--red); }
.root-note { color: #4a4a4a; font-size: 10px; margin-top: 8px; line-height: 1.6; }

/* ---------------------------------------------------------------- shared */

.btn {
  background: #101010; color: var(--fg);
  border: 1px solid var(--line); padding: 10px 12px;
  font-family: var(--font); font-size: 12px; letter-spacing: 0.14em;
  cursor: pointer; text-align: center;
}
.btn:active { background: #1c1c1c; }
.btn.big { font-size: 16px; padding: 14px; border-color: #3a3a3a; }
.btn.small { padding: 6px 8px; font-size: 11px; }
.btn[disabled] { color: #333; border-color: #161616; }

.bar {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 10px; border-bottom: 1px solid var(--line);
}
.bar-title { flex: 1; text-align: center; font-size: 12px; color: var(--dim); }
.bar-right { font-size: 11px; color: var(--dim); }

/* ---------------------------------------------------------------- select */

#node-map { flex: 1; overflow-y: auto; padding: 14px 10px 30px; }
.node-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 6px; }
.node-group { color: #3a3a3a; font-size: 10px; margin: 14px 0 6px; }
.node {
  width: 46px; height: 46px; border: 1px solid var(--line); background: #0b0b0b;
  color: var(--fg); font-family: var(--font); font-size: 13px; cursor: pointer;
  display: flex; align-items: center; justify-content: center; position: relative;
}
.node.locked { color: #2a2a2a; border-color: #141414; }
.node.cleared { border-color: var(--accent); color: var(--accent); }
.node.hiddenstage { border-color: var(--red); color: var(--red); }
.node.picked { background: #22222c; }
.node .digit { pointer-events: none; }
.node.surgery .digit { cursor: grab; }
.sel-foot { padding: 8px 12px 16px; color: #4a4a4a; font-size: 10px; line-height: 1.6; border-top: 1px solid var(--line); }

/* ---------------------------------------------------------------- play */

#screen-play { display: none; }
#screen-play.active { display: flex; }

#hud { gap: 6px; }
.chip {
  border: 1px solid var(--line); padding: 6px 8px; font-size: 11px;
  display: flex; gap: 1px; background: #0b0b0b; white-space: nowrap;
}
.chip-title { flex: 1; justify-content: center; color: var(--dim); overflow: hidden; }
.chip .ch { display: inline-block; min-width: .62em; text-align: center; }
.chip .ch.grabbable { color: var(--gold); cursor: grab; }

#board-wrap { flex: 1; position: relative; min-height: 0; }
#board { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; touch-action: none; }

#rot-handle {
  position: absolute; right: 6px; bottom: 6px; width: 30px; height: 30px;
  background: transparent; border: 1px solid #1c1c1c; color: #333;
  font-size: 14px; cursor: pointer; line-height: 1;
}
#rot-handle:active { color: var(--fg); }

.flash {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  pointer-events: none; opacity: 0; font-size: 18px; letter-spacing: .3em;
  background: rgba(255,255,255,.06);
}
.flash.on { animation: flashin .5s ease-out; }
@keyframes flashin { 0% { opacity: 1; } 100% { opacity: 0; } }

.tray { display: flex; flex-wrap: wrap; gap: 5px; padding: 0 8px; }
.tray:empty { display: none; }
.tray .word-chip {
  border: 1px dashed #3a3a44; color: var(--gold); background: #0b0b0b;
  padding: 5px 7px; font-size: 11px; cursor: grab;
}

#controls { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; padding: 8px; }

.note { border-top: 1px solid var(--line); background: var(--panel); max-height: 42vh; display: flex; flex-direction: column; }
.note.closed .note-body { display: none; }
.note-head { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-bottom: 1px solid var(--line); }
.note-title { font-size: 11px; color: var(--dim); }
.note-count { font-size: 10px; color: #3a3a3a; flex: 1; }
.note-x { background: none; border: none; color: var(--dim); font-size: 18px; cursor: pointer; line-height: 1; padding: 0 4px; }
.note-body { overflow-y: auto; padding: 8px 10px 12px; }
.note-obs { font-size: 11px; color: #9a9a9a; line-height: 1.7; margin-bottom: 8px; }
.note-obs div::before { content: "> "; color: #3a3a3a; }
.note-obs .empty { color: #3a3a3a; }
.note-obs .empty::before { content: ""; }

.guess-line { border: 1px solid var(--line); min-height: 30px; padding: 6px; display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.guess-empty { color: #333; font-size: 10px; }
.token-pool { display: flex; flex-wrap: wrap; gap: 4px; margin: 6px 0; }
.token {
  border: 1px solid var(--line); background: #101010; color: var(--fg);
  padding: 4px 6px; font-size: 11px; cursor: pointer; font-family: var(--font);
}
.token.picked { border-color: var(--accent); color: var(--accent); }
.guess-actions { display: flex; gap: 6px; }
.known-rules { margin-top: 10px; font-size: 11px; color: var(--accent); line-height: 1.7; }
.known-rules div::before { content: "\2713 "; }
.known-rules .head { color: #3a3a3a; margin-bottom: 2px; }
.known-rules .head::before { content: ""; }

/* ---------------------------------------------------------------- overlay */

.overlay {
  position: fixed; inset: 0; background: rgba(5,5,5,.94);
  display: flex; align-items: center; justify-content: center; z-index: 40;
  padding: 24px;
}
.overlay .card { width: min(400px, 92vw); border: 1px solid var(--line); background: var(--panel); padding: 18px; }
.overlay h2 { margin: 0 0 12px; font-size: 15px; letter-spacing: .2em; font-weight: 400; }
.overlay p { font-size: 12px; line-height: 1.9; color: #b0b0b0; margin: 0 0 14px; }
.overlay .row { display: flex; gap: 8px; flex-wrap: wrap; }
.overlay .row .btn { flex: 1; }
.overlay .discovered h2 { color: var(--accent); }
.big-word { font-size: clamp(20px, 7vw, 34px); letter-spacing: .28em; text-align: center; margin: 10px 0 18px; }
.hint-tier { border: 1px solid var(--line); padding: 8px; margin-bottom: 8px; font-size: 12px; line-height: 1.8; color: #b0b0b0; }
.hint-tier .lbl { color: #3a3a3a; font-size: 10px; display: block; margin-bottom: 4px; }

.drag-ghost {
  position: fixed; z-index: 60; pointer-events: none;
  border: 1px solid var(--gold); background: #14140c; color: var(--gold);
  padding: 4px 6px; font-size: 12px; font-family: var(--font); transform: translate(-50%, -50%);
}

.shake { animation: shake .18s linear; }
@keyframes shake { 25% { transform: translateX(-3px); } 75% { transform: translateX(3px); } }


  html, body { overflow: auto; }
  #ed { display: grid; grid-template-columns: minmax(320px, 1fr) minmax(300px, 480px); gap: 12px; padding: 12px; height: 100vh; }
  @media (max-width: 780px) { #ed { grid-template-columns: 1fr; height: auto; } }
  textarea {
    width: 100%; height: 100%; min-height: 360px; background: #0b0b0b; color: #d8d8d8;
    border: 1px solid #262626; font-family: var(--font); font-size: 12px; padding: 10px; line-height: 1.5;
  }
  .pane { display: flex; flex-direction: column; gap: 8px; min-height: 0; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; }
  #ed-canvas-wrap { position: relative; height: 300px; border: 1px solid #262626; }
  #ed-canvas { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; }
  #log { border: 1px solid #262626; background: #0b0b0b; padding: 8px; font-size: 11px;
         line-height: 1.7; min-height: 90px; max-height: 220px; overflow: auto; white-space: pre-wrap; }
  .ok { color: #7ad1ff; } .bad { color: #e04a5a; } .dim { color: #6a6a6a; }
  h1 { font-size: 13px; letter-spacing: .2em; margin: 0; color: #7a7a7a; font-weight: 400; }
  select { background: #0b0b0b; color: #d8d8d8; border: 1px solid #262626; font-family: var(--font); padding: 6px; }

</style>
</head>
<body>

<div id="ed">
  <div class="pane">
    <div class="row">
      <h1>STAGE EDITOR</h1>
    </div>
    <div class="row">
      <select id="pick"></select>
      <button class="btn small" id="btn-load">読み込み</button>
      <button class="btn small" id="btn-new">新規</button>
      <button class="btn small" id="btn-fmt">整形</button>
    </div>
    <textarea id="src" spellcheck="false"></textarea>
  </div>

  <div class="pane">
    <div class="row">
      <button class="btn small" id="btn-check">検証（solution を再生）</button>
      <button class="btn small" id="btn-reset">初期化</button>
      <button class="btn small" id="btn-install">ゲームに追加</button>
      <button class="btn small" id="btn-clearcustom">追加分を全消去</button>
      <a class="btn small" href="RULE-BREAK.html">GAME へ</a>
    </div>
    <div id="ed-canvas-wrap"><canvas id="ed-canvas"></canvas></div>
    <div class="row">
      <button class="btn small" data-mv="up">↑</button>
      <button class="btn small" data-mv="down">↓</button>
      <button class="btn small" data-mv="left">←</button>
      <button class="btn small" data-mv="right">→</button>
      <button class="btn small" data-mv="undo">UNDO</button>
    </div>
    <div id="log" class="dim">ステージはすべてデータ。ここで書いて検証すれば、エンジンには一行も触れずに追加できる。</div>
  </div>
</div>


<script>
// RULE//BREAK -- single file build. Generated by tools/build.mjs.
const __M = {};

// ===== src/expr.js =====
__M['expr'] = (function () {
// expr.js -- tiny JSON expression language used by stage data.
//
// Everything a stage author needs to describe a hidden rule is expressed with
// these forms, so new stages never require engine code changes.
//
//   42                       literal
//   "text"                   literal
//   {v:"turn"}               read a context variable (dotted path allowed)
//   {op:"==", a:.., b:..}    operator
//   {op:"and", args:[..]}    n-ary and / or
//   {tileAt:[x,y]}           tile type name at a cell
//   {objAt:[x,y]}            kind of the topmost object at a cell ("" if none)
//   {countObj:"box"}         how many objects of a kind exist
//   {objProp:["box#1","x"]}  read a property of an object (by id or kind)
//   {visitsAt:[x,y]}         how many times the player stepped on a cell
//   {has:"WALL IS SOLID"}    is that rule sentence currently active
//   {label:"door1"}          text label of an object (LEVEL 5 puzzles)
//   {textAt:[x,y]}           text of the word block sitting on a cell
//   {global:"s12_box"}       cross-stage variable
//   {at:["player","goal"]}   do two kinds share a cell
//
// Anything not recognised is returned as-is, so plain objects can be data.

const OPS = {
  '+': (a, b) => a + b,
  '-': (a, b) => a - b,
  '*': (a, b) => a * b,
  '/': (a, b) => (b === 0 ? 0 : a / b),
  '%': (a, b) => ((a % b) + b) % b, // always non-negative, easier to reason about
  '==': (a, b) => a === b,
  '!=': (a, b) => a !== b,
  '<': (a, b) => a < b,
  '<=': (a, b) => a <= b,
  '>': (a, b) => a > b,
  '>=': (a, b) => a >= b,
};

function ev(e, ctx) {
  if (e === null || e === undefined) return e;
  const t = typeof e;
  if (t === 'number' || t === 'string' || t === 'boolean') return e;
  if (Array.isArray(e)) return e.map((x) => ev(x, ctx));

  if ('v' in e) return ctx.get(e.v);
  if ('global' in e) return ctx.getGlobal(e.global);
  if ('has' in e) return ctx.hasSentence(e.has);
  if ('label' in e) return ctx.labelOf(e.label);
  if ('textAt' in e) {
    const [x, y] = ev(e.textAt, ctx);
    return ctx.textAt(x, y);
  }
  if ('tileAt' in e) {
    const [x, y] = ev(e.tileAt, ctx);
    return ctx.tileAt(x, y);
  }
  if ('objAt' in e) {
    const [x, y] = ev(e.objAt, ctx);
    return ctx.objAt(x, y);
  }
  if ('countObj' in e) return ctx.countObj(ev(e.countObj, ctx));
  if ('objProp' in e) {
    const [ref, prop] = ev(e.objProp, ctx);
    return ctx.objProp(ref, prop);
  }
  if ('visitsAt' in e) {
    const [x, y] = ev(e.visitsAt, ctx);
    return ctx.visitsAt(x, y);
  }
  if ('at' in e) {
    const [a, b] = ev(e.at, ctx);
    return ctx.sameCell(a, b);
  }

  if ('op' in e) {
    const op = e.op;
    if (op === 'and') return (e.args || []).every((x) => truthy(ev(x, ctx)));
    if (op === 'or') return (e.args || []).some((x) => truthy(ev(x, ctx)));
    if (op === 'not') return !truthy(ev(e.a !== undefined ? e.a : e.args?.[0], ctx));
    if (op === 'if') return truthy(ev(e.a, ctx)) ? ev(e.b, ctx) : ev(e.c, ctx);
    if (op === 'abs') return Math.abs(ev(e.a, ctx));
    if (op === 'min') return Math.min(...(e.args || [e.a, e.b]).map((x) => ev(x, ctx)));
    if (op === 'max') return Math.max(...(e.args || [e.a, e.b]).map((x) => ev(x, ctx)));
    if (op === 'in') {
      const a = ev(e.a, ctx);
      const list = ev(e.b, ctx) || [];
      return list.includes(a);
    }
    const f = OPS[op];
    if (!f) throw new Error('unknown op: ' + op);
    return f(ev(e.a, ctx), ev(e.b, ctx));
  }
  return e;
}

function truthy(x) {
  if (x === undefined || x === null) return false;
  if (typeof x === 'number') return x !== 0;
  if (typeof x === 'string') return x.length > 0;
  return !!x;
}

function test(e, ctx) {
  if (e === undefined || e === null) return true; // "no condition" means always
  return truthy(ev(e, ctx));
}

// Resolve a dotted path against a plain object graph.
function dig(obj, path) {
  let cur = obj;
  for (const part of String(path).split('.')) {
    if (cur === null || cur === undefined) return undefined;
    cur = cur[part];
  }
  return cur;
}

return { ev, truthy, test, dig };
})();

// ===== src/sentence.js =====
__M['sentence'] = (function () {
// sentence.js -- the rule sentences that literally sit on the board.
//
// From LEVEL 6 onward the board carries word blocks such as
//   WALL IS SOLID / GOAL = CLEAR / PLAYER EXISTS
// and those sentences *are* the engine's configuration. Push a word out of a
// line and the world loses that law.
//
// Grammar (a sentence is a run of >=2 adjacent word blocks, read left-to-right
// on a row or top-to-bottom on a column):
//
//   NOUN IS PROP           WALL IS SOLID
//   NOUN IS NOUN           BOX IS WALL          (transform)
//   NOUN = PROP            GOAL = CLEAR
//   NOUN = NOUN            PLAYER = GOAL        (identity)
//   NOUN CAN VERB          PLAYER CAN MOVE
//   NOUN EXISTS            PLAYER EXISTS
//   IGNORE NEXT RULE       directive
//   IGNORE PREVIOUS RULE   directive
//   THIS RULE IS FALSE     self-referential paradox
//
// Evaluation order is top-to-bottom, then left-to-right. The order is never
// explained to the player; LEVEL 7 is about deducing it.

const NOUNS = new Set([
  'PLAYER', 'WALL', 'BOX', 'GOAL', 'KEY', 'DOOR', 'ENEMY', 'GHOST', 'TEXT',
  'RED', 'BLUE', 'FLOOR', 'RULE', 'STAGE',
]);

const PROPS = new Set([
  'SOLID', 'PUSH', 'WIN', 'YOU', 'STOP', 'OPEN', 'SHUT', 'CLEAR', 'FALSE',
  'FLOAT', 'DEAD', 'SAFE', 'WEAK',
]);

const VERBS = new Set(['MOVE', 'PASS', 'UNDO', 'PUSH', 'WIN']);

// Which kind of board object a noun refers to. Tile nouns map to tile types.
// A noun can cover more than one tile type: BLUE means both the blue floor
// and the blue wall.
const NOUN_TILE = {
  WALL: ['wall'], RED: ['redwall'], BLUE: ['bluewall', 'bluefloor'], FLOOR: ['floor'],
};
const nounForTile = (type) => Object.keys(NOUN_TILE).find((n) => NOUN_TILE[n].includes(type));
const NOUN_OBJ = {
  PLAYER: 'player', BOX: 'box', GOAL: 'goal', KEY: 'key',
  DOOR: 'door', ENEMY: 'enemy', GHOST: 'ghost', TEXT: 'word',
};

function baseSemantics() {
  return {
    props: {},        // NOUN -> Set(PROP)
    can: {},          // NOUN -> Set(VERB)
    ident: [],        // [A, B] pairs from "A = B"
    exists: new Set(),// nouns forced to exist
    sentences: [],    // human readable list of the sentences in force
    paradox: false,   // a THIS RULE IS FALSE is on the board
  };
}

function addProp(sem, noun, prop) {
  (sem.props[noun] || (sem.props[noun] = new Set())).add(prop);
}
function addCan(sem, noun, verb) {
  (sem.can[noun] || (sem.can[noun] = new Set())).add(verb);
}

function hasProp(sem, noun, prop) {
  return !!(sem.props[noun] && sem.props[noun].has(prop));
}
function canDo(sem, noun, verb) {
  return !!(sem.can[noun] && sem.can[noun].has(verb));
}

// Collect maximal runs of adjacent word objects.
function runs(words, w, h) {
  const at = new Map();
  for (const o of words) at.set(o.x + ',' + o.y, o);
  const out = [];
  const scan = (get, len1, len2) => {
    for (let a = 0; a < len1; a++) {
      let run = [];
      for (let b = 0; b < len2; b++) {
        const o = get(a, b);
        if (o) run.push(o);
        else {
          if (run.length >= 2) out.push(run);
          run = [];
        }
      }
      if (run.length >= 2) out.push(run);
    }
  };
  scan((y, x) => at.get(x + ',' + y), h, w);       // rows
  scan((x, y) => at.get(x + ',' + y), w, h);       // columns
  return out;
}

// Split a run of words into the sentences it contains.
function sentencesIn(run) {
  const t = run.map((o) => String(o.text).toUpperCase());
  const out = [];
  let i = 0;
  while (i < t.length) {
    const rest = t.length - i;
    const take = (n, kind) => {
      out.push({ kind, words: t.slice(i, i + n), objs: run.slice(i, i + n), text: t.slice(i, i + n).join(' ') });
      i += n;
    };
    if (rest >= 4 && t[i] === 'THIS' && t[i + 1] === 'RULE' && t[i + 2] === 'IS' && t[i + 3] === 'FALSE') { take(4, 'paradox'); continue; }
    if (rest >= 3 && t[i] === 'IGNORE' && (t[i + 1] === 'NEXT' || t[i + 1] === 'PREVIOUS') && t[i + 2] === 'RULE') { take(3, 'ignore'); continue; }
    if (rest >= 3 && (t[i + 1] === 'IS' || t[i + 1] === '=') && (PROPS.has(t[i + 2]) || NOUNS.has(t[i + 2]))) {
      if (NOUNS.has(t[i])) { take(3, t[i + 1] === '=' ? 'eq' : 'is'); continue; }
    }
    if (rest >= 3 && t[i + 1] === 'CAN' && VERBS.has(t[i + 2]) && NOUNS.has(t[i])) { take(3, 'can'); continue; }
    if (rest >= 2 && t[i + 1] === 'EXISTS' && NOUNS.has(t[i])) { take(2, 'exists'); continue; }
    i++; // this word is not part of any sentence -- yet
  }
  return out;
}

// Parse the board's word blocks into an ordered, directive-resolved rule list.
function parseSentences(words, w, h, evalTick = 0) {
  const found = [];
  for (const run of runs(words, w, h)) {
    for (const s of sentencesIn(run)) {
      const first = s.objs[0];
      found.push({ ...s, y: first.y, x: first.x });
    }

      for (const eff of rule.then || []) this.applyEffect(eff, ctx, out, rule);
      if (rule.note) this.observe(rule.note, rule.id);
      this.emit({ t: 'rule', id: rule.id, when });
    }
    return out;
  }

  applyEffect(eff, ctx, out, rule) {
    const A = (k, d) => (eff[k] === undefined ? d : ev(eff[k], ctx));
    const s = this.s;
    switch (eff.do) {
      case 'cancel': out.cancel = true; break;
      case 'redirect': out.redirect = A('dir'); break;
      case 'setFlag': setDeep(s.flags, A('flag'), A('value', true)); break;
      case 'addFlag': {
        const k = A('flag');
        setDeep(s.flags, k, (digInto(s.flags, k) || 0) + A('by', 1));
        break;
      }
      case 'toggleFlag': {
        const k = A('flag');
        setDeep(s.flags, k, !digInto(s.flags, k));
        break;
      }
      case 'setGlobal': setDeep(this.globals, A('key'), A('value', true)); break;
      case 'setTile': this.setTile(A('x', this.playerX), A('y', this.playerY), A('to', 'wall')); break;
      case 'setTileHere': this.setTile(this.playerX, this.playerY, A('to', 'wall')); break;
      case 'setTilePrev': {
        const p = s.from;
        if (p) this.setTile(p.x, p.y, A('to', 'wall'));
        break;
      }
      case 'addTurn': s.turn += A('by', 1); break;
      case 'setTurn': s.turn = A('to', 0); break;
      case 'moveObj': {
        const o = this.byRef(A('ref', 'goal'));
        if (!o) break;
        let dx = A('dx', 0), dy = A('dy', 0);
        const mode = A('dir', null);
        if (mode) {
          const base = DIRS[mode === 'opposite' ? opposite(ctx.get('dir') || s.lastDir || 'up')
            : mode === 'same' ? (ctx.get('dir') || s.lastDir || 'up') : mode];
          if (base) { dx = base[0] * A('by', 1); dy = base[1] * A('by', 1); }
        }
        const nx = o.x + dx, ny = o.y + dy;
        const force = A('force', false);
        if (force !== true) {
          if (force === 'objects') {
            // Slides under boxes and doors, but still respects the walls.
            const t = this.tileDef(this.tileAt(nx, ny));
            let solid = t.solid;
            if (typeof solid === 'object') solid = test(solid, this.ctx({ tx: nx, ty: ny }));
            if (solid) break;
          } else if (this.solidFor(nx, ny, o)) break;
        }
        o.x = nx; o.y = ny;
        break;
      }
      case 'teleport': {
        const o = this.byRef(A('ref', 'player'));
        if (o) { o.x = A('x', o.x); o.y = A('y', o.y); }
        break;
      }
      case 'swap': {
        const a = this.byRef(A('a', 'player')), b = this.byRef(A('b', 'box'));
        if (a && b) { const t = { x: a.x, y: a.y }; a.x = b.x; a.y = b.y; b.x = t.x; b.y = t.y; }
        break;
      }
      case 'spawn': {
        const o = { id: nextId(), kind: A('kind', 'box'), x: A('x', 0), y: A('y', 0), ...(eff.props || {}) };
        s.objs.push(o);
        break;
      }
      case 'remove': {
        const o = this.byRef(A('ref', 'box'));
        if (o) s.objs.splice(s.objs.indexOf(o), 1);
        break;
      }
      case 'removeAll': {
        const k = A('kind', 'enemy');
        s.objs = s.objs.filter((o) => o.kind !== k);
        break;
      }
      case 'setProp': {
        const o = this.byRef(A('ref', 'player'));
        if (o) o[A('prop', 'label')] = A('value', '');
        break;
      }
      case 'setLabel': {
        const o = this.byRef(A('ref', 'door'));
        if (o) o.label = String(A('value', ''));
        break;
      }
      case 'flipGravity': s.flags.gravDir = s.flags.gravDir === 'up' ? 'down' : 'up'; break;
      case 'setGravity': s.flags.gravDir = A('dir', 'down'); break;
      case 'rotate': s.rot = (((s.rot + A('by', 90)) % 360) + 360) % 360; break;
      case 'setView': s.view = { x: A('x', 0), y: A('y', 0), w: A('w', s.w), h: A('h', s.h) }; break;
      case 'spawnGhost': {
        const from = A('from', 0);
        const src = A('source', 'state') === 'full' ? (this.meta.fullTrail || []) : s.trail;
        const path = src.slice(from).map((p) => ({ ...p }));
        if (path.length) s.objs.push({ id: nextId(), kind: 'ghost', x: path[0].x, y: path[0].y, path, i: 0 });
        break;
      }
      case 'revive': {
        const dead = (s.flags.graveyard || []);
        for (const d of dead) s.objs.push({ id: nextId(), ...d });
        s.flags.graveyard = [];
        break;
      }
      case 'win': s.won = true; break;
      case 'fail': s.dead = true; break;
      case 'note': this.observe(A('text', ''), rule && rule.id); break;
      case 'discover': this.discover(A('rule', rule && rule.id)); break;
      case 'unlock': this.emit({ t: 'unlock', stage: A('stage', '') }); break;
      case 'flash': this.emit({ t: 'flash', text: A('text', ''), color: A('color', '#fff') }); break;
      case 'sound': this.emit({ t: 'sound', name: A('name', 'blip') }); break;
      default: this.emit({ t: 'unknownEffect', name: eff.do });
    }
  }

  // ---------------------------------------------------------------- physics

  // Is (x,y) impassable for `who`? Consults tile rules first, then the board's
  // rule sentences, then objects standing there.
  solidFor(x, y, who = null) {
    if (x < 0 || y < 0 || x >= this.s.w || y >= this.s.h) return true;
    const type = this.tileAt(x, y);
    const def = this.tileDef(type);
    const sem = this.semantics();

    // On sentence-driven stages the words on the board decide what a wall is;
    // everywhere else the tile keeps its own law.
    const noun = nounForTile(type);
    if (noun && this.stage.use_sentences) {
      if (hasProp(sem, noun, 'SOLID') || hasProp(sem, noun, 'STOP')) return true;
      return false;
    }
    if (this.s.flags.rootWallSoft && (type === 'wall' || type === 'redwall' || type === 'bluewall')) {
      // The player edited "WALL IS SOLID" out of the root rules.
      for (const o of this.objsAt(x, y)) if (o !== who && this.objSolid(o, who, sem)) return true;
      return false;
    }
    let solid = def.solid;
    if (typeof solid === 'object') solid = test(solid, this.ctx({ tx: x, ty: y }));
    if (solid) return true;

    for (const o of this.objsAt(x, y)) {
      if (o === who) continue;
      if (this.objSolid(o, who, sem)) return true;
    }
    return false;
  }

  objSolid(o, who, sem = this.semantics()) {
    if (o.kind === 'box') return true;             // handled by the push pass
    if (o.kind === 'word') return !this.stage.words_walkable;
    if (o.kind === 'door') return !this.doorOpen(o);
    if (o.kind === 'enemy') return false;          // walking in gets you caught
    if (o.solid !== undefined) return !!o.solid;
    const noun = Object.keys(NOUN_OBJ).find((n) => NOUN_OBJ[n] === o.kind);
    if (noun && hasProp(sem, noun, 'SOLID')) return true;
    return false;
  }

  doorOpen(d) {
    if (d.open) return true;
    if (d.needs && this.s.keys[d.needs]) return true;
    if (d.link) {
      return this.s.objs.some((o) => o.kind === 'switch' && o.link === d.link
        && this.s.objs.some((p) => p !== o && p.x === o.x && p.y === o.y && ['player', 'box', 'ghost'].includes(p.kind)));
    }
    if (d.openIf) return test(d.openIf, this.ctx());
    return false;
  }

  pushable(o, sem = this.semantics()) {
    if (o.push === false) return false;   // bolted down: bumping it does something else
    if (o.kind === 'box') return true;
    if (o.kind === 'word') return !!this.stage.words_pushable;
    const noun = Object.keys(NOUN_OBJ).find((n) => NOUN_OBJ[n] === o.kind);
    return !!(noun && hasProp(sem, noun, 'PUSH'));
  }

  // ---------------------------------------------------------------- actions

  apply(action) {
    if (this.s.won) return { ok: false, reason: 'won' };
    this.meta.inputs++;
    switch (action.type) {
      case 'move': return this.move(action.dir);
      case 'wait': return this.commitTurn({ moved: false });
      case 'undo': return this.undo();
      case 'reset': this.reset(false); return { ok: true };
      case 'ui': return this.uiAction(action.name, action.args || {});
      default: return { ok: false, reason: 'unknown action' };
    }
  }

  snapshot() { return { s: clone(this.s) }; }
  restore(snap) { this.s = clone(snap.s); }
  pushHistory() { this.history.push(this.snapshot()); if (this.history.length > 4000) this.history.shift(); }

  // Screen direction -> world direction (the board can be rotated).
  worldDir(dir) {
    const steps = ((this.s.rot / 90) | 0) % 4;
    const i = DIR_ORDER.indexOf(dir);
    if (i < 0) return dir;
    return DIR_ORDER[(i + steps + 4) % 4];
  }

  move(screenDir) {
    const before = this.snapshot();
    let dir = this.worldDir(screenDir);
    if (this.s.flags.mirrorInput) dir = opposite(dir);

    const p = this.player;
    if (!p) { this.emit({ t: 'noPlayer' }); return { ok: false, reason: 'no player' }; }
    this.s.from = { x: p.x, y: p.y };

    // Rules get to see where the move is aiming before it happens.
    const aim = DIRS[dir] || [0, 0];
    const pre = this.fire('beforeMove', { dir, screenDir, tx: p.x + aim[0], ty: p.y + aim[1] });
    if (pre.redirect) dir = pre.redirect;
    if (pre.cancel) { this.pushHistoryFrom(before); return this.commitTurn({ moved: false, blocked: true, dir }); }

    const sem = this.semantics();
    if (this.stage.use_sentences && !hasProp(sem, 'PLAYER', 'YOU') && !sem.props.PLAYER) {
      // Nothing is "you" any more.
      this.emit({ t: 'notYou' });
      return { ok: false, reason: 'not you' };
    }
    if (this.stage.use_sentences && sem.can.PLAYER && !canDo(sem, 'PLAYER', 'MOVE')) {
      this.emit({ t: 'cannotMove' });
      return { ok: false, reason: 'cannot move' };
    }

    this.s.facing = dir;
    const [dx, dy] = DIRS[dir];
    const nx = p.x + dx, ny = p.y + dy;

    // Push chain.
    const pushed = this.objsAt(nx, ny).filter((o) => this.pushable(o, sem));
    if (pushed.length) {
      const chain = this.pushChain(nx, ny, dx, dy, sem);
      if (!chain) {
        this.pushHistoryFrom(before);
        this.fire('moveBlocked', { dir, byBox: true });
        return this.commitTurn({ moved: false, blocked: true, dir });
      }
      this.pushHistoryFrom(before);
      const ordered = [...chain].reverse(); // farthest first, so nothing overlaps mid-push
      for (const o of ordered) {
        o.x += dx; o.y += dy;
        o.pushed = (o.pushed || 0) + 1;
        this.s.boxPushes[o.id] = o.pushed;
      }
      const lead = ordered[0];
      if (lead && lead.slide) {
        for (let guard = 0; guard < 64; guard++) {
          const tx = lead.x + dx, ty = lead.y + dy;
          if (this.solidFor(tx, ty, lead)) break;
          if (this.objsAt(tx, ty).some((o) => o.kind === 'player')) break;
          lead.x = tx; lead.y = ty;
        }
      }
      this.s.pushes++;
      p.x = nx; p.y = ny;
      this.fire('onPush', { dir, count: chain.length, ref: '#' + chain[0].id });
      return this.commitTurn({ moved: true, dir, pushed: true });
    }

    if (this.solidFor(nx, ny, p)) {
      this.pushHistoryFrom(before);
      const blocker = this.objsAt(nx, ny).find((o) => this.objSolid(o, p, sem));
      this.fire('moveBlocked', { dir, tile: this.tileAt(nx, ny), by: blocker ? blocker.kind : this.tileAt(nx, ny), ref: blocker ? '#' + blocker.id : null });
      this.observeBlocked(nx, ny);
      return this.commitTurn({ moved: false, blocked: true, dir });
    }

    this.pushHistoryFrom(before);
    p.x = nx; p.y = ny;
    return this.commitTurn({ moved: true, dir });
  }

  pushHistoryFrom(snap) { this.history.push(snap); }

  pushChain(x, y, dx, dy, sem) {
    const chain = [];
    let cx = x, cy = y;
    for (let guard = 0; guard < 64; guard++) {
      const here = this.objsAt(cx, cy).filter((o) => this.pushable(o, sem));
      if (!here.length) break;
      chain.push(...here);
      cx += dx; cy += dy;
      if (cx < 0 || cy < 0 || cx >= this.s.w || cy >= this.s.h) return null;
      const t = this.tileDef(this.tileAt(cx, cy));
      let solid = t.solid;
      if (typeof solid === 'object') solid = test(solid, this.ctx({ tx: cx, ty: cy }));
      if (solid && !t.boxPass) return null;   // a grate stops people, not cargo
      const blockers = this.objsAt(cx, cy).filter((o) => !this.pushable(o, sem) && this.objSolid(o, null, sem));
      if (blockers.length) return null;
    }
    return chain.length ? chain : null;
  }

  commitTurn(info) {
    const s = this.s;
    const tc = this.stage.turn_conditions || {};
    if (info.moved) {
      s.lastDir = info.dir;
      for (const d of Object.keys(s.streak)) s.streak[d] = d === info.dir ? s.streak[d] + 1 : 0;
      s.turn += tc.step ?? 1;
    } else if (info.blocked && tc.countBlocked) {
      s.turn += tc.step ?? 1;
    }
    this.meta.evalTick++;

    if (info.moved) {
      this.fire('onEnter', { tile: this.tileAt(this.playerX, this.playerY), dir: info.dir });
    }
    this.fire('afterMove', { dir: info.dir, moved: !!info.moved, blocked: !!info.blocked });
    this.gravity();
    // Only the cell you come to rest on counts as a place you have been.
    if (info.moved) {
      s.visits[this.playerX + ',' + this.playerY] = this.visitsAt(this.playerX, this.playerY) + 1;
      s.trail.push({ x: this.playerX, y: this.playerY });
      (this.meta.fullTrail || (this.meta.fullTrail = [])).push({ x: this.playerX, y: this.playerY });
      this.pickups();
    }
    this.stepActors(info);
    this.fire('everyTurn', { dir: info.dir });
    this.hazards();
    this.applyExistence();
    this.checkWin();
    this.emit({ t: 'turn', turn: s.turn, moved: !!info.moved });
    return { ok: true, moved: !!info.moved, won: s.won, dead: s.dead };
  }

  pickups() {
    const p = this.player;
    if (!p) return;
    for (const o of this.objsAt(p.x, p.y)) {
      if (o.kind === 'key') {
        this.s.keys[o.keyId || 'k'] = true;
        this.s.objs.splice(this.s.objs.indexOf(o), 1);
        this.emit({ t: 'sound', name: 'get' });
      }
    }
  }

  gravity() {
    const dir = this.s.flags.gravDir;
    if (!dir) return;
    const [dx, dy] = DIRS[dir];
    for (let guard = 0; guard < 64; guard++) {
      let moved = false;
      for (const o of this.s.objs) {
        if (!['player', 'box'].includes(o.kind)) continue;
        if (o.float) continue;
        if (!this.solidFor(o.x + dx, o.y + dy, o)) { o.x += dx; o.y += dy; moved = true; }
      }
      if (!moved) break;
    }
  }

  stepActors(info) {
    for (const o of this.s.objs) {
      if (o.kind === 'ghost') {
        o.i = Math.min((o.i || 0) + 1, o.path.length - 1);
        const p = o.path[o.i];
        o.x = p.x; o.y = p.y;
      }
    }
    if (!info.moved) return;
    for (const e of this.s.objs.filter((o) => o.kind === 'enemy')) this.stepEnemy(e, info);
  }

  stepEnemy(e, info) {
    const p = this.player;
    if (!p) return;
    const behavior = e.behavior || 'chase';
    const tryMove = (dir) => {
      const [dx, dy] = DIRS[dir] || [0, 0];
      if (this.solidFor(e.x + dx, e.y + dy, e)) return false;
      e.x += dx; e.y += dy; return true;
    };
    if (behavior === 'mirror') {
      tryMove(opposite(info.dir));
    } else if (behavior === 'copy') {
      tryMove(info.dir);
    } else if (behavior === 'patrol') {
      // Walks its route; on hitting something it takes the next leg instead.
      const path = e.patrol || ['left', 'right'];
      e.pi = (e.pi || 0) % path.length;
      if (!tryMove(path[e.pi])) {
        e.pi = (e.pi + 1) % path.length;
        tryMove(path[e.pi]);
      }
    } else if (behavior === 'still') {
      // stays put
    } else { // chase: greedy, longest axis first
      const dx = p.x - e.x, dy = p.y - e.y;
      const order = Math.abs(dx) >= Math.abs(dy)
        ? [dx > 0 ? 'right' : 'left', dy > 0 ? 'down' : 'up']
        : [dy > 0 ? 'down' : 'up', dx > 0 ? 'right' : 'left'];
      for (const d of order) { if ((d === 'right' && dx === 0) || (d === 'left' && dx === 0) || (d === 'down' && dy === 0) || (d === 'up' && dy === 0)) continue; if (tryMove(d)) break; }
    }
  }

  hazards() {
    const p = this.player;
    if (!p) return;
    const def = this.tileDef(this.tileAt(p.x, p.y));
    if (def.deadly) { this.s.dead = true; this.emit({ t: 'dead', why: 'hole' }); }
    if (this.s.objs.some((o) => o.kind === 'enemy' && o.x === p.x && o.y === p.y)) {
      this.s.dead = true; this.emit({ t: 'dead', why: 'enemy' });
    }
  }

  // "PLAYER EXISTS" / "GOAL EXISTS" literally control whether things are there.
  applyExistence() {
    if (!this.stage.existence_kinds) return;
    const sem = this.semantics();
    for (const noun of this.stage.existence_kinds) {
      const kind = NOUN_OBJ[noun] || noun.toLowerCase();
      const have = this.s.objs.find((o) => o.kind === kind);
      const should = sem.exists.has(noun);
      if (should && !have) {
        const sp = (this.stage.spawns || {})[noun] || { x: 1, y: 1 };
        this.s.objs.push({ id: nextId(), kind, x: sp.x, y: sp.y });
        this.emit({ t: 'sound', name: 'discover' });
      } else if (!should && have) {
        this.s.objs.splice(this.s.objs.indexOf(have), 1);
      }
    }
  }

  undo() {
    if (!this.history.length) { this.emit({ t: 'noUndo' }); return { ok: false, reason: 'empty' }; }
    const snap = this.history.pop();
    this.restore(snap);
    this.meta.undos++;
    this.meta.evalTick++;
    this.fire('onUndo', { undos: this.meta.undos });
    this.applyExistence();
    this.checkWin();
    this.emit({ t: 'undo', undos: this.meta.undos });
    return { ok: true, won: this.s.won };
  }

  // ---------------------------------------------------------------- UI as gameplay

  allows(name) {
    const list = this.stage.available_ui_actions || ['undo', 'reset'];
    if (!list.includes(name)) return false;
    // A stage may also say *when* an action works -- a board that only turns
    // while you stand on the pivot, for instance.
    const cond = (this.stage.ui_conditions || {})[name];
    return cond === undefined ? true : test(cond, this.ctx());
  }

  uiAction(name, args) {
    if (!this.allows(name)) { this.emit({ t: 'uiRefused', name }); return { ok: false, reason: 'not available' }; }
    const s = this.s;
    const before = this.snapshot();
    let handled = true;
    switch (name) {
      case 'zoom':
        this.pushHistoryFrom(before);
        s.flags.zoomed = !s.flags.zoomed;
        s.view = s.flags.zoomed ? { x: 0, y: 0, w: s.w, h: s.h } : { ...(this.stage.view || { x: 0, y: 0, w: s.w, h: s.h }) };
        break;
      case 'rotate': {
        this.pushHistoryFrom(before);
        const by = args.by ?? this.stage.rotate_step ?? 90;
        s.rot = (((s.rot + by) % 360) + 360) % 360;
        // Turning the screen turns which way is down.
        if (s.flags.gravDir) {
          const steps = (((by / 90) | 0) % 4 + 4) % 4;
          const i = DIR_ORDER.indexOf(s.flags.gravDir);
          if (i >= 0) s.flags.gravDir = DIR_ORDER[(i + steps) % 4];
        }
        break;
      }
      case 'closeNote':
        this.pushHistoryFrom(before);
        s.flags.noteClosed = !s.flags.noteClosed;
        break;
      case 'tapTitle':
        this.pushHistoryFrom(before);
        s.flags.titleTaps = (s.flags.titleTaps || 0) + 1;
        break;
      case 'dropUI': { // drag a UI label (RESET, UNDO, MOVES...) onto the board
        const { item, x, y } = args;
        if (this.solidFor(x, y, null)) { handled = false; break; }
        this.pushHistoryFrom(before);
        const base = 'ui_' + String(item).toUpperCase();
        let wid = base, n = 1;
        while (s.objs.some((o) => o.id === wid)) wid = base + '_' + (++n);
        s.objs.push({ id: wid, kind: 'word', text: String(item).toUpperCase(), x, y, fromUI: true });
        break;
      }
      case 'dropChar': { // pull a character out of a UI label and graft it onto an object
        const { char, ref, mode } = args;
        const o = this.byRef(ref);
        if (!o) { handled = false; break; }
        this.pushHistoryFrom(before);
        const cur = String(o.label ?? '');
        o.label = mode === 'set' ? String(char)
          : mode === 'prepend' ? String(char) + cur
          : cur + String(char);
        break;
      }
      case 'splitWord': { // RESET -> RE + SET
        const o = this.byRef(args.ref);
        if (!o || o.kind !== 'word') { handled = false; break; }
        const at = args.at ?? 2;
        const head = o.text.slice(0, at), tail = o.text.slice(at);
        if (!head || !tail) { handled = false; break; }
        this.pushHistoryFrom(before);
        o.text = head;
        s.objs.push({ id: 'ui_' + tail, kind: 'word', text: tail,
          x: args.x ?? o.x, y: args.y ?? o.y, fromUI: o.fromUI });
        break;
      }
      case 'wordDrag': { // pick a word block up and put it somewhere else
        const o = this.byRef(args.ref);
        if (!o || o.kind !== 'word') { handled = false; break; }
        if (this.solidFor(args.x, args.y, o)) { handled = false; break; }
        this.pushHistoryFrom(before);
        o.x = args.x; o.y = args.y;
        break;
      }
      case 'dragBoard':
        s.view = { ...s.view, x: args.x ?? s.view.x, y: args.y ?? s.view.y };
        break;
      default:
        this.pushHistoryFrom(before);
        s.flags['ui_' + name] = (s.flags['ui_' + name] || 0) + 1;
    }
    if (!handled) { this.emit({ t: 'uiFailed', name }); return { ok: false }; }
    this.meta.evalTick++;
    const res = this.fire('onUI', { ui: { name, ...args } });
    if ((this.stage.turn_conditions || {}).uiCountsTurn) s.turn += 1;
    this.gravity();
    this.applyExistence();
    this.checkWin();

__M['save'] = (function () {
// save.js -- autosave. The game may pretend to break; the save file never does.
const KEY = 'rulebreak.save.v1';

const BLANK = {
  version: 1,
  cleared: {},      // stageId -> true
  discovered: {},   // ruleId  -> true
  notes: {},        // stageId -> [observation strings]
  globals: {},      // cross-stage variables
  unlocked: {},     // hidden stage ids
  hints: {},        // stageId -> how many hint tiers were opened
  titleBroken: false,
  rootRules: {},    // root rules the player has edited (post-title-break)
  muted: false,
  lastStage: '1',
};

let cache = null;

function load() {
  if (cache) return cache;
  try {
    const raw = localStorage.getItem(KEY);
    cache = raw ? { ...BLANK, ...JSON.parse(raw) } : { ...BLANK };
  } catch {
    cache = { ...BLANK };            // corrupt or blocked storage: start clean, never throw
  }
  for (const k of Object.keys(BLANK)) if (cache[k] === undefined) cache[k] = BLANK[k];
  return cache;
}

let pending = null;
function save() {
  const data = load();
  if (pending) clearTimeout(pending);
  pending = setTimeout(() => {
    pending = null;
    try { localStorage.setItem(KEY, JSON.stringify(data)); } catch { /* storage full or denied */ }
  }, 120);
}

function saveNow() {
  const data = load();
  try { localStorage.setItem(KEY, JSON.stringify(data)); } catch { /* ignore */ }
}

function wipe() {
  cache = { ...BLANK };
  saveNow();
}

return { load, save, saveNow, wipe };

// needs to know the difference.
function registerStages(list) {
  for (const st of list || []) {
    const i = STAGES.findIndex((s) => String(s.id) === String(st.id));
    if (i >= 0) STAGES[i] = st; else STAGES.push(st);

  return STAGES;
}

  STAGES.filter((s) => !s.hidden || unlocked[s.id]);

  if (M[str]) return { type: 'move', dir: M[str] };
  if (str === 'Z') return { type: 'undo' };
  if (str === 'X') return { type: 'reset' };
  if (str === 'W') return { type: 'wait' };
  if (String(str).startsWith('ui:')) {
    const [, name, rest] = String(str).split(':');
    const a = (rest || '').split(',');
    switch (name) {
      case 'wordDrag': return { type: 'ui', name, args: { ref: a[0], x: +a[1], y: +a[2] } };
      case 'dropUI': return { type: 'ui', name, args: { item: a[0], x: +a[1], y: +a[2] } };
      case 'dropChar': return { type: 'ui', name, args: { char: a[0], ref: a[1], mode: a[2] || 'append' } };
      case 'splitWord': return { type: 'ui', name, args: { ref: a[0], at: +a[1], x: +a[2], y: +a[3] } };
      default: return { type: 'ui', name, args: {} };
    }
  }
  throw new Error('未知の操作: ' + str);
};

const renderer = new Renderer($('ed-canvas'));
let game = null;

function log(msg, cls = 'dim') {
  $('log').className = cls;
  $('log').textContent = msg;
}

function currentStage() {
  return JSON.parse($('src').value);
}

function boot() {
  const sel = $('pick');
  for (const st of STAGES) {
    const o = document.createElement('option');
    o.value = st.id;
    o.textContent = `${st.id}  ${st.title}`;
    sel.appendChild(o);
  }
  $('src').value = JSON.stringify(TEMPLATE, null, 2);
  fresh();
}

function fresh() {
  try {
    const st = currentStage();
    game = new Game(st, { globals: {} });
    renderer.resize();
    renderer.draw(game, {});
    return true;
  } catch (e) {
    log('JSON か盤面の定義にエラー: ' + e.message, 'bad');
    return false;
  }
}

$('btn-load').onclick = () => {
  const st = STAGES.find((s) => String(s.id) === $('pick').value);
  if (!st) return;
  $('src').value = JSON.stringify(st, null, 2);
  fresh();
  log(`STAGE ${st.id} を読み込んだ。書き換えて「検証」。`, 'dim');
};
$('btn-new').onclick = () => { $('src').value = JSON.stringify(TEMPLATE, null, 2); fresh(); };
$('btn-fmt').onclick = () => {
  try { $('src').value = JSON.stringify(JSON.parse($('src').value), null, 2); log('整形した。', 'ok'); }
  catch (e) { log('JSON エラー: ' + e.message, 'bad'); }
};
$('btn-reset').onclick = () => { if (fresh()) log('初期化した。', 'dim'); };

$('btn-check').onclick = () => {
  let st;
  try { st = currentStage(); } catch (e) { return log('JSON エラー: ' + e.message, 'bad'); }
  const problems = [];
  if (!st.id) problems.push('id がない');
  if (!st.grid || !st.grid.rows || !st.grid.rows.length) problems.push('grid.rows がない');
  else {
    const w = st.grid.rows[0].length;
    if (!st.grid.rows.every((r) => r.length === w)) problems.push('grid.rows の長さが揃っていない');
  }
  if (!st.hint_1 || !st.hint_2 || !st.hint_3) problems.push('hint_1..3 のいずれかがない');
  if (!Array.isArray(st.solution) || !st.solution.length) problems.push('solution がない（検証できない）');
  if (problems.length) return log('NG:\n  - ' + problems.join('\n  - '), 'bad');

  const g = new Game(st, { globals: { ...(st.test_globals || {}) } });
  let stepInfo = '';
  try {
    st.solution.forEach((a, i) => {
      g.apply(parseAction(a));
      if (g.s.dead) throw new Error(`${i + 1}手目 (${a}) で死亡`);
    });
  } catch (e) { return log('NG: ' + e.message, 'bad'); }
  game = g;
  renderer.resize(); renderer.draw(g, {});
  stepInfo = `solution ${st.solution.length}手 / MOVES ${g.s.turn}`;
  if (g.s.won) log(`OK: クリア可能。${stepInfo}`, 'ok');
  else log(`NG: solution を再生してもクリアにならない。${stepInfo}`, 'bad');
};

$('btn-install').onclick = () => {
  let st;
  try { st = currentStage(); } catch (e) { return log('JSON エラー: ' + e.message, 'bad'); }
  const list = JSON.parse(localStorage.getItem(CUSTOM_KEY) || '[]');
  const i = list.findIndex((s) => String(s.id) === String(st.id));
  if (i >= 0) list[i] = st; else list.push(st);
  localStorage.setItem(CUSTOM_KEY, JSON.stringify(list));
  log(`STAGE ${st.id} をゲームに追加した。ステージ選択の CUSTOM に出る。`, 'ok');
};

$('btn-clearcustom').onclick = () => {
  localStorage.removeItem(CUSTOM_KEY);
  log('追加ステージを全消去した。本編のセーブデータには触れていない。', 'ok');
};

for (const b of document.querySelectorAll('[data-mv]')) {
  b.onclick = () => {
    if (!game) return;
    const m = b.dataset.mv;
    game.apply(m === 'undo' ? { type: 'undo' } : { type: 'move', dir: m });
    renderer.draw(game, {});
    log(`MOVES ${game.s.turn}${game.s.won ? '  -- CLEAR' : ''}${game.s.dead ? '  -- DEAD' : ''}`,
      game.s.won ? 'ok' : 'dim');
  };
}

window.addEventListener('resize', () => { if (game) { renderer.resize(); renderer.draw(game, {}); } });
boot();

return {  };
})();

</script>
