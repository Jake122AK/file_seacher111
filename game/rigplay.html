/* irradiance convolution (cosine) from env cube */
const FS_IRRADIANCE = SH_COMMON + `
uniform samplerCube uEnv;
uniform int uFace;
in vec2 vUV;
out vec4 outC;
vec3 faceDir(int f, vec2 uv){
  vec2 t = uv*2.0-1.0;
  if(f==0) return normalize(vec3( 1.0, -t.y, -t.x));
  if(f==1) return normalize(vec3(-1.0, -t.y,  t.x));
  if(f==2) return normalize(vec3( t.x,  1.0,  t.y));
  if(f==3) return normalize(vec3( t.x, -1.0, -t.y));
  if(f==4) return normalize(vec3( t.x, -t.y,  1.0));
  return normalize(vec3(-t.x, -t.y, -1.0));
}
void main(){
  vec3 N = faceDir(uFace, vUV);
  vec3 up = abs(N.y)<0.999 ? vec3(0,1,0) : vec3(1,0,0);
  vec3 T = normalize(cross(up,N)), B = cross(N,T);
  vec3 sum = vec3(0.0); float w = 0.0;
  const int NPHI = 40, NTH = 12;
  for(int i=0;i<NPHI;i++){
    float phi = float(i)/float(NPHI)*TAU;
    for(int j=0;j<NTH;j++){
      float th = (float(j)+0.5)/float(NTH)*PI*0.5;
      vec3 L = cos(phi)*sin(th)*T + sin(phi)*sin(th)*B + cos(th)*N;
      float c = cos(th)*sin(th);
      sum += textureLod(uEnv, L, 2.0).rgb * c;
      w += c;
    }
  }
  outC = vec4(sum/max(w,1e-4), 1.0);
}
`;

/* GGX prefilter */
const FS_PREFILTER = SH_COMMON + `
uniform samplerCube uEnv;
uniform int uFace;
uniform float uRough;
uniform float uSrcSize;
in vec2 vUV;
out vec4 outC;
vec3 faceDir(int f, vec2 uv){
  vec2 t = uv*2.0-1.0;
  if(f==0) return normalize(vec3( 1.0, -t.y, -t.x));
  if(f==1) return normalize(vec3(-1.0, -t.y,  t.x));
  if(f==2) return normalize(vec3( t.x,  1.0,  t.y));
  if(f==3) return normalize(vec3( t.x, -1.0, -t.y));
  if(f==4) return normalize(vec3( t.x, -t.y,  1.0));
  return normalize(vec3(-t.x, -t.y, -1.0));
}
float radicalInverse(uint bits){
  bits = (bits << 16u) | (bits >> 16u);
  bits = ((bits & 0x55555555u) << 1u) | ((bits & 0xAAAAAAAAu) >> 1u);
  bits = ((bits & 0x33333333u) << 2u) | ((bits & 0xCCCCCCCCu) >> 2u);
  bits = ((bits & 0x0F0F0F0Fu) << 4u) | ((bits & 0xF0F0F0F0u) >> 4u);
  bits = ((bits & 0x00FF00FFu) << 8u) | ((bits & 0xFF00FF00u) >> 8u);
  return float(bits) * 2.3283064365386963e-10;
}
vec3 importanceGGX(vec2 Xi, vec3 N, float rough){
  float a = rough*rough;
  float phi = TAU*Xi.x;
  float ct = sqrt((1.0-Xi.y)/(1.0+(a*a-1.0)*Xi.y));
  float st = sqrt(1.0-ct*ct);
  vec3 H = vec3(cos(phi)*st, sin(phi)*st, ct);
  vec3 up = abs(N.z)<0.999?vec3(0,0,1):vec3(1,0,0);
  vec3 T = normalize(cross(up,N)), B = cross(N,T);
  return normalize(T*H.x + B*H.y + N*H.z);
}
void main(){
  vec3 N = faceDir(uFace, vUV); vec3 V = N;
  const uint NS = 64u;
  vec3 sum = vec3(0.0); float wsum = 0.0;
  for(uint i=0u;i<NS;i++){
    vec2 Xi = vec2(float(i)/float(NS), radicalInverse(i));
    vec3 H = importanceGGX(Xi, N, uRough);
    vec3 L = normalize(2.0*dot(V,H)*H - V);
    float ndl = max(dot(N,L),0.0);
    if(ndl>0.0){
      float ndh = max(dot(N,H),0.0);
      float a = uRough*uRough;
      float d = (ndh*a - ndh)*ndh + 1.0;
      float D = a/(PI*d*d+1e-7);
      float pdf = D*ndh/(4.0*max(dot(V,H),1e-4)) + 1e-4;
      float sa_t = 1.0/(float(NS)*pdf);
      float sa_s = 4.0*PI/(6.0*uSrcSize*uSrcSize);
      float mip = uRough==0.0 ? 0.0 : max(0.5*log2(sa_t/sa_s)+1.0, 0.0);
      sum += textureLod(uEnv, L, mip).rgb*ndl; wsum += ndl;
    }
  }
  outC = vec4(sum/max(wsum,1e-4),1.0);
}
`;

/* --------------------------- MATERIAL BAKING --------------------------- */
/* Bakes tileable material layers.
   MRT0 = albedo.rgb + AO        MRT1 = normal.xy(+z implicit) , roughness, detailMask */
const FS_BAKE = SH_COMMON + `
uniform int uLayer;
uniform float uRes;
in vec2 vUV;
layout(location=0) out vec4 outA;
layout(location=1) out vec4 outB;

const float P = 8.0; // tiling period in noise space

/* ---- height fields per material; normal derived by finite difference ---- */
float hVermillion(vec2 uv, out vec3 alb, out float rough, out float ao){
  // fine grain running along +V (the timber axis)
  float g1 = pfbm(vec2(uv.x*P*22.0, uv.y*P*2.2), P*16.0, 4);
  float g2 = pfbm(vec2(uv.x*P*64.0, uv.y*P*6.0), P*32.0, 3);
  float grain = g1*0.62 + g2*0.38;
  float drift = pfbm(uv*P*1.25 + vec2(5.0,9.0), P*2.0, 4);
  // rain-washed streaks down the timber
  float streak = pfbm(vec2(uv.x*P*17.0, uv.y*P*0.85), P*16.0, 4);
  streak = smoothstep(0.50, 0.82, streak);
  // sparse paint chips
  vec2 w = pworley(uv*P*15.0, P*15.0);
  float chips = smoothstep(0.085, 0.015, w.x) * step(0.60, pfbm(uv*P*4.0+vec2(3.0,8.0), P*4.0, 3));
  // hairline checking
  float ck = pfbm(vec2(uv.x*P*38.0, uv.y*P*1.5), P*32.0, 3);
  float crack = smoothstep(0.705,0.775,ck)*smoothstep(0.880,0.790,ck);

  vec3 fresh = vec3(0.780, 0.198, 0.072);
  vec3 faded = vec3(0.620, 0.238, 0.148);
  vec3 bare  = vec3(0.285, 0.175, 0.125);
  alb = mix(fresh, faded, saturate(drift*0.90 + grain*0.22 - 0.10));
  alb *= 1.0 - streak*0.085;
  alb = mix(alb, bare, chips*0.55);
  alb = mix(alb, bare*0.7, crack*0.45);
  alb *= 0.955 + 0.085*grain;

  float h = grain*0.30 + drift*0.12 - crack*0.55 - chips*0.45;
  rough = clamp(0.33 + drift*0.19 + streak*0.11 + crack*0.20 + chips*0.24, 0.16, 0.86);
  ao = 1.0 - crack*0.32 - chips*0.28;
  return h;
}

float hBlack(vec2 uv, out vec3 alb, out float rough, out float ao){
  float grain = pfbm(vec2(uv.x*P*3.0, uv.y*P*10.0), P*4.0, 4);
  float dust  = pfbm(uv*P*5.0+vec2(2.,8.), P*5.0, 4);
  vec2 w = pworley(uv*P*7.0, P*7.0);
  float pit = smoothstep(0.16,0.0,w.x);
  alb = mix(vec3(0.036,0.033,0.031), vec3(0.085,0.078,0.070), dust*0.8+grain*0.2);
  alb = mix(alb, vec3(0.145,0.120,0.098), pit*0.35);
  rough = clamp(mix(0.34,0.72,dust)+pit*0.2, 0.2, 0.95);
  ao = 1.0-pit*0.4;
  return grain*0.3 - pit*0.6;
}

float hStone(vec2 uv, out vec3 alb, out float rough, out float ao){
  // wet packed-stone path : irregular flags + grit + puddle-prone lows
  vec2 c = pworley(uv*P*2.2, P*2.2);
  float edge = smoothstep(0.045, 0.0, c.y-c.x);          // joint lines
  float cellId = hash12(floor(uv*P*2.2)+0.5);
  float grit  = pfbm(uv*P*16.0, P*16.0, 4);
  float coarse= pfbm(uv*P*3.5+vec2(4.,1.), P*3.5, 5);
  vec2 pebble = pworley(uv*P*9.0, P*9.0);
  float peb = smoothstep(0.30,0.06,pebble.x);

  vec3 base = mix(vec3(0.176,0.166,0.152), vec3(0.246,0.232,0.212), cellId);
  base = mix(base, vec3(0.132,0.136,0.120), coarse*0.55);
  base = mix(base, vec3(0.228,0.216,0.194), peb*0.5*grit);
  base *= 0.85+0.30*grit;
  base = mix(base, vec3(0.078,0.078,0.072), edge*0.85);
  alb = base;
  float h = -edge*1.0 + coarse*0.35 + grit*0.12 + peb*0.25;
  rough = clamp(0.55 + coarse*0.25 - peb*0.1, 0.25, 0.95);
  ao = 1.0 - edge*0.75 - (1.0-coarse)*0.12;
  return h;
}

float hMoss(vec2 uv, out vec3 alb, out float rough, out float ao){
  float m1 = pfbm(uv*P*7.0, P*7.0, 5);
  float m2 = pfbm(uv*P*22.0+vec2(3.,6.), P*22.0, 3);
  vec2 cl = pworley(uv*P*13.0, P*13.0);
  float clump = smoothstep(0.34,0.02,cl.x);
  float dirt = pfbm(uv*P*3.0+vec2(9.,2.), P*3.0, 5);
  vec3 mossC = mix(vec3(0.088,0.150,0.062), vec3(0.165,0.235,0.092), m2);
  mossC = mix(mossC, vec3(0.215,0.280,0.115), clump*0.6);
  vec3 dirtC = mix(vec3(0.118,0.096,0.070), vec3(0.185,0.152,0.112), m1);
  alb = mix(dirtC, mossC, smoothstep(0.36,0.62,dirt));
  float h = m1*0.5+m2*0.35+clump*0.6;
  rough = clamp(0.78 + m2*0.15, 0.5, 0.98);
  ao = clamp(0.45+0.55*(m1*0.5+clump*0.5), 0.2, 1.0);
  return h;
}

float hGranite(vec2 uv, out vec3 alb, out float rough, out float ao){
  float sp = pfbm(uv*P*30.0, P*30.0, 3);
  vec2 fl = pworley(uv*P*18.0, P*18.0);
  float flake = smoothstep(0.22,0.02,fl.x);
  float lich = pfbm(uv*P*5.0+vec2(7.,3.), P*5.0, 5);
  float lichM = smoothstep(0.52,0.70,lich);
  float chip = pfbm(uv*P*2.0, P*2.0, 4);
  vec3 g = mix(vec3(0.230,0.222,0.205), vec3(0.320,0.310,0.292), sp);
  g = mix(g, vec3(0.115,0.108,0.100), flake*0.7);
  g = mix(g, vec3(0.148,0.170,0.108), lichM*0.75);
  g = mix(g, vec3(0.170,0.180,0.150), smoothstep(0.62,0.8,chip)*0.3);
  alb = g;
  float h = sp*0.25 + flake*0.4 + lichM*0.3;
  rough = clamp(0.70+sp*0.2-lichM*0.05, 0.4, 0.97);
  ao = 1.0-flake*0.35-lichM*0.15;
  return h;
}

float hBark(vec2 uv, out vec3 alb, out float rough, out float ao){
  vec2 g = vec2(uv.x*P*4.0, uv.y*P*1.2);
  float strip = pfbm(vec2(g.x*3.0, g.y*0.25), P*8.0, 4);
  float ridge = abs(fract(uv.x*P*7.0 + strip*2.2)*2.0-1.0);
  float groove = smoothstep(0.35,0.02,ridge);
  float fine = pfbm(vec2(uv.x*P*20.0, uv.y*P*3.0), P*16.0, 3);
  vec3 c = mix(vec3(0.115,0.082,0.058), vec3(0.200,0.152,0.110), fine);
  c = mix(c, vec3(0.045,0.034,0.026), groove*0.85);
  c = mix(c, vec3(0.080,0.110,0.055), smoothstep(0.6,0.85,pfbm(uv*P*2.,P*2.,4))*0.35);
  alb = c;
  float h = -groove*1.0 + fine*0.3;
  rough = clamp(0.80+fine*0.15, 0.5, 0.99);
  ao = 1.0-groove*0.6;
  return h;
}

float hPlaster(vec2 uv, out vec3 alb, out float rough, out float ao){
  float n = pfbm(uv*P*9.0, P*9.0, 5);
  float n2 = pfbm(uv*P*30.0, P*30.0, 3);
  float stain = smoothstep(0.5,0.85,pfbm(vec2(uv.x*P*3.,uv.y*P*0.7),P*3.,4));
  alb = mix(vec3(0.760,0.742,0.700), vec3(0.585,0.565,0.525), n*0.7);
  alb = mix(alb, vec3(0.395,0.372,0.338), stain*0.5);
  alb *= 0.92+0.16*n2;
  rough = clamp(0.72+n2*0.2,0.5,0.98);
  ao = 1.0-n*0.15;
  return n*0.4+n2*0.15;
}

float hFoliage(vec2 uv, out vec3 alb, out float rough, out float ao){
  vec2 c = uv-0.5;
  float r = length(c)*2.0;
  float ang = atan(c.y,c.x);
  float clump = pfbm(uv*P*3.0, P*3.0, 5);
  float fine  = pfbm(uv*P*14.0, P*14.0, 3);
  float needles = 0.5+0.5*sin(ang*13.0 + r*26.0 + clump*9.0);
  float sprays  = 0.5+0.5*sin(ang*5.0 - r*9.0 + fine*5.0);
  float mask = clump*0.52 + needles*0.26 + sprays*0.22;
  mask *= 1.0 - smoothstep(0.55, 1.02, r);
  float a = smoothstep(0.40, 0.52, mask);
  vec3 deep = vec3(0.038,0.072,0.031);
  vec3 lit  = vec3(0.105,0.160,0.062);
  vec3 dry  = vec3(0.145,0.115,0.052);
  alb = mix(deep, lit, fine*0.7+clump*0.3);
  alb = mix(alb, dry, smoothstep(0.66,0.9,pfbm(uv*P*2.0+vec2(4.,7.),P*2.0,4))*0.45);
  rough = clamp(0.68+fine*0.2, 0.4, 0.95);
  ao = 0.55+0.45*clump;
  return a;   // alpha goes to outB.w
}

/* ---- 官服 : the dark silk of a Qing official, worn and dusted ---- */
float hSilk(vec2 uv, out vec3 alb, out float rough, out float ao){
  // twill: two crossed high frequency bands beating against each other
  float wa = sin(uv.x*P*150.0 + uv.y*P*150.0);
  float wb = sin(uv.x*P*150.0 - uv.y*P*150.0);
  float weave = (wa*wb)*0.5+0.5;
  // damask roundel, the sort woven into a rank robe
  vec2 q = fract(uv*P*1.6)-0.5;
  float rr = length(q);
  float medal = smoothstep(0.30,0.26,rr)*smoothstep(0.13,0.17,rr);
  medal *= 0.5+0.5*sin(atan(q.y,q.x)*8.0 + rr*30.0);
  float fold = pfbm(vec2(uv.x*P*3.0, uv.y*P*11.0), P*8.0, 4);
  float dust = pfbm(uv*P*6.0+vec2(7.,2.), P*6.0, 4);
  float rot  = smoothstep(0.58,0.86, pfbm(uv*P*3.4+vec2(2.,9.), P*3.4, 5));

  vec3 indigo = vec3(0.0295,0.0330,0.0480);
  vec3 lift   = vec3(0.0700,0.0760,0.0980);
  alb = mix(indigo, lift, weave*0.35 + fold*0.45);
  alb = mix(alb, vec3(0.115,0.098,0.062), medal*0.55);   // tarnished gold thread
  alb = mix(alb, vec3(0.128,0.112,0.083), dust*0.28);    // grave dust in the weave
  alb = mix(alb, vec3(0.055,0.050,0.038), rot*0.45);     // mould
  rough = clamp(0.46 + fold*0.22 + dust*0.18 + rot*0.20, 0.22, 0.95);
  ao = 1.0 - rot*0.25 - (1.0-weave)*0.08;
  return weave*0.10 + fold*0.55 + medal*0.25 - rot*0.30;
}

/* ---- 屍蝋 : corpse skin, dried tight over the bone ---- */
float hCorpse(vec2 uv, out vec3 alb, out float rough, out float ao){
  float pore = pfbm(uv*P*38.0, P*32.0, 3);
  float mott = pfbm(uv*P*5.0+vec2(3.,7.), P*5.0, 5);
  vec2 cr = pworley(uv*P*11.0, P*11.0);
  float crack = smoothstep(0.052,0.0, cr.y-cr.x);        // split, desiccated skin
  float livor = smoothstep(0.55,0.85, pfbm(uv*P*2.6+vec2(8.,1.), P*2.6, 4));
  vec3 wax    = vec3(0.238,0.244,0.208);
  vec3 grey   = vec3(0.132,0.146,0.128);
  vec3 bruise = vec3(0.092,0.076,0.088);
  alb = mix(wax, grey, mott*0.75);
  alb = mix(alb, bruise, livor*0.55);                    // 屍斑
  alb *= 0.93 + 0.14*pore;
  alb = mix(alb, vec3(0.048,0.044,0.040), crack*0.70);
  rough = clamp(0.62 + pore*0.20 + crack*0.15 - livor*0.05, 0.35, 0.97);
  ao = 1.0 - crack*0.55 - livor*0.10;
  return pore*0.18 + mott*0.30 - crack*0.90;
}

/* ---- 符 : talisman paper, foxed with age, cinnabar ink ---- */
float hTalisman(vec2 uv, out vec3 alb, out float rough, out float ao){
  float fib = pfbm(vec2(uv.x*P*60.0, uv.y*P*9.0), P*32.0, 3);   // paper fibre
  float age = pfbm(uv*P*3.0, P*3.0, 5);
  float foxing = smoothstep(0.62,0.88, pfbm(uv*P*7.0+vec2(5.,3.), P*7.0, 4));
  // the spell runs down one vertical column with a latticed head
  float cx = abs(uv.x-0.5);
  float spine = smoothstep(0.030,0.012, cx)*step(0.10, uv.y)*step(uv.y, 0.90);
  float ry = abs(fract(uv.y*13.0)-0.5);
  float rung = smoothstep(0.105,0.055, cx)*smoothstep(0.060,0.028, ry)
             * step(0.12, uv.y)*step(uv.y, 0.88);
  float head = smoothstep(0.17,0.10, cx)*smoothstep(0.060,0.028, abs(uv.y-0.925))
             * (0.55+0.45*sin(uv.x*90.0));
  float stroke = clamp(spine + rung*0.85 + head*0.90, 0.0, 1.0);
  stroke *= 0.75 + 0.25*fib;                             // ink bleeds into the fibre

  vec3 paper = mix(vec3(0.470,0.400,0.245), vec3(0.330,0.268,0.155), age*0.8);
  paper = mix(paper, vec3(0.245,0.180,0.100), foxing*0.6);
  alb = mix(paper, vec3(0.395,0.052,0.028), stroke*0.92);
  alb *= 0.94+0.12*fib;
  rough = clamp(0.80 + fib*0.14 - stroke*0.10, 0.5, 0.99);
  ao = 1.0 - foxing*0.12;
  return fib*0.25 + age*0.20 - stroke*0.10;
}

/* ---- 檜皮葺 : cypress bark, laid in courses. The butt line of each
       course is most of what you see of a shrine roof from below. ---- */
float hHiwada(vec2 uv, out vec3 alb, out float rough, out float ao){
  float ry = uv.y*P*46.0;
  float course = fract(ry), rid = floor(ry);
  float lip  = smoothstep(0.0,0.09,course)*smoothstep(1.0,0.86,course);
  float shad = smoothstep(0.18,0.0,course);          // the course above shades this one
  float jag  = pfbm(vec2(uv.x*P*26.0, rid*0.37), P*16.0, 3);
  float grain= pfbm(vec2(uv.x*P*40.0, uv.y*P*7.0), P*32.0, 3);
  float moss = smoothstep(0.62,0.86, pfbm(uv*P*4.0+vec2(6.,2.), P*4.0, 5));
  alb = mix(vec3(0.0490,0.0412,0.0330), vec3(0.1090,0.0885,0.0660), grain*0.55 + jag*0.35);
  alb *= 0.80 + 0.30*lip;
  alb = mix(alb, vec3(0.076,0.096,0.050), moss*0.45);
  alb *= 1.0 - shad*0.45;
  rough = clamp(0.86 + grain*0.12 - moss*0.06, 0.6, 0.99);
  ao = 1.0 - shad*0.60 - moss*0.10;
  return lip*0.55 + grain*0.18 + jag*0.12 - shad*0.40;
}

/* ---- 銅 : cast fittings. Verdigris settles in the hollows, the raised
       work stays closer to the original gilt. ---- */
float hBronze(vec2 uv, out vec3 alb, out float rough, out float ao){
  float hammer = pfbm(uv*P*14.0, P*14.0, 4);
  vec2 w = pworley(uv*P*9.0, P*9.0);
  float dent = smoothstep(0.30,0.02,w.x);
  float patina = smoothstep(0.44,0.78, pfbm(uv*P*5.0+vec2(3.,8.), P*5.0, 5));
  float grime = pfbm(uv*P*20.0, P*20.0, 3);
  vec3 metal = mix(vec3(0.315,0.230,0.108), vec3(0.470,0.365,0.170), hammer);
  alb = mix(metal, vec3(0.105,0.198,0.163), patina*0.72);
  alb = mix(alb, alb*0.55, dent*0.40);
  alb *= 0.92 + 0.16*grime;
  rough = clamp(mix(0.26,0.72,patina) + dent*0.12 + grime*0.08, 0.15, 0.92);
  ao = 1.0 - dent*0.35;
  return hammer*0.35 - dent*0.70;
}

/* ---- 毛 : short fur. Clumps first, strands inside them, pale guard-hair
       tips on top. The strand direction runs along V, so a loft's own
       parameterisation lays the coat down the limb for free. ---- */
float furBody(vec2 uv, vec3 base, vec3 tipC, vec3 deep,
              out vec3 alb, out float rough, out float ao){
  float clump  = pfbm(vec2(uv.x*P*8.0,   uv.y*P*3.0),  P*8.0,   4);
  float strand = pfbm(vec2(uv.x*P*88.0,  uv.y*P*6.5),  P*64.0,  3);
  float fine   = pfbm(vec2(uv.x*P*190.0, uv.y*P*12.0), P*128.0, 2);
  float part   = pfbm(vec2(uv.x*P*3.0,   uv.y*P*1.4),  P*4.0,   4);
  float lift = strand*0.62 + fine*0.38;
  alb = mix(deep, base, clamp(clump*0.55 + lift*0.55, 0.0, 1.0));
  alb = mix(alb, tipC, smoothstep(0.60, 0.95, lift)*0.55);
  alb *= 0.90 + 0.20*part;
  rough = clamp(0.74 + lift*0.16 - clump*0.06, 0.45, 0.99);
  ao = clamp(0.55 + 0.45*(clump*0.5 + lift*0.5), 0.25, 1.0);
  return lift*0.75 + clump*0.35 - 0.15;
}
float hFur(vec2 uv, out vec3 alb, out float rough, out float ao){
  return furBody(uv, vec3(0.352,0.148,0.058), vec3(0.520,0.300,0.140),
                     vec3(0.128,0.052,0.024), alb, rough, ao);
}
float hFurC(vec2 uv, out vec3 alb, out float rough, out float ao){
  return furBody(uv, vec3(0.700,0.660,0.598), vec3(0.845,0.815,0.762),
                     vec3(0.372,0.336,0.292), alb, rough, ao);
}
/* ---- 布 : cloth for a cel-shaded character. Nearly flat on purpose —
       the style carries fabric with drawn folds and a silhouette, not with
       a weave you can count. Just enough thread to catch the rim. ---- */
float hCloth(vec2 uv, out vec3 alb, out float rough, out float ao){
  /* A real bolt of cloth: a visible over-under weave with slubs in the
     yarn, fibres standing off the surface, and wear where a garment
     creases. Flat cloth is the thing that made the last pass read as
     paper, and the weave has to be in the NORMAL, not just the colour. */
  float gx = fract(uv.x*P*340.0), gy = fract(uv.y*P*340.0);
  float over = step(0.5, fract(uv.y*P*170.0));
  float warp = sin(gx*PI), weft = sin(gy*PI);
  float weave = mix(warp*0.85 + weft*0.15, weft*0.85 + warp*0.15, over);
  float slub = pfbm(vec2(uv.x*P*130.0, uv.y*P*9.0), P*48.0, 3);
  float fuzz = pfbm(uv*P*460.0, P*128.0, 2);
  float crease = pfbm(vec2(uv.x*P*2.0, uv.y*P*6.5), P*8.0, 4);
  float wear = smoothstep(0.62, 0.90, crease);

  alb = vec3(0.842,0.828,0.806)*(0.94 + 0.07*weave + 0.04*slub);
  alb = mix(alb, vec3(0.905,0.895,0.876), wear*0.35);      // rubbed lighter
  alb *= 0.97 + 0.06*fuzz;
  rough = clamp(0.74 + slub*0.12 + fuzz*0.06 - wear*0.08, 0.55, 0.96);
  ao = 1.0 - (1.0-weave)*0.10;
  return weave*0.11 + slub*0.09 + fuzz*0.03 - wear*0.05;
}

/* ---- 麻布 : undyed hemp, plain weave with slubs ---- */
float hLinen(vec2 uv, out vec3 alb, out float rough, out float ao){
  float wx = 0.5+0.5*sin(uv.x*P*210.0);
  float wy = 0.5+0.5*sin(uv.y*P*210.0);
  float weave = mix(wx, wy, step(0.5, fract(uv.y*P*105.0)));
  float slub = pfbm(vec2(uv.x*P*38.0, uv.y*P*3.0), P*32.0, 3);
  float dirt = pfbm(uv*P*4.0+vec2(2.,6.), P*4.0, 5);
  alb = mix(vec3(0.700,0.678,0.622), vec3(0.560,0.538,0.482), weave*0.35 + slub*0.30);
  alb = mix(alb, vec3(0.398,0.372,0.318), smoothstep(0.55,0.85,dirt)*0.35);
  rough = clamp(0.80 + slub*0.14, 0.55, 0.99);
  ao = 1.0 - (1.0-weave)*0.10;
  return weave*0.30 + slub*0.25;
}

/* ---- 肌 : anime skin. Almost featureless on purpose. Pores, blotches and
       a shading gradient across the cheek are exactly what the style
       removes; all this needs is enough break-up not to read as plastic. ---- */
float hSkin(vec2 uv, out vec3 alb, out float rough, out float ao){
  /* Real skin: pores, not noise. Worley cells at pore scale give the
     dimpled surface a fractal blur never will, and the roughness has to
     VARY — the T-zone is oily and glossy, the cheeks are matte. A single
     roughness value is one of the surest tells of a CG face. */
  vec2 pore = pworley(uv*P*90.0, P*90.0);
  float dimple = smoothstep(0.24, 0.02, pore.x);
  float fine = pfbm(uv*P*150.0, P*128.0, 2);
  float mott = pfbm(uv*P*7.0+vec2(3.,8.), P*7.0, 5);     // dermal mottling
  float melan = pfbm(uv*P*2.4+vec2(9.,1.), P*2.4, 4);    // slow tone drift
  float vein = pfbm(uv*P*4.0+vec2(5.,7.), P*4.0, 3);
  float oil = pfbm(uv*P*3.2+vec2(2.,6.), P*3.2, 4);

  vec3 base = mix(vec3(0.700,0.512,0.436), vec3(0.788,0.612,0.528), melan);
  base = mix(base, vec3(0.742,0.492,0.442), mott*0.30);   // reddening
  base = mix(base, vec3(0.640,0.510,0.512), smoothstep(0.58,0.86,vein)*0.16);
  alb = base*(0.965 + 0.055*fine - dimple*0.06);

  rough = clamp(0.56 - oil*0.20 + dimple*0.10 + mott*0.05, 0.28, 0.74);
  ao = 1.0 - dimple*0.22;
  return -dimple*0.55 + fine*0.10 + mott*0.06;
}

/* ---- 髪 : strands along V, so a lock's own parameterisation lays them
       down its length. The broad banding is what the toon highlight rides. ---- */
float hHair(vec2 uv, out vec3 alb, out float rough, out float ao){
  /* Individual strands, tight and directional, so the anisotropic lobe in
     the lighting pass has something to run along. Realistic hair is much
     darker than it looks — most of what the eye reads is the highlight. */
  float s1 = pfbm(vec2(uv.x*P*420.0, uv.y*P*2.0), P*256.0, 2);
  float s2 = pfbm(vec2(uv.x*P*170.0, uv.y*P*1.4), P*128.0, 3);
  float clump = pfbm(vec2(uv.x*P*22.0, uv.y*P*1.2), P*16.0, 3);
  float lift = s1*0.52 + s2*0.48;
  /* Anime hair is a dark BROWN read, not a black one. At these values the
     mass went to silhouette and only the specular band showed, which is
     what made the fringe read as holes cut in the frame. */
  alb = mix(vec3(0.0455,0.0245,0.0158), vec3(0.1720,0.0960,0.0555),
            clamp(clump*0.50 + lift*0.60, 0.0, 1.0));
  alb = mix(alb, vec3(0.268,0.163,0.096), smoothstep(0.70, 0.98, lift)*0.60);
  rough = clamp(0.30 + lift*0.14 - clump*0.05, 0.16, 0.52);
  ao = clamp(0.62 + 0.38*lift, 0.35, 1.0);
  return lift*0.80 + clump*0.25 - 0.20;
}

/* ---- one near-white layer for every flat character colour; the lashes,
       brows, mouth, sclera and ear linings are separated by tint, which is
       why the whole face costs three texture layers instead of eleven ---- */
float hChar(vec2 uv, out vec3 alb, out float rough, out float ao){
  float nz = pfbm(uv*P*40.0, P*32.0, 2);
  alb = vec3(0.962,0.957,0.952) * (0.985 + 0.025*nz);
  rough = 0.44; ao = 1.0;
  return nz*0.03;
}

/* ---- 虹彩 : the iris is DRAWN, not shaded. Bright at the centre, radial
       fibres, a dark limbal ring at the rim. Mapped with radial uvs. ---- */
/* ---- 白目 : never white, and darkest where the lid hangs over it ---- */
float hSclera(vec2 uv, out vec3 alb, out float rough, out float ao){
  vec3 lit  = vec3(0.905,0.890,0.885);
  vec3 shad = vec3(0.400,0.395,0.440);
  // uv.y runs 0 at the bottom of the aperture to 1 at the top
  float occ = smoothstep(0.42, 1.02, uv.y);
  // and the corners are always in shadow too
  float cor = smoothstep(0.44, 0.02, uv.x) + smoothstep(0.56, 0.98, uv.x);
  alb = mix(lit, shad, clamp(occ*0.92 + cor*0.30, 0.0, 1.0));
  // the faintest warmth at the inner corner, where the caruncle is
  alb = mix(alb, vec3(0.780,0.560,0.540), smoothstep(0.62, 0.99, uv.x)*0.45);
  rough = 0.16; ao = 1.0;
  return 0.0;
}

float hEye(vec2 uv, out vec3 alb, out float rough, out float ao){
  /* A real iris: collarette ridge about a third out, crypts and trabeculae
     radiating from it, a dark limbal ring at the rim and a pupil that is
     genuinely black. The stroma is a dozen shades of one colour, never one. */
  /* An anime iris is a painted stack, not an eye: dark at the top where
     the lid shadows it, bright at the bottom, a hard limbal ring, radial
     fibres, and — the part that does most of the work — two catchlights
     that are baked in rather than left to the specular. A real iris on an
     anime face reads as a doll's glass eye. */
  vec2 c = uv - 0.5;
  float r = length(c)*2.0, a = atan(c.y, c.x);
  float fib = 0.5+0.5*sin(a*46.0 + r*7.0);
  float fb2 = 0.5+0.5*sin(a*19.0 - r*13.0 + 1.7);

  vec3 top  = vec3(0.045,0.088,0.150);        // 上 : 瞼の影
  vec3 body = vec3(0.115,0.235,0.330);
  vec3 low  = vec3(0.330,0.560,0.610);        // 下 : 透ける
  float v = clamp(uv.y, 0.0, 1.0);
  alb = mix(top, body, smoothstep(0.10,0.52,v));
  alb = mix(alb, low, smoothstep(0.46,0.94,v)*0.92);
  alb *= 0.86 + 0.24*(fib*0.5 + fb2*0.5)*smoothstep(0.30,0.86,r);
  /* 瞳孔. The first attempt made it r<0.40 and the eye read as a keyhole:
     a pupil that big leaves no iris to be coloured, and the catchlight
     lands inside it and disappears. Small pupil, wide bright iris, and the
     highlights sitting ON the coloured part where they can be seen. */
  alb = mix(alb, vec3(0.014,0.018,0.030), smoothstep(0.34,0.26,r));
  // the ring of light around the pupil that gives an anime iris its depth
  alb += vec3(0.20,0.34,0.36)*smoothstep(0.30,0.40,r)*smoothstep(0.58,0.44,r);
  alb = mix(alb, vec3(0.016,0.034,0.060), smoothstep(0.82,0.99,r));  // 輪
  // 光 : one large high and outward, one small low and inward. Flat white,
  // full strength — a soft highlight is not a highlight.
  float g1 = smoothstep(0.150, 0.085, length(uv-vec2(0.360,0.700)));
  float g2 = smoothstep(0.070, 0.030, length(uv-vec2(0.635,0.335)));
  alb = mix(alb, vec3(1.00,1.00,1.00), g1);
  alb = mix(alb, vec3(0.90,0.95,1.00), g2*0.92);
  rough = 0.07;
  ao = 1.0;
  return 0.0;
}

/* the ink line carries no texture at all: pure white, so the per-part tint
   is the line colour and nothing else touches it */
float hOutline(vec2 uv, out vec3 alb, out float rough, out float ao){
  alb = vec3(1.0); rough = 1.0; ao = 1.0; return 0.0;
}

float dispatch(vec2 uv, out vec3 alb, out float rough, out float ao){
  if(uLayer==20) return hOutline(uv, alb, rough, ao);
  if(uLayer==21) return hSkin(uv, alb, rough, ao);   // overwritten by the canvas
  if(uLayer==22) return hCloth(uv, alb, rough, ao);
  if(uLayer==16) return hSkin(uv, alb, rough, ao);
  if(uLayer==17) return hHair(uv, alb, rough, ao);
  if(uLayer==18) return hChar(uv, alb, rough, ao);
  if(uLayer==19) return hEye(uv, alb, rough, ao);
  if(uLayer==23) return hSclera(uv, alb, rough, ao);
  if(uLayer==13) return hFur(uv, alb, rough, ao);
  if(uLayer==14) return hFurC(uv, alb, rough, ao);
  if(uLayer==15) return hLinen(uv, alb, rough, ao);
  if(uLayer==11) return hHiwada(uv, alb, rough, ao);
  if(uLayer==12) return hBronze(uv, alb, rough, ao);
  if(uLayer==8)  return hSilk(uv, alb, rough, ao);
  if(uLayer==9)  return hCorpse(uv, alb, rough, ao);
  if(uLayer==10) return hTalisman(uv, alb, rough, ao);
  if(uLayer==7){ float a=hFoliage(uv,alb,rough,ao); return a; }
  if(uLayer==0) return hVermillion(uv, alb, rough, ao);
  if(uLayer==1) return hBlack(uv, alb, rough, ao);
  if(uLayer==2) return hStone(uv, alb, rough, ao);
  if(uLayer==3) return hMoss(uv, alb, rough, ao);
  if(uLayer==4) return hGranite(uv, alb, rough, ao);
  if(uLayer==5) return hBark(uv, alb, rough, ao);
  return hPlaster(uv, alb, rough, ao);
}

void main(){
  vec3 alb; float rough, ao;
  float h = dispatch(vUV, alb, rough, ao);
  if(uLayer==7){ outA = vec4(alb, ao); outB = vec4(0.5,0.5,rough,h); return; }
  float e = 1.0/uRes;
  vec3 d; float r2, a2;
  float hx = dispatch(vUV+vec2(e,0.0), d, r2, a2);
  float hy = dispatch(vUV+vec2(0.0,e), d, r2, a2);
  float strength = 2.2;
  vec3 n = normalize(vec3(-(hx-h)*strength/e*0.004, -(hy-h)*strength/e*0.004, 1.0));
  outA = vec4(alb, ao);
  outB = vec4(n.xy*0.5+0.5, rough, h*0.5+0.5);
}
`;

/* --------------------------- G-BUFFER --------------------------- */
const VS_GBUF = `
layout(location=0) in vec3 aPos;
layout(location=1) in vec3 aNrm;
layout(location=2) in vec2 aUV;
layout(location=3) in float aMat;
layout(location=4) in mat4 aInst;
layout(location=8) in vec4 aTint;

uniform mat4 uViewProj;
uniform mat4 uModel;
uniform int uInstanced;
uniform float uTime;
uniform float uWind;

out vec3 vWPos;
out float vLocalY;
out vec3 vNrm;
out vec2 vUV;
out float vMat;
out vec4 vTint;

layout(location=9) in vec4 aBI;
layout(location=10) in vec4 aBW;
uniform int uSkin;
uniform sampler2D uBones;
/* four consecutive texels are the four columns of one bone matrix */
mat4 boneAt(float f){
  int k = int(f)*4;
  return mat4(texelFetch(uBones, ivec2(k,   0), 0), texelFetch(uBones, ivec2(k+1, 0), 0),
              texelFetch(uBones, ivec2(k+2, 0), 0), texelFetch(uBones, ivec2(k+3, 0), 0));
}
void main(){
  vec3 sPos = aPos; vec3 sNrm = aNrm;
  if(uSkin==1){
    mat4 S = boneAt(aBI.x)*aBW.x + boneAt(aBI.y)*aBW.y
           + boneAt(aBI.z)*aBW.z + boneAt(aBI.w)*aBW.w;
    sPos = (S*vec4(aPos,1.0)).xyz;
    sNrm = mat3(S)*aNrm;
  }
  mat4 M = uInstanced==1 ? aInst : uModel;
  vec4 wp = M * vec4(sPos,1.0);
  vTint = uInstanced==1 ? aTint : vec4(1.0,1.0,1.0,0.0);
  if(uWind != 0.0){
    float sway = sin(uTime*1.1 + wp.x*0.5 + wp.z*0.37 + vTint.w*7.0)*0.5
               + sin(uTime*2.3 + wp.z*1.1 + vTint.w*3.0)*0.25;
    /* positive = grows up out of the ground (foliage);
       negative = hangs down off a joint (cloth, hair). */
    float k = uWind > 0.0 ? max(sPos.y,0.0)*uWind : max(-sPos.y,0.0)*(-uWind);
    wp.xz += sway*k*vec2(0.6,0.35);
  }
  vWPos = wp.xyz;
  vLocalY = wp.y - M[3][1];
  mat3 NM = mat3(M);
  vNrm = normalize(NM*sNrm);
  vUV = aUV;
  vMat = aMat;
  gl_Position = uViewProj*wp;
}
`;

const FS_GBUF = SH_COMMON + `
in vec3 vWPos; in float vLocalY; in vec3 vNrm; in vec2 vUV; in float vMat; in vec4 vTint;
layout(location=0) out vec4 oAlbedo;
layout(location=1) out vec4 oNormal;
layout(location=2) out vec4 oExtra;

uniform sampler2DArray uMatA;
uniform sampler2DArray uMatB;
uniform float uTime;
uniform vec3 uCamPos;
uniform float uWetness;
uniform int uAlphaMask;
uniform vec3 uEmissive;
uniform float uNormalStrength;
uniform int uDecalMode;
uniform sampler2D uDecal;

mat3 cotangentFrame(vec3 N, vec3 p, vec2 uv){
  vec3 dp1 = dFdx(p), dp2 = dFdy(p);
  vec2 duv1 = dFdx(uv), duv2 = dFdy(uv);
  vec3 dp2perp = cross(dp2,N), dp1perp = cross(N,dp1);
  vec3 T = dp2perp*duv1.x + dp1perp*duv2.x;
  vec3 B = dp2perp*duv1.y + dp1perp*duv2.y;
  float invmax = inversesqrt(max(dot(T,T),dot(B,B))+1e-9);
  return mat3(T*invmax, B*invmax, N);
}

void main(){
  int layer = int(vMat+0.5);
  vec4 A = texture(uMatA, vec3(vUV, float(layer)));
  vec4 B = texture(uMatB, vec3(vUV, float(layer)));
  if(uAlphaMask==1 && B.w < 0.42) discard;
  float decalA = 0.0;
  if(uDecalMode==1){
    float cell = floor(vTint.w*3.999);
    vec2 duv = vec2((clamp(vUV.x,0.0,1.0)+cell)*0.25, vUV.y);
    decalA = texture(uDecal, duv).a;
    if(decalA < 0.35) discard;
  }

  vec3 albedo = A.rgb;
  float ao = A.a;
  float rough = B.z;
  float metal = 0.0;

  // per-instance colour variation & large-scale world breakup
  albedo *= vTint.rgb;
  float bigN = fbm3(vWPos*0.16+vec3(vTint.w*13.0), 3);
  float bigN2 = fbm3(vWPos*0.9+vec3(3.0), 2);
  // none of the world's weathering belongs on a character
  if(layer < 16){
    albedo *= 0.84 + 0.32*bigN;
    rough = clamp(rough * (0.86+0.28*bigN2), 0.05, 1.0);
    float grime = smoothstep(1.5, -0.1, vLocalY) * 0.55;
    albedo = mix(albedo, albedo*vec3(0.55,0.55,0.50), grime*(0.35+0.4*bigN2));
  }

  vec3 N = normalize(vNrm);
  vec3 nT = vec3(B.xy*2.0-1.0, 0.0);
  nT.z = sqrt(max(1.0-dot(nT.xy,nT.xy),0.0));
  nT.xy *= uNormalStrength;
  mat3 TBN = cotangentFrame(N, vWPos, vUV);
  vec3 Nm = normalize(TBN*normalize(nT));
  // fade normal detail with distance to keep it calm
  float d = distance(vWPos, uCamPos);
  N = normalize(mix(Nm, N, smoothstep(16.0, 55.0, d)));

  // ---- wetness : darkens albedo, smooths, flattens normal, pools in lows ----
  float upness = smoothstep(0.35, 0.92, N.y);
  float pool = smoothstep(0.30,0.80, fbm3(vWPos*vec3(0.55,0.2,0.55)+vec3(11.0), 3));
  float wet = (layer < 16 ? 1.0 : 0.0) * uWetness * upness * (0.62 + 0.38*pool);
  if(layer==2){
    float puddle = smoothstep(0.44,0.74, fbm3(vWPos*vec3(0.85,0.3,0.85)+vec3(4.0,0.0,9.0),4)) * uWetness * upness;
    vec2 rp = vWPos.xz*7.0;
    float rip = sin(rp.x*1.7+uTime*1.3)*0.5+sin(rp.y*2.1-uTime*1.1)*0.5;
    rip += (vnoise(rp*2.0+uTime*0.35)-0.5)*1.4;
    // damp everywhere, mirror only where water actually stands
    float wpatch = fbm3(vWPos*vec3(2.1,0.6,2.1)+vec3(19.0), 3);
    albedo = mix(albedo, albedo*vec3(0.60,0.60,0.63), wet*0.85);
    albedo = mix(albedo, albedo*vec3(0.34,0.35,0.40), puddle*0.9);
    rough = mix(rough, mix(0.42,0.20,wpatch), wet*0.90);
    rough = mix(rough, 0.030, puddle*0.97);
    // shallow water keeps a trace of the surface beneath + fine ripples
    N = normalize(mix(N, normalize(vec3(rip*0.010, 1.0, rip*0.008)), puddle*0.88));
    ao = mix(ao, 1.0, puddle*0.45);
  } else if(layer==3){
    // wet moss and leaf litter: darker, only slightly glossier
    albedo = mix(albedo, albedo*vec3(0.52,0.56,0.54), wet*0.85);
    rough = mix(rough, 0.46, wet*0.55);
  } else if(layer==4 || layer==5){
    albedo = mix(albedo, albedo*0.58, wet*0.7);
    rough = mix(rough, 0.28, wet*0.6);
  } else {
    albedo = mix(albedo, albedo*0.68, wet*0.45);
    rough = mix(rough, 0.20, wet*0.5);
  }


  if(uDecalMode==1){
    float ink = smoothstep(0.35,0.62,decalA);
    albedo = mix(albedo, vec3(0.020,0.017,0.016), ink*0.93);
    rough = mix(rough, 0.52, ink*0.8);
  }
  oAlbedo = vec4(albedo, ao);
  oNormal = vec4(octEncode(N), rough, metal);
  oExtra  = vec4(uEmissive*vTint.rgb, float(layer)+0.5);
}
`;

/* --------------------------- SHADOW --------------------------- */
const VS_SHADOW = `
layout(location=0) in vec3 aPos;
layout(location=1) in vec3 aNrm;
layout(location=2) in vec2 aUV;
layout(location=3) in float aMat;
layout(location=4) in mat4 aInst;
layout(location=8) in vec4 aTint;
out float vMatS;
uniform mat4 uLightVP;
uniform mat4 uModel;
uniform int uInstanced;
uniform float uTime;
uniform float uWind;
out vec2 vUV;
layout(location=9) in vec4 aBI;
layout(location=10) in vec4 aBW;
uniform int uSkin;
uniform sampler2D uBones;
/* four consecutive texels are the four columns of one bone matrix */
mat4 boneAt(float f){
  int k = int(f)*4;
  return mat4(texelFetch(uBones, ivec2(k,   0), 0), texelFetch(uBones, ivec2(k+1, 0), 0),
              texelFetch(uBones, ivec2(k+2, 0), 0), texelFetch(uBones, ivec2(k+3, 0), 0));
}
void main(){
  vec3 sPos = aPos; vec3 sNrm = aNrm;
  if(uSkin==1){
    mat4 S = boneAt(aBI.x)*aBW.x + boneAt(aBI.y)*aBW.y
           + boneAt(aBI.z)*aBW.z + boneAt(aBI.w)*aBW.w;
    sPos = (S*vec4(aPos,1.0)).xyz;
    sNrm = mat3(S)*aNrm;
  }
  mat4 M = uInstanced==1 ? aInst : uModel;
  vec4 wp = M*vec4(sPos,1.0);
  if(uWind!=0.0){
    float sd = uInstanced==1?aTint.w:0.0;
    float sway = sin(uTime*1.1 + wp.x*0.5 + wp.z*0.37 + sd*7.0)*0.5 + sin(uTime*2.3+wp.z*1.1+sd*3.0)*0.25;
    float k = uWind > 0.0 ? max(sPos.y,0.0)*uWind : max(-sPos.y,0.0)*(-uWind);
    wp.xz += sway*k*vec2(0.6,0.35);
  }
  vUV = aUV; vMatS = aMat;
  gl_Position = uLightVP*wp;
}
`;
const FS_SHADOW = `
in vec2 vUV; in float vMatS;
uniform int uAlphaMask;
uniform sampler2DArray uMatB;
out vec4 o;
void main(){
  if(uAlphaMask==1){
    if(texture(uMatB, vec3(vUV, vMatS+0.5)).w < 0.42) discard;
  }
  o = vec4(1.0);
}
`;

/* ==== b_shaders_b.js ==== */
/* =========================================================================
   SHADERS part B : deferred lighting, AO, SSR, volumetrics, post
   ========================================================================= */

const SH_GBUF_READ = `
uniform sampler2D uGA;      // albedo.rgb ao
uniform sampler2D uGN;      // oct normal.xy, rough, metal
uniform sampler2D uGE;      // emissive.rgb, matId
uniform sampler2D uDepth;
uniform mat4 uInvViewProj;
uniform mat4 uInvProj;
uniform mat4 uView;
uniform vec3 uCamPos;
uniform vec2 uNearFar;

float linearDepth(float d){
  float z = d*2.0-1.0;
  return (2.0*uNearFar.x*uNearFar.y)/(uNearFar.y+uNearFar.x - z*(uNearFar.y-uNearFar.x));
}
vec3 worldFromDepth(vec2 uv, float d){
  vec4 c = vec4(uv*2.0-1.0, d*2.0-1.0, 1.0);
  vec4 w = uInvViewProj*c;
  return w.xyz/w.w;
}
vec3 viewFromDepth(vec2 uv, float d){
  vec4 c = vec4(uv*2.0-1.0, d*2.0-1.0, 1.0);
  vec4 v = uInvProj*c;
  return v.xyz/v.w;
}
`;

const SH_PBR = `
float D_GGX(float ndh, float a){
  float a2=a*a; float d=(ndh*a2-ndh)*ndh+1.0;
  return a2/max(PI*d*d,1e-7);
}
float V_SmithGGX(float ndv, float ndl, float a){
  float a2=a*a;
  float gv = ndl*sqrt(ndv*ndv*(1.0-a2)+a2);
  float gl = ndv*sqrt(ndl*ndl*(1.0-a2)+a2);
  return 0.5/max(gv+gl,1e-6);
}
vec3 F_Schlick(vec3 f0, float u){ float f=pow(1.0-u,5.0); return f0 + (1.0-f0)*f; }
vec3 envBRDFApprox(vec3 f0, float rough, float ndv){
  const vec4 c0 = vec4(-1.0,-0.0275,-0.572,0.022);
  const vec4 c1 = vec4(1.0,0.0425,1.04,-0.04);
  vec4 r = rough*c0+c1;
  float a004 = min(r.x*r.x, exp2(-9.28*ndv))*r.x + r.y;
  vec2 AB = vec2(-1.04,1.04)*a004 + r.zw;
  return f0*AB.x + AB.y;
}
float specularAO(float ndv, float ao, float rough){
  return clamp(pow(ndv+ao, exp2(-16.0*rough-1.0)) - 1.0 + ao, 0.0, 1.0);
}
`;

const FS_LIGHT = SH_COMMON + SH_GBUF_READ + SH_PBR + `
uniform samplerCube uIrr;
uniform samplerCube uPref;
uniform sampler2D uAO;
uniform sampler2DShadow uSh0;
uniform sampler2DShadow uSh1;
uniform sampler2DShadow uSh2;
uniform mat4 uShVP0, uShVP1, uShVP2;
uniform vec3 uSunDir;
uniform vec3 uSunColor;
uniform vec3 uSkyTint;
uniform vec3 uBounce;
uniform vec3 uAmbTint;
uniform float uPrefMips;
uniform float uAmbient;
uniform float uTime;
uniform vec3 uHairRing;   // centre Y, half width, strength
uniform float uStarAmt;
uniform vec3 uPole;
uniform float uStarRot;
uniform int uNumLights;
uniform vec4 uLightPos[16];   // xyz, radius
uniform vec4 uLightCol[16];   // rgb, intensity
uniform samplerCube uSky;
uniform vec3 uHazeColor;
uniform float uHazeAmt;
uniform int uShadowQuality;
uniform vec2 uShadowTexel;

in vec2 vUV;
out vec4 outC;

const vec2 POISSON[12] = vec2[12](
  vec2(-0.326,-0.406), vec2(-0.840,-0.074), vec2(-0.696, 0.457), vec2(-0.203, 0.621),
  vec2( 0.962,-0.195), vec2( 0.473,-0.480), vec2( 0.519, 0.767), vec2( 0.185,-0.893),
  vec2( 0.507, 0.064), vec2( 0.896, 0.412), vec2(-0.322,-0.933), vec2(-0.792,-0.598));

float sampleCascade(sampler2DShadow s, vec3 c, float rot, float spread){
  if(c.x<0.001||c.x>0.999||c.y<0.001||c.y>0.999) return -1.0;
  float sum=0.0;
  float cs=cos(rot), sn=sin(rot);
  int taps = uShadowQuality==2 ? 12 : (uShadowQuality==1 ? 6 : 4);
  for(int i=0;i<12;i++){
    if(i>=taps) break;
    vec2 o = POISSON[i];
    o = vec2(o.x*cs-o.y*sn, o.x*sn+o.y*cs)*spread;
    sum += texture(s, vec3(c.xy+o*uShadowTexel, c.z));
  }
  return sum/float(taps);
}

float shadowFactor(vec3 wpos, vec3 N, float viewDist, float rot){
  float ndl = max(dot(N, uSunDir), 0.0);
  float slope = clamp(1.0-ndl, 0.0, 1.0);
  vec3 off = N*(0.020+0.075*slope);
  float s;
  /* cascade 0 is half the extent it was, so its offset is halved with it —
     the acne margin is unchanged and the penumbra lands where the caster
     actually is. The wider poisson spread costs nothing and turns a hard
     blotch into a shadow. */
  vec4 c0 = uShVP0*vec4(wpos+off*0.32,1.0); vec3 p0 = c0.xyz/c0.w*0.5+0.5;
  s = sampleCascade(uSh0, p0, rot, 2.40);
  if(s<0.0){
    vec4 c1 = uShVP1*vec4(wpos+off*1.9,1.0); vec3 p1=c1.xyz/c1.w*0.5+0.5;
    s = sampleCascade(uSh1, p1, rot, 1.0);
    if(s<0.0){
      vec4 c2 = uShVP2*vec4(wpos+off*4.5,1.0); vec3 p2=c2.xyz/c2.w*0.5+0.5;
      s = sampleCascade(uSh2, p2, rot, 0.9);
      if(s<0.0) s = 1.0;
    }
  }
  return s;
}

void main(){
  float d = texture(uDepth, vUV).r;
  vec4 GN = texture(uGN, vUV);
  vec4 GA = texture(uGA, vUV);
  vec4 GE = texture(uGE, vUV);

  if(d >= 0.99999){
    vec3 dir = normalize(worldFromDepth(vUV, 1.0) - uCamPos);
    vec3 sky = textureLod(uSky, dir, 0.0).rgb;
    // crisp sun disc + forward glow, reddened near the horizon
    float c = dot(dir, uSunDir);
    float disc = smoothstep(0.99965, 0.99992, c);
    float glow = pow(max(c,0.0), 900.0)*0.6 + pow(max(c,0.0), 40.0)*0.06;
    sky += uSunColor*(disc*7.0 + glow)*smoothstep(-0.02,0.06,dir.y);
    // ---- stars: a fixed field turned about the celestial pole by the hour angle ----
    if(uStarAmt > 0.002){
      float ca = cos(uStarRot), sa = sin(uStarRot);
      vec3 P = uPole;
      vec3 sd2 = dir*ca + cross(P,dir)*sa + P*dot(P,dir)*(1.0-ca);
      float st = 0.0;
      for(int k=0;k<3;k++){
        float sc = 168.0 + 232.0*float(k);
        vec3 g = sd2*sc;
        vec3 idc = floor(g);
        float h = hash13(idc + vec3(float(k)*31.7));
        if(h > 0.9805){
          vec3 jit = vec3(hash13(idc+vec3(5.1)), hash13(idc+vec3(9.7)), hash13(idc+vec3(2.3)));
          vec3 fr = fract(g) - 0.5 - (jit-0.5)*0.55;
          float mag = (h-0.9805)/0.0195;
          st += smoothstep(0.34, 0.0, length(fr))*mag*mag/(1.0+float(k)*1.6);
        }
      }
      vec3 stc = mix(vec3(0.70,0.79,1.06), vec3(1.06,0.88,0.66), hash13(floor(sd2*168.0)+vec3(77.0)));
      sky += stc*st*uStarAmt*smoothstep(0.005, 0.20, dir.y)*2.6;
    }
    sky = mix(sky, uHazeColor, smoothstep(0.16, -0.03, dir.y)*uHazeAmt);
    outC = vec4(sky, 1.0);
    return;
  }

  vec3 wpos = worldFromDepth(vUV, d);
  vec3 N = octDecode(GN.xy);
  float rough = clamp(GN.z, 0.03, 1.0);
  float metal = GN.w;
  vec3 albedo = GA.rgb;
  float aoTex = GA.a;
  float ssao = texture(uAO, vUV).r;
  float ao = min(aoTex, ssao);

  vec3 V = normalize(uCamPos - wpos);
  float ndv = max(dot(N,V), 1e-4);
  vec3 f0 = mix(vec3(0.04), albedo, metal);
  vec3 diffCol = albedo*(1.0-metal);

  float viewDist = distance(uCamPos, wpos);
  float rot = hash12(gl_FragCoord.xy + fract(uTime)*13.0)*TAU;

  // ---------------- sun ----------------
  vec3 L = uSunDir;
  float ndl = max(dot(N,L),0.0);
  vec3 direct = vec3(0.0);
  float sh = 0.0;
  if(ndl > 0.0){
    sh = shadowFactor(wpos, N, viewDist, rot);
    if(sh > 0.001){
      vec3 H = normalize(L+V);
      float ndh = max(dot(N,H),0.0), vdh = max(dot(V,H),0.0);
      float a = rough*rough;
      vec3 F = F_Schlick(f0, vdh);
      float Dv = D_GGX(ndh,a), Vv = V_SmithGGX(ndv,ndl,a);
      vec3 spec = F*Dv*Vv;
      vec3 kd = (1.0-F);
      direct = (kd*diffCol/PI + spec)*uSunColor*ndl*sh;
    }
  }

  // ---------------- IBL ----------------
  vec3 irr = texture(uIrr, N).rgb;
  vec3 R = reflect(-V,N);
  float mip = rough*(uPrefMips-1.0);
  vec3 pref = textureLod(uPref, R, mip).rgb;
  vec3 dfg = envBRDFApprox(f0, rough, ndv);
  float sao = specularAO(ndv, ao, rough);
  vec3 ambient = irr*uAmbTint*diffCol*pow(ao,1.35)*uAmbient + pref*uAmbTint*dfg*sao*uAmbient;

  // fake colour bleeding from the vermillion corridor + damp ground
  float down = clamp(-N.y*0.5+0.5,0.0,1.0);
  ambient += diffCol*uBounce*ao*(0.35+0.65*down);

  // ---------------- point lights (lanterns) ----------------
  vec3 pl = vec3(0.0);
  for(int i=0;i<16;i++){
    if(i>=uNumLights) break;
    vec3 dv = uLightPos[i].xyz - wpos;
    float dist2 = dot(dv,dv);
    float rad = uLightPos[i].w;
    if(dist2 > rad*rad) continue;
    float dl = sqrt(dist2);
    vec3 Lp = dv/max(dl,1e-4);
    float nl = max(dot(N,Lp),0.0);
    if(nl<=0.0) continue;
    float att = clamp(1.0-dl/rad,0.0,1.0); att*=att;
    att /= (1.0+dist2*0.6);
    vec3 H = normalize(Lp+V);
    float ndh=max(dot(N,H),0.0), vdh=max(dot(V,H),0.0);
    float a=rough*rough;
    vec3 F=F_Schlick(f0,vdh);
    vec3 spec=F*D_GGX(ndh,a)*V_SmithGGX(ndv,nl,a);
    pl += ((1.0-F)*diffCol/PI + spec)*uLightCol[i].rgb*uLightCol[i].w*nl*att;
  }

  /* ---------------- SKIN AND HAIR ----------------

     The brief moved from cel to Monster Hunter, which is the opposite
     problem, so the toon path is gone and these are physically shaded like
     everything else in the scene. What separates rendered flesh from
     painted plastic is not the BRDF — it is that light goes INTO skin,
     scatters, and comes back out red a millimetre away. Without that the
     terminator is a hard grey edge and the face is a mannequin.

     Two things do the work: a wrapped diffuse, which lets light past the
     geometric terminator the way a translucent medium does, and a red bleed
     concentrated exactly in the band where the surface turns away.
     Plus skin takes TWO speculars — a broad soft sheen from the oil film
     and a tight one from the surface itself. One GGX lobe cannot be both,
     and skin with a single lobe always reads as vinyl.                    */
  int cmid = int(GE.w);
  if(cmid == 16 || cmid == 21){
    /* Anime skin is not flat shading and it is not cel shading. It is a
       very WIDE wrap with the midtones compressed, so most of the face
       sits in one value and the shadow arrives as a soft, slightly cool
       edge. Physical falloff across a cheek is what made the realistic
       pass look like a photograph of a mannequin. */
    const float WRAP = 0.58;
    float nw = clamp((ndl + WRAP)/(1.0 + WRAP), 0.0, 1.0);
    nw = mix(nw, smoothstep(0.30, 0.66, nw)*0.72 + 0.28, 0.78);
    // a whisper of subsurface, only right at the turn
    float term = smoothstep(-WRAP, 0.06, ndl) * (1.0 - smoothstep(0.0, 0.34, ndl));
    vec3 sss = vec3(0.520, 0.190, 0.130);
    vec3 dif = albedo*(nw + sss*term*0.30);

    vec3 H2 = normalize(L+V);
    float ndh2 = max(dot(N,H2),0.0), vdh2 = max(dot(V,H2),0.0);
    float aB = clamp(rough*2.4, 0.20, 1.0); aB *= aB;
    vec3 F2 = F_Schlick(vec3(0.021), vdh2);
    vec3 spec = F2*D_GGX(ndh2,aB)*V_SmithGGX(ndv,ndl,aB)*0.40;
    /* An anime face does NOT take a hard shadow from its own hair. In
       production the face gets its own softened shadow term for exactly
       this reason: a raw shadow map thrown across flat-shaded skin reads
       as a grey mask stuck over the drawing, which is precisely what the
       last render produced. Keep a hint of it and no more. */
    float shF = mix(1.0, smoothstep(0.0, 1.0, sh), 0.18);
    vec3 skinDirect = (dif/PI + spec*ndl)*uSunColor*shF;

    vec3 irrS = texture(uIrr, N).rgb;
    // the shadow side is filled and cooled rather than left to go dark
    vec3 ambS = mix(irrS, vec3(dot(irrS, vec3(0.3,0.59,0.11))), 0.35)
                *uAmbTint*albedo*pow(ao,0.65)*uAmbient*1.28
              + albedo*vec3(0.040,0.028,0.030);
    outC = vec4(skinDirect + ambS + pl + GE.rgb, 1.0);
    return;
  }
  if(cmid == 17){
    /* Hair is a bundle of cylinders, so its highlight is a BAND across the
       strands, not a point. Kajiya-Kay: shift the shading normal toward the
       strand tangent and take the specular off that. Two lobes again — a
       tight bright one on the surface and a broad coloured one from light
       that has been through the strand. */
    vec3 T2 = normalize(cross(N, vec3(0.0,1.0,0.0)) + vec3(1e-4));
    vec3 H2 = normalize(L+V);
    float tdh = dot(T2, H2);
    float sinTH = sqrt(max(0.0, 1.0 - tdh*tdh));
    float prim = pow(sinTH, 90.0), sec = pow(sinTH, 16.0);
    vec3 hspec = (vec3(1.0)*pow(sinTH,150.0)*0.20 + albedo*vec3(1.5,1.12,0.86)*sec*0.075);
    float hw = clamp((ndl + 0.52)/1.52, 0.0, 1.0);
  vec3 hdif = albedo*(mix(hw, smoothstep(0.26,0.62,hw)*0.74 + 0.26, 0.72));
    vec3 irrH = texture(uIrr, N).rgb;
    outC = vec4((hdif/PI*1.9 + hspec*ndl)*uSunColor*sh
              + irrH*uAmbTint*albedo*pow(ao,1.3)*uAmbient + pl + GE.rgb, 1.0);
    return;
  }

  vec3 col = direct + ambient + pl + GE.rgb;
  outC = vec4(col, 1.0);
}
`;

/* ------------------------- SSAO / GTAO-lite ------------------------- */
const FS_AO = SH_COMMON + SH_GBUF_READ + `
uniform float uRadius;
uniform float uIntensity;
uniform vec2 uRes;
uniform float uTime;
in vec2 vUV;
out vec4 outC;

void main(){
  float d = texture(uDepth, vUV).r;
  if(d>=0.99999){ outC=vec4(1.0); return; }
  vec3 vp = viewFromDepth(vUV, d);
  vec3 N = octDecode(texture(uGN, vUV).xy);
  vec3 vn = normalize((uView*vec4(N,0.0)).xyz);
  float noise = hash12(gl_FragCoord.xy*1.7 + fract(uTime)*77.0);
  float ao = 0.0;
  const int DIRS = 6, STEPS = 4;
  float radiusPix = uRadius / max(-vp.z,0.4);
  radiusPix = clamp(radiusPix, 0.004, 0.055);
  for(int i=0;i<DIRS;i++){
    float ang = (float(i)+noise)/float(DIRS)*TAU;
    vec2 dir = vec2(cos(ang),sin(ang));
    float best = 0.0;
    for(int j=1;j<=STEPS;j++){
      float t = (float(j)-0.25*noise)/float(STEPS);
      vec2 suv = vUV + dir*radiusPix*t*vec2(1.0, uRes.x/uRes.y);
      if(suv.x<0.0||suv.x>1.0||suv.y<0.0||suv.y>1.0) break;
      float sd = texture(uDepth, suv).r;
      if(sd>=0.99999) continue;
      vec3 sp = viewFromDepth(suv, sd);
      vec3 dv = sp - vp;
      float l = length(dv);
      if(l<1e-4) continue;
      float h = dot(dv/l, vn);
      float atten = 1.0/(1.0 + l*l*2.6);
      best = max(best, h*atten);

    ao += clamp(best,0.0,1.0);

/* ------------------------- SSR ------------------------- */
const FS_SSR = SH_COMMON + SH_GBUF_READ + `
uniform sampler2D uColor;
uniform mat4 uProj;
uniform vec2 uRes;
uniform float uTime;
uniform float uMaxRough;
in vec2 vUV;
out vec4 outC;

void main(){
  float d = texture(uDepth, vUV).r;
  vec4 GN = texture(uGN, vUV);
  float rough = GN.z;
  if(d>=0.99999 || rough > uMaxRough){ outC = vec4(0.0); return; }
  vec3 N = octDecode(GN.xy);
  vec3 vpos = viewFromDepth(vUV, d);
  vec3 vn = normalize((uView*vec4(N,0.0)).xyz);
  vec3 V = normalize(vpos);
  vec3 R = reflect(V, vn);
  if(R.z > 0.0 && vpos.z > -0.4){ outC=vec4(0.0); return; }

  float jitter = hash12(gl_FragCoord.xy + fract(uTime)*31.0);
  // rough-perturbed reflection
  vec3 rnd = (hash33(vec3(gl_FragCoord.xy, fract(uTime)*100.0))-0.5)*2.0;
  R = normalize(R + rnd*rough*rough*1.5);

  float stepLen = 0.30;
  vec3 p = vpos + vn*0.02;
  float thickness = 0.42;
  vec2 hitUV = vec2(-1.0);
  float travelled = 0.0;
  const int STEPS = 42;
  vec3 prevP = p;
  for(int i=0;i<STEPS;i++){
    float sl = stepLen*(1.0 + float(i)*0.10);
    prevP = p;
    p += R*sl*(0.85+0.3*jitter);
    travelled += sl;
    if(p.z > -uNearFar.x) break;
    vec4 c = uProj*vec4(p,1.0);
    vec2 uv = (c.xy/c.w)*0.5+0.5;
    if(uv.x<0.0||uv.x>1.0||uv.y<0.0||uv.y>1.0) break;
    float sd = texture(uDepth, uv).r;
    if(sd>=0.99999) continue;
    vec3 sp = viewFromDepth(uv, sd);
    float diff = sp.z - p.z;
    if(diff > 0.0 && diff < thickness + sl*0.6){
      // binary refine
      vec3 a = prevP, b = p;
      for(int k=0;k<5;k++){
        vec3 m = (a+b)*0.5;
        vec4 cm = uProj*vec4(m,1.0);
        vec2 muv = (cm.xy/cm.w)*0.5+0.5;
        float md = texture(uDepth, muv).r;
        vec3 msp = viewFromDepth(muv, md);
        if(msp.z - m.z > 0.0) b = m; else a = m;
      }
      vec4 cf = uProj*vec4((a+b)*0.5,1.0);
      hitUV = (cf.xy/cf.w)*0.5+0.5;
      break;
    }
  }
  if(hitUV.x < 0.0){ outC = vec4(0.0); return; }

  vec3 col = texture(uColor, hitUV).rgb;
  vec2 e = abs(hitUV*2.0-1.0);
  float edgeFade = (1.0-smoothstep(0.72,1.0,max(e.x,e.y)));
  float distFade = 1.0 - smoothstep(0.0, 26.0, travelled);
  float roughFade = 1.0 - smoothstep(uMaxRough*0.35, uMaxRough, rough);
  outC = vec4(col, edgeFade*distFade*roughFade);

`;

/* ------------------------- VOLUMETRIC LIGHT ------------------------- */
const FS_VOLUME = SH_COMMON + SH_GBUF_READ + `
uniform sampler2DShadow uSh0;
uniform sampler2DShadow uSh1;
uniform sampler2DShadow uSh2;
uniform mat4 uShVP0, uShVP1, uShVP2;
uniform vec3 uSunDir;
uniform vec3 uSunColor;
uniform float uTime;
uniform float uDensity;
uniform float uFogHeight;
uniform float uAnisotropy;
uniform int uSteps;
uniform vec3 uAmbientFog;
in vec2 vUV;
out vec4 outC;

float shadowAt(vec3 w){
  vec4 c0 = uShVP0*vec4(w,1.0); vec3 p0=c0.xyz/c0.w*0.5+0.5;
  if(p0.x>0.005&&p0.x<0.995&&p0.y>0.005&&p0.y<0.995&&p0.z<1.0) return texture(uSh0,p0);
  vec4 c1 = uShVP1*vec4(w,1.0); vec3 p1=c1.xyz/c1.w*0.5+0.5;
  if(p1.x>0.005&&p1.x<0.995&&p1.y>0.005&&p1.y<0.995&&p1.z<1.0) return texture(uSh1,p1);
  vec4 c2 = uShVP2*vec4(w,1.0); vec3 p2=c2.xyz/c2.w*0.5+0.5;

float hg(float c, float g){
  float g2=g*g;
  return (1.0-g2)/(4.0*PI*pow(1.0+g2-2.0*g*c, 1.5));
}
void main(){
  float d = texture(uDepth, vUV).r;
  vec3 wend = worldFromDepth(vUV, min(d,0.9999));
  vec3 ro = uCamPos;
  vec3 rd = wend - ro;
  float maxT = length(rd);
  rd /= max(maxT,1e-4);
  maxT = min(maxT, 46.0);

  float jitter = hash12(gl_FragCoord.xy*3.11 + fract(uTime)*61.0);
  int STEPS = uSteps;
  float dt = maxT/float(STEPS);
  float cosA = dot(rd, uSunDir);
  float phase = hg(cosA, uAnisotropy);

  for(int i=0;i<64;i++){

      acc += trans*inscat*sigma;

const FS_COMPOSITE = SH_COMMON + SH_GBUF_READ + SH_PBR + `

uniform sampler2D uSSR;

/* ------------------------- AUTO EXPOSURE -------------------------

   Metering the sun's elevation is not good enough here. The player spends
   most of the game under a roofed corridor, where a high sun delivers LESS
   light to the eye, not more, because the beam is stopped by the kasagi.
   An open loop estimate stops the lens down exactly when the scene got
   darker. So measure the frame that was actually rendered.

   Centre weighted log-average, adapted inside a 1x1 target, which keeps
   the whole loop on the GPU: no readPixels, no pipeline stall.           */
const FS_METER = SH_COMMON + `
uniform sampler2D uScene;
uniform sampler2D uPrev;
uniform float uDt, uKey, uGamma, uMin, uMax, uValid;
out vec4 outC;
void main(){
  /* A log-average is the textbook choice but it is dominated by the floor
     here: this scene has large genuinely black regions (the nuki wedges,
     the wooded slope) and a log mean of mostly-floor barely moves between
     noon and midnight. Use a Reinhard mean instead - soft clipped on the
     way in, so neither the black nor a sun disc can own the meter. */
  float sum = 0.0, wsum = 0.0;
  for(int y=0;y<13;y++){
    for(int x=0;x<13;x++){
      vec2 uv = (vec2(float(x),float(y))+0.5)/13.0;
      vec2 dd = uv-0.5;
      float w = exp(-dot(dd,dd)*3.2);        // centre weighted, like a real meter
      float l = luma(texture(uScene, uv).rgb);
      sum += (l/(1.0+l))*w;
      wsum += w;
    }
  }
  float Lc = sum/max(wsum,1e-4);
  float L = Lc/max(1.0-Lc, 1e-3);            // back out to scene linear
  /* Deliberately NOT a full normalisation. Inverting L exactly would make
     midnight and midday equally bright, which is the classic auto exposure
     mistake. uGamma < 1 leaves part of the real difference on screen: at
     0.75, night still reads about 70% as bright as dawn. */
  float target = clamp(uKey*pow(max(L, 1e-4), -uGamma), uMin, uMax);
  if(uValid < 0.5){ outC = vec4(target,L,0,1); return; }
  float prev = texture(uPrev, vec2(0.5)).r;
  float rate = target < prev ? 1.4 : 0.55;   // quick into the light, slow into the dark
  outC = vec4(prev + (target-prev)*(1.0-exp(-rate*uDt)), L, 0.0, 1.0);
}
`;

/* ------------------------- FINAL GRADE ------------------------- */
const FS_FINAL = SH_COMMON + `
uniform sampler2D uTex;
uniform sampler2D uBloom;
uniform vec2 uRes;
uniform float uExposure, uBloomAmt, uVignette, uGrain, uCA, uTime, uSat, uContrast;
uniform sampler2D uExpo;      // 1x1, the adapted exposure
uniform vec3 uLift, uGamma, uGain;
in vec2 vUV; out vec4 outC;

vec3 agxDefaultContrastApprox(vec3 x){
  vec3 x2=x*x; vec3 x4=x2*x2;
  return + 15.5*x4*x2 - 40.14*x4*x + 31.96*x4 - 6.868*x2*x + 0.4298*x2 + 0.1191*x - 0.00232;
}
vec3 agx(vec3 val){
  const mat3 m = mat3(0.842479062253094,0.0423282422610123,0.0423756549057051,
                      0.0784335999999992,0.878468636469772,0.0784336,
                      0.0792237451477643,0.0791661274605434,0.879142973793104);
  const float mn=-12.47393, mx=4.026069;

  val = clamp((log2(val+1e-10)-mn)/(mx-mn), 0.0, 1.0);

vec3 agxEotf(vec3 val){
  const mat3 m = mat3( 1.19687900512017,-0.0528968517574562,-0.0529716355144438,

/* gentle "punchy" look: slight desaturation of extremes, warm/cool split */
vec3 agxLook(vec3 c){
  const vec3 lw = vec3(0.2126,0.7152,0.0722);
  float l = dot(c,lw);
  vec3 offset = vec3(0.0);
  vec3 slope  = vec3(1.02,1.00,0.985);
  vec3 power  = vec3(1.02,1.00,1.00);
  float sat   = 1.14;
  c = pow(max(c*slope+offset,0.0), power);
  return max(l + sat*(c-l), 0.0);

vec3 tonemap(vec3 c){ return agxEotf(agxLook(agx(c))); }

void main(){
  vec2 uv = vUV;

  vec3 col;

  col.g = texture(uTex, uv).g;

  float lNW=dot(rgbNW,lm),lNE=dot(rgbNE,lm),lSW=dot(rgbSW,lm),lSE=dot(rgbSE,lm),lM=dot(rgbM,lm);
  float lMin=min(lM,min(min(lNW,lNE),min(lSW,lSE)));
  float lMax=max(lM,max(max(lNW,lNE),max(lSW,lSE)));
  vec2 dir=vec2(-((lNW+lNE)-(lSW+lSE)),((lNW+lSW)-(lNE+lSE)));
  float dirRed=max((lNW+lNE+lSW+lSE)*0.25*0.125,0.0078125);
  float rcp=1.0/(min(abs(dir.x),abs(dir.y))+dirRed);
  dir=clamp(dir*rcp,-8.0,8.0)*uTexel;
  vec3 rgbA=0.5*(texture(uTex,vUV+dir*(1.0/3.0-0.5)).rgb+texture(uTex,vUV+dir*(2.0/3.0-0.5)).rgb);
  vec3 rgbB=rgbA*0.5+0.25*(texture(uTex,vUV+dir*-0.5).rgb+texture(uTex,vUV+dir*0.5).rgb);
  float lB=dot(rgbB,lm);
  outC=vec4((lB<lMin||lB>lMax)?rgbA:rgbB,1.0);
}
`;

uniform sampler2D uTex; uniform vec2 uTexel; uniform float uAmount;
in vec2 vUV; out vec4 outC;
void main(){
  vec3 c = texture(uTex,vUV).rgb;
  vec3 n = texture(uTex,vUV+vec2(0.0,-uTexel.y)).rgb
         + texture(uTex,vUV+vec2(0.0, uTexel.y)).rgb
         + texture(uTex,vUV+vec2(-uTexel.x,0.0)).rgb
         + texture(uTex,vUV+vec2( uTexel.x,0.0)).rgb;
  vec3 sharp = c + (c*4.0 - n)*uAmount*0.25;

}
`;

/* =========================================================================
   SOLAR ASTRONOMY

   The sun is not two free sliders. It is a calendar.

   The player is given two dials — 節気 (which of the 24 solar terms) and
   時刻 (time of day) — and the sun's elevation and azimuth follow from
   them by real astronomy at this latitude. Whole regions of the sky are
   therefore unreachable, which is what makes a shadow puzzle solvable.
   ========================================================================= */

const SITE = { lat: 34.9671, lon: 135.7727, meridian: 135.0 };   // Fushimi Inari / JST
const OBLIQ = 23.4397 * PI / 180;

/* Compass bearing of world +Z, which is the direction the approach climbs.
   The real Senbon Torii ascends ENE, so the sunrise sweeps across the
   corridor axis over the course of the year. That sweep is the game. */
const SCENE_BEARING = 75.0;

/* Kyoto sits WNW of the mountain; its glow is on that horizon at night. */
const CITY_BEARING = 300.0;

/* 二十四節気 — the terms sit at exactly 15 degrees of solar longitude
   apart starting from 立春 at 315, so declination follows from the index
   alone with no calendar lookup. */
const SEKKI = [
  ['立春', '2月4日'], ['雨水', '2月19日'], ['啓蟄', '3月6日'], ['春分', '3月20日'],
  ['清明', '4月5日'], ['穀雨', '4月20日'], ['立夏', '5月5日'], ['小満', '5月21日'],
  ['芒種', '6月6日'], ['夏至', '6月21日'], ['小暑', '7月7日'], ['大暑', '7月23日'],
  ['立秋', '8月7日'], ['処暑', '8月23日'], ['白露', '9月8日'], ['秋分', '9月23日'],
  ['寒露', '10月8日'], ['霜降', '10月23日'], ['立冬', '11月7日'], ['小雪', '11月22日'],
  ['大雪', '12月7日'], ['冬至', '12月22日'], ['小寒', '1月5日'], ['大寒', '1月20日']
];

function sekkiToLambda(i) { return ((315 + 15 * i) * PI / 180) % TAU; }
function declination(lam) { return Math.asin(Math.sin(OBLIQ) * Math.sin(lam)); }
function dayOfYear(lam) { return (79.5 + (lam / TAU) * 365.2422) % 365.2422; }

/* equation of time, in minutes: how far the real sun runs ahead of the clock */
function equationOfTime(N) {
  const B = TAU * (N - 81) / 364.0;
  return 9.87 * Math.sin(2 * B) - 7.53 * Math.cos(B) - 1.5 * Math.sin(B);
}
function clockToHourAngle(hour, N) {
  const solar = hour + equationOfTime(N) / 60 + (SITE.lon - SITE.meridian) / 15;
  return (solar - 12) * 15 * PI / 180;
}

/* sun direction in the local horizontal frame: [east, north, up] */
function sunENU(lam, hour) {
  const dec = declination(lam);
  const H = clockToHourAngle(hour, dayOfYear(lam)), phi = SITE.lat * PI / 180;
  const cd = Math.cos(dec), sd = Math.sin(dec);
  const cp = Math.cos(phi), sp = Math.sin(phi);
  const cH = Math.cos(H), sH = Math.sin(H);
  return [-cd * sH, -cd * cH * sp + sd * cp, cd * cH * cp + sd * sp];
}

/* The world is right handed with +Y up, so at SCENE_BEARING 180 this is
   the textbook mapping: +X east, +Z south. */
function enuToWorld(v) {
  const th = SCENE_BEARING * PI / 180, ct = Math.cos(th), st = Math.sin(th);
  return [-v[0] * ct + v[1] * st, v[2], v[0] * st + v[1] * ct];
}
/* the same 2x2 is its own inverse (it is a reflection), hence: */
function worldToBearing(w) {
  const th = SCENE_BEARING * PI / 180, ct = Math.cos(th), st = Math.sin(th);
  const e = -ct * w[0] + st * w[2], nn = st * w[0] + ct * w[2];
  return ((Math.atan2(e, nn) * 180 / PI) % 360 + 360) % 360;
}
function bearingToWorld(deg) {
  const b = deg * PI / 180;
  return enuToWorld([Math.sin(b), Math.cos(b), 0]);
}

/* sunrise / solar noon / sunset in clock hours. -0.833 deg accounts for
   refraction plus the sun's own radius. */
function dayLength(lam) {
  const dec = declination(lam), phi = SITE.lat * PI / 180;
  const noon = 12 - equationOfTime(dayOfYear(lam)) / 60 - (SITE.lon - SITE.meridian) / 15;
  const c = (Math.sin(-0.833 * PI / 180) - Math.sin(phi) * Math.sin(dec)) /
    (Math.cos(phi) * Math.cos(dec));
  if (c <= -1) return { rise: noon - 11.99, noon, set: noon + 11.99 };
  if (c >= 1) return { rise: noon, noon, set: noon };
  const H = Math.acos(c) * 180 / PI / 15;
  return { rise: noon - H, noon, set: noon + H };
}

function fmtHM(h) {
  const m = Math.round((((h % 24) + 24) % 24) * 60);
  return String(Math.floor(m / 60) % 24).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
}

/* Critically damped follow: framerate independent, and it takes the short
   way round midnight. It snaps once inside eps, because an exponential
   never actually arrives and a puzzle that asks the player to stand at
   冬至 has to be able to tell when they are standing at 冬至. */
function dampWrap(cur, tgt, period, lambda, dt, eps) {
  let d = (tgt - cur) % period;
  if (d > period / 2) d -= period;
  if (d < -period / 2) d += period;
  if (Math.abs(d) < (eps || 0)) return tgt;
  const v = cur + d * (1 - Math.exp(-lambda * dt));
  return ((v % period) + period) % period;
}
