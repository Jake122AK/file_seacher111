/* ==== c_scene.js ==== */
/* =========================================================================
   SCENE : 伏見稲荷大社 千本鳥居 — geometry construction
   ========================================================================= */

const MAT = { VERMILLION: 0, BLACK: 1, STONE: 2, MOSS: 3, GRANITE: 4, BARK: 5, PLASTER: 6, FOLIAGE: 7 };

/* ---------------- path through the mountain ---------------- */
const PATH_LEN = 210;
function pathPos(t) {
  const x = 7.2 * Math.sin(t * 0.0455) + 3.1 * Math.sin(t * 0.0192 + 1.35) - 0.35 * Math.sin(t * 0.061);
  const y = t * 0.055 + 0.5 * Math.sin(t * 0.035 + 0.4) + 0.20 * Math.sin(t * 0.09);
  return [x, y, t];
}
function pathTan(t) {
  const a = pathPos(t - 0.25), b = pathPos(t + 0.25);
  return norm(sub(b, a));
}
function pathRight(t) {
  const tg = pathTan(t);
  return norm(cross([0, 1, 0], tg));   // points to -X-ish for tg=+Z  => actually +X
}
function pathY(t) { return pathPos(t)[1]; }

/* ---------------- TORII (稲荷鳥居 / 台輪鳥居) ---------------- */
function buildTorii(detail) {
  const g = new Geo();
  const RS = detail ? 22 : 8;                 // radial segments
  const CS = detail ? 3 : 1;                  // corner segments of sections
  const SW = detail ? 11 : 4;                 // sweep path nodes

  const clear = 1.86;                          // inner clear width
  const rBase = 0.152, rTop = 0.126;
  const px = clear * 0.5 + rBase;              // pillar centre x
  const hPillar = 2.90;
  const lean = 0.022;                          // inward lean (radians)

  // ---- stone plinth ----
  const plinth = roundedBox(0.50, 0.20, 0.50, 0.025, detail ? 2 : 1, { mat: MAT.GRANITE, uScale: 0.5, vScale: 0.5 });
  // ---- black root wrap (根巻) ----
  const nemakiProf = [
    [0.0, 0.075], [0.175, 0.075], [0.186, 0.10], [0.186, 0.40], [0.176, 0.425], [0.0, 0.425]
  ].map(p => [p[0], p[1], p[1] * 1.4]);
  const nemaki = lathe(nemakiProf, RS, { mat: MAT.BLACK, uScale: 1.0 });

  // ---- pillar ----
  const prof = [];
  prof.push([0.0, 0.40, 0.0]);
  prof.push([rBase * 0.99, 0.40, 0.0]);
  for (let i = 0; i <= (detail ? 7 : 2); i++) {
    const k = i / (detail ? 7 : 2);
    const y = lerp(0.40, hPillar - 0.05, k);
    const r = lerp(rBase, rTop, k) * (1 + 0.004 * Math.sin(k * 9));
    prof.push([r, y, y * 0.55]);
  }
  prof.push([rTop * 0.97, hPillar - 0.012, hPillar * 0.55]);
  prof.push([rTop * 0.90, hPillar, hPillar * 0.55]);
  prof.push([0.0, hPillar + 0.004, hPillar * 0.55]);
  const pillar = lathe(prof, RS, { mat: MAT.VERMILLION, uScale: 1.0 });

  // ---- daiwa (台輪) : square collar under the nuki-top ----
  const daiwa = roundedBox(0.46, 0.085, 0.46, 0.014, detail ? 2 : 1, { mat: MAT.VERMILLION, uScale: 0.4, vScale: 0.12 });

  const m = M4.create();
  for (const sgn of [-1, 1]) {
    const x0 = sgn * px;
    // plinth
    M4.compose(m, [x0, 0.06, 0], 0, [1, 1, 1]);
    g.merge(plinth, m);
    // leaning column parts : rotate about Z so the top tips inward
    const rz = -sgn * lean;
    M4.compose(m, [x0, 0, 0], 0, [1, 1, 1], 0, rz);
    g.merge(nemaki, m);
    g.merge(pillar, m);
    const dy = 2.40;
    M4.compose(m, [x0 - sgn * Math.sin(lean) * dy, dy, 0], 0, [1, 1, 1], 0, rz);
    g.merge(daiwa, m);
  }

  // ---- nuki (貫) : through-beam ----
  const nukiLen = px * 2 + 0.66;
  const nukiSec = roundedRect(0.175, 0.235, 0.022, CS);
  const nukiPath = [];
  for (let i = 0; i <= SW; i++) {
    const k = i / SW, x = lerp(-nukiLen / 2, nukiLen / 2, k);
    const taper = 1.0 - 0.10 * smoothstep(0.80, 1.0, Math.abs(k * 2 - 1));
    nukiPath.push({ p: [x, 1.94, 0], sx: taper, sy: taper });
  }
  g.merge(sweep(nukiPath, nukiSec, { mat: MAT.VERMILLION, uScale: 0.55, vScale: 0.30 }));

  // ---- kusabi (楔) wedges either side of each pillar ----
  const kus = roundedBox(0.075, 0.20, 0.20, 0.012, 1, { mat: MAT.VERMILLION, uScale: 0.2, vScale: 0.2 });
  for (const sgn of [-1, 1]) for (const o of [-1, 1]) {
    M4.compose(m, [sgn * px + o * (rBase + 0.05), 1.94, 0], 0, [1, 1.06, 1]);
    g.merge(kus, m);
  }

  // ---- shimaki (島木) : thick curved beam ----
  const shLen = px * 2 + 1.06;
  const sori = 0.155;
  const shSec = roundedRect(0.315, 0.225, 0.028, CS);
  const shPath = [];
  for (let i = 0; i <= SW * 2; i++) {
    const k = i / (SW * 2), u = k * 2 - 1;
    const x = u * shLen / 2;
    const y = 2.735 + sori * u * u * 0.55;
    const endTaper = 1.0 - 0.16 * smoothstep(0.86, 1.0, Math.abs(u));
    shPath.push({ p: [x, y, 0], sx: endTaper, sy: 1.0 - 0.28 * smoothstep(0.90, 1.0, Math.abs(u)) });
  }
  g.merge(sweep(shPath, shSec, { mat: MAT.VERMILLION, uScale: 0.5, vScale: 0.28 }));

  // ---- kasagi (笠木) : top beam, more sori, dark upper face ----
  const kaLen = px * 2 + 1.34;
  const kaSec = roundedRect(0.375, 0.135, 0.026, CS);
  const kaPath = [];
  for (let i = 0; i <= SW * 2; i++) {
    const k = i / (SW * 2), u = k * 2 - 1;
    const x = u * kaLen / 2;
    const y = 2.955 + (sori * 1.35) * u * u * 0.62;
    const endT = 1.0 - 0.13 * smoothstep(0.84, 1.0, Math.abs(u));
    kaPath.push({ p: [x, y, 0], sx: endT, sy: 1.0 - 0.34 * smoothstep(0.88, 1.0, Math.abs(u)) });
  }
  g.merge(sweep(kaPath, kaSec, { mat: MAT.BLACK, uScale: 0.5, vScale: 0.26 }));

  // ---- gakuzuka (額束) centre strut ----
  const gz = roundedBox(0.145, 0.60, 0.185, 0.016, 1, { mat: MAT.VERMILLION, uScale: 0.15, vScale: 0.5 });
  M4.compose(m, [0, 2.35, 0], 0, [1, 1, 1]);
  g.merge(gz, m);

  return g;
}

/* ---------------- inscription decal strips on the pillar faces ---------------- */
function buildInscriptionDecals() {
  const g = new Geo();
  const clear = 1.86, rBase = 0.152, rTop = 0.126;
  const px = clear * 0.5 + rBase;
  const y0 = 0.62, y1 = 2.16;
  const seg = 5, rows = 6;
  const half = 0.52;                       // arc half-angle (rad)
  for (const sgn of [-1, 1]) {
    const vBase = sgn < 0 ? 0.0 : 0.5;     // atlas row: left pillar / right pillar
    const grid = [];
    for (let r = 0; r <= rows; r++) {
      const line = [];
      const ky = r / rows;
      const y = lerp(y0, y1, ky);
      const rad = lerp(rBase, rTop, (y - 0.4) / 2.5) + 0.008;
      for (let i = 0; i <= seg; i++) {
        const k = i / seg;
        const a = -PI / 2 + lerp(-half, half, k);   // centred on -Z
        const cx = sgn * px + Math.sin(a + PI / 2) * 0 + Math.cos(a) * rad;
        const cz = Math.sin(a) * rad;
        const nx = Math.cos(a), nz = Math.sin(a);
        line.push(g.push(cx, y, cz, nx, 0, nz, k, vBase + ky * 0.5, MAT.VERMILLION));
      }
      grid.push(line);
    }
    for (let r = 0; r < rows; r++) for (let i = 0; i < seg; i++)
      g.quad(grid[r][i], grid[r][i + 1], grid[r + 1][i + 1], grid[r + 1][i]);
  }
  return g;
}

/* ---------------- ground: path surface + banks ---------------- */
function bankHeight(s) {
  const a = Math.abs(s);
  if (a < 1.42) return -0.010 * a * a;
  const k = a - 1.42;
  // shallow gutter, then a steep wooded slope
  return -0.02 + 0.42 * Math.min(k, 0.55) / 0.55
    + 0.92 * Math.max(Math.min(k, 7.0) - 0.55, 0)
    + 0.62 * Math.max(k - 7.0, 0);
}
function groundNoise(s, t) {
  const n = Math.sin(s * 2.3 + t * 0.7) * 0.012 + Math.sin(t * 1.7 - s * 1.1) * 0.010 + Math.sin(t * 0.31 + s * 0.5) * 0.03;
  return n;
}

function buildGroundStrip(sMin, sMax, matId, nS, tStep, yOff, uvScale) {
  const g = new Geo();
  const rows = [];
  for (let t = -8; t <= PATH_LEN + 12; t += tStep) {
    const P = pathPos(t), R = pathRight(t);
    const row = [];
    for (let i = 0; i <= nS; i++) {
      const s = lerp(sMin, sMax, i / nS);
      const h = bankHeight(s) + groundNoise(s, t) * (Math.abs(s) > 1.4 ? 3.0 : 1.0);
      const x = P[0] + R[0] * s, z = P[2] + R[2] * s;
      const y = P[1] + h + yOff;
      row.push({ x, y, z, s, t });
    }
    rows.push(row);
  }
  const ids = [];
  for (let r = 0; r < rows.length; r++) {
    const row = [];
    for (let i = 0; i < rows[r].length; i++) {
      const c = rows[r][i];
      // normal by neighbours
      const cL = rows[r][Math.max(i - 1, 0)], cR = rows[r][Math.min(i + 1, rows[r].length - 1)];
      const cD = rows[Math.max(r - 1, 0)][i], cU = rows[Math.min(r + 1, rows.length - 1)][i];
      const du = [cR.x - cL.x, cR.y - cL.y, cR.z - cL.z];
      const dv = [cU.x - cD.x, cU.y - cD.y, cU.z - cD.z];
      const n = norm(cross(dv, du));
      if (n[1] < 0) { n[0] = -n[0]; n[1] = -n[1]; n[2] = -n[2]; }
      row.push(g.push(c.x, c.y, c.z, n[0], n[1], n[2], c.s * uvScale, c.t * uvScale, matId));
    }
    ids.push(row);
  }
  for (let r = 0; r < ids.length - 1; r++)
    for (let i = 0; i < ids[r].length - 1; i++)
      g.quad(ids[r][i], ids[r + 1][i], ids[r + 1][i + 1], ids[r][i + 1]);
  return g;
}

/* ---------------- stone lantern (石灯籠) ---------------- */
function buildLantern(detail) {
  const g = new Geo(); const RS = detail ? 16 : 8; const m = M4.create();
  const P = (r, y) => [r, y, y * 0.8];
  // base
  g.merge(lathe([P(0, 0), P(0.30, 0), P(0.32, 0.05), P(0.30, 0.14), P(0.22, 0.18), P(0.20, 0.24), P(0, 0.24)], RS, { mat: MAT.GRANITE }));
  // shaft
  g.merge(lathe([P(0, 0.24), P(0.115, 0.24), P(0.105, 0.55), P(0.118, 0.86), P(0.10, 0.92), P(0, 0.92)], RS, { mat: MAT.GRANITE }));
  // platform
  g.merge(lathe([P(0, 0.92), P(0.20, 0.94), P(0.26, 1.00), P(0.24, 1.06), P(0.16, 1.09), P(0, 1.09)], RS, { mat: MAT.GRANITE }));
  // fire box: 4 corner posts + top ring
  const post = roundedBox(0.055, 0.36, 0.055, 0.008, 1, { mat: MAT.GRANITE });
  for (let i = 0; i < 4; i++) {
    const a = i / 4 * TAU + PI / 4;
    M4.compose(m, [Math.cos(a) * 0.145, 1.27, Math.sin(a) * 0.145], 0, [1, 1, 1]);
    g.merge(post, m);
  }
  g.merge(lathe([P(0, 1.09), P(0.175, 1.09), P(0.175, 1.13), P(0, 1.13)], RS, { mat: MAT.GRANITE }));
  g.merge(lathe([P(0, 1.44), P(0.185, 1.44), P(0.185, 1.49), P(0, 1.49)], RS, { mat: MAT.GRANITE }));
  // roof
  g.merge(lathe([P(0, 1.49), P(0.16, 1.50), P(0.34, 1.60), P(0.40, 1.70), P(0.38, 1.76), P(0.30, 1.80), P(0.14, 1.83), P(0, 1.84)], RS, { mat: MAT.GRANITE }));
  // finial
  g.merge(lathe([P(0, 1.83), P(0.07, 1.86), P(0.085, 1.92), P(0.055, 1.99), P(0.03, 2.03), P(0, 2.05)], RS, { mat: MAT.GRANITE }));
  return g;
}

/* ---------------- cedar trunk ---------------- */
function buildTrunk(detail) {
  const RS = detail ? 12 : 6;
  const prof = [];
  const H = 17.0;
  for (let i = 0; i <= (detail ? 9 : 3); i++) {
    const k = i / (detail ? 9 : 3);
    const y = k * H;
    let r = lerp(0.42, 0.13, Math.pow(k, 0.72));
    r *= 1 + 0.06 * Math.sin(k * 11) + 0.10 * Math.exp(-k * 14);
    prof.push([r, y, y * 0.30]);
  }
  prof.push([0.02, H + 0.4, H * 0.30]);
  return lathe(prof, RS, { mat: MAT.BARK, uScale: 1.6 });
}

/* ---------------- canopy cluster : crossed cards of cedar foliage ---------------- */
function buildCanopyClump(seed, n) {
  const g = new Geo();
  const rnd = mulberry32(seed);
  for (let i = 0; i < n; i++) {
    const a = rnd() * TAU;
    const tilt = (rnd() - 0.5) * 1.1;
    const w = 1.5 + rnd() * 2.2, h = 1.2 + rnd() * 1.9;
    const cx = (rnd() - 0.5) * 2.4, cy = (rnd() - 0.5) * 1.9, cz = (rnd() - 0.5) * 2.4;
    const ux = Math.cos(a), uz = Math.sin(a);
    const vx = -Math.sin(a) * Math.sin(tilt), vy = Math.cos(tilt), vz = Math.cos(a) * Math.sin(tilt);
    const nx = uz * vy - 0 * vz, ny = 0 * vx - ux * vz, nz = ux * vy - uz * vx;
    const nl = Math.hypot(nx, ny, nz) || 1;
    const N = [nx / nl, ny / nl, nz / nl];
    const P = (sx, sy) => g.push(
      cx + ux * sx * w * 0.5 + vx * sy * h * 0.5,
      cy + vy * sy * h * 0.5,
      cz + uz * sx * w * 0.5 + vz * sy * h * 0.5,
      N[0], N[1], N[2], sx * 0.5 + 0.5, sy * 0.5 + 0.5, MAT.FOLIAGE);
    const a0 = P(-1, -1), b0 = P(1, -1), c0 = P(1, 1), d0 = P(-1, 1);
    g.quad(a0, b0, c0, d0);
    g.quad(d0, c0, b0, a0);
  }
  return g;
}

/* ---------------- foliage card (fern / undergrowth) ---------------- */
function buildFernClump() {
  const g = new Geo();
  const rnd = mulberry32(7331);
  for (let i = 0; i < 7; i++) {
    const a = rnd() * TAU;
    const len = 0.42 + rnd() * 0.55;
    const w = 0.13 + rnd() * 0.10;
    const bend = 0.35 + rnd() * 0.5;
    const seg = 5;
    const dirx = Math.cos(a), dirz = Math.sin(a);
    const rows = [];
    for (let j = 0; j <= seg; j++) {
      const k = j / seg;
      const y = len * k - bend * len * k * k * 0.9;
      const rr = len * k * 0.8;
      const cx = dirx * rr, cz = dirz * rr;
      const nx = -dirz, nz = dirx;
      const hw = w * (1 - k * 0.15) * 0.5;
      const nrm = norm([dirx * 0.35 + 0, 0.9, dirz * 0.35]);
      rows.push([
        g.push(cx - nx * hw, y, cz - nz * hw, nrm[0], nrm[1], nrm[2], 0, k, MAT.FOLIAGE),
        g.push(cx + nx * hw, y, cz + nz * hw, nrm[0], nrm[1], nrm[2], 1, k, MAT.FOLIAGE)
      ]);
    }
    for (let j = 0; j < seg; j++) {
      g.quad(rows[j][0], rows[j][1], rows[j + 1][1], rows[j + 1][0]);
      g.quad(rows[j + 1][0], rows[j + 1][1], rows[j][1], rows[j][0]);
    }
  }
  return g;
}

/* ---------------- fallen leaf ---------------- */
function buildLeaf() {
  const g = new Geo();
  const w = 0.055, l = 0.085;
  const n = [0, 1, 0];
  const a = g.push(-w, 0, -l, n[0], n[1], n[2], 0, 0, MAT.MOSS);
  const b = g.push(w, 0.004, -l, n[0], n[1], n[2], 1, 0, MAT.MOSS);
  const c = g.push(w, 0.008, l, n[0], n[1], n[2], 1, 1, MAT.MOSS);
  const d = g.push(-w, 0.002, l, n[0], n[1], n[2], 0, 1, MAT.MOSS);
  g.quad(a, b, c, d);
  return g;
}

/* ---------------- fox (狐) — simplified seated form ---------------- */
function buildFox() {
  const g = new Geo(); const m = M4.create(); const RS = 12;
  const P = (r, y) => [r, y, y];
  // pedestal
  g.merge(roundedBox(0.62, 0.50, 0.52, 0.03, 2, { mat: MAT.GRANITE }), M4.compose(m, [0, 0.25, 0], 0, [1, 1, 1]));
  // haunches / body: tapered lathe leaning forward
  const body = lathe([P(0, 0), P(0.17, 0.02), P(0.19, 0.16), P(0.165, 0.36), P(0.125, 0.56), P(0.10, 0.66), P(0, 0.68)], RS, { mat: MAT.GRANITE });
  g.merge(body, M4.compose(m, [0, 0.50, 0.02], 0, [1.0, 1.0, 1.25], 0.12, 0));
  // chest
  g.merge(lathe([P(0, 0), P(0.12, 0.04), P(0.13, 0.20), P(0.10, 0.34), P(0, 0.38)], RS, { mat: MAT.GRANITE }),
    M4.compose(m, [0, 0.72, 0.14], 0, [1, 1, 1.1]));
  // head
  g.merge(lathe([P(0, 0), P(0.085, 0.02), P(0.098, 0.10), P(0.082, 0.19), P(0.045, 0.235), P(0, 0.245)], RS, { mat: MAT.GRANITE }),
    M4.compose(m, [0, 1.03, 0.13], 0, [1.05, 1, 1.15], -0.15, 0));
  // muzzle
  g.merge(lathe([P(0, 0), P(0.052, 0.01), P(0.045, 0.10), P(0.028, 0.16), P(0, 0.17)], RS, { mat: MAT.GRANITE }),
    M4.compose(m, [0, 1.09, 0.20], 0, [1, 1, 1], 1.25, 0));
  // ears
  for (const sx of [-1, 1])
    g.merge(lathe([P(0, 0), P(0.048, 0.01), P(0.030, 0.10), P(0, 0.175)], 8, { mat: MAT.GRANITE }),
      M4.compose(m, [sx * 0.055, 1.20, 0.10], 0, [1, 1, 0.55], -0.18, sx * 0.20));
  // front legs
  for (const sx of [-1, 1])
    g.merge(lathe([P(0, 0), P(0.045, 0.02), P(0.040, 0.30), P(0.055, 0.40), P(0, 0.42)], 10, { mat: MAT.GRANITE }),
      M4.compose(m, [sx * 0.075, 0.50, 0.20], 0, [1, 1, 1], -0.06, 0));
  // tail: sweep curving up behind
  const tp = [];
  for (let i = 0; i <= 8; i++) {
    const k = i / 8;
    tp.push({ p: [0, 0.52 + k * 0.72 - 0.12 * Math.sin(k * 2.4), -0.16 - 0.20 * Math.sin(k * 1.7)], sx: 1 - k * 0.35, sy: 1 - k * 0.35 });
  }
  g.merge(sweep(tp, roundedRect(0.13, 0.15, 0.05, 3), { mat: MAT.GRANITE, uScale: 0.5, vScale: 0.5 }));
  return g;
}

/* =========================================================================
   Scene assembly
   ========================================================================= */
function buildScene(quality) {
  const rnd = mulberry32(20240815);
  const draws = [];
  const shadowDraws = [];
  const lights = [];

  const detail = quality >= 2;
  const toriiSpacingBase = quality >= 2 ? 0.545 : 0.70;

  /* -------- torii -------- */
  const toriiGeo = buildTorii(true);
  const toriiLow = buildTorii(false);
  const toriiMesh = new Mesh(toriiGeo);
  const toriiShadow = new Mesh(toriiLow);
  const inst = [];
  let t = 1.0;
  while (t < PATH_LEN) {
    const P = pathPos(t), T = pathTan(t);
    const ry = Math.atan2(T[0], T[2]);
    const big = rnd() < 0.07;
    const scale = (big ? 1.14 + rnd() * 0.12 : 0.93 + rnd() * 0.14);
    const wide = 0.96 + rnd() * 0.11;
    const m = M4.create();
    // torii plane is XY in local space, path direction is +Z -> rotate so local +X is lateral
    M4.compose(m, [P[0], P[1] - 0.03, P[2]], ry, [scale * wide, scale, scale],
      0, (rnd() - 0.5) * 0.014);
    const age = Math.pow(rnd(), 0.8);
    const tint = [
      1.06 - age * 0.36 + (rnd() - 0.5) * 0.10,
      1.00 - age * 0.16 + (rnd() - 0.5) * 0.09,
      0.98 - age * 0.06 + (rnd() - 0.5) * 0.09,
      rnd()
    ];
    inst.push({ m, tint, t });
    // occasional break in the run — light floods in through the gap
    const gapRoll = rnd();
    if (gapRoll < 0.030) t += 1.5 + rnd() * 2.6;
    else if (gapRoll < 0.075) t += 0.5 + rnd() * 0.7;
    t += toriiSpacingBase + rnd() * 0.14;
  }
  toriiMesh.setInstances(inst);
  toriiShadow.setInstances(inst);
  draws.push({ mesh: toriiMesh, name: 'torii' });
  shadowDraws.push({ mesh: toriiShadow });

  const decalMesh = new Mesh(buildInscriptionDecals());
  decalMesh.setInstances(inst);
  draws.push({ mesh: decalMesh, name: 'decals', decal: 1, normalStrength: 0.0 });

  /* -------- ground -------- */
  const pathGeo = buildGroundStrip(-1.45, 1.45, MAT.STONE, quality >= 2 ? 12 : 6, quality >= 2 ? 0.45 : 0.9, 0.0, 0.60);
  const pathMesh = new Mesh(pathGeo);
  draws.push({ mesh: pathMesh, name: 'path' });

  const bankL = buildGroundStrip(-13.0, -1.30, MAT.MOSS, quality >= 2 ? 16 : 8, quality >= 2 ? 0.9 : 1.8, -0.02, 0.30);
  const bankR = buildGroundStrip(1.30, 13.0, MAT.MOSS, quality >= 2 ? 16 : 8, quality >= 2 ? 0.9 : 1.8, -0.02, 0.30);
  const farL = buildGroundStrip(-46.0, -12.6, MAT.MOSS, 7, 4.0, -0.02, 0.16);
  const farR = buildGroundStrip(12.6, 46.0, MAT.MOSS, 7, 4.0, -0.02, 0.16);
  const bankGeo = new Geo(); bankGeo.merge(bankL); bankGeo.merge(bankR); bankGeo.merge(farL); bankGeo.merge(farR);
  const bankMesh = new Mesh(bankGeo);
  draws.push({ mesh: bankMesh, name: 'bank' });
  shadowDraws.push({ mesh: bankMesh });
  shadowDraws.push({ mesh: pathMesh });

  /* -------- kerb stones along the path edge -------- */
  const kerbGeo = roundedBox(0.20, 0.22, 0.55, 0.02, 1, { mat: MAT.GRANITE, uScale: 0.3, vScale: 0.5 });
  const kerbMesh = new Mesh(kerbGeo);
  const kerbInst = [];
  for (let tt = -2; tt < PATH_LEN + 6; tt += 0.62) {
    const P = pathPos(tt), R = pathRight(tt), T = pathTan(tt);
    const ry = Math.atan2(T[0], T[2]);
    for (const sgn of [-1, 1]) {
      const s = sgn * (1.40 + rnd() * 0.05);
      const m = M4.create();
      M4.compose(m, [P[0] + R[0] * s, P[1] + bankHeight(Math.abs(s)) - 0.06 + (rnd() - .5) * 0.02, P[2] + R[2] * s],
        ry + (rnd() - .5) * 0.09, [1, 0.85 + rnd() * 0.4, 1]);
      kerbInst.push({ m, tint: [0.85 + rnd() * 0.3, 0.85 + rnd() * 0.3, 0.85 + rnd() * 0.3, rnd()], t: tt });
    }
  }
  kerbMesh.setInstances(kerbInst);
  draws.push({ mesh: kerbMesh, name: 'kerb' });
  shadowDraws.push({ mesh: kerbMesh });

  /* -------- cedar trunks -------- */
  const trunkMesh = new Mesh(buildTrunk(detail));
  const trunkLow = new Mesh(buildTrunk(false));
  const trunkInst = [];
  for (let tt = -16; tt < PATH_LEN + 30; tt += 1.05) {
    for (const sgn of [-1, 1]) {
      if (rnd() > 0.72) continue;
      const s = sgn * (2.15 + Math.pow(rnd(), 0.8) * 22.0);
      const P = pathPos(tt + (rnd() - .5) * 2.2), R = pathRight(tt);
      const m = M4.create();
      const sc = 0.7 + rnd() * 0.75;
      M4.compose(m, [P[0] + R[0] * s, P[1] + bankHeight(Math.abs(s)) - 0.25, P[2] + R[2] * s],
        rnd() * TAU, [sc, sc * (0.8 + rnd() * 0.5), sc], (rnd() - .5) * 0.09, (rnd() - .5) * 0.09);
      trunkInst.push({ m, tint: [0.8 + rnd() * 0.45, 0.8 + rnd() * 0.4, 0.8 + rnd() * 0.4, rnd()], t: tt });
    }
  }
  trunkMesh.setInstances(trunkInst); trunkLow.setInstances(trunkInst);
  draws.push({ mesh: trunkMesh, name: 'trunks' });
  shadowDraws.push({ mesh: trunkLow });

  /* -------- canopy overhead : closes the sky and breaks the light -------- */
  const canopyMesh = new Mesh(buildCanopyClump(4711, detail ? 9 : 5));
  const canopyInst = [];
  const canopyCount = quality >= 2 ? 1150 : 480;
  for (let i = 0; i < canopyCount; i++) {
    const tt = -16 + rnd() * (PATH_LEN + 40);
    const s = (rnd() - 0.5) * 40.0;
    const P = pathPos(tt), Rp = pathRight(tt);
    const base = P[1] + bankHeight(Math.abs(s));
    // hug the corridor: lower over the path, higher out on the slopes
    const hgt = base + 5.0 + rnd() * 9.0 + Math.abs(s) * 0.32;
    const m = M4.create();
    const sc = 1.0 + rnd() * 1.9;
    M4.compose(m, [P[0] + Rp[0] * s, hgt, P[2] + Rp[2] * s], rnd() * TAU,
      [sc, sc * (0.75 + rnd() * 0.6), sc], (rnd() - .5) * 0.4, (rnd() - .5) * 0.4);
    canopyInst.push({ m, tint: [0.55 + rnd() * 0.75, 0.65 + rnd() * 0.6, 0.5 + rnd() * 0.6, rnd()], t: tt });
  }
  canopyMesh.setInstances(canopyInst);
  draws.push({ mesh: canopyMesh, name: 'canopy', alphaMask: 1, wind: 0.012, twoSided: true, normalStrength: 0.0 });
  shadowDraws.push({ mesh: canopyMesh, alphaMask: 1, wind: 0.012, twoSided: true });

  /* -------- undergrowth -------- */
  const fernMesh = new Mesh(buildFernClump());
  const fernInst = [];
  const fernCount = quality >= 2 ? 1500 : 600;
  for (let i = 0; i < fernCount; i++) {
    const tt = -6 + rnd() * (PATH_LEN + 20);
    const sgn = rnd() < 0.5 ? -1 : 1;
    const s = sgn * (1.95 + Math.pow(rnd(), 0.7) * 10.0);
    const P = pathPos(tt), R = pathRight(tt);
    const m = M4.create();
    const sc = 0.6 + rnd() * 0.9;
    M4.compose(m, [P[0] + R[0] * s, P[1] + bankHeight(Math.abs(s)) - 0.04, P[2] + R[2] * s],
      rnd() * TAU, [sc, sc * (0.8 + rnd() * 0.6), sc]);
    fernInst.push({ m, tint: [0.6 + rnd() * 0.7, 0.75 + rnd() * 0.5, 0.55 + rnd() * 0.5, rnd()], t: tt });
  }
  fernMesh.setInstances(fernInst);
  draws.push({ mesh: fernMesh, name: 'ferns', alphaMask: 1, wind: 0.05, twoSided: true });
  shadowDraws.push({ mesh: fernMesh, alphaMask: 1, wind: 0.05, twoSided: true });

  /* -------- fallen leaves -------- */
  const leafMesh = new Mesh(buildLeaf());
  const leafInst = [];
  const leafCount = quality >= 2 ? 2400 : 900;
  for (let i = 0; i < leafCount; i++) {
    const tt = -4 + rnd() * (PATH_LEN + 14);
    const s = (rnd() - 0.5) * 9.0;
    const onPath = Math.abs(s) < 1.4;
    if (onPath && rnd() > 0.35) continue;
    const P = pathPos(tt), R = pathRight(tt);
    const m = M4.create();
    const sc = 0.7 + rnd() * 0.9;
    M4.compose(m, [P[0] + R[0] * s, P[1] + bankHeight(Math.abs(s)) + 0.012, P[2] + R[2] * s],
      rnd() * TAU, [sc, 1, sc], (rnd() - .5) * 0.5, (rnd() - .5) * 0.5);
    const br = 0.5 + rnd() * 0.9;
    leafInst.push({ m, tint: [br * 1.35, br * 0.85, br * 0.5, rnd()], t: tt });
  }
  leafMesh.setInstances(leafInst);
  draws.push({ mesh: leafMesh, name: 'leaves', twoSided: true });

  /* -------- stone lanterns -------- */
  const lanternMesh = new Mesh(buildLantern(detail));
  const lanternInst = [];
  const lanternTs = [6.5, 23.0, 41.5, 58.0, 76.5, 95.0, 112.0];
  for (let i = 0; i < lanternTs.length; i++) {
    const tt = lanternTs[i];
    const sgn = i % 2 === 0 ? -1 : 1;
    const s = sgn * 2.15;
    const P = pathPos(tt), R = pathRight(tt), T = pathTan(tt);
    const wx = P[0] + R[0] * s, wz = P[2] + R[2] * s, wy = P[1] + bankHeight(Math.abs(s)) - 0.05;
    const m = M4.create();
    M4.compose(m, [wx, wy, wz], Math.atan2(T[0], T[2]) + (rnd() - .5) * 0.3, [1, 1, 1]);
    lanternInst.push({ m, tint: [0.9 + rnd() * 0.2, 0.9 + rnd() * 0.2, 0.9 + rnd() * 0.2, rnd()], t: tt });
    lights.push({ pos: [wx, wy + 1.27, wz], radius: 6.2, color: [1.0, 0.60, 0.26], intensity: 3.4, flicker: rnd() * 10 });
  }
  lanternMesh.setInstances(lanternInst);
  draws.push({ mesh: lanternMesh, name: 'lanterns' });
  shadowDraws.push({ mesh: lanternMesh });

  /* glowing lantern cores */
  const coreGeo = roundedBox(0.16, 0.26, 0.16, 0.05, 2, { mat: MAT.PLASTER });
  const coreMesh = new Mesh(coreGeo);
  coreMesh.setInstances(lanternInst.map((li, i) => {
    const m = M4.create(); m.set(li.m);
    m[13] += 1.27;
    return { m, tint: [1, 1, 1, i], t: li.t };
  }));
  draws.push({ mesh: coreMesh, name: 'cores', emissive: [3.6, 1.55, 0.55] });

  /* -------- fox statues at the entrance -------- */
  const foxMesh = new Mesh(buildFox());
  const foxInst = [];
  for (const [tt, sgn] of [[0.2, -1], [0.2, 1]]) {
    const P = pathPos(tt), R = pathRight(tt), T = pathTan(tt);
    const s = sgn * 2.45;
    const m = M4.create();
    M4.compose(m, [P[0] + R[0] * s, P[1] + bankHeight(Math.abs(s)) - 0.06, P[2] + R[2] * s],
      Math.atan2(T[0], T[2]) + PI + sgn * 0.22, [1, 1, 1]);
    foxInst.push({ m, tint: [1, 1, 1, 0.3] });
  }
  foxMesh.setInstances(foxInst);
  draws.push({ mesh: foxMesh, name: 'fox' });
  shadowDraws.push({ mesh: foxMesh });

  return { draws, shadowDraws, lights, toriiCount: inst.length };
}

/* ==== d_render.js ==== */
/* =========================================================================
   RENDERER : passes, camera, controls, main loop
   ========================================================================= */

/* ---------------- camera ---------------- */
const CAM = {

  fov: 46 * PI / 180,
  near: 0.06, far: 320,
  t: 3.0,           // param along path for auto walk
  view: M4.create(), proj: M4.create(), viewProj: M4.create(),
  prevViewProj: M4.create(), invViewProj: M4.create(), invProj: M4.create(),
  projNoJitter: M4.create(),
};

const HALTON2 = [0.5, 0.25, 0.75, 0.125, 0.625, 0.375, 0.875, 0.0625];
const HALTON3 = [0.3333, 0.6667, 0.1111, 0.4444, 0.7778, 0.2222, 0.5556, 0.8889];

/* ---------------- programs ---------------- */
function initPrograms() {

/* ---------------- material texture arrays ---------------- */
const NUM_LAYERS = 8;
function bakeMaterials(res) {
  const arrA = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D_ARRAY, arrA);
  const mips = Math.floor(Math.log2(res)) + 1;
  gl.texStorage3D(gl.TEXTURE_2D_ARRAY, mips, gl.SRGB8_ALPHA8, res, res, NUM_LAYERS);
  const arrB = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D_ARRAY, arrB);
  gl.texStorage3D(gl.TEXTURE_2D_ARRAY, mips, gl.RGBA8, res, res, NUM_LAYERS);

  const fb = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
  gl.drawBuffers([gl.COLOR_ATTACHMENT0, gl.COLOR_ATTACHMENT1]);
  gl.viewport(0, 0, res, res);
  gl.disable(gl.DEPTH_TEST);
  const p = use(R.prog.bake);
  u1f(p, 'uRes', res);
  for (let i = 0; i < NUM_LAYERS; i++) {
    gl.framebufferTextureLayer(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, arrA, 0, i);
    gl.framebufferTextureLayer(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT1, arrB, 0, i);
    u1i(p, 'uLayer', i);
    drawFS();
  }
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.deleteFramebuffer(fb);

  for (const t of [arrA, arrB]) {
    gl.bindTexture(gl.TEXTURE_2D_ARRAY, t);
    gl.generateMipmap(gl.TEXTURE_2D_ARRAY);
    gl.texParameteri(gl.TEXTURE_2D_ARRAY, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
    gl.texParameteri(gl.TEXTURE_2D_ARRAY, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D_ARRAY, gl.TEXTURE_WRAP_S, gl.REPEAT);
    gl.texParameteri(gl.TEXTURE_2D_ARRAY, gl.TEXTURE_WRAP_T, gl.REPEAT);
    const ext = gl.getExtension('EXT_texture_filter_anisotropic');
    if (ext) gl.texParameterf(gl.TEXTURE_2D_ARRAY, ext.TEXTURE_MAX_ANISOTROPY_EXT,
      Math.min(8, gl.getParameter(ext.MAX_TEXTURE_MAX_ANISOTROPY_EXT)));
  }
  R.matA = arrA; R.matB = arrB;
}

/* ---------------- sky / IBL ---------------- */
function makeCube(size, mips) {
  const t = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_CUBE_MAP, t);
  gl.texStorage2D(gl.TEXTURE_CUBE_MAP, mips, gl.RGBA16F, size, size);
  gl.texParameteri(gl.TEXTURE_CUBE_MAP, gl.TEXTURE_MIN_FILTER, mips > 1 ? gl.LINEAR_MIPMAP_LINEAR : gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_CUBE_MAP, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_CUBE_MAP, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_CUBE_MAP, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  return { tex: t, size, mips };
}

function sunDirection() {
  const e = CFG.sunElev, a = CFG.sunAzimuth;
  return norm([Math.cos(e) * Math.sin(a), Math.sin(e), Math.cos(e) * Math.cos(a)]);
}

function bakeSky() {
  const sd = sunDirection();
  const SKY = R.skyCube, IRR = R.irrCube, PRE = R.prefCube;
  const fb = R.cubeFB || (R.cubeFB = gl.createFramebuffer());
  gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
  gl.disable(gl.DEPTH_TEST);
  gl.drawBuffers([gl.COLOR_ATTACHMENT0]);

  let p = use(R.prog.skycube);
  u3f(p, 'uSunDir', sd[0], sd[1], sd[2]);
  u1f(p, 'uSkyExposure', 1.0);
  gl.viewport(0, 0, SKY.size, SKY.size);
  for (let f = 0; f < 6; f++) {
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_CUBE_MAP_POSITIVE_X + f, SKY.tex, 0);
    u1i(p, 'uFace', f);
    drawFS();
  }
  gl.bindTexture(gl.TEXTURE_CUBE_MAP, SKY.tex);
  gl.generateMipmap(gl.TEXTURE_CUBE_MAP);

  p = use(R.prog.irr);
  tex(p, 'uEnv', 0, SKY.tex, gl.TEXTURE_CUBE_MAP);
  gl.viewport(0, 0, IRR.size, IRR.size);
  for (let f = 0; f < 6; f++) {
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_CUBE_MAP_POSITIVE_X + f, IRR.tex, 0);
    u1i(p, 'uFace', f);
    drawFS();
  }

  p = use(R.prog.pref);
  tex(p, 'uEnv', 0, SKY.tex, gl.TEXTURE_CUBE_MAP);
  u1f(p, 'uSrcSize', SKY.size);
  for (let mip = 0; mip < PRE.mips; mip++) {
    const s = PRE.size >> mip;
    gl.viewport(0, 0, s, s);
    u1f(p, 'uRough', mip / (PRE.mips - 1));
    for (let f = 0; f < 6; f++) {
      gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_CUBE_MAP_POSITIVE_X + f, PRE.tex, mip);
      u1i(p, 'uFace', f);
      drawFS();
    }
  }
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.enable(gl.DEPTH_TEST);
  R.skyDirty = false;
}

/* ---------------- shadow maps ---------------- */
const SHADOW_SPLITS = [0.1, 11.0, 34.0, 105.0];
function makeShadowRT(size) {
  const t = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texStorage2D(gl.TEXTURE_2D, 1, gl.DEPTH_COMPONENT24, size, size);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_COMPARE_MODE, gl.COMPARE_REF_TO_TEXTURE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_COMPARE_FUNC, gl.LEQUAL);
  const fb = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.DEPTH_ATTACHMENT, gl.TEXTURE_2D, t, 0);
  gl.drawBuffers([gl.NONE]);
  gl.readBuffer(gl.NONE);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  return { tex: t, fb, size };
}

function computeCascade(idx, sunDir) {
  const n = SHADOW_SPLITS[idx], f = SHADOW_SPLITS[idx + 1];
  const aspect = R.w / R.h;
  const tanY = Math.tan(CAM.fov / 2), tanX = tanY * aspect;
  // frustum corners in view space, then to world
  const inv = M4.create(); M4.invert(inv, CAM.view);
  const pts = [];
  for (const d of [n, f]) for (const sy of [-1, 1]) for (const sx of [-1, 1]) {
    const v = [sx * tanX * d, sy * tanY * d, -d, 1];
    pts.push([
      inv[0] * v[0] + inv[4] * v[1] + inv[8] * v[2] + inv[12],
      inv[1] * v[0] + inv[5] * v[1] + inv[9] * v[2] + inv[13],
      inv[2] * v[0] + inv[6] * v[1] + inv[10] * v[2] + inv[14]
    ]);
  }
  let c = [0, 0, 0];
  for (const p of pts) { c[0] += p[0]; c[1] += p[1]; c[2] += p[2]; }
  c = scl(c, 1 / pts.length);
  let radius = 0;
  for (const p of pts) radius = Math.max(radius, dist(p, c));
  radius = Math.ceil(radius * 16) / 16;

  const size = R.shadow[idx].size;
  const texelSize = radius * 2 / size;
  c = [Math.floor(c[0] / texelSize) * texelSize, Math.floor(c[1] / texelSize) * texelSize, Math.floor(c[2] / texelSize) * texelSize];

  const eye = add(c, scl(sunDir, radius + 40));
  const up = Math.abs(sunDir[1]) > 0.98 ? [0, 0, 1] : [0, 1, 0];
  const view = M4.create(); M4.lookAt(view, eye, c, up);
  const proj = M4.create(); M4.ortho(proj, -radius, radius, -radius, radius, 0.2, radius * 2 + 90);
  const vp = M4.create(); M4.mul(vp, proj, view);
  return vp;
}

/* ---------------- render targets ---------------- */
function allocTargets(w, h) {
  R.w = w; R.h = h;
  const hw = Math.max(1, w >> 1), hh = Math.max(1, h >> 1);
  const del = k => { if (R.rt[k]) { gl.deleteFramebuffer(R.rt[k].fb); for (const t of R.rt[k].texs) gl.deleteTexture(t); if (R.rt[k].depth) gl.deleteTexture(R.rt[k].depth); } };
  for (const k in R.rt) del(k);
  R.rt = {};
  R.rt.gbuf = makeRT(w, h, { count: 3, formats: ['rgba8', 'rgba16f', 'rgba16f'], depth: true });
  R.rt.hdr = makeRT(w, h, { format: 'rgba16f' });
  R.rt.hdr2 = makeRT(w, h, { format: 'rgba16f' });
  R.rt.taa = makeRT(w, h, { format: 'rgba16f' });
  R.rt.hist = makeRT(w, h, { format: 'rgba16f' });
  R.rt.ao = makeRT(hw, hh, { format: 'r8' });
  R.rt.ao2 = makeRT(hw, hh, { format: 'r8' });
  R.rt.ssr = makeRT(hw, hh, { format: 'rgba16f' });
  R.rt.ssr2 = makeRT(hw, hh, { format: 'rgba16f' });
  R.rt.vol = makeRT(hw, hh, { format: 'rgba16f' });
  R.rt.vol2 = makeRT(hw, hh, { format: 'rgba16f' });
  R.rt.dof = makeRT(w, h, { format: 'rgba16f' });
  R.rt.ldr = makeRT(w, h, { format: 'rgba8' });
  R.bloom = [];
  let bw = w >> 1, bh = h >> 1;
  for (let i = 0; i < 6 && bw > 8 && bh > 8; i++) {
    R.bloom.push({ a: makeRT(bw, bh, { format: 'rgba16f' }), b: makeRT(bw, bh, { format: 'rgba16f' }), w: bw, h: bh });
    bw >>= 1; bh >>= 1;
  }
  R.histValid = false;
}

/* ---------------- passes ---------------- */
R.only = null;
R.debugView = null;
R.cullView = 78;
R.cullShadow = 62;
function drawGeometry(prog, list, isShadow) {
  for (const d of list) {
    if (R.only && d.name && d.name !== R.only) continue;
    u1i(prog, 'uInstanced', d.mesh.instances ? 1 : 0);
    u1i(prog, 'uAlphaMask', d.alphaMask ? 1 : 0);
    u1f(prog, 'uWind', d.wind || 0);
    if (!isShadow) {
      u1i(prog, 'uDecalMode', d.decal ? 1 : 0);
      const e = d.emissive || [0, 0, 0];
      u3f(prog, 'uEmissive', e[0], e[1], e[2]);
      u1f(prog, 'uNormalStrength', d.normalStrength === undefined ? 1.0 : d.normalStrength);
    }
    if (!d.mesh.instances) umat(prog, 'uModel', IDENT);
    if (d.twoSided) gl.disable(gl.CULL_FACE); else gl.enable(gl.CULL_FACE);
    d.mesh.draw(CAM.t, isShadow ? R.cullShadow : R.cullView);
  }
  gl.enable(gl.CULL_FACE);
}
const IDENT = M4.create();

function renderFrame(dt) {
  const S = R.scene;
  R.groundY = groundHeightAt(CAM.pos[0], CAM.pos[2]).y;
  const sd = sunDirection();
  if (R.skyDirty) bakeSky();

  /* ---- shadows ---- */
  gl.enable(gl.DEPTH_TEST);
  gl.depthFunc(gl.LEQUAL);
  gl.enable(gl.CULL_FACE);
  gl.cullFace(gl.BACK);
  const p_sh = use(R.prog.shadow);
  u1f(p_sh, 'uTime', R.time);
  tex(p_sh, 'uMatB', 1, R.matB, gl.TEXTURE_2D_ARRAY);
  for (let i = 0; i < 3; i++) {
    R.cascadeVP[i] = computeCascade(i, sd);
    gl.bindFramebuffer(gl.FRAMEBUFFER, R.shadow[i].fb);
    gl.viewport(0, 0, R.shadow[i].size, R.shadow[i].size);
    gl.clear(gl.DEPTH_BUFFER_BIT);
    umat(p_sh, 'uLightVP', R.cascadeVP[i]);
    gl.enable(gl.POLYGON_OFFSET_FILL);
    gl.polygonOffset(1.6, 3.0);
    drawGeometry(p_sh, S.shadowDraws, true);
    gl.disable(gl.POLYGON_OFFSET_FILL);
  }

  /* ---- gbuffer ---- */
  bindRT(R.rt.gbuf);
  gl.clearColor(0, 0, 0, 0);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  const p_g = use(R.prog.gbuf);
  umat(p_g, 'uViewProj', CAM.viewProj);
  u1f(p_g, 'uTime', R.time);
  u3f(p_g, 'uCamPos', CAM.pos[0], CAM.pos[1], CAM.pos[2]);
  u1f(p_g, 'uWetness', CFG.wetness);
  tex(p_g, 'uMatA', 0, R.matA, gl.TEXTURE_2D_ARRAY);
  tex(p_g, 'uMatB', 1, R.matB, gl.TEXTURE_2D_ARRAY);
  tex(p_g, 'uDecal', 2, R.decalTex);
  drawGeometry(p_g, S.draws, false);

  gl.disable(gl.DEPTH_TEST);

  /* ---- AO ---- */
  if (CFG.ao) {
    bindRT(R.rt.ao);
    const p = use(R.prog.ao);
    tex(p, 'uDepth', 0, R.rt.gbuf.depth);
    tex(p, 'uGN', 1, R.rt.gbuf.texs[1]);
    umat(p, 'uInvProj', CAM.invProj);
    umat(p, 'uView', CAM.view);
    umat(p, 'uInvViewProj', CAM.invViewProj);
    u2f(p, 'uNearFar', CAM.near, CAM.far);
    u1f(p, 'uRadius', 0.42);
    u1f(p, 'uIntensity', 1.45);
    u2f(p, 'uRes', R.rt.ao.w, R.rt.ao.h);
    u1f(p, 'uTime', R.time);
    drawFS();
    // bilateral blur
    const pb = use(R.prog.blur);
    tex(pb, 'uDepthT', 1, R.rt.gbuf.depth);
    bindRT(R.rt.ao2); tex(pb, 'uTex', 0, R.rt.ao.tex);
    u2f(pb, 'uDir', 1, 0); u2f(pb, 'uTexel', 1 / R.rt.ao.w, 1 / R.rt.ao.h); drawFS();
    bindRT(R.rt.ao); tex(pb, 'uTex', 0, R.rt.ao2.tex);
    u2f(pb, 'uDir', 0, 1); drawFS();
  } else {
    bindRT(R.rt.ao); gl.clearColor(1, 1, 1, 1); gl.clear(gl.COLOR_BUFFER_BIT);
  }

  /* ---- deferred lighting ---- */
  bindRT(R.rt.hdr);
  const p_l = use(R.prog.light);
  tex(p_l, 'uGA', 0, R.rt.gbuf.texs[0]);
  tex(p_l, 'uGN', 1, R.rt.gbuf.texs[1]);
  tex(p_l, 'uGE', 2, R.rt.gbuf.texs[2]);
  tex(p_l, 'uDepth', 3, R.rt.gbuf.depth);
  tex(p_l, 'uIrr', 4, R.irrCube.tex, gl.TEXTURE_CUBE_MAP);
  tex(p_l, 'uPref', 5, R.prefCube.tex, gl.TEXTURE_CUBE_MAP);
  tex(p_l, 'uAO', 6, R.rt.ao.tex);
  tex(p_l, 'uSh0', 7, R.shadow[0].tex);
  tex(p_l, 'uSh1', 8, R.shadow[1].tex);
  tex(p_l, 'uSh2', 9, R.shadow[2].tex);
  tex(p_l, 'uSky', 10, R.skyCube.tex, gl.TEXTURE_CUBE_MAP);
  umat(p_l, 'uInvViewProj', CAM.invViewProj);
  umat(p_l, 'uInvProj', CAM.invProj);
  umat(p_l, 'uView', CAM.view);
  umat(p_l, 'uShVP0', R.cascadeVP[0]);
  umat(p_l, 'uShVP1', R.cascadeVP[1]);
  umat(p_l, 'uShVP2', R.cascadeVP[2]);
  u3f(p_l, 'uCamPos', CAM.pos[0], CAM.pos[1], CAM.pos[2]);
  u2f(p_l, 'uNearFar', CAM.near, CAM.far);
  u3f(p_l, 'uSunDir', sd[0], sd[1], sd[2]);
  u3v(p_l, 'uSunColor', R.sunColor);
  u3v(p_l, 'uBounce', R.bounce);
  u3v(p_l, 'uAmbTint', R.ambTint);
  u3v(p_l, 'uHazeColor', R.fogColor);
  u1f(p_l, 'uHazeAmt', 0.86);
  u1f(p_l, 'uPrefMips', R.prefCube.mips);
  u1f(p_l, 'uAmbient', R.ambient);
  u1f(p_l, 'uTime', R.time);
  u1i(p_l, 'uShadowQuality', R.quality);
  u2f(p_l, 'uShadowTexel', 1 / R.shadow[0].size, 1 / R.shadow[0].size);
  // lights
  const lp = new Float32Array(64), lc = new Float32Array(64);
  const nL = Math.min(S.lights.length, 16);
  for (let i = 0; i < nL; i++) {
    const L = S.lights[i];
    const fl = 0.86 + 0.14 * Math.sin(R.time * 3.1 + L.flicker) + 0.06 * Math.sin(R.time * 8.7 + L.flicker * 2.3);
    lp.set([L.pos[0], L.pos[1], L.pos[2], L.radius], i * 4);
    lc.set([L.color[0], L.color[1], L.color[2], L.intensity * fl], i * 4);
  }
  u1i(p_l, 'uNumLights', nL);
  u4v(p_l, 'uLightPos', lp);
  u4v(p_l, 'uLightCol', lc);
  drawFS();

  /* ---- SSR ---- */
  if (CFG.ssr > 0) {
    bindRT(R.rt.ssr);
    const p = use(R.prog.ssr);
    tex(p, 'uColor', 0, R.rt.hdr.tex);
    tex(p, 'uDepth', 1, R.rt.gbuf.depth);
    tex(p, 'uGN', 2, R.rt.gbuf.texs[1]);
    umat(p, 'uInvProj', CAM.invProj);
    umat(p, 'uInvViewProj', CAM.invViewProj);
    umat(p, 'uView', CAM.view);
    umat(p, 'uProj', CAM.projNoJitter);
    u2f(p, 'uNearFar', CAM.near, CAM.far);
    u3f(p, 'uCamPos', CAM.pos[0], CAM.pos[1], CAM.pos[2]);
    u2f(p, 'uRes', R.rt.ssr.w, R.rt.ssr.h);
    u1f(p, 'uTime', R.time);
    u1f(p, 'uMaxRough', 0.72);
    drawFS();
    const pb = use(R.prog.blur);
    tex(pb, 'uDepthT', 1, R.rt.gbuf.depth);
    bindRT(R.rt.ssr2); tex(pb, 'uTex', 0, R.rt.ssr.tex);
    u2f(pb, 'uDir', 1, 0); u2f(pb, 'uTexel', 1 / R.rt.ssr.w, 1 / R.rt.ssr.h); drawFS();
    bindRT(R.rt.ssr); tex(pb, 'uTex', 0, R.rt.ssr2.tex);
    u2f(pb, 'uDir', 0, 1); drawFS();
  } else { bindRT(R.rt.ssr); gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT); }

  /* ---- volumetric ---- */
  if (CFG.volumetric) {
    bindRT(R.rt.vol);
    const p = use(R.prog.vol);
    tex(p, 'uDepth', 0, R.rt.gbuf.depth);
    tex(p, 'uSh0', 1, R.shadow[0].tex);
    tex(p, 'uSh1', 2, R.shadow[1].tex);
    tex(p, 'uSh2', 3, R.shadow[2].tex);
    umat(p, 'uInvViewProj', CAM.invViewProj);
    umat(p, 'uInvProj', CAM.invProj);
    umat(p, 'uView', CAM.view);
    umat(p, 'uShVP0', R.cascadeVP[0]);
    umat(p, 'uShVP1', R.cascadeVP[1]);
    umat(p, 'uShVP2', R.cascadeVP[2]);
    u3f(p, 'uCamPos', CAM.pos[0], CAM.pos[1], CAM.pos[2]);
    u2f(p, 'uNearFar', CAM.near, CAM.far);
    u3f(p, 'uSunDir', sd[0], sd[1], sd[2]);
    u3v(p, 'uSunColor', R.sunColor);
    u3v(p, 'uAmbientFog', R.fogColor);
    u1f(p, 'uTime', R.time);
    u1f(p, 'uDensity', CFG.volDensity);
    u1f(p, 'uFogHeight', R.groundY + 0.55);
    u1f(p, 'uAnisotropy', 0.46);
    u1i(p, 'uSteps', R.quality >= 2 ? 40 : 20);
    drawFS();
    const pb = use(R.prog.blur);
    tex(pb, 'uDepthT', 1, R.rt.gbuf.depth);
    bindRT(R.rt.vol2); tex(pb, 'uTex', 0, R.rt.vol.tex);
    u2f(pb, 'uDir', 1, 0); u2f(pb, 'uTexel', 1 / R.rt.vol.w, 1 / R.rt.vol.h); drawFS();
    bindRT(R.rt.vol); tex(pb, 'uTex', 0, R.rt.vol2.tex);
    u2f(pb, 'uDir', 0, 1); drawFS();
  } else { bindRT(R.rt.vol); gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT); }

  /* ---- composite ---- */
  bindRT(R.rt.hdr2);
  const p_c = use(R.prog.comp);
  tex(p_c, 'uColor', 0, R.rt.hdr.tex);
  tex(p_c, 'uSSR', 1, R.rt.ssr.tex);
  tex(p_c, 'uVolume', 2, R.rt.vol.tex);
  tex(p_c, 'uDepth', 3, R.rt.gbuf.depth);
  tex(p_c, 'uGN', 4, R.rt.gbuf.texs[1]);
  tex(p_c, 'uGA', 5, R.rt.gbuf.texs[0]);
  tex(p_c, 'uPref', 6, R.prefCube.tex, gl.TEXTURE_CUBE_MAP);
  umat(p_c, 'uInvViewProj', CAM.invViewProj);
  umat(p_c, 'uInvProj', CAM.invProj);
  umat(p_c, 'uView', CAM.view);
  u3f(p_c, 'uCamPos', CAM.pos[0], CAM.pos[1], CAM.pos[2]);
  u2f(p_c, 'uNearFar', CAM.near, CAM.far);
  u3f(p_c, 'uSunDir', sd[0], sd[1], sd[2]);
  u3v(p_c, 'uSunColor', R.sunColor);
  u3v(p_c, 'uFogColor', R.fogColor);
  u3v(p_c, 'uFogColorSun', R.fogColorSun);
  u1f(p_c, 'uFogDensity', CFG.fogDensity);
  u1f(p_c, 'uFogHeight', R.groundY + 1.8);
  u1f(p_c, 'uSSRStrength', CFG.ssr);
  drawFS();

  /* ---- TAA ---- */
  let srcTex = R.rt.hdr2.tex;
  if (CFG.taa) {
    bindRT(R.rt.taa);
    const p = use(R.prog.taa);
    tex(p, 'uCur', 0, R.rt.hdr2.tex);
    tex(p, 'uHist', 1, R.histValid ? R.rt.hist.tex : R.rt.hdr2.tex);
    tex(p, 'uDepth', 2, R.rt.gbuf.depth);
    umat(p, 'uInvViewProj', CAM.invViewProj);
    umat(p, 'uPrevViewProj', CAM.prevViewProj);
    u2f(p, 'uTexel', 1 / R.w, 1 / R.h);
    u1f(p, 'uBlend', R.histValid ? 0.88 : 0.0);
    drawFS();
    // copy to history
    bindRT(R.rt.hist);
    const pb = use(R.prog.blit);
    tex(pb, 'uTex', 0, R.rt.taa.tex);
    drawFS();
    R.histValid = true;
    srcTex = R.rt.taa.tex;
  }

  /* ---- DOF ---- */
  if (CFG.dof) {
    bindRT(R.rt.dof);
    const p = use(R.prog.dof);
    tex(p, 'uTex', 0, srcTex);
    tex(p, 'uDepth', 1, R.rt.gbuf.depth);
    u2f(p, 'uNearFar', CAM.near, CAM.far);
    u2f(p, 'uTexel', 1 / R.w, 1 / R.h);
    u1f(p, 'uFocus', CFG.focusDist);
    u1f(p, 'uRange', 16.0);
    u1f(p, 'uMaxCoC', 5.0 * CFG.aperture * (R.h / 900));
    drawFS();
    srcTex = R.rt.dof.tex;
  }

  /* ---- bloom ---- */
  {
    const b0 = R.bloom[0];
    bindRT(b0.a);
    let p = use(R.prog.bright);
    tex(p, 'uTex', 0, srcTex);
    u1f(p, 'uThreshold', 1.55); u1f(p, 'uSoft', 0.65);
    drawFS();
    p = use(R.prog.down);
    for (let i = 1; i < R.bloom.length; i++) {
      bindRT(R.bloom[i].a);
      tex(p, 'uTex', 0, R.bloom[i - 1].a.tex);
      u2f(p, 'uTexel', 1 / R.bloom[i - 1].w, 1 / R.bloom[i - 1].h);
      drawFS();
    }
    p = use(R.prog.up);
    for (let i = R.bloom.length - 2; i >= 0; i--) {
      const src = (i === R.bloom.length - 2) ? R.bloom[i + 1].a : R.bloom[i + 1].b;
      bindRT(R.bloom[i].b);
      tex(p, 'uTex', 0, src.tex);
      tex(p, 'uPrev', 1, R.bloom[i].a.tex);
      u2f(p, 'uTexel', 1 / R.bloom[i + 1].w, 1 / R.bloom[i + 1].h);
      u1f(p, 'uScale', 0.82);
      drawFS();
    }
  }

  /* ---- final ---- */
  bindRT(R.rt.ldr);
  const p_f = use(R.prog.final);
  tex(p_f, 'uTex', 0, srcTex);
  tex(p_f, 'uBloom', 1, R.bloom.length > 1 ? R.bloom[0].b.tex : R.bloom[0].a.tex);
  u2f(p_f, 'uRes', R.w, R.h);
  u1f(p_f, 'uExposure', CFG.exposure);
  u1f(p_f, 'uBloomAmt', CFG.bloom);
  u1f(p_f, 'uVignette', CFG.vignette);
  u1f(p_f, 'uGrain', CFG.grain);
  u1f(p_f, 'uCA', CFG.ca);
  u1f(p_f, 'uTime', R.time);
  u1f(p_f, 'uSat', 1.10);
  u1f(p_f, 'uContrast', 1.07);
  u3v(p_f, 'uLift', R.lift);
  u3v(p_f, 'uGamma', R.gammaG);
  u3v(p_f, 'uGain', R.gain);
  drawFS();

  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, R.canvas.width, R.canvas.height);
  if (R.debugView) {
    const map = { ao: R.rt.ao.tex, ssr: R.rt.ssr.tex, vol: R.rt.vol.tex,
                  albedo: R.rt.gbuf.texs[0], normal: R.rt.gbuf.texs[1], extra: R.rt.gbuf.texs[2],
                  hdr: R.rt.hdr.tex, bloom: R.bloom[0].b.tex };
    const pd = use(R.prog.blit);
    tex(pd, 'uTex', 0, map[R.debugView] || R.rt.ao.tex);
    drawFS();
    return;
  }
  const p_x = use(CFG.taa ? R.prog.sharpen : R.prog.fxaa);
  tex(p_x, 'uTex', 0, R.rt.ldr.tex);
  u2f(p_x, 'uTexel', 1 / R.w, 1 / R.h);
  u1f(p_x, 'uAmount', 0.62);
  drawFS();
}

/* ---------------- lighting palette from sun elevation ---------------- */
function updateLightingPalette() {
  const e = CFG.sunElev;
  const k = smoothstep(-0.10, 0.30, e);
  // sun colour: deep orange at horizon -> warm white higher
  const warm = [1.00, 0.335, 0.105];
  const mid = [1.00, 0.70, 0.45];
  const t = smoothstep(0.0, 0.22, e);
  const c = [lerp(warm[0], mid[0], t), lerp(warm[1], mid[1], t), lerp(warm[2], mid[2], t)];
  const intensity = lerp(3.2, 8.0, smoothstep(-0.05, 0.25, e));
  R.sunColor = new Float32Array([c[0] * intensity, c[1] * intensity, c[2] * intensity]);
  R.ambient = lerp(0.24, 0.62, k);
  R.bounce = new Float32Array([0.062 * (1 - t * 0.4), 0.019, 0.009]);
  R.ambTint = new Float32Array([0.74, 0.90, 1.22]);
  R.fogColor = new Float32Array([0.055, 0.068, 0.098]);
  R.fogColorSun = new Float32Array([0.72, 0.40, 0.22]);
  R.lift = new Float32Array([0.010, 0.014, 0.028]);
  R.gammaG = new Float32Array([1.00, 1.00, 1.01]);
  R.gain = new Float32Array([1.03, 0.995, 0.965]);
  R.skyDirty = true;
}

/* ---------------- camera update ---------------- */
const KEYS = {};
let touchLook = null, joy = { active: false, x: 0, y: 0, id: -1 };

function groundHeightAt(x, z) {
  // find nearest path param by search (path is monotone in z)
  let t = z;
  for (let i = 0; i < 4; i++) {
    const P = pathPos(t);
    t += (z - P[2]) * 1.0;
  }
  const P = pathPos(t), Rt = pathRight(t);
  const s = (x - P[0]) * Rt[0] + (z - P[2]) * Rt[2];
  return { y: P[1] + bankHeight(Math.abs(s)), s, t };
}

function updateCamera(dt) {
  if (CFG.autoWalk) {
    CAM.t += dt * 0.85;
    if (CAM.t > PATH_LEN - 12) CAM.t = 2.0;
    const P = pathPos(CAM.t);
    const look = pathPos(CAM.t + 7);
    const bob = Math.sin(R.time * 2.6) * 0.017 + Math.sin(R.time * 5.1) * 0.006;
    const sway = Math.sin(R.time * 1.3) * 0.10;
    CAM.pos = [P[0] + sway * 0.3, P[1] + 1.62 + bob, P[2]];
    const d = norm(sub([look[0], look[1] + 1.35, look[2]], CAM.pos));
    CAM.yaw = Math.atan2(d[0], -d[2]) + Math.sin(R.time * 0.43) * 0.05;
    CAM.pitch = Math.asin(clamp(d[1], -1, 1)) + Math.sin(R.time * 0.31) * 0.012;
  } else {
    const spd = (KEYS['shift'] ? 3.6 : 1.55) * dt;
    let fx = 0, fz = 0;
    if (KEYS['w'] || KEYS['arrowup']) fz += 1;
    if (KEYS['s'] || KEYS['arrowdown']) fz -= 1;
    if (KEYS['a'] || KEYS['arrowleft']) fx -= 1;
    if (KEYS['d'] || KEYS['arrowright']) fx += 1;
    if (joy.active) { fx += joy.x; fz += -joy.y; }
    const l = Math.hypot(fx, fz);
    if (l > 1) { fx /= l; fz /= l; }
    const sy = Math.sin(CAM.yaw), cy = Math.cos(CAM.yaw);
    CAM.pos[0] += (-sy * fz + cy * fx) * spd;
    CAM.pos[2] += (-cy * fz - sy * fx) * spd;
    const g = groundHeightAt(CAM.pos[0], CAM.pos[2]);
    // soft corridor constraint
    if (Math.abs(g.s) > 1.15) {
      const k = (Math.abs(g.s) - 1.15) * Math.sign(g.s);
      const Rt = pathRight(g.t);
      CAM.pos[0] -= Rt[0] * k * 0.5; CAM.pos[2] -= Rt[2] * k * 0.5;
    }
    const gy = groundHeightAt(CAM.pos[0], CAM.pos[2]).y;
    CAM.pos[1] += (gy + 1.62 - CAM.pos[1]) * Math.min(1, dt * 9);
    CAM.t = g.t;
  }
  CAM.pitch = clamp(CAM.pitch, -1.25, 1.25);

  const dir = [Math.sin(CAM.yaw) * Math.cos(CAM.pitch), Math.sin(CAM.pitch), -Math.cos(CAM.yaw) * Math.cos(CAM.pitch)];
  M4.copy(CAM.prevViewProj, CAM.viewProj);
  M4.lookAt(CAM.view, CAM.pos, add(CAM.pos, dir), [0, 1, 0]);
  M4.perspective(CAM.projNoJitter, CAM.fov, R.w / R.h, CAM.near, CAM.far);
  M4.copy(CAM.proj, CAM.projNoJitter);
  if (CFG.taa) {
    const i = R.jitterIdx % 8;
    const jx = (HALTON2[i] - 0.5) * 2 / R.w;
    const jy = (HALTON3[i] - 0.5) * 2 / R.h;
    CAM.proj[8] += jx; CAM.proj[9] += jy;
    R.jitterIdx++;
  }
  M4.mul(CAM.viewProj, CAM.proj, CAM.view);
  M4.invert(CAM.invViewProj, CAM.viewProj);
  M4.invert(CAM.invProj, CAM.proj);

  // autofocus: distance to what is straight ahead, smoothed
  if (CFG.dof) {
    const g = groundHeightAt(CAM.pos[0] + dir[0] * 8, CAM.pos[2] + dir[2] * 8);
    const target = 9.5;
    CFG.focusDist += (target - CFG.focusDist) * Math.min(1, dt * 2);
  }
}

/* ==== e_main.js ==== */
/* =========================================================================
   MAIN : boot, input, UI
   ========================================================================= */

const QUALITY = [
  { name: '低', scale: 0.62, shadow: 1024, mat: 512, ao: true, ssr: false, vol: true, taa: true, dof: false },
  { name: '中', scale: 0.82, shadow: 1536, mat: 512, ao: true, ssr: true, vol: true, taa: true, dof: true },
  { name: '高', scale: 1.00, shadow: 2048, mat: 1024, ao: true, ssr: true, vol: true, taa: true, dof: true },
];

/* vertical donor inscriptions, drawn to a 4x2 atlas (col = variant, row = pillar side) */
const INSCRIPTIONS = [
  ['奉納', '株式會社 山邑商店', '令和五年三月吉日'],
  ['奉納', '伏見 中村 光雄', '平成三十一年二月'],
  ['奉納', '有限會社 藤田運送', '令和二年十一月吉日'],
  ['奉納', '京都 小林 志づ', '平成二十七年九月'],
  ['奉納', '大阪 森下製作所', '令和四年五月吉日'],
  ['奉納', '神戸 岡本 清一郎', '平成二十四年十月'],
  ['奉納', '宇治 白川屋本店', '令和元年七月吉日'],
  ['奉納', '東京 渡邊 とみ子', '平成二十二年四月'],
];
function makeInscriptionAtlas() {
  const CW = 256, CH = 512;                 // cell
  const cv = document.createElement('canvas');
  cv.width = CW * 4; cv.height = CH * 2;
  const c = cv.getContext('2d');
  c.clearRect(0, 0, cv.width, cv.height);
  const fonts = '"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP","Noto Sans CJK JP","Noto Sans JP","MS Mincho",serif';
  for (let row = 0; row < 2; row++) for (let col = 0; col < 4; col++) {
    const set = INSCRIPTIONS[row * 4 + col];
    // row 0 = donor name (right-hand column of the pair), row 1 = date
    const text = row === 0 ? set[1] : set[2];
    const head = row === 0 ? set[0] : '';
    const ox = col * CW, oy = row * CH;
    c.save();
    c.translate(ox, oy);
    c.fillStyle = '#000';
    c.textAlign = 'center';
    c.textBaseline = 'middle';
    let y = 34;
    if (head) {
      c.font = '700 60px ' + fonts;
      for (const ch of head) { c.fillText(ch, CW * 0.5, y); y += 64; }
      y += 22;
    }
    const size = text.length > 8 ? 44 : 52;
    c.font = '600 ' + size + 'px ' + fonts;
    const step = size * 1.08;
    for (const ch of text) {
      if (y > CH - 20) break;
      c.fillText(ch, CW * 0.5, y);
      y += step;
    }
    c.restore();
  }
  // weather the ink a little
  const img = c.getImageData(0, 0, cv.width, cv.height);
  const d = img.data;
  for (let i = 0; i < d.length; i += 4) {
    const x = (i / 4) % cv.width, yy = Math.floor((i / 4) / cv.width);
    const n = (Math.sin(x * 0.7) * Math.sin(yy * 0.53) + Math.sin(x * 0.13 + yy * 0.21)) * 0.5;
    d[i + 3] = clamp(d[i + 3] * (0.82 + 0.3 * n), 0, 255);
  }
  c.putImageData(img, 0, 0);
  const t = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, t);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, cv);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
  gl.generateMipmap(gl.TEXTURE_2D);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  R.decalTex = t;
  R.decalCanvas = cv;
}

function isMobile() {
  return /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) ||
    (navigator.maxTouchPoints > 1 && Math.min(screen.width, screen.height) < 900);
}

function resize() {
  const q = QUALITY[R.quality];
  const dpr = Math.min(window.devicePixelRatio || 1, isMobile() ? 2.0 : 2.0);
  const cw = R.canvas.clientWidth || window.innerWidth;
  const ch = R.canvas.clientHeight || window.innerHeight;
  const w = Math.max(320, Math.round(cw * dpr * q.scale * R.userScale));
  const h = Math.max(200, Math.round(ch * dpr * q.scale * R.userScale));
  R.canvas.width = Math.round(cw * dpr);
  R.canvas.height = Math.round(ch * dpr);
  if (w !== R.w || h !== R.h) allocTargets(w, h);
}

function applyQuality(qi, rebuildShadows) {
  R.quality = qi;
  const q = QUALITY[qi];
  CFG.ao = q.ao; CFG.ssr = q.ssr ? 1.0 : 0.0; CFG.volumetric = q.vol;
  CFG.taa = q.taa; CFG.dof = q.dof && CFG.dofUser;
  if (rebuildShadows) {
    for (const s of R.shadow) { gl.deleteTexture(s.tex); gl.deleteFramebuffer(s.fb); }
    R.shadow = [makeShadowRT(q.shadow), makeShadowRT(q.shadow), makeShadowRT(Math.max(1024, q.shadow >> 1))];
  }
  resize();
}

async function boot() {
  const canvas = document.getElementById('gl');
  R.canvas = canvas;
  R.userScale = 1.0;
  CFG.dofUser = true;
  gl = canvas.getContext('webgl2', {
    antialias: false, depth: true, stencil: false, alpha: false,
    powerPreference: 'high-performance', preserveDrawingBuffer: true
  });
  if (!gl) { document.getElementById('err').style.display = 'block'; return; }
  if (!gl.getExtension('EXT_color_buffer_float')) {
    document.getElementById('err').innerHTML = 'このデバイスは EXT_color_buffer_float に対応していません。';
    document.getElementById('err').style.display = 'block'; return;
  }
  gl.getExtension('OES_texture_float_linear');
  gl.getExtension('EXT_float_blend');

  const status = document.getElementById('status');
  const step = async (msg, fn) => {
    status.textContent = msg;
    await new Promise(r => setTimeout(r, 12));
    fn();
  };

  const QS = new URLSearchParams(location.search);
  R.quality = QS.has('q') ? clamp(parseInt(QS.get('q')), 0, 2) : (isMobile() ? 1 : 2);
  const q = Object.assign({}, QUALITY[R.quality]);
  if (QS.has('mat')) q.mat = parseInt(QS.get('mat'));
  if (QS.has('shadow')) q.shadow = parseInt(QS.get('shadow'));
  R.sceneDetail = QS.has('sd') ? parseInt(QS.get('sd')) : (isMobile() ? 1 : 2);

  fullscreenInit();
  await step('シェーダをコンパイル中…', () => initPrograms());
  await step('質感をベイク中…', () => { bakeMaterials(q.mat); makeInscriptionAtlas(); });
  await step('空と環境光を計算中…', () => {
    R.skyCube = makeCube(256, 7);
    R.irrCube = makeCube(32, 1);
    R.prefCube = makeCube(128, 6);
    R.shadow = [makeShadowRT(q.shadow), makeShadowRT(q.shadow), makeShadowRT(Math.max(1024, q.shadow >> 1))];
    R.cascadeVP = [M4.create(), M4.create(), M4.create()];
    updateLightingPalette();
  });
  await step('千本鳥居を建立中…', () => {
    R.scene = buildScene(R.sceneDetail);
  });
  await step('準備完了', () => {
    applyQuality(R.quality, false);
    resize();
    bakeSky();
  });

  document.getElementById('loading').style.opacity = '0';
  setTimeout(() => document.getElementById('loading').style.display = 'none', 700);

  window.addEventListener('resize', resize);
  setupInput();
  setupUI();
  if (QS.get('ui') === '0') { document.getElementById('ui').style.display = 'none'; CFG.showUI = false; }
  else if (isMobile() || window.innerWidth < 560) document.getElementById('panel').classList.add('collapsed');
  if (QS.has('walk')) CFG.autoWalk = QS.get('walk') !== '0';

  let last = performance.now();
  let acc = 0, frames = 0;
  function loop(now) {
    const dt = Math.min((now - last) / 1000, 0.06);
    last = now;
    R.time += dt;
    acc += dt; frames++;
    if (acc > 0.5) { document.getElementById('fps').textContent = Math.round(frames / acc) + ' fps'; acc = 0; frames = 0; }
    updateCamera(dt);
    renderFrame(dt);
    R.frame++;
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
  window.__DBG = { CFG, R, CAM, QUALITY, updateLightingPalette, pathPos, resize };
  window.__probe = function (rtName, px, py, n) {
    const rt = R.rt[rtName]; if (!rt) return null;
    n = n || 1;
    gl.bindFramebuffer(gl.FRAMEBUFFER, rt.fb);
    gl.readBuffer(gl.COLOR_ATTACHMENT0);
    const buf = new Float32Array(4 * n * n);
    const x = Math.round(px * rt.w), y = Math.round(py * rt.h);
    try { gl.readPixels(x, y, n, n, gl.RGBA, gl.FLOAT, buf); }
    catch (e) { gl.bindFramebuffer(gl.FRAMEBUFFER, null); return 'ERR ' + e; }
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    let r = 0, g = 0, b = 0;
    for (let i = 0; i < n * n; i++) { r += buf[i * 4]; g += buf[i * 4 + 1]; b += buf[i * 4 + 2]; }
    const k = n * n;
    return [+(r / k).toFixed(4), +(g / k).toFixed(4), +(b / k).toFixed(4)];
  };
  window.__ready = true;
}

/* ---------------- input ---------------- */
function setupInput() {
  const c = R.canvas;
  addEventListener('keydown', e => {
    KEYS[e.key.toLowerCase()] = true;
    if (e.key === 'Shift') KEYS['shift'] = true;
    if (e.key.toLowerCase() === 'c') { CFG.autoWalk = !CFG.autoWalk; syncUI(); }
    if (e.key.toLowerCase() === 'h') { CFG.showUI = !CFG.showUI; document.getElementById('ui').style.display = CFG.showUI ? '' : 'none'; }
    if (['w', 'a', 's', 'd'].includes(e.key.toLowerCase())) CFG.autoWalk = false;
  });
  addEventListener('keyup', e => { KEYS[e.key.toLowerCase()] = false; if (e.key === 'Shift') KEYS['shift'] = false; });

  let dragging = false, lx = 0, ly = 0;
  c.addEventListener('pointerdown', e => {
    if (e.pointerType === 'touch' && e.clientX < window.innerWidth * 0.4 && e.clientY > window.innerHeight * 0.55) {
      joy.active = true; joy.id = e.pointerId; joy.ox = e.clientX; joy.oy = e.clientY; joy.x = 0; joy.y = 0;
      CFG.autoWalk = false; syncUI();
      const jd = document.getElementById('joy');
      jd.style.display = 'block'; jd.style.left = (e.clientX - 55) + 'px'; jd.style.top = (e.clientY - 55) + 'px';
      return;
    }
    dragging = true; lx = e.clientX; ly = e.clientY; c.setPointerCapture(e.pointerId);
    CFG.autoWalk = false; syncUI();
  });
  c.addEventListener('pointermove', e => {
    if (joy.active && e.pointerId === joy.id) {
      const dx = clamp((e.clientX - joy.ox) / 48, -1, 1), dy = clamp((e.clientY - joy.oy) / 48, -1, 1);
      joy.x = dx; joy.y = dy;
      document.getElementById('joyknob').style.transform = `translate(${dx * 34}px,${dy * 34}px)`;
      return;
    }
    if (!dragging) return;
    const dx = e.clientX - lx, dy = e.clientY - ly; lx = e.clientX; ly = e.clientY;
    CAM.yaw += dx * 0.0032;
    CAM.pitch -= dy * 0.0032;
  });
  const end = e => {
    if (joy.active && e.pointerId === joy.id) {
      joy.active = false; joy.x = 0; joy.y = 0;
      document.getElementById('joy').style.display = 'none';
      document.getElementById('joyknob').style.transform = '';
    }
    dragging = false;
  };
  c.addEventListener('pointerup', end);
  c.addEventListener('pointercancel', end);
  c.addEventListener('wheel', e => {
    CAM.fov = clamp(CAM.fov + e.deltaY * 0.0006, 18 * PI / 180, 78 * PI / 180);
    e.preventDefault();
  }, { passive: false });
}

/* ---------------- UI ---------------- */
function bindSlider(id, get, set, fmt) {
  const el = document.getElementById(id);
  const out = document.getElementById(id + 'v');
  el.value = get();
  if (out) out.textContent = fmt ? fmt(get()) : get();
  el.addEventListener('input', () => {
    set(parseFloat(el.value));
    if (out) out.textContent = fmt ? fmt(parseFloat(el.value)) : el.value;
  });
}

function syncUI() {
  const b = document.getElementById('btnwalk');
  if (b) b.textContent = CFG.autoWalk ? '自動歩行 ON' : '自動歩行 OFF';
}

function setupUI() {
  bindSlider('sunel', () => CFG.sunElev, v => { CFG.sunElev = v; updateLightingPalette(); }, v => (v * 57.3).toFixed(1) + '°');
  bindSlider('sunaz', () => CFG.sunAzimuth, v => { CFG.sunAzimuth = v; R.skyDirty = true; }, v => (v * 57.3).toFixed(0) + '°');
  bindSlider('expo', () => CFG.exposure, v => CFG.exposure = v, v => v.toFixed(2));
  bindSlider('wet', () => CFG.wetness, v => CFG.wetness = v, v => v.toFixed(2));
  bindSlider('fog', () => CFG.volDensity, v => { CFG.volDensity = v; CFG.fogDensity = 0.006 + v * 0.46; }, v => v.toFixed(3));
  bindSlider('fovs', () => CAM.fov * 57.3, v => CAM.fov = v / 57.3, v => v.toFixed(0) + '\u00b0');
  bindSlider('rscale', () => 1.0, v => { R.userScale = v; resize(); }, v => (v * 100).toFixed(0) + '%');

  document.getElementById('qual').addEventListener('change', e => {
    applyQuality(parseInt(e.target.value), true);
  });
  document.getElementById('qual').value = R.quality;

  document.getElementById('btnwalk').addEventListener('click', () => { CFG.autoWalk = !CFG.autoWalk; syncUI(); });
  document.getElementById('btndof').addEventListener('click', e => {
    CFG.dofUser = !CFG.dofUser; CFG.dof = CFG.dofUser && QUALITY[R.quality].dof;
    e.target.textContent = '被写界深度 ' + (CFG.dof ? 'ON' : 'OFF');
  });
  document.getElementById('btnhide').addEventListener('click', () => {
    document.getElementById('panel').classList.toggle('collapsed');
  });
  document.getElementById('btnshot').addEventListener('click', () => {
    const a = document.createElement('a');
    a.download = 'fushimi-inari.png';
    a.href = R.canvas.toDataURL('image/png');
    a.click();
  });
  syncUI();
}

if (document.readyState === 'loading') addEventListener('DOMContentLoaded', boot); else boot();

})();
</script>
<script>
document.getElementById('tab').addEventListener('click',()=>{
  document.getElementById('panel').classList.remove('collapsed');
});
</script>
