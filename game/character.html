/* ==== b_shaders_b.js ==== */
/* =========================================================================
   SHADERS part B : deferred lighting, AO, SSR, volumetrics, post
   ========================================================================= */

const SH_GBUF_READ = `
uniform sampler2D uGA;      // albedo.rgb ao
uniform sampler2D uGN;      // oct normal.xy, rough, metal
uniform sampler2D uGE;      // emissive.rgb, matId
uniform sampler2D uDepth;
uniform mat4 uInvViewProj;
uniform mat4 uInvProj;
uniform mat4 uView;
uniform vec3 uCamPos;
uniform vec2 uNearFar;

float linearDepth(float d){
  float z = d*2.0-1.0;
  return (2.0*uNearFar.x*uNearFar.y)/(uNearFar.y+uNearFar.x - z*(uNearFar.y-uNearFar.x));
}
vec3 worldFromDepth(vec2 uv, float d){
  vec4 c = vec4(uv*2.0-1.0, d*2.0-1.0, 1.0);
  vec4 w = uInvViewProj*c;
  return w.xyz/w.w;
}
vec3 viewFromDepth(vec2 uv, float d){
  vec4 c = vec4(uv*2.0-1.0, d*2.0-1.0, 1.0);
  vec4 v = uInvProj*c;
  return v.xyz/v.w;
}
`;

const SH_PBR = `
float D_GGX(float ndh, float a){
  float a2=a*a; float d=(ndh*a2-ndh)*ndh+1.0;
  return a2/max(PI*d*d,1e-7);
}
float V_SmithGGX(float ndv, float ndl, float a){
  float a2=a*a;
  float gv = ndl*sqrt(ndv*ndv*(1.0-a2)+a2);
  float gl = ndv*sqrt(ndl*ndl*(1.0-a2)+a2);
  return 0.5/max(gv+gl,1e-6);
}
vec3 F_Schlick(vec3 f0, float u){ float f=pow(1.0-u,5.0); return f0 + (1.0-f0)*f; }
vec3 envBRDFApprox(vec3 f0, float rough, float ndv){
  const vec4 c0 = vec4(-1.0,-0.0275,-0.572,0.022);
  const vec4 c1 = vec4(1.0,0.0425,1.04,-0.04);
  vec4 r = rough*c0+c1;
  float a004 = min(r.x*r.x, exp2(-9.28*ndv))*r.x + r.y;
  vec2 AB = vec2(-1.04,1.04)*a004 + r.zw;
  return f0*AB.x + AB.y;
}
float specularAO(float ndv, float ao, float rough){
  return clamp(pow(ndv+ao, exp2(-16.0*rough-1.0)) - 1.0 + ao, 0.0, 1.0);
}
`;

const FS_LIGHT = SH_COMMON + SH_GBUF_READ + SH_PBR + `
uniform samplerCube uIrr;
uniform samplerCube uPref;
uniform sampler2D uAO;
uniform sampler2DShadow uSh0;
uniform sampler2DShadow uSh1;
uniform sampler2DShadow uSh2;
uniform mat4 uShVP0, uShVP1, uShVP2;
uniform vec3 uSunDir;
uniform vec3 uSunColor;
uniform vec3 uSkyTint;
uniform vec3 uBounce;
uniform vec3 uAmbTint;
uniform float uPrefMips;
uniform float uAmbient;
uniform float uTime;
uniform vec3 uHairRing;   // centre Y, half width, strength
uniform float uStarAmt;
uniform vec3 uPole;
uniform float uStarRot;
uniform int uNumLights;
uniform vec4 uLightPos[16];   // xyz, radius
uniform vec4 uLightCol[16];   // rgb, intensity
uniform samplerCube uSky;
uniform vec3 uHazeColor;
uniform float uHazeAmt;
uniform int uShadowQuality;
uniform vec2 uShadowTexel;

in vec2 vUV;
out vec4 outC;

const vec2 POISSON[12] = vec2[12](
  vec2(-0.326,-0.406), vec2(-0.840,-0.074), vec2(-0.696, 0.457), vec2(-0.203, 0.621),
  vec2( 0.962,-0.195), vec2( 0.473,-0.480), vec2( 0.519, 0.767), vec2( 0.185,-0.893),
  vec2( 0.507, 0.064), vec2( 0.896, 0.412), vec2(-0.322,-0.933), vec2(-0.792,-0.598));

float sampleCascade(sampler2DShadow s, vec3 c, float rot, float spread){
  if(c.x<0.001||c.x>0.999||c.y<0.001||c.y>0.999) return -1.0;
  float sum=0.0;
  float cs=cos(rot), sn=sin(rot);
  int taps = uShadowQuality==2 ? 12 : (uShadowQuality==1 ? 6 : 4);
  for(int i=0;i<12;i++){
    if(i>=taps) break;
    vec2 o = POISSON[i];
    o = vec2(o.x*cs-o.y*sn, o.x*sn+o.y*cs)*spread;
    sum += texture(s, vec3(c.xy+o*uShadowTexel, c.z));
  }
  return sum/float(taps);
}

float shadowFactor(vec3 wpos, vec3 N, float viewDist, float rot){
  float ndl = max(dot(N, uSunDir), 0.0);
  float slope = clamp(1.0-ndl, 0.0, 1.0);
  vec3 off = N*(0.020+0.075*slope);
  float s;
  /* cascade 0 is half the extent it was, so its offset is halved with it —
     the acne margin is unchanged and the penumbra lands where the caster
     actually is. The wider poisson spread costs nothing and turns a hard
     blotch into a shadow. */
  vec4 c0 = uShVP0*vec4(wpos+off*0.32,1.0); vec3 p0 = c0.xyz/c0.w*0.5+0.5;
  s = sampleCascade(uSh0, p0, rot, 2.40);
  if(s<0.0){
    vec4 c1 = uShVP1*vec4(wpos+off*1.9,1.0); vec3 p1=c1.xyz/c1.w*0.5+0.5;
    s = sampleCascade(uSh1, p1, rot, 1.0);
    if(s<0.0){
      vec4 c2 = uShVP2*vec4(wpos+off*4.5,1.0); vec3 p2=c2.xyz/c2.w*0.5+0.5;
      s = sampleCascade(uSh2, p2, rot, 0.9);
      if(s<0.0) s = 1.0;
    }
  }
  return s;
}

void main(){
  float d = texture(uDepth, vUV).r;
  vec4 GN = texture(uGN, vUV);
  vec4 GA = texture(uGA, vUV);
  vec4 GE = texture(uGE, vUV);

  if(d >= 0.99999){
    vec3 dir = normalize(worldFromDepth(vUV, 1.0) - uCamPos);
    vec3 sky = textureLod(uSky, dir, 0.0).rgb;
    // crisp sun disc + forward glow, reddened near the horizon
    float c = dot(dir, uSunDir);
    float disc = smoothstep(0.99965, 0.99992, c);
    float glow = pow(max(c,0.0), 900.0)*0.6 + pow(max(c,0.0), 40.0)*0.06;
    sky += uSunColor*(disc*7.0 + glow)*smoothstep(-0.02,0.06,dir.y);
    // ---- stars: a fixed field turned about the celestial pole by the hour angle ----
    if(uStarAmt > 0.002){
      float ca = cos(uStarRot), sa = sin(uStarRot);
      vec3 P = uPole;
      vec3 sd2 = dir*ca + cross(P,dir)*sa + P*dot(P,dir)*(1.0-ca);
      float st = 0.0;
      for(int k=0;k<3;k++){
        float sc = 168.0 + 232.0*float(k);
        vec3 g = sd2*sc;
        vec3 idc = floor(g);
        float h = hash13(idc + vec3(float(k)*31.7));
        if(h > 0.9805){
          vec3 jit = vec3(hash13(idc+vec3(5.1)), hash13(idc+vec3(9.7)), hash13(idc+vec3(2.3)));
          vec3 fr = fract(g) - 0.5 - (jit-0.5)*0.55;
          float mag = (h-0.9805)/0.0195;
          st += smoothstep(0.34, 0.0, length(fr))*mag*mag/(1.0+float(k)*1.6);
        }
      }
      vec3 stc = mix(vec3(0.70,0.79,1.06), vec3(1.06,0.88,0.66), hash13(floor(sd2*168.0)+vec3(77.0)));
      sky += stc*st*uStarAmt*smoothstep(0.005, 0.20, dir.y)*2.6;
    }
    sky = mix(sky, uHazeColor, smoothstep(0.16, -0.03, dir.y)*uHazeAmt);
    outC = vec4(sky, 1.0);
    return;
  }

  vec3 wpos = worldFromDepth(vUV, d);
  vec3 N = octDecode(GN.xy);
  float rough = clamp(GN.z, 0.03, 1.0);
  float metal = GN.w;
  vec3 albedo = GA.rgb;
  float aoTex = GA.a;
  float ssao = texture(uAO, vUV).r;
  float ao = min(aoTex, ssao);

  vec3 V = normalize(uCamPos - wpos);
  float ndv = max(dot(N,V), 1e-4);
  vec3 f0 = mix(vec3(0.04), albedo, metal);
  vec3 diffCol = albedo*(1.0-metal);

  float viewDist = distance(uCamPos, wpos);
  float rot = hash12(gl_FragCoord.xy + fract(uTime)*13.0)*TAU;

  // ---------------- sun ----------------
  vec3 L = uSunDir;
  float ndl = max(dot(N,L),0.0);
  vec3 direct = vec3(0.0);
  float sh = 0.0;
  if(ndl > 0.0){
    sh = shadowFactor(wpos, N, viewDist, rot);
    if(sh > 0.001){
      vec3 H = normalize(L+V);
      float ndh = max(dot(N,H),0.0), vdh = max(dot(V,H),0.0);
      float a = rough*rough;
      vec3 F = F_Schlick(f0, vdh);
      float Dv = D_GGX(ndh,a), Vv = V_SmithGGX(ndv,ndl,a);
      vec3 spec = F*Dv*Vv;
      vec3 kd = (1.0-F);
      direct = (kd*diffCol/PI + spec)*uSunColor*ndl*sh;
    }
  }

  // ---------------- IBL ----------------
  vec3 irr = texture(uIrr, N).rgb;
  vec3 R = reflect(-V,N);
  float mip = rough*(uPrefMips-1.0);
  vec3 pref = textureLod(uPref, R, mip).rgb;
  vec3 dfg = envBRDFApprox(f0, rough, ndv);
  float sao = specularAO(ndv, ao, rough);
  vec3 ambient = irr*uAmbTint*diffCol*pow(ao,1.35)*uAmbient + pref*uAmbTint*dfg*sao*uAmbient;

  // fake colour bleeding from the vermillion corridor + damp ground
  float down = clamp(-N.y*0.5+0.5,0.0,1.0);
  ambient += diffCol*uBounce*ao*(0.35+0.65*down);

  // ---------------- point lights (lanterns) ----------------
  vec3 pl = vec3(0.0);
  for(int i=0;i<16;i++){
    if(i>=uNumLights) break;
    vec3 dv = uLightPos[i].xyz - wpos;
    float dist2 = dot(dv,dv);
    float rad = uLightPos[i].w;
    if(dist2 > rad*rad) continue;
    float dl = sqrt(dist2);
    vec3 Lp = dv/max(dl,1e-4);
    float nl = max(dot(N,Lp),0.0);
    if(nl<=0.0) continue;
    float att = clamp(1.0-dl/rad,0.0,1.0); att*=att;
    att /= (1.0+dist2*0.6);
    vec3 H = normalize(Lp+V);
    float ndh=max(dot(N,H),0.0), vdh=max(dot(V,H),0.0);
    float a=rough*rough;
    vec3 F=F_Schlick(f0,vdh);
    vec3 spec=F*D_GGX(ndh,a)*V_SmithGGX(ndv,nl,a);
    pl += ((1.0-F)*diffCol/PI + spec)*uLightCol[i].rgb*uLightCol[i].w*nl*att;
  }

  /* ---------------- SKIN AND HAIR ----------------

     The brief moved from cel to Monster Hunter, which is the opposite
     problem, so the toon path is gone and these are physically shaded like
     everything else in the scene. What separates rendered flesh from
     painted plastic is not the BRDF — it is that light goes INTO skin,
     scatters, and comes back out red a millimetre away. Without that the
     terminator is a hard grey edge and the face is a mannequin.

     Two things do the work: a wrapped diffuse, which lets light past the
     geometric terminator the way a translucent medium does, and a red bleed
     concentrated exactly in the band where the surface turns away.
     Plus skin takes TWO speculars — a broad soft sheen from the oil film
     and a tight one from the surface itself. One GGX lobe cannot be both,
     and skin with a single lobe always reads as vinyl.                    */
  int cmid = int(GE.w);
  if(cmid == 16 || cmid == 21){
    /* Anime skin is not flat shading and it is not cel shading. It is a
       very WIDE wrap with the midtones compressed, so most of the face
       sits in one value and the shadow arrives as a soft, slightly cool
       edge. Physical falloff across a cheek is what made the realistic
       pass look like a photograph of a mannequin. */
    const float WRAP = 0.58;
    float nw = clamp((ndl + WRAP)/(1.0 + WRAP), 0.0, 1.0);
    nw = mix(nw, smoothstep(0.30, 0.66, nw)*0.72 + 0.28, 0.78);
    // a whisper of subsurface, only right at the turn
    float term = smoothstep(-WRAP, 0.06, ndl) * (1.0 - smoothstep(0.0, 0.34, ndl));
    vec3 sss = vec3(0.520, 0.190, 0.130);
    vec3 dif = albedo*(nw + sss*term*0.30);

    vec3 H2 = normalize(L+V);
    float ndh2 = max(dot(N,H2),0.0), vdh2 = max(dot(V,H2),0.0);
    float aB = clamp(rough*2.4, 0.20, 1.0); aB *= aB;
    vec3 F2 = F_Schlick(vec3(0.021), vdh2);
    vec3 spec = F2*D_GGX(ndh2,aB)*V_SmithGGX(ndv,ndl,aB)*0.40;
    /* An anime face does NOT take a hard shadow from its own hair. In
       production the face gets its own softened shadow term for exactly
       this reason: a raw shadow map thrown across flat-shaded skin reads
       as a grey mask stuck over the drawing, which is precisely what the
       last render produced. Keep a hint of it and no more. */
    float shF = mix(1.0, smoothstep(0.0, 1.0, sh), 0.18);
    vec3 skinDirect = (dif/PI + spec*ndl)*uSunColor*shF;

    vec3 irrS = texture(uIrr, N).rgb;
    // the shadow side is filled and cooled rather than left to go dark
    vec3 ambS = mix(irrS, vec3(dot(irrS, vec3(0.3,0.59,0.11))), 0.35)
                *uAmbTint*albedo*pow(ao,0.65)*uAmbient*1.28
              + albedo*vec3(0.040,0.028,0.030);
    outC = vec4(skinDirect + ambS + pl + GE.rgb, 1.0);
    return;
  }
  if(cmid == 17){
    /* Hair is a bundle of cylinders, so its highlight is a BAND across the
       strands, not a point. Kajiya-Kay: shift the shading normal toward the
       strand tangent and take the specular off that. Two lobes again — a
       tight bright one on the surface and a broad coloured one from light
       that has been through the strand. */
    vec3 T2 = normalize(cross(N, vec3(0.0,1.0,0.0)) + vec3(1e-4));
    vec3 H2 = normalize(L+V);
    float tdh = dot(T2, H2);
    float sinTH = sqrt(max(0.0, 1.0 - tdh*tdh));
    float prim = pow(sinTH, 90.0), sec = pow(sinTH, 16.0);
    vec3 hspec = (vec3(1.0)*pow(sinTH,150.0)*0.20 + albedo*vec3(1.5,1.12,0.86)*sec*0.075);
    float hw = clamp((ndl + 0.52)/1.52, 0.0, 1.0);
  vec3 hdif = albedo*(mix(hw, smoothstep(0.26,0.62,hw)*0.74 + 0.26, 0.72));
    vec3 irrH = texture(uIrr, N).rgb;
    outC = vec4((hdif/PI*1.9 + hspec*ndl)*uSunColor*sh
              + irrH*uAmbTint*albedo*pow(ao,1.3)*uAmbient + pl + GE.rgb, 1.0);
    return;
  }

  vec3 col = direct + ambient + pl + GE.rgb;
  outC = vec4(col, 1.0);
}
`;

/* ------------------------- SSAO / GTAO-lite ------------------------- */
const FS_AO = SH_COMMON + SH_GBUF_READ + `
uniform float uRadius;
uniform float uIntensity;
uniform vec2 uRes;
uniform float uTime;
in vec2 vUV;
out vec4 outC;

void main(){
  float d = texture(uDepth, vUV).r;
  if(d>=0.99999){ outC=vec4(1.0); return; }
  vec3 vp = viewFromDepth(vUV, d);
  vec3 N = octDecode(texture(uGN, vUV).xy);
  vec3 vn = normalize((uView*vec4(N,0.0)).xyz);
  float noise = hash12(gl_FragCoord.xy*1.7 + fract(uTime)*77.0);
  float ao = 0.0;
  const int DIRS = 6, STEPS = 4;
  float radiusPix = uRadius / max(-vp.z,0.4);
  radiusPix = clamp(radiusPix, 0.004, 0.055);
  for(int i=0;i<DIRS;i++){
    float ang = (float(i)+noise)/float(DIRS)*TAU;
    vec2 dir = vec2(cos(ang),sin(ang));
    float best = 0.0;
    for(int j=1;j<=STEPS;j++){
      float t = (float(j)-0.25*noise)/float(STEPS);
      vec2 suv = vUV + dir*radiusPix*t*vec2(1.0, uRes.x/uRes.y);
      if(suv.x<0.0||suv.x>1.0||suv.y<0.0||suv.y>1.0) break;
      float sd = texture(uDepth, suv).r;
      if(sd>=0.99999) continue;
      vec3 sp = viewFromDepth(suv, sd);
      vec3 dv = sp - vp;
      float l = length(dv);
      if(l<1e-4) continue;
      float h = dot(dv/l, vn);
      float atten = 1.0/(1.0 + l*l*2.6);
      best = max(best, h*atten);
    }
    ao += clamp(best,0.0,1.0);
  }
  ao = 1.0 - ao/float(DIRS)*uIntensity;
  outC = vec4(pow(clamp(ao,0.0,1.0), 1.55));

`;

void main(){

/* ------------------------- SSR ------------------------- */
const FS_SSR = SH_COMMON + SH_GBUF_READ + `
uniform sampler2D uColor;
uniform mat4 uProj;
uniform vec2 uRes;
uniform float uTime;
uniform float uMaxRough;
in vec2 vUV;
out vec4 outC;

void main(){
  float d = texture(uDepth, vUV).r;
  vec4 GN = texture(uGN, vUV);
  float rough = GN.z;
  if(d>=0.99999 || rough > uMaxRough){ outC = vec4(0.0); return; }
  vec3 N = octDecode(GN.xy);
  vec3 vpos = viewFromDepth(vUV, d);
  vec3 vn = normalize((uView*vec4(N,0.0)).xyz);
  vec3 V = normalize(vpos);
  vec3 R = reflect(V, vn);
  if(R.z > 0.0 && vpos.z > -0.4){ outC=vec4(0.0); return; }

  float jitter = hash12(gl_FragCoord.xy + fract(uTime)*31.0);
  // rough-perturbed reflection
  vec3 rnd = (hash33(vec3(gl_FragCoord.xy, fract(uTime)*100.0))-0.5)*2.0;
  R = normalize(R + rnd*rough*rough*1.5);

  float stepLen = 0.30;
  vec3 p = vpos + vn*0.02;
  float thickness = 0.42;
  vec2 hitUV = vec2(-1.0);
  float travelled = 0.0;
  const int STEPS = 42;
  vec3 prevP = p;
  for(int i=0;i<STEPS;i++){
    float sl = stepLen*(1.0 + float(i)*0.10);
    prevP = p;
    p += R*sl*(0.85+0.3*jitter);
    travelled += sl;
    if(p.z > -uNearFar.x) break;
    vec4 c = uProj*vec4(p,1.0);
    vec2 uv = (c.xy/c.w)*0.5+0.5;
    if(uv.x<0.0||uv.x>1.0||uv.y<0.0||uv.y>1.0) break;
    float sd = texture(uDepth, uv).r;
    if(sd>=0.99999) continue;
    vec3 sp = viewFromDepth(uv, sd);
    float diff = sp.z - p.z;
    if(diff > 0.0 && diff < thickness + sl*0.6){
      // binary refine
      vec3 a = prevP, b = p;
      for(int k=0;k<5;k++){
        vec3 m = (a+b)*0.5;
        vec4 cm = uProj*vec4(m,1.0);
        vec2 muv = (cm.xy/cm.w)*0.5+0.5;
        float md = texture(uDepth, muv).r;
        vec3 msp = viewFromDepth(muv, md);
        if(msp.z - m.z > 0.0) b = m; else a = m;
      }
      vec4 cf = uProj*vec4((a+b)*0.5,1.0);
      hitUV = (cf.xy/cf.w)*0.5+0.5;
      break;
    }
  }
  if(hitUV.x < 0.0){ outC = vec4(0.0); return; }

  vec3 col = texture(uColor, hitUV).rgb;
  vec2 e = abs(hitUV*2.0-1.0);
  float edgeFade = (1.0-smoothstep(0.72,1.0,max(e.x,e.y)));
  float distFade = 1.0 - smoothstep(0.0, 26.0, travelled);
  float roughFade = 1.0 - smoothstep(uMaxRough*0.35, uMaxRough, rough);
  outC = vec4(col, edgeFade*distFade*roughFade);
}
`;

/* ------------------------- VOLUMETRIC LIGHT ------------------------- */
const FS_VOLUME = SH_COMMON + SH_GBUF_READ + `
uniform sampler2DShadow uSh0;
uniform sampler2DShadow uSh1;
uniform sampler2DShadow uSh2;
uniform mat4 uShVP0, uShVP1, uShVP2;
uniform vec3 uSunDir;
uniform vec3 uSunColor;
uniform float uTime;
uniform float uDensity;
uniform float uFogHeight;
uniform float uAnisotropy;
uniform int uSteps;
uniform vec3 uAmbientFog;
in vec2 vUV;
out vec4 outC;

float shadowAt(vec3 w){
  vec4 c0 = uShVP0*vec4(w,1.0); vec3 p0=c0.xyz/c0.w*0.5+0.5;
  if(p0.x>0.005&&p0.x<0.995&&p0.y>0.005&&p0.y<0.995&&p0.z<1.0) return texture(uSh0,p0);
  vec4 c1 = uShVP1*vec4(w,1.0); vec3 p1=c1.xyz/c1.w*0.5+0.5;
  if(p1.x>0.005&&p1.x<0.995&&p1.y>0.005&&p1.y<0.995&&p1.z<1.0) return texture(uSh1,p1);
  vec4 c2 = uShVP2*vec4(w,1.0); vec3 p2=c2.xyz/c2.w*0.5+0.5;
  if(p2.x>0.005&&p2.x<0.995&&p2.y>0.005&&p2.y<0.995&&p2.z<1.0) return texture(uSh2,p2);
  return 1.0;
}
float hg(float c, float g){
  float g2=g*g;
  return (1.0-g2)/(4.0*PI*pow(1.0+g2-2.0*g*c, 1.5));
}
void main(){
  float d = texture(uDepth, vUV).r;
  vec3 wend = worldFromDepth(vUV, min(d,0.9999));
  vec3 ro = uCamPos;
  vec3 rd = wend - ro;
  float maxT = length(rd);
  rd /= max(maxT,1e-4);
  maxT = min(maxT, 46.0);

  float jitter = hash12(gl_FragCoord.xy*3.11 + fract(uTime)*61.0);
  int STEPS = uSteps;
  float dt = maxT/float(STEPS);
  float cosA = dot(rd, uSunDir);
  float phase = hg(cosA, uAnisotropy);
  vec3 acc = vec3(0.0);
  float trans = 1.0;
  float t = dt*jitter;
  for(int i=0;i<64;i++){
    if(i>=STEPS) break;
    vec3 p = ro + rd*t;
    float hf = exp(-max(p.y-uFogHeight,0.0)*0.42);
    // drifting mist clumps
    float m = fbm3(p*vec3(0.19,0.42,0.19)+vec3(uTime*0.020,uTime*0.010,-uTime*0.014), 3);
    float dens = uDensity*hf*(0.35+1.5*smoothstep(0.30,0.78,m));
    if(dens > 1e-5){
      float sh = shadowAt(p);
      float sigma = dens*dt;
      vec3 inscat = uSunColor*phase*sh*3.1 + uAmbientFog*0.30;
      acc += trans*inscat*sigma;
      trans *= exp(-sigma*1.35);
      if(trans < 0.02) break;
    }
    t += dt;
  }
  outC = vec4(acc, 1.0-trans);
}
`;

/* ------------------------- COMPOSITE (fog + ssr + volume) ------------------------- */
const FS_COMPOSITE = SH_COMMON + SH_GBUF_READ + SH_PBR + `
uniform sampler2D uColor;
uniform sampler2D uSSR;
uniform sampler2D uVolume;
uniform samplerCube uPref;
uniform vec3 uSunDir;
uniform vec3 uSunColor;
uniform vec3 uFogColor;
uniform vec3 uFogColorSun;
uniform float uFogDensity;
uniform float uFogHeight;
uniform float uSSRStrength;
in vec2 vUV;
out vec4 outC;

void main(){
  vec3 col = texture(uColor, vUV).rgb;
  float d = texture(uDepth, vUV).r;
  vec4 vol = texture(uVolume, vUV);

  if(d < 0.99999){
    vec4 GN = texture(uGN, vUV);
    vec3 N = octDecode(GN.xy);
    float rough = GN.z, metal = GN.w;
    vec3 albedo = texture(uGA, vUV).rgb;
    vec3 wpos = worldFromDepth(vUV, d);
    vec3 V = normalize(uCamPos-wpos);
    float ndv = max(dot(N,V),1e-4);
    vec3 f0 = mix(vec3(0.04), albedo, metal);
    vec3 dfg = envBRDFApprox(f0, rough, ndv);
    vec4 ssr = texture(uSSR, vUV);
    col += ssr.rgb*ssr.a*max(dfg, vec3(0.06))*uSSRStrength*1.8;

    // ---- height + distance fog with sun inscatter ----
    float dist = distance(uCamPos, wpos);
    const float kh = 0.20;
    float hC = exp(-(uCamPos.y-uFogHeight)*kh);
    float hP = exp(-(wpos.y-uFogHeight)*kh);
    float dy = wpos.y-uCamPos.y;
    float hint = (abs(dy) < 1e-3) ? hC : (hC-hP)/(kh*dy);
    float fogAmt = 1.0 - exp(-uFogDensity*dist*clamp(hint,0.0,3.0));
    fogAmt = clamp(fogAmt,0.0,1.0);
    vec3 vdir = normalize(wpos-uCamPos);
    float sunAmt = max(dot(vdir,uSunDir),0.0);
    vec3 fc = mix(uFogColor, uFogColorSun, pow(sunAmt,4.0)*0.85);
    col = mix(col, fc, fogAmt);

  outC = vec4(col,1.0);

`;

/* ------------------------- BLOOM ------------------------- */
const FS_BRIGHT = SH_COMMON + `
uniform sampler2D uTex; uniform float uThreshold; uniform float uSoft;
uniform sampler2D uExpo; uniform float uExpoBias;
in vec2 vUV; out vec4 outC;
void main(){
  vec3 c = texture(uTex,vUV).rgb;
  float br = max(c.r,max(c.g,c.b));
  // the threshold is in post-exposure terms, so pull it back into scene linear
  float thr = uThreshold/max(texture(uExpo, vec2(0.5)).r*uExpoBias, 1e-3);

const FS_DOF = SH_COMMON + `

const FS_TAA = SH_COMMON + `
uniform sampler2D uCur;
uniform sampler2D uHist;

uniform mat4 uPrevViewProj;

in vec2 vUV; out vec4 outC;

/* ------------------------- AUTO EXPOSURE -------------------------

   Metering the sun's elevation is not good enough here. The player spends
   most of the game under a roofed corridor, where a high sun delivers LESS
   light to the eye, not more, because the beam is stopped by the kasagi.
   An open loop estimate stops the lens down exactly when the scene got
   darker. So measure the frame that was actually rendered.

   Centre weighted log-average, adapted inside a 1x1 target, which keeps
   the whole loop on the GPU: no readPixels, no pipeline stall.           */
const FS_METER = SH_COMMON + `
uniform sampler2D uScene;
uniform sampler2D uPrev;
uniform float uDt, uKey, uGamma, uMin, uMax, uValid;
out vec4 outC;
void main(){
  /* A log-average is the textbook choice but it is dominated by the floor
     here: this scene has large genuinely black regions (the nuki wedges,
     the wooded slope) and a log mean of mostly-floor barely moves between
     noon and midnight. Use a Reinhard mean instead - soft clipped on the
     way in, so neither the black nor a sun disc can own the meter. */
  float sum = 0.0, wsum = 0.0;
  for(int y=0;y<13;y++){
    for(int x=0;x<13;x++){
      vec2 uv = (vec2(float(x),float(y))+0.5)/13.0;
      vec2 dd = uv-0.5;
      float w = exp(-dot(dd,dd)*3.2);        // centre weighted, like a real meter
      float l = luma(texture(uScene, uv).rgb);
      sum += (l/(1.0+l))*w;
      wsum += w;
    }
  }
  float Lc = sum/max(wsum,1e-4);
  float L = Lc/max(1.0-Lc, 1e-3);            // back out to scene linear
  /* Deliberately NOT a full normalisation. Inverting L exactly would make
     midnight and midday equally bright, which is the classic auto exposure
     mistake. uGamma < 1 leaves part of the real difference on screen: at
     0.75, night still reads about 70% as bright as dawn. */
  float target = clamp(uKey*pow(max(L, 1e-4), -uGamma), uMin, uMax);
  if(uValid < 0.5){ outC = vec4(target,L,0,1); return; }
  float prev = texture(uPrev, vec2(0.5)).r;
  float rate = target < prev ? 1.4 : 0.55;   // quick into the light, slow into the dark
  outC = vec4(prev + (target-prev)*(1.0-exp(-rate*uDt)), L, 0.0, 1.0);
}
`;

/* ------------------------- FINAL GRADE ------------------------- */
const FS_FINAL = SH_COMMON + `
uniform sampler2D uTex;
uniform sampler2D uBloom;
uniform vec2 uRes;
uniform float uExposure, uBloomAmt, uVignette, uGrain, uCA, uTime, uSat, uContrast;
uniform sampler2D uExpo;      // 1x1, the adapted exposure
uniform vec3 uLift, uGamma, uGain;
in vec2 vUV; out vec4 outC;

// AgX-ish filmic (Blender AgX approximation)
vec3 agxDefaultContrastApprox(vec3 x){
  vec3 x2=x*x; vec3 x4=x2*x2;
  return + 15.5*x4*x2 - 40.14*x4*x + 31.96*x4 - 6.868*x2*x + 0.4298*x2 + 0.1191*x - 0.00232;
}
vec3 agx(vec3 val){
  const mat3 m = mat3(0.842479062253094,0.0423282422610123,0.0423756549057051,
                      0.0784335999999992,0.878468636469772,0.0784336,
                      0.0792237451477643,0.0791661274605434,0.879142973793104);
  const float mn=-12.47393, mx=4.026069;
  val = m*val;
  val = clamp((log2(val+1e-10)-mn)/(mx-mn), 0.0, 1.0);
  return agxDefaultContrastApprox(val);
}
vec3 agxEotf(vec3 val){
  const mat3 m = mat3( 1.19687900512017,-0.0528968517574562,-0.0529716355144438,
                      -0.0980208811401368,1.15190312990417,-0.0980434501171241,
                      -0.0990297440797205,-0.0989611768448433,1.15107367264116);
  val = m*val;
  return pow(max(val,0.0), vec3(2.2));     // -> display-referred LINEAR
}
/* gentle "punchy" look: slight desaturation of extremes, warm/cool split */
vec3 agxLook(vec3 c){
  const vec3 lw = vec3(0.2126,0.7152,0.0722);
  float l = dot(c,lw);
  vec3 offset = vec3(0.0);
  vec3 slope  = vec3(1.02,1.00,0.985);
  vec3 power  = vec3(1.02,1.00,1.00);
  float sat   = 1.14;
  c = pow(max(c*slope+offset,0.0), power);
  return max(l + sat*(c-l), 0.0);
}
vec3 tonemap(vec3 c){ return agxEotf(agxLook(agx(c))); }

void main(){
  vec2 uv = vUV;
  vec2 cen = uv-0.5;
  float r2 = dot(cen,cen);
  // chromatic aberration + subtle barrel
  vec3 col;
  float ca = uCA*(0.35+r2*2.2);
  col.r = texture(uTex, uv + cen*ca*0.0016).r;
  col.g = texture(uTex, uv).g;
  col.b = texture(uTex, uv - cen*ca*0.0016).b;

  vec3 bloom = texture(uBloom, uv).rgb;
  col += bloom*uBloomAmt;

  col *= uExposure*texture(uExpo, vec2(0.5)).r;
  col = tonemap(col);                       // display-referred linear
  col = lin2srgb(clamp(col,0.0,1.0));       // -> display encoded, grade from here

  col = uGain*(col+uLift*(1.0-col));
  col = pow(max(col,0.0), 1.0/max(uGamma,vec3(0.01)));
  float l = luma(col);
  col = mix(vec3(l), col, uSat);
  col = clamp((col-0.5)*uContrast+0.5, 0.0, 1.0);

  // vignette
  float vig = 1.0 - uVignette*smoothstep(0.15,0.85,r2*1.6);
  col *= vig;

  // grain (luma-weighted, finer in highlights)
  float g = hash12(gl_FragCoord.xy + fract(uTime)*137.0)-0.5;
  col += g*uGrain*(0.35+0.65*(1.0-luma(col)));

  float dth = (hash12(gl_FragCoord.xy*0.7)-0.5)/255.0;
  col += dth;

  outC = vec4(clamp(col,0.0,1.0), 1.0);
}
`;

/* ------------------------- FXAA ------------------------- */
const FS_FXAA = SH_COMMON + `
uniform sampler2D uTex; uniform vec2 uTexel;
in vec2 vUV; out vec4 outC;
void main(){
  vec3 rgbNW=texture(uTex,vUV+vec2(-1,-1)*uTexel).rgb;
  vec3 rgbNE=texture(uTex,vUV+vec2( 1,-1)*uTexel).rgb;
  vec3 rgbSW=texture(uTex,vUV+vec2(-1, 1)*uTexel).rgb;
  vec3 rgbSE=texture(uTex,vUV+vec2( 1, 1)*uTexel).rgb;
  vec3 rgbM =texture(uTex,vUV).rgb;
  vec3 lm=vec3(0.299,0.587,0.114);
  float lNW=dot(rgbNW,lm),lNE=dot(rgbNE,lm),lSW=dot(rgbSW,lm),lSE=dot(rgbSE,lm),lM=dot(rgbM,lm);
  float lMin=min(lM,min(min(lNW,lNE),min(lSW,lSE)));
  float lMax=max(lM,max(max(lNW,lNE),max(lSW,lSE)));
  vec2 dir=vec2(-((lNW+lNE)-(lSW+lSE)),((lNW+lSW)-(lNE+lSE)));
  float dirRed=max((lNW+lNE+lSW+lSE)*0.25*0.125,0.0078125);
  float rcp=1.0/(min(abs(dir.x),abs(dir.y))+dirRed);
  dir=clamp(dir*rcp,-8.0,8.0)*uTexel;
  vec3 rgbA=0.5*(texture(uTex,vUV+dir*(1.0/3.0-0.5)).rgb+texture(uTex,vUV+dir*(2.0/3.0-0.5)).rgb);
  vec3 rgbB=rgbA*0.5+0.25*(texture(uTex,vUV+dir*-0.5).rgb+texture(uTex,vUV+dir*0.5).rgb);
  float lB=dot(rgbB,lm);
  outC=vec4((lB<lMin||lB>lMax)?rgbA:rgbB,1.0);
}
`;

/* ------------------------- sharpen ------------------------- */
const FS_SHARPEN = SH_COMMON + `
uniform sampler2D uTex; uniform vec2 uTexel; uniform float uAmount;
in vec2 vUV; out vec4 outC;
void main(){
  vec3 c = texture(uTex,vUV).rgb;
  vec3 n = texture(uTex,vUV+vec2(0.0,-uTexel.y)).rgb
         + texture(uTex,vUV+vec2(0.0, uTexel.y)).rgb
         + texture(uTex,vUV+vec2(-uTexel.x,0.0)).rgb
         + texture(uTex,vUV+vec2( uTexel.x,0.0)).rgb;
  vec3 sharp = c + (c*4.0 - n)*uAmount*0.25;
  outC = vec4(clamp(sharp,0.0,1.0),1.0);
}
`;

/* ------------------------- simple blit ------------------------- */
const FS_BLIT = `
uniform sampler2D uTex;
in vec2 vUV; out vec4 outC;
void main(){ outC = texture(uTex,vUV); }
`;

/* =========================================================================
   STUDIO : キャラクターだけを見るための最小の世界

   本編の伏見稲荷は丸ごと外してある。残っているのは、キャラクターが
   立つ床と、レンダラが世界に対して尋ねてくる数個の口だけ。地面が平ら
   だと接地とプロポーションの誤りがそのまま出るので、評価用としては
   境内より正確でもある。
   ========================================================================= */

const MAT = {
  VERMILLION: 0, BLACK: 1, STONE: 2, MOSS: 3, GRANITE: 4, BARK: 5, PLASTER: 6, FOLIAGE: 7,
  SILK: 8, CORPSE: 9, TALISMAN: 10,     // 官服 / 屍蝋 / 符
  HIWADA: 11, BRONZE: 12,               // 檜皮葺 / 銅・金具
  FUR: 13, FURC: 14, LINEN: 15,         // 毛（背）/ 毛（腹）/ 麻布
  /* 16 and up are the character, and the lighting pass switches to a
     toon path on that boundary. */
  SKIN: 16, HAIR: 17, CHAR: 18, EYE: 19, // 肌 / 髪 / 平色 / 虹彩
  OUTLINE: 20,                           // 輪郭線 — flat, unlit, tint-coloured
  FACE: 21,                              // the painted face, drawn on a canvas
  /* The garments were on LINEN (15), BELOW the toon boundary, so the
     clothes were being shaded physically while the face and hair were
     shaded as cel. One character, two lighting models. */
  CLOTH: 22,                             // 布 — toon cloth
  SCLERA: 23                             // 白目（上瞼の落とす影を含む）
};


/* the renderer asks the world for these; here they are trivial */
const KY = { lights: [], list: [] };
const WORLD = {
  areas: [], boxes: [],
  groundAt(x, z) { return { y: 0, solid: true }; },
  resolve(p, r) { }
};
function keidaiGroundY(x, z) { return 0; }
function groundHeightAt(x, z) { return { y: 0, s: 0, t: 0 }; }

/* ---------------- the set ----------------
   A flat plaza, and a low stone dais under the character. The dais is not
   decoration: a contact shadow against a known plane is the fastest way to
   see whether the feet are actually on the ground.                        */
function buildPlane(size, n, mat, uv) {
  const g = new Geo(), idx = [];
  for (let i = 0; i <= n; i++) {
    const row = [];
    for (let j = 0; j <= n; j++) {
      const x = (j / n - 0.5) * size, z = (i / n - 0.5) * size;
      row.push(g.push(x, 0, z, 0, 1, 0, (x / size + 0.5) * uv, (z / size + 0.5) * uv, mat));
    }
    idx.push(row);
  }
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++)
    g.quad(idx[i][j], idx[i + 1][j], idx[i + 1][j + 1], idx[i][j + 1]);
  return g;
}

function buildDais(r, h, seg, mat) {
  const g = new Geo(), top = [], bot = [];
  for (let j = 0; j <= seg; j++) {
    const a = (j / seg) * TAU, c = Math.cos(a), s = Math.sin(a);
    top.push(g.push(r * c, h, r * s, 0, 1, 0, 0.5 + c * 0.5, 0.5 + s * 0.5, mat));
    bot.push(g.push(r * c, 0, r * s, 0, 1, 0, 0.5 + c * 0.5, 0.5 + s * 0.5, mat));
  }
  const ctr = g.push(0, h, 0, 0, 1, 0, 0.5, 0.5, mat);
  for (let j = 0; j < seg; j++) g.tri(ctr, top[j], top[j + 1]);
  // the rim, with its own normals so it catches a highlight
  const rt = [], rb = [];
  for (let j = 0; j <= seg; j++) {
    const a = (j / seg) * TAU, c = Math.cos(a), s = Math.sin(a);
    rt.push(g.push(r * c, h, r * s, c, 0, s, (j / seg) * 6, 0, mat));
    rb.push(g.push(r * c, 0, r * s, c, 0, s, (j / seg) * 6, 0.5, mat));
  }
  for (let j = 0; j < seg; j++) g.quad(rt[j], rb[j], rb[j + 1], rt[j + 1]);
  return g;
}

function buildScene(quality) {
  const draws = [], shadowDraws = [], lights = [];
  const detail = quality >= 2;

  const floor = new Mesh(buildPlane(90, detail ? 48 : 16, MAT.STONE, 26));
  draws.push({ mesh: floor, name: 'floor' });
  shadowDraws.push({ mesh: floor });

  const dais = new Mesh(buildDais(1.65, 0.075, detail ? 72 : 24, MAT.GRANITE));
  draws.push({ mesh: dais, name: 'dais' });
  shadowDraws.push({ mesh: dais });

  for (const m of [floor, dais]) m.setInstances([{ m: M4.create(), tint: [1, 1, 1, 0.3] }]);

  R.toriiTs = [];
  return { draws, shadowDraws, lights };
}
/* ==== c2_astro.js ==== */
/* =========================================================================
   SOLAR ASTRONOMY

   The sun is not two free sliders. It is a calendar.

   The player is given two dials — 節気 (which of the 24 solar terms) and
   時刻 (time of day) — and the sun's elevation and azimuth follow from
   them by real astronomy at this latitude. Whole regions of the sky are
   therefore unreachable, which is what makes a shadow puzzle solvable.
   ========================================================================= */

const SITE = { lat: 34.9671, lon: 135.7727, meridian: 135.0 };   // Fushimi Inari / JST
const OBLIQ = 23.4397 * PI / 180;

/* Compass bearing of world +Z, which is the direction the approach climbs.
   The real Senbon Torii ascends ENE, so the sunrise sweeps across the
   corridor axis over the course of the year. That sweep is the game. */
const SCENE_BEARING = 75.0;

/* Kyoto sits WNW of the mountain; its glow is on that horizon at night. */
const CITY_BEARING = 300.0;

/* 二十四節気 — the terms sit at exactly 15 degrees of solar longitude
   apart starting from 立春 at 315, so declination follows from the index
   alone with no calendar lookup. */
const SEKKI = [
  ['立春', '2月4日'], ['雨水', '2月19日'], ['啓蟄', '3月6日'], ['春分', '3月20日'],
  ['清明', '4月5日'], ['穀雨', '4月20日'], ['立夏', '5月5日'], ['小満', '5月21日'],
  ['芒種', '6月6日'], ['夏至', '6月21日'], ['小暑', '7月7日'], ['大暑', '7月23日'],
  ['立秋', '8月7日'], ['処暑', '8月23日'], ['白露', '9月8日'], ['秋分', '9月23日'],
  ['寒露', '10月8日'], ['霜降', '10月23日'], ['立冬', '11月7日'], ['小雪', '11月22日'],
  ['大雪', '12月7日'], ['冬至', '12月22日'], ['小寒', '1月5日'], ['大寒', '1月20日']
];

function sekkiToLambda(i) { return ((315 + 15 * i) * PI / 180) % TAU; }
function declination(lam) { return Math.asin(Math.sin(OBLIQ) * Math.sin(lam)); }
function dayOfYear(lam) { return (79.5 + (lam / TAU) * 365.2422) % 365.2422; }

/* equation of time, in minutes: how far the real sun runs ahead of the clock */
function equationOfTime(N) {
  const B = TAU * (N - 81) / 364.0;
  return 9.87 * Math.sin(2 * B) - 7.53 * Math.cos(B) - 1.5 * Math.sin(B);
}
function clockToHourAngle(hour, N) {
  const solar = hour + equationOfTime(N) / 60 + (SITE.lon - SITE.meridian) / 15;
  return (solar - 12) * 15 * PI / 180;
}

/* sun direction in the local horizontal frame: [east, north, up] */
function sunENU(lam, hour) {
  const dec = declination(lam);
  const H = clockToHourAngle(hour, dayOfYear(lam)), phi = SITE.lat * PI / 180;
  const cd = Math.cos(dec), sd = Math.sin(dec);
  const cp = Math.cos(phi), sp = Math.sin(phi);
  const cH = Math.cos(H), sH = Math.sin(H);
  return [-cd * sH, -cd * cH * sp + sd * cp, cd * cH * cp + sd * sp];
}

/* The world is right handed with +Y up, so at SCENE_BEARING 180 this is
   the textbook mapping: +X east, +Z south. */
function enuToWorld(v) {
  const th = SCENE_BEARING * PI / 180, ct = Math.cos(th), st = Math.sin(th);
  return [-v[0] * ct + v[1] * st, v[2], v[0] * st + v[1] * ct];
}
/* the same 2x2 is its own inverse (it is a reflection), hence: */
function worldToBearing(w) {
  const th = SCENE_BEARING * PI / 180, ct = Math.cos(th), st = Math.sin(th);
  const e = -ct * w[0] + st * w[2], nn = st * w[0] + ct * w[2];
  return ((Math.atan2(e, nn) * 180 / PI) % 360 + 360) % 360;
}
function bearingToWorld(deg) {
  const b = deg * PI / 180;
  return enuToWorld([Math.sin(b), Math.cos(b), 0]);
}

/* sunrise / solar noon / sunset in clock hours. -0.833 deg accounts for
   refraction plus the sun's own radius. */
function dayLength(lam) {
  const dec = declination(lam), phi = SITE.lat * PI / 180;
  const noon = 12 - equationOfTime(dayOfYear(lam)) / 60 - (SITE.lon - SITE.meridian) / 15;
  const c = (Math.sin(-0.833 * PI / 180) - Math.sin(phi) * Math.sin(dec)) /
    (Math.cos(phi) * Math.cos(dec));
  if (c <= -1) return { rise: noon - 11.99, noon, set: noon + 11.99 };
  if (c >= 1) return { rise: noon, noon, set: noon };
  const H = Math.acos(c) * 180 / PI / 15;
  return { rise: noon - H, noon, set: noon + H };
}

function fmtHM(h) {
  const m = Math.round((((h % 24) + 24) % 24) * 60);
  return String(Math.floor(m / 60) % 24).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
}

/* Critically damped follow: framerate independent, and it takes the short
   way round midnight. It snaps once inside eps, because an exponential
   never actually arrives and a puzzle that asks the player to stand at
   冬至 has to be able to tell when they are standing at 冬至. */
function dampWrap(cur, tgt, period, lambda, dt, eps) {
  let d = (tgt - cur) % period;
  if (d > period / 2) d -= period;
  if (d < -period / 2) d += period;
  if (Math.abs(d) < (eps || 0)) return tgt;
  const v = cur + d * (1 - Math.exp(-lambda * dt));
  return ((v % period) + period) % period;
}

/* ---------------- material texture arrays ---------------- */
const NUM_LAYERS = 24;
const TOON_MIN = 16;
function bakeMaterials(res) {
  const arrA = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D_ARRAY, arrA);
  const mips = Math.floor(Math.log2(res)) + 1;
  gl.texStorage3D(gl.TEXTURE_2D_ARRAY, mips, gl.SRGB8_ALPHA8, res, res, NUM_LAYERS);
  const arrB = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D_ARRAY, arrB);
  gl.texStorage3D(gl.TEXTURE_2D_ARRAY, mips, gl.RGBA8, res, res, NUM_LAYERS);

  const fb = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
  gl.drawBuffers([gl.COLOR_ATTACHMENT0, gl.COLOR_ATTACHMENT1]);
  gl.viewport(0, 0, res, res);
  gl.disable(gl.DEPTH_TEST);
  const p = use(R.prog.bake);
  u1f(p, 'uRes', res);
  for (let i = 0; i < NUM_LAYERS; i++) {
    gl.framebufferTextureLayer(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, arrA, 0, i);
    gl.framebufferTextureLayer(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT1, arrB, 0, i);
    u1i(p, 'uLayer', i);
    drawFS();
  }
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.deleteFramebuffer(fb);

  bakeFaceLayer(arrA, arrB, res, MAT.FACE);

  for (const t of [arrA, arrB]) {
    gl.bindTexture(gl.TEXTURE_2D_ARRAY, t);
    gl.generateMipmap(gl.TEXTURE_2D_ARRAY);
    gl.texParameteri(gl.TEXTURE_2D_ARRAY, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
    gl.texParameteri(gl.TEXTURE_2D_ARRAY, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D_ARRAY, gl.TEXTURE_WRAP_S, gl.REPEAT);
    gl.texParameteri(gl.TEXTURE_2D_ARRAY, gl.TEXTURE_WRAP_T, gl.REPEAT);
    const ext = gl.getExtension('EXT_texture_filter_anisotropic');
    if (ext) gl.texParameterf(gl.TEXTURE_2D_ARRAY, ext.TEXTURE_MAX_ANISOTROPY_EXT,
      Math.min(8, gl.getParameter(ext.MAX_TEXTURE_MAX_ANISOTROPY_EXT)));
  }
  R.matA = arrA; R.matB = arrB;
}

/* ---------------- sky / IBL ---------------- */
function makeCube(size, mips) {
  const t = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_CUBE_MAP, t);
  gl.texStorage2D(gl.TEXTURE_CUBE_MAP, mips, gl.RGBA16F, size, size);
  gl.texParameteri(gl.TEXTURE_CUBE_MAP, gl.TEXTURE_MIN_FILTER, mips > 1 ? gl.LINEAR_MIPMAP_LINEAR : gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_CUBE_MAP, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_CUBE_MAP, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_CUBE_MAP, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  return { tex: t, size, mips };
}

const SHADOW_SPLITS = [0.1, 6.0, 34.0, 105.0];
function makeShadowRT(size) {
  const t = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texStorage2D(gl.TEXTURE_2D, 1, gl.DEPTH_COMPONENT24, size, size);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_COMPARE_MODE, gl.COMPARE_REF_TO_TEXTURE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_COMPARE_FUNC, gl.LEQUAL);
  const fb = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.DEPTH_ATTACHMENT, gl.TEXTURE_2D, t, 0);
  gl.drawBuffers([gl.NONE]);
  gl.readBuffer(gl.NONE);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  return { tex: t, fb, size };
}

function computeCascade(idx, sunDir) {
  const n = SHADOW_SPLITS[idx], f = SHADOW_SPLITS[idx + 1];
  const aspect = R.w / R.h;
  const tanY = Math.tan(CAM.fov / 2), tanX = tanY * aspect;
  // frustum corners in view space, then to world
  const inv = M4.create(); M4.invert(inv, CAM.view);
  const pts = [];
  for (const d of [n, f]) for (const sy of [-1, 1]) for (const sx of [-1, 1]) {
    const v = [sx * tanX * d, sy * tanY * d, -d, 1];
    pts.push([
      inv[0] * v[0] + inv[4] * v[1] + inv[8] * v[2] + inv[12],
      inv[1] * v[0] + inv[5] * v[1] + inv[9] * v[2] + inv[13],
      inv[2] * v[0] + inv[6] * v[1] + inv[10] * v[2] + inv[14]
    ]);
  }
  let c = [0, 0, 0];
  for (const p of pts) { c[0] += p[0]; c[1] += p[1]; c[2] += p[2]; }
  c = scl(c, 1 / pts.length);
  let radius = 0;
  for (const p of pts) radius = Math.max(radius, dist(p, c));
  radius = Math.ceil(radius * 16) / 16;

  const size = R.shadow[idx].size;
  const texelSize = radius * 2 / size;
  c = [Math.floor(c[0] / texelSize) * texelSize, Math.floor(c[1] / texelSize) * texelSize, Math.floor(c[2] / texelSize) * texelSize];

  const eye = add(c, scl(sunDir, radius + 40));
  const up = Math.abs(sunDir[1]) > 0.98 ? [0, 0, 1] : [0, 1, 0];
  const view = M4.create(); M4.lookAt(view, eye, c, up);
  const proj = M4.create(); M4.ortho(proj, -radius, radius, -radius, radius, 0.2, radius * 2 + 90);
  const vp = M4.create(); M4.mul(vp, proj, view);
  return vp;
}

/* ---------------- render targets ---------------- */
function allocTargets(w, h) {
  R.w = w; R.h = h;
  const hw = Math.max(1, w >> 1), hh = Math.max(1, h >> 1);
  const del = k => { if (R.rt[k]) { gl.deleteFramebuffer(R.rt[k].fb); for (const t of R.rt[k].texs) gl.deleteTexture(t); if (R.rt[k].depth) gl.deleteTexture(R.rt[k].depth); } };
  for (const k in R.rt) del(k);
  R.rt = {};
  R.rt.gbuf = makeRT(w, h, { count: 3, formats: ['rgba8', 'rgba16f', 'rgba16f'], depth: true });
  R.rt.hdr = makeRT(w, h, { format: 'rgba16f' });
  R.rt.hdr2 = makeRT(w, h, { format: 'rgba16f' });
  R.rt.taa = makeRT(w, h, { format: 'rgba16f' });
  R.rt.hist = makeRT(w, h, { format: 'rgba16f' });
  R.rt.ao = makeRT(hw, hh, { format: 'r8' });
  R.rt.ao2 = makeRT(hw, hh, { format: 'r8' });
  R.rt.ssr = makeRT(hw, hh, { format: 'rgba16f' });
  R.rt.ssr2 = makeRT(hw, hh, { format: 'rgba16f' });
  R.rt.vol = makeRT(hw, hh, { format: 'rgba16f' });
  R.rt.vol2 = makeRT(hw, hh, { format: 'rgba16f' });
  R.rt.dof = makeRT(w, h, { format: 'rgba16f' });
  R.rt.ldr = makeRT(w, h, { format: 'rgba8' });
  R.bloom = [];
  let bw = w >> 1, bh = h >> 1;
  for (let i = 0; i < 6 && bw > 8 && bh > 8; i++) {
    R.bloom.push({ a: makeRT(bw, bh, { format: 'rgba16f' }), b: makeRT(bw, bh, { format: 'rgba16f' }), w: bw, h: bh });
    bw >>= 1; bh >>= 1;
  }
  R.histValid = false;
}

/* ---------------- passes ---------------- */
R.only = null;
R.debugView = null;
R.cullView = 78;
R.cullShadow = 62;
function drawGeometry(prog, list, isShadow) {
  for (const d of list) {
    if (R.only && d.name && d.name !== R.only) continue;
    if (d.zMax !== undefined && CAM.pos[2] > d.zMax) continue;
    u1i(prog, 'uInstanced', d.mesh.instances ? 1 : 0);
    u1i(prog, 'uAlphaMask', d.alphaMask ? 1 : 0);
    u1f(prog, 'uWind', d.wind || 0);
    if (!isShadow) {
      u1i(prog, 'uDecalMode', d.decal ? 1 : 0);
      const e = d.emissive || [0, 0, 0];
      const eg = d.name === 'cores' ? R.lanternGlow : 1.0;
      u3f(prog, 'uEmissive', e[0] * eg, e[1] * eg, e[2] * eg);
      u1f(prog, 'uNormalStrength', d.normalStrength === undefined ? 1.0 : d.normalStrength);
    }
    if (!d.mesh.instances) umat(prog, 'uModel', IDENT);
    if (d.twoSided) gl.disable(gl.CULL_FACE); else gl.enable(gl.CULL_FACE);
    d.mesh.draw(CAM.t, isShadow ? R.cullShadow : R.cullView);
  }
  gl.enable(gl.CULL_FACE);
}
const IDENT = M4.create();

function renderFrame(dt) {
  const S = R.scene;
  R.groundY = groundHeightAt(CAM.pos[0], CAM.pos[2]).y;
  const sd = sunDirection();
  if (R.skyDirty) bakeSky();

  /* ---- shadows ---- */
  gl.enable(gl.DEPTH_TEST);
  gl.depthFunc(gl.LEQUAL);
  gl.enable(gl.CULL_FACE);
  gl.cullFace(gl.BACK);
  const p_sh = use(R.prog.shadow);
  u1f(p_sh, 'uTime', R.time);
  tex(p_sh, 'uMatB', 1, R.matB, gl.TEXTURE_2D_ARRAY);
  for (let i = 0; i < 3; i++) {
    R.cascadeVP[i] = computeCascade(i, sd);
    gl.bindFramebuffer(gl.FRAMEBUFFER, R.shadow[i].fb);
    gl.viewport(0, 0, R.shadow[i].size, R.shadow[i].size);
    gl.clear(gl.DEPTH_BUFFER_BIT);
    umat(p_sh, 'uLightVP', R.cascadeVP[i]);
    gl.enable(gl.POLYGON_OFFSET_FILL);
    gl.polygonOffset(1.6, 3.0);
    drawGeometry(p_sh, S.shadowDraws, true);
    gl.disable(gl.POLYGON_OFFSET_FILL);
  }

  /* ---- gbuffer ---- */
  bindRT(R.rt.gbuf);
  gl.clearColor(0, 0, 0, 0);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  const p_g = use(R.prog.gbuf);
  umat(p_g, 'uViewProj', CAM.viewProj);
  u1f(p_g, 'uTime', R.time);
  u3f(p_g, 'uCamPos', CAM.pos[0], CAM.pos[1], CAM.pos[2]);
  u1f(p_g, 'uWetness', CFG.wetness);
  tex(p_g, 'uMatA', 0, R.matA, gl.TEXTURE_2D_ARRAY);
  tex(p_g, 'uMatB', 1, R.matB, gl.TEXTURE_2D_ARRAY);
  tex(p_g, 'uDecal', 2, R.decalTex);
  drawGeometry(p_g, S.draws, false);

  gl.disable(gl.DEPTH_TEST);

  /* ---- AO ---- */
  if (CFG.ao) {
    bindRT(R.rt.ao);
    const p = use(R.prog.ao);
    tex(p, 'uDepth', 0, R.rt.gbuf.depth);
    tex(p, 'uGN', 1, R.rt.gbuf.texs[1]);
    umat(p, 'uInvProj', CAM.invProj);
    umat(p, 'uView', CAM.view);
    umat(p, 'uInvViewProj', CAM.invViewProj);
    u2f(p, 'uNearFar', CAM.near, CAM.far);
    u1f(p, 'uRadius', 0.42);
    u1f(p, 'uIntensity', 1.45);
    u2f(p, 'uRes', R.rt.ao.w, R.rt.ao.h);
    u1f(p, 'uTime', R.time);
    drawFS();
    // bilateral blur
    const pb = use(R.prog.blur);
    tex(pb, 'uDepthT', 1, R.rt.gbuf.depth);
    bindRT(R.rt.ao2); tex(pb, 'uTex', 0, R.rt.ao.tex);
    u2f(pb, 'uDir', 1, 0); u2f(pb, 'uTexel', 1 / R.rt.ao.w, 1 / R.rt.ao.h); drawFS();
    bindRT(R.rt.ao); tex(pb, 'uTex', 0, R.rt.ao2.tex);
    u2f(pb, 'uDir', 0, 1); drawFS();
  } else {
    bindRT(R.rt.ao); gl.clearColor(1, 1, 1, 1); gl.clear(gl.COLOR_BUFFER_BIT);
  }

  /* ---- deferred lighting ---- */
  bindRT(R.rt.hdr);
  const p_l = use(R.prog.light);
  tex(p_l, 'uGA', 0, R.rt.gbuf.texs[0]);
  tex(p_l, 'uGN', 1, R.rt.gbuf.texs[1]);
  tex(p_l, 'uGE', 2, R.rt.gbuf.texs[2]);
  tex(p_l, 'uDepth', 3, R.rt.gbuf.depth);
  tex(p_l, 'uIrr', 4, R.irrCube.tex, gl.TEXTURE_CUBE_MAP);
  tex(p_l, 'uPref', 5, R.prefCube.tex, gl.TEXTURE_CUBE_MAP);
  tex(p_l, 'uAO', 6, R.rt.ao.tex);
  tex(p_l, 'uSh0', 7, R.shadow[0].tex);
  tex(p_l, 'uSh1', 8, R.shadow[1].tex);
  tex(p_l, 'uSh2', 9, R.shadow[2].tex);
  tex(p_l, 'uSky', 10, R.skyCube.tex, gl.TEXTURE_CUBE_MAP);
  umat(p_l, 'uInvViewProj', CAM.invViewProj);
  umat(p_l, 'uInvProj', CAM.invProj);
  umat(p_l, 'uView', CAM.view);
  umat(p_l, 'uShVP0', R.cascadeVP[0]);
  umat(p_l, 'uShVP1', R.cascadeVP[1]);
  umat(p_l, 'uShVP2', R.cascadeVP[2]);
  u3f(p_l, 'uCamPos', CAM.pos[0], CAM.pos[1], CAM.pos[2]);
  u2f(p_l, 'uNearFar', CAM.near, CAM.far);
  u3f(p_l, 'uSunDir', sd[0], sd[1], sd[2]);
  u3v(p_l, 'uSunColor', R.sunColor);
  u3v(p_l, 'uBounce', R.bounce);
  u3v(p_l, 'uAmbTint', R.ambTint);
  u3v(p_l, 'uHazeColor', R.fogColor);
  u1f(p_l, 'uHazeAmt', 0.86);
  u1f(p_l, 'uPrefMips', R.prefCube.mips);
  u1f(p_l, 'uAmbient', R.ambient);
  u1f(p_l, 'uTime', R.time);
  u1i(p_l, 'uShadowQuality', R.quality);
  u1f(p_l, 'uStarAmt', R.starAmt);
  u3v(p_l, 'uHairRing', R.hairRing || new Float32Array(3));
  u3v(p_l, 'uPole', R.pole);
  u1f(p_l, 'uStarRot', -R.hourAngle);
  u2f(p_l, 'uShadowTexel', 1 / R.shadow[0].size, 1 / R.shadow[0].size);
  // lights
  const lp = new Float32Array(64), lc = new Float32Array(64);
  // burning kyonshi go first so they never fall off the end of the 16 slots,
  // then the nearest lanterns: the precinct alone has more than the budget
  let stat = S.lights;
  if (stat.length + KY.lights.length > 16) {
    const cx = CAM.pos[0], cz = CAM.pos[2];
    const d2 = L => (L.pos[0] - cx) * (L.pos[0] - cx) + (L.pos[2] - cz) * (L.pos[2] - cz);
    stat = stat.slice().sort((a, b) => d2(a) - d2(b)).slice(0, Math.max(0, 16 - KY.lights.length));
  }
  const LL = KY.lights.length ? KY.lights.concat(stat) : stat;
  const nL = Math.min(LL.length, 16);
  for (let i = 0; i < nL; i++) {
    const L = LL[i];
    const fl = 0.86 + 0.14 * Math.sin(R.time * 3.1 + L.flicker) + 0.06 * Math.sin(R.time * 8.7 + L.flicker * 2.3);
    lp.set([L.pos[0], L.pos[1], L.pos[2], L.radius], i * 4);
    lc.set([L.color[0], L.color[1], L.color[2], L.intensity * fl * (L.dyn ? 1 : R.lanternGlow)], i * 4);
  }
  u1i(p_l, 'uNumLights', nL);
  u4v(p_l, 'uLightPos', lp);
  u4v(p_l, 'uLightCol', lc);
  drawFS();

  /* ---- SSR ---- */
  if (CFG.ssr > 0) {
    bindRT(R.rt.ssr);
    const p = use(R.prog.ssr);
    tex(p, 'uColor', 0, R.rt.hdr.tex);
    tex(p, 'uDepth', 1, R.rt.gbuf.depth);
    tex(p, 'uGN', 2, R.rt.gbuf.texs[1]);
    umat(p, 'uInvProj', CAM.invProj);
    umat(p, 'uInvViewProj', CAM.invViewProj);
    umat(p, 'uView', CAM.view);
    umat(p, 'uProj', CAM.projNoJitter);
    u2f(p, 'uNearFar', CAM.near, CAM.far);
    u3f(p, 'uCamPos', CAM.pos[0], CAM.pos[1], CAM.pos[2]);
    u2f(p, 'uRes', R.rt.ssr.w, R.rt.ssr.h);
    u1f(p, 'uTime', R.time);
    u1f(p, 'uMaxRough', 0.72);
    drawFS();
    const pb = use(R.prog.blur);
    tex(pb, 'uDepthT', 1, R.rt.gbuf.depth);
    bindRT(R.rt.ssr2); tex(pb, 'uTex', 0, R.rt.ssr.tex);
    u2f(pb, 'uDir', 1, 0); u2f(pb, 'uTexel', 1 / R.rt.ssr.w, 1 / R.rt.ssr.h); drawFS();
    bindRT(R.rt.ssr); tex(pb, 'uTex', 0, R.rt.ssr2.tex);
    u2f(pb, 'uDir', 0, 1); drawFS();
  } else { bindRT(R.rt.ssr); gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT); }

  /* ---- volumetric ---- */
  if (CFG.volumetric) {
    bindRT(R.rt.vol);
    const p = use(R.prog.vol);
    tex(p, 'uDepth', 0, R.rt.gbuf.depth);
    tex(p, 'uSh0', 1, R.shadow[0].tex);
    tex(p, 'uSh1', 2, R.shadow[1].tex);
    tex(p, 'uSh2', 3, R.shadow[2].tex);
    umat(p, 'uInvViewProj', CAM.invViewProj);
    umat(p, 'uInvProj', CAM.invProj);
    umat(p, 'uView', CAM.view);
    umat(p, 'uShVP0', R.cascadeVP[0]);
    umat(p, 'uShVP1', R.cascadeVP[1]);
    umat(p, 'uShVP2', R.cascadeVP[2]);
    u3f(p, 'uCamPos', CAM.pos[0], CAM.pos[1], CAM.pos[2]);
    u2f(p, 'uNearFar', CAM.near, CAM.far);
    u3f(p, 'uSunDir', sd[0], sd[1], sd[2]);
    u3v(p, 'uSunColor', R.sunColor);
    u3v(p, 'uAmbientFog', R.fogColor);
    u1f(p, 'uTime', R.time);
    u1f(p, 'uDensity', CFG.volDensity * R.fogScale);
    u1f(p, 'uFogHeight', R.groundY + 0.55);
    u1f(p, 'uAnisotropy', 0.46);
    u1i(p, 'uSteps', R.quality >= 2 ? 40 : 20);
    drawFS();
    const pb = use(R.prog.blur);
    tex(pb, 'uDepthT', 1, R.rt.gbuf.depth);
    bindRT(R.rt.vol2); tex(pb, 'uTex', 0, R.rt.vol.tex);
    u2f(pb, 'uDir', 1, 0); u2f(pb, 'uTexel', 1 / R.rt.vol.w, 1 / R.rt.vol.h); drawFS();
    bindRT(R.rt.vol); tex(pb, 'uTex', 0, R.rt.vol2.tex);
    u2f(pb, 'uDir', 0, 1); drawFS();
  } else { bindRT(R.rt.vol); gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT); }

  /* ---- composite ---- */
  bindRT(R.rt.hdr2);
  const p_c = use(R.prog.comp);
  tex(p_c, 'uColor', 0, R.rt.hdr.tex);
  tex(p_c, 'uSSR', 1, R.rt.ssr.tex);
  tex(p_c, 'uVolume', 2, R.rt.vol.tex);
  tex(p_c, 'uDepth', 3, R.rt.gbuf.depth);
  tex(p_c, 'uGN', 4, R.rt.gbuf.texs[1]);
  tex(p_c, 'uGA', 5, R.rt.gbuf.texs[0]);
  tex(p_c, 'uPref', 6, R.prefCube.tex, gl.TEXTURE_CUBE_MAP);
  umat(p_c, 'uInvViewProj', CAM.invViewProj);
  umat(p_c, 'uInvProj', CAM.invProj);
  umat(p_c, 'uView', CAM.view);
  u3f(p_c, 'uCamPos', CAM.pos[0], CAM.pos[1], CAM.pos[2]);
  u2f(p_c, 'uNearFar', CAM.near, CAM.far);
  u3f(p_c, 'uSunDir', sd[0], sd[1], sd[2]);
  u3v(p_c, 'uSunColor', R.sunColor);
  u3v(p_c, 'uFogColor', R.fogColor);
  u3v(p_c, 'uFogColorSun', R.fogColorSun);
  u1f(p_c, 'uFogDensity', CFG.fogDensity * R.fogScale);
  u1f(p_c, 'uFogHeight', R.groundY + 1.8);
  u1f(p_c, 'uSSRStrength', CFG.ssr);
  drawFS();

  /* ---- TAA ---- */
  let srcTex = R.rt.hdr2.tex;
  if (CFG.taa) {
    bindRT(R.rt.taa);
    const p = use(R.prog.taa);
    tex(p, 'uCur', 0, R.rt.hdr2.tex);
    tex(p, 'uHist', 1, R.histValid ? R.rt.hist.tex : R.rt.hdr2.tex);
    tex(p, 'uDepth', 2, R.rt.gbuf.depth);
    umat(p, 'uInvViewProj', CAM.invViewProj);
    umat(p, 'uPrevViewProj', CAM.prevViewProj);
    u2f(p, 'uTexel', 1 / R.w, 1 / R.h);
    u1f(p, 'uBlend', R.histValid ? 0.88 - 0.34 * R.sunMotion : 0.0);
    drawFS();
    // copy to history
    bindRT(R.rt.hist);
    const pb = use(R.prog.blit);
    tex(pb, 'uTex', 0, R.rt.taa.tex);
    drawFS();
    R.histValid = true;
    srcTex = R.rt.taa.tex;
  }

  /* ---- DOF ---- */
  if (CFG.dof) {
    bindRT(R.rt.dof);
    const p = use(R.prog.dof);
    tex(p, 'uTex', 0, srcTex);
    tex(p, 'uDepth', 1, R.rt.gbuf.depth);
    u2f(p, 'uNearFar', CAM.near, CAM.far);
    u2f(p, 'uTexel', 1 / R.w, 1 / R.h);
    u1f(p, 'uFocus', CFG.focusDist);
    u1f(p, 'uRange', 16.0);
    u1f(p, 'uMaxCoC', 5.0 * CFG.aperture * (R.h / 900));
    drawFS();
    srcTex = R.rt.dof.tex;
  }

  /* ---- auto exposure: measure this frame, adapt in a 1x1 target ---- */
  {
    const cur = R.meter[R.meterIdx], prev = R.meter[R.meterIdx ^ 1];
    bindRT(cur);
    const p = use(R.prog.meter);
    tex(p, 'uScene', 0, srcTex);
    tex(p, 'uPrev', 1, prev.tex);
    u1f(p, 'uDt', Math.min(dt, 0.1));
    // key calibrated so an equinox dawn lands on the exposure this scene
    // was originally hand graded at (1.05)
    u1f(p, 'uKey', 0.112);
    u1f(p, 'uGamma', 0.75);
    u1f(p, 'uMin', 0.15);
    u1f(p, 'uMax', 8.0);
    u1f(p, 'uValid', (R.meterValid && !R.expoSnap) ? 1 : 0);
    drawFS();
    R.meterIdx ^= 1;
    R.meterValid = true;
    R.expoSnap = false;
    R.expoTex = cur.tex;
  }

  /* ---- bloom ---- */
  {
    const b0 = R.bloom[0];
    bindRT(b0.a);
    let p = use(R.prog.bright);
    tex(p, 'uTex', 0, srcTex);
    tex(p, 'uExpo', 1, R.expoTex);
    u1f(p, 'uExpoBias', CFG.exposure);
    u1f(p, 'uThreshold', 1.55); u1f(p, 'uSoft', 0.65);
    drawFS();
    p = use(R.prog.down);
    for (let i = 1; i < R.bloom.length; i++) {
      bindRT(R.bloom[i].a);
      tex(p, 'uTex', 0, R.bloom[i - 1].a.tex);
      u2f(p, 'uTexel', 1 / R.bloom[i - 1].w, 1 / R.bloom[i - 1].h);
      drawFS();
    }
    p = use(R.prog.up);
    for (let i = R.bloom.length - 2; i >= 0; i--) {
      const src = (i === R.bloom.length - 2) ? R.bloom[i + 1].a : R.bloom[i + 1].b;
      bindRT(R.bloom[i].b);
      tex(p, 'uTex', 0, src.tex);
      tex(p, 'uPrev', 1, R.bloom[i].a.tex);
      u2f(p, 'uTexel', 1 / R.bloom[i + 1].w, 1 / R.bloom[i + 1].h);
      u1f(p, 'uScale', 0.82);
      drawFS();
    }
  }

  /* ---- final ---- */
  bindRT(R.rt.ldr);
  const p_f = use(R.prog.final);
  tex(p_f, 'uTex', 0, srcTex);
  tex(p_f, 'uBloom', 1, R.bloom.length > 1 ? R.bloom[0].b.tex : R.bloom[0].a.tex);
  u2f(p_f, 'uRes', R.w, R.h);
  tex(p_f, 'uExpo', 2, R.expoTex);
  u1f(p_f, 'uExposure', CFG.exposure);
  u1f(p_f, 'uBloomAmt', CFG.bloom);
  u1f(p_f, 'uVignette', CFG.vignette + CFG.curse * 0.40 + R.bellFlash * 0.10);
  u1f(p_f, 'uGrain', CFG.grain);
  u1f(p_f, 'uCA', CFG.ca);
  u1f(p_f, 'uTime', R.time);
  u1f(p_f, 'uSat', 1.10 - CFG.curse * 0.66);
  u1f(p_f, 'uContrast', 1.07);
  u3v(p_f, 'uLift', R.lift);
  u3v(p_f, 'uGamma', R.gammaG);
  u3v(p_f, 'uGain', R.gain);
  drawFS();

  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, R.canvas.width, R.canvas.height);
  if (R.debugView) {
    const map = { ao: R.rt.ao.tex, ssr: R.rt.ssr.tex, vol: R.rt.vol.tex,
                  albedo: R.rt.gbuf.texs[0], normal: R.rt.gbuf.texs[1], extra: R.rt.gbuf.texs[2],
                  hdr: R.rt.hdr.tex, bloom: R.bloom[0].b.tex };
    const pd = use(R.prog.blit);
    tex(pd, 'uTex', 0, map[R.debugView] || R.rt.ao.tex);
    drawFS();
    return;
  }
  const p_x = use(CFG.taa ? R.prog.sharpen : R.prog.fxaa);
  tex(p_x, 'uTex', 0, R.rt.ldr.tex);
  u2f(p_x, 'uTexel', 1 / R.w, 1 / R.h);
  u1f(p_x, 'uAmount', 0.62);
  drawFS();
}

/* ---------------- lighting derived from the physical beam ----------------

   The sun's colour is not art directed, it is the transmittance of the
   atmosphere along the beam. Rayleigh plus Mie optical depth at the zenith,
   times the relative air mass, exponentiated. That single expression gives
   warm white at noon and deep red on the horizon at every latitude and
   every season without a hand tuned gradient, which matters here because
   the player can now stand anywhere on the arc.                            */

const TAU_RAYLEIGH = [0.0464, 0.1079, 0.2646];   // betaR * scale height
const TAU_MIE = [0.0580, 0.0552, 0.0524];   // betaM * scale height

function airMass(elevRad) {
  // Kasten-Young. Below about -1.4 deg the beam is gone anyway.
  const h = Math.max(elevRad * 180 / PI, -1.4);
  return 1.0 / (Math.sin(h * PI / 180) + 0.50572 * Math.pow(h + 6.07995, -1.6364));
}

function updateLightingPalette() {
  const e = CFG.sunElev;
  const m = airMass(e), tb = CFG.turbidity;
  const T = [
    Math.exp(-(TAU_RAYLEIGH[0] + TAU_MIE[0] * tb) * m),
    Math.exp(-(TAU_RAYLEIGH[1] + TAU_MIE[1] * tb) * m),
    Math.exp(-(TAU_RAYLEIGH[2] + TAU_MIE[2] * tb) * m)
  ];
  // the disc sets over its own diameter rather than switching off
  const setFade = smoothstep(-0.0155, 0.0075, e);
  const K = 11.0 * setFade;
  R.sunColor = new Float32Array([K * T[0], K * T[1], K * T[2]]);

  const day = smoothstep(-0.16, 0.30, e);
  const dusk = smoothstep(0.34, -0.02, e);          // 1 when the sun is low or gone
  const t = smoothstep(0.0, 0.22, e);

  // the IBL cube already carries the sky's own brightness, so this stays
  // near constant and only lifts a little to keep twilight readable
  // a bright midday sky delivers far more skylight into a covered corridor
  // than a dusk sky does, so this rises with the sun, and only lifts again
  // at night so that lantern-lit twilight stays readable
  R.ambient = lerp(0.30, 0.72, day) + 0.26 * smoothstep(-0.02, -0.16, e);
  R.bounce = new Float32Array([0.062 * (1 - t * 0.4), 0.019, 0.009]);
  R.ambTint = new Float32Array([0.74, 0.90, 1.22]);
  R.fogColor = new Float32Array([
    lerp(0.055, 0.030, day), lerp(0.068, 0.046, day), lerp(0.098, 0.082, day)]);
  R.fogColorSun = new Float32Array([0.72, 0.40, 0.22]);
  R.lift = new Float32Array([0.010, 0.014, 0.028]);
  R.gammaG = new Float32Array([1.00, 1.00, 1.01]);
  const cz = CFG.curse || 0;
  R.gain = new Float32Array([1.03 + cz * 0.34, 0.995 - cz * 0.24, 0.965 - cz * 0.20]);

  // lanterns take over as the sun goes; stars come out after it has gone
  R.lanternGlow = 0.15 + 1.15 * dusk;
  R.starAmt = smoothstep(0.020, -0.130, e);

}

/* ---------------- the two dials drive everything ---------------- */
function updateSun(dt) {
  if (CFG.timelapse) setHour(CFG.hourTarget + dt * CFG.lapseSpeed, true);
  if (KEYS['q']) setHour(CFG.hourTarget - dt * 1.7, true);
  if (KEYS['e']) setHour(CFG.hourTarget + dt * 1.7, true);

  CFG.hour = dampWrap(CFG.hour, CFG.hourTarget, 24, 5.5, dt, 1 / 3600);   // 1 second
  CFG.sekki = dampWrap(CFG.sekki, CFG.sekkiTarget, 24, 3.2, dt, 1e-4);

  const lam = sekkiToLambda(CFG.sekki);
  const sd = norm(enuToWorld(sunENU(lam, CFG.hour)));
  const prev = R.sunDir || sd;
  R.sunDir = sd;
  R.hourAngle = clockToHourAngle(CFG.hour, dayOfYear(lam));
  CFG.sunElev = Math.asin(clamp(sd[1], -1, 1));
  CFG.sunAzimuth = Math.atan2(sd[0], sd[2]);
  if (!R.pole) R.pole = norm(enuToWorld([0, Math.cos(SITE.lat * PI / 180), Math.sin(SITE.lat * PI / 180)]));

  // how hard is the sun sweeping? this relaxes TAA and paces the IBL rebake
  const step = Math.acos(clamp(dot(prev, sd), -1, 1));
  R.sunMotion = Math.min(1, Math.max(R.sunMotion * Math.exp(-dt * 6.0), step / 0.010));

  updateLightingPalette();

  /* The IBL is low frequency, so it does not need to be rebuilt every frame
     while the dial is moving. The direct beam does, and that is what the eye
     actually tracks across a shadow. Rebake on an angular threshold, and at
     most every other frame while sweeping. */
  const off = R.bakeSun ? Math.acos(clamp(dot(R.bakeSun, sd), -1, 1)) : 9;
  if (off > 0.0055 || (off > 1e-6 && step < 2e-5)) {
    if (R.sunMotion < 0.5 || (R.frame & 1) === 0) { R.skyDirty = true; R.bakeSun = sd.slice(); }
  }

  // open ground wants less haze than a closed corridor
  const want = CAM.pos[2] < 1 ? 0.26 : 1.0;
  R.fogScale += (want - R.fogScale) * Math.min(1, dt * 1.6);
  if ((R.frame & 3) === 0) refreshLiveReadout();
}

let touchLook = null, joy = { active: false, x: 0, y: 0, id: -1 };

/* =========================================================================
   狐巫女 — THE FOX-EARED SHRINE MAIDEN

   The first attempt aimed at the wrong genre entirely. It built a fox: a
   muzzle, fur over the whole body, digitigrade legs, paws. That is ケモノ.
   The reference asked for is ウマ娘, and an ウマ娘 is not an animal person —
   it is a HUMAN GIRL with animal ears and an animal tail. Everything else
   about her is human, and the appeal lives almost entirely in the face and
   the hair.

   So, rebuilt from that premise:

     · human body, human skin, plantigrade legs. Fur appears only on the
       ears and the tail.
     · no muzzle. An anime face: large cranium, small face, cheekbones wide,
       jaw sweeping to a small pointed chin.
     · the eyes are enormous and nearly flat against the face plane, with a
       heavy upper lash line. The lash is the single strongest anime signal
       in the whole model.
     · hair is a major part of the silhouette, not a texture — a cap, a row
       of bangs, two side locks framing the face, a long back mass, and an
       アホ毛.
     · 6.7 heads. Long legs, narrow waist, small hands.
     · 巫女装束 — white 白衣, vermillion 緋袴. It belongs in this shrine, it
       reads instantly to a Japanese eye next to fox ears, and its wide
       sleeves and long skirt hide exactly the joints an unskinned character
       cannot bend cleanly.

   And a toon shading path, without which none of the above matters. See
   the TOON block in the lighting pass: banded diffuse, flat bright ambient,
   suppressed specular, rim light. In PBR this face is a plastic doll.
   ========================================================================= */

/* ---------------- loft ---------------- */
function loft(rings, seg, opts) {
  opts = opts || {};
  const g = new Geo(), mat = opts.mat || 0;
  const uS = opts.uScale === undefined ? 1 : opts.uScale;
  const vS = opts.vScale === undefined ? 1 : opts.vScale;
  const N = rings.length, capA = opts.capStart !== false, capB = opts.capEnd !== false;
  const T = [];
  for (let i = 0; i < N; i++) {
    const a = rings[Math.max(0, i - 1)].p, b = rings[Math.min(N - 1, i + 1)].p;
    let t = sub(b, a);
    if (len(t) < 1e-6) t = [0, 1, 0];
    T.push(norm(t));
  }
  let ref = opts.up || [0, 0, 1];
  const U = [], Rt = [];
  for (let i = 0; i < N; i++) {
    let u = sub(ref, scl(T[i], dot(ref, T[i])));
    if (len(u) < 1e-5) { const alt = Math.abs(T[i][0]) < 0.9 ? [1, 0, 0] : [0, 1, 0]; u = sub(alt, scl(T[i], dot(alt, T[i]))); }
    u = norm(u);
    U.push(u); Rt.push(norm(cross(T[i], u)));
    ref = u;
  }
  const Pp = [];
  for (let i = 0; i < N; i++) {
    const r = rings[i], row = [];
    const rx = r.rx, ry = r.ry === undefined ? r.rx : r.ry;
    const roll = r.roll || 0, off = r.off || [0, 0];
    for (let j = 0; j <= seg; j++) {
      const a = (j / seg) * TAU + roll;
      const sx = Math.cos(a) * rx + off[0], sy = Math.sin(a) * ry + off[1];
      row.push([
        r.p[0] + Rt[i][0] * sx + U[i][0] * sy,
        r.p[1] + Rt[i][1] * sx + U[i][1] * sy,
        r.p[2] + Rt[i][2] * sx + U[i][2] * sy
      ]);
    }
    Pp.push(row);
  }
  const idx = [];
  let vlen = 0;
  for (let i = 0; i < N; i++) {
    if (i > 0) vlen += dist(rings[i].p, rings[i - 1].p);
    const row = [];
    for (let j = 0; j <= seg; j++) {
      const a = Pp[i][(j + seg - 1) % seg], b = Pp[i][(j + 1) % seg];
      const c = Pp[Math.max(0, i - 1)][j], d = Pp[Math.min(N - 1, i + 1)][j];
      let nr = cross(sub(b, a), sub(d, c));
      if (len(nr) < 1e-9) nr = sub(Pp[i][j], rings[i].p);
      nr = norm(nr);
      if (dot(nr, sub(Pp[i][j], rings[i].p)) < 0) nr = scl(nr, -1);
      const p = Pp[i][j];
      row.push(g.push(p[0], p[1], p[2], nr[0], nr[1], nr[2], (j / seg) * uS, vlen * vS, mat));
    }
    idx.push(row);
  }
  for (let i = 0; i < N - 1; i++) for (let j = 0; j < seg; j++)
    g.quad(idx[i][j], idx[i + 1][j], idx[i + 1][j + 1], idx[i][j + 1]);
  const cap = (i, flip) => {
    const c = rings[i].p, t = scl(T[i], flip ? -1 : 1);
    const ci = g.push(c[0], c[1], c[2], t[0], t[1], t[2], 0.5, 0.5, mat);
    for (let j = 0; j < seg; j++) {
      const a = idx[i][j], b = idx[i][j + 1];
      if (flip) g.tri(ci, a, b); else g.tri(ci, b, a);
    }
  };
  if (capA) cap(0, true);
  if (capB) cap(N - 1, false);
  return g;
}

/* A shallow domed disc with RADIAL uvs, so a texture authored in polar
   terms — an iris — maps the way it was drawn. An ellipsoid's spherical
   parameterisation would smear it round the equator. */
function domeDisc(rx, ry, bulge, seg, rows, mat) {
  const g = new Geo(), grid = [];
  for (let i = 0; i <= rows; i++) {
    const rr = i / rows, row = [];
    for (let j = 0; j <= seg; j++) {
      const a = (j / seg) * TAU, ca = Math.cos(a), sa = Math.sin(a);
      const x = ca * rx * rr, y = sa * ry * rr;
      const z = bulge * Math.sqrt(Math.max(0, 1 - rr * rr));
      const nx = -x / (rx * rx) * bulge * 2, ny = -y / (ry * ry) * bulge * 2;
      const l = Math.hypot(nx, ny, 1) || 1;
      row.push(g.push(x, y, z, nx / l, ny / l, 1 / l,
        0.5 + ca * rr * 0.5, 0.5 + sa * rr * 0.5, mat));
    }
    grid.push(row);
  }
  // wound outward-then-round, so the disc faces +Z; the other order puts its
  // back to the viewer and backface culling swallows the iris whole
  for (let i = 0; i < rows; i++) for (let j = 0; j < seg; j++)
    g.quad(grid[i][j], grid[i + 1][j], grid[i + 1][j + 1], grid[i][j + 1]);
  return g;
}

function ellipsoid(rx, ry, rz, seg, opts) {
  opts = opts || {};
  const g = new Geo(), mat = opts.mat || 0, rows = opts.rows || Math.max(4, seg >> 1);
  const grid = [];
  for (let i = 0; i <= rows; i++) {
    const v = i / rows, phi = v * PI, sp = Math.sin(phi), cp = Math.cos(phi), row = [];
    for (let j = 0; j <= seg; j++) {
      const th = (j / seg) * TAU, ct = Math.cos(th), st = Math.sin(th);
      const x = sp * ct, y = cp, z = sp * st;
      const nx = x / rx, ny = y / ry, nz = z / rz;
      const l = Math.hypot(nx, ny, nz) || 1;
      row.push(g.push(x * rx, y * ry, z * rz, nx / l, ny / l, nz / l,
        (j / seg) * (opts.uScale || 1), v * (opts.vScale || 1), mat));
    }
    grid.push(row);
  }
  for (let i = 0; i < rows; i++) for (let j = 0; j < seg; j++)
    g.quad(grid[i][j], grid[i][j + 1], grid[i + 1][j + 1], grid[i + 1][j]);
  return g;
}

/* ---------------- the ink line ----------------
   An inverted hull: copy the surface, push every vertex out along its own
   normal, flip the winding. Backface culling then shows the copy only where
   it escapes past the silhouette of the original, which is exactly a line
   of constant screen weight around the form. Without this the character
   reads as untextured polygons no matter how good the shading is. */
function shellOf(geo, width) {
  const g = new Geo();
  const nv = geo.vcount;
  for (let i = 0; i < nv; i++) {
    g.push(
      geo.p[i * 3] + geo.n[i * 3] * width,
      geo.p[i * 3 + 1] + geo.n[i * 3 + 1] * width,
      geo.p[i * 3 + 2] + geo.n[i * 3 + 2] * width,
      -geo.n[i * 3], -geo.n[i * 3 + 1], -geo.n[i * 3 + 2],
      geo.uv[i * 2], geo.uv[i * 2 + 1], MAT.OUTLINE);
  }
  for (let i = 0; i < geo.idx.length; i += 3)
    g.tri(geo.idx[i], geo.idx[i + 2], geo.idx[i + 1]);
  return g;
}

/* A hair lock: a flat tapering ribbon that ends in a point. Anime hair is
   read as a stack of these, never as a solid volume, and the pointed tip is
   what stops it looking like a helmet. */
function hairLock(pts, w0, w1, thick, mat) {
  const rings = [];
  const n = pts.length;
  for (let i = 0; i < n; i++) {
    const k = i / (n - 1);
    const taper = Math.pow(1 - k, 0.65);
    rings.push({ p: pts[i], rx: lerp(w0, w1, k) * (0.35 + 0.65 * taper), ry: thick * (0.4 + 0.6 * taper) });
  }
  return loft(rings, 12, { mat: mat === undefined ? MAT.HAIR : mat, uScale: 0.6, vScale: 1.4, up: [0, 0, 1] });
}
