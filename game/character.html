/* ---------------- the face is DRAWN, not modelled ----------------

   This is the thing the earlier passes got wrong at the root. In an anime
   3D character the eyes, lashes, brows, mouth and nose are not geometry —
   they are a painted texture on a smooth head. Modelling each feature is
   why they read as objects stuck onto a skull rather than as a face.

   So the face is authored the way it would actually be authored: with a 2D
   drawing tool. Canvas gives beziers, gradients and clipping, which is
   everything an anime eye needs — and an anime eye is a stack of about ten
   deliberate layers, not a coloured disc.                                  */

const FACE_RES = 1024;

/* Repainted for realism. The anime version put the whole eye on the
   texture; a realistic eye is an actual sphere in an actual socket, so the
   drawing now carries only what geometry cannot: the lid margin and its
   lashes, the socket shading, the lips and their vermillion border, brows
   as individual hairs, and the tonal drift that makes a face look lived in.  */
/* Everything below is placed in WORLD millimetres on the head and converted
   here. The drawing and the geometry then cannot drift apart — which they
   did, twice, while the painter carried its own hand-tuned canvas
   fractions and the model moved underneath it. */
let PS = 1024;
const PX = x => (0.5 + x / FACE_U) * PS;          // world x  → canvas x
const PY = y => (0.5 - (y - FACE_CY) / FACE_V) * PS;  // world y → canvas y (flipped on upload)
const PW = d => (d / FACE_U) * PS;                // a world length, across
const PH = d => (d / FACE_V) * PS;                // a world length, up

function drawBrow(c, sx) {
  const bx = PX(sx * BROW_X), by = PY(BROW_Y);
  const W = PW(0.0232), H = PH(0.0064);
  /* An anime brow is a SHAPE, not hairs. The realistic version drew 340
     individual strands and every one of them fought the drawn eye below
     it. One clean tapered stroke, thick at the head, dying at the tail —
     with a soft duplicate underneath so the edge is not a decal. */
  const arc = (k, alpha, col) => {
    c.fillStyle = 'rgba(' + col + ',' + alpha + ')';
    c.beginPath();
    c.moveTo(bx - sx * W * k, by + H * (0.30 * k));
    c.quadraticCurveTo(bx - sx * W * 0.20 * k, by - H * (1.00 * k),
                       bx + sx * W * k, by - H * (0.10 * k));
    c.quadraticCurveTo(bx + sx * W * 0.10 * k, by - H * (0.22 * k),
                       bx - sx * W * k, by + H * (0.92 * k));
    c.closePath(); c.fill();
  };
  arc(1.10, 0.20, '104,68,50');
  arc(1.00, 0.92, '92,58,42');
}

function drawLidAndLashes(c, sx) {
  const cx = PX(sx * EYE_P[0]), cy = PY(EYE_P[1]);
  // the aperture is stated in millimetres now, so the lash line lands on
  // the modelled rim with nothing to convert
  const W = PW(EYE_HW), HU = PH(EYE_HU), HD = PH(EYE_HD);
  const ux = t => cx + sx * W * Math.cos(t);      // t=0 外眼角 … PI 内眼角
  const uy = t => cy - HU * Math.sin(t);
  const ly = t => cy + HD * Math.sin(t);
  c.lineCap = 'round'; c.lineJoin = 'round';

  // アイシャドウ : a soft warm wash over the top third of the eye only
  const sg = c.createLinearGradient(0, cy - HU * 1.30, 0, cy + HD * 0.30);
  sg.addColorStop(0.00, 'rgba(170,104,110,0.30)');
  sg.addColorStop(0.55, 'rgba(186,126,124,0.12)');
  sg.addColorStop(1.00, 'rgba(200,150,140,0)');
  c.save();
  c.beginPath(); c.ellipse(cx, cy - HU * 0.18, W * 1.22, (HU + HD) * 0.86, 0, 0, TAU); c.clip();
  c.fillStyle = sg; c.fillRect(cx - W * 1.6, cy - HU * 2.2, W * 3.2, (HU + HD) * 3.4);
  c.restore();

  /* 上まつ毛. The single most important line on an anime face: a heavy
     band that is thickest about two thirds out and flicks past the outer
     corner. Drawn as many short segments with a varying width, because a
     constant-width stroke reads as a wire. */
  const N = 64;
  for (let i = 0; i < N; i++) {
    const t0 = (i / N) * PI, t1 = ((i + 1) / N) * PI;
    const u = 1 - t0 / PI;                        // 0 = inner … 1 = outer
    const arch = Math.sin(t0);                    // 0 at corners, 1 at top
    const thick = PH(0.0016 + 0.0074 * Math.pow(arch, 0.50) * (0.40 + 0.60 * Math.pow(u, 0.8)));
    c.strokeStyle = 'rgba(42,28,38,0.96)';
    c.lineWidth = thick;
    c.beginPath(); c.moveTo(ux(t0), uy(t0)); c.lineTo(ux(t1), uy(t1)); c.stroke();
  }
  // the flick past the outer corner, and two lashes off it
  c.strokeStyle = 'rgba(42,28,38,0.96)';
  c.lineWidth = PH(0.0021);
  c.beginPath();
  c.moveTo(ux(0.26), uy(0.26));
  c.quadraticCurveTo(cx + sx * W * 1.02, cy - HU * 0.26,
                     cx + sx * W * 1.16, cy - HU * 0.80);
  c.stroke();
  for (const [a, L] of [[0.06, 1.00], [0.20, 0.78], [0.36, 0.56]]) {
    const t = a * PI;
    c.lineWidth = PH(0.0022 * L);
    c.beginPath();
    c.moveTo(ux(t), uy(t));
    c.quadraticCurveTo(ux(t) + sx * W * 0.16 * L, uy(t) - HU * 0.34 * L,
                       ux(t) + sx * W * 0.30 * L, uy(t) - HU * 0.72 * L);
    c.stroke();
  }
  // 下まぶた : a thin line on the outer half only, and never as dark
  c.strokeStyle = 'rgba(120,80,86,0.60)';
  c.lineWidth = PH(0.0013);
  c.beginPath();
  for (let i = 0; i <= 24; i++) {
    const t = (i / 24) * PI * 0.62;
    if (i) c.lineTo(ux(t), ly(t)); else c.moveTo(ux(t), ly(t));
  }
  c.stroke();
  // 二重 : one light line, well above the lash band
  c.strokeStyle = 'rgba(196,142,132,0.42)';
  c.lineWidth = PH(0.0010);
  c.beginPath();
  c.moveTo(ux(0.86 * PI), uy(0.86 * PI) - HU * 0.30);
  c.quadraticCurveTo(cx, cy - HU * 1.46, ux(0.10 * PI), uy(0.10 * PI) - HU * 0.34);
  c.stroke();
  // 涙袋 : the little cushion under the eye. Cheap, and it is half of what
  // makes an anime eye look kind rather than blank.
  const tg = c.createLinearGradient(0, cy + HD * 0.9, 0, cy + HD * 2.4);
  tg.addColorStop(0, 'rgba(255,238,232,0.42)');
  tg.addColorStop(1, 'rgba(214,150,140,0)');
  c.fillStyle = tg;
  c.beginPath(); c.ellipse(cx + sx * W * 0.06, cy + HD * 1.50, W * 0.80, HD * 0.62, 0, 0, TAU); c.fill();
}

function drawAnimeFace(c, S) {
  PS = S;
  /* Anime skin is ONE value with almost nothing on it. Everything the
     realistic version carried — tonal zones, capillary mottling,
     nasolabial folds, a lip mass, nostrils — is removed, because each of
     them is a thing a drawing would not have. What is left is a blush, a
     nose shadow the size of a grain of rice, and the mouth. */
  c.fillStyle = '#f6d3bd';
  c.fillRect(0, 0, S, S);
  const g0 = c.createLinearGradient(0, PY(0.1400), 0, PY(-0.0620));
  g0.addColorStop(0.00, 'rgba(255,238,222,0.26)');
  g0.addColorStop(0.55, 'rgba(246,206,190,0.10)');
  g0.addColorStop(1.00, 'rgba(226,178,170,0.20)');
  c.fillStyle = g0; c.fillRect(0, 0, S, S);

  const blush = (wx, wy, rx, ry, al, col) => {
    const bx = PX(wx), by = PY(wy);
    const bg = c.createRadialGradient(bx, by, 0, bx, by, Math.max(PW(rx), PH(ry)));
    bg.addColorStop(0, 'rgba(' + col + ',' + al + ')');
    bg.addColorStop(1, 'rgba(' + col + ',0)');
    c.fillStyle = bg;
    c.beginPath(); c.ellipse(bx, by, PW(rx), PH(ry), 0, 0, TAU); c.fill();
  };
  blush(-0.0440, 0.0270, 0.0215, 0.0135, 0.30, '236,140,138');
  blush( 0.0440, 0.0270, 0.0215, 0.0135, 0.30, '236,140,138');
  blush( 0.0000,-0.0450, 0.0150, 0.0090, 0.12, '236,150,142');

  // 鼻 : two soft dots of shadow. No nostrils, no bridge line, no wings.
  for (const sx of [-1, 1]) {
    const nx = PX(sx * 0.0044), ny = PY(0.0118);
    const ng = c.createRadialGradient(nx, ny, 0, nx, ny, PW(0.0046));
    ng.addColorStop(0, 'rgba(184,120,106,0.28)');
    ng.addColorStop(1, 'rgba(196,132,116,0)');
    c.fillStyle = ng;
    c.beginPath(); c.ellipse(nx, ny, PW(0.0046), PH(0.0031), 0, 0, TAU); c.fill();
  }

  /* 口 : small, soft, and closed. An anime mouth at rest is a short curve
     with a hint of a lower lip under it — not a pair of lips. */
  const M = PX(0), lw = PW(0.0128);
  const yM = PY(-0.0230);
  const lg = c.createLinearGradient(0, yM - PH(0.0030), 0, yM + PH(0.0058));
  lg.addColorStop(0.00, 'rgba(206,116,116,0.55)');
  lg.addColorStop(0.45, 'rgba(224,138,132,0.42)');
  lg.addColorStop(1.00, 'rgba(244,182,170,0.18)');
  c.fillStyle = lg;
  c.beginPath();
  c.moveTo(M - lw, yM);
  c.quadraticCurveTo(M, yM - PH(0.0026), M + lw, yM);
  c.quadraticCurveTo(M, yM + PH(0.0064), M - lw, yM);
  c.closePath(); c.fill();
  c.strokeStyle = 'rgba(168,86,88,0.78)';
  c.lineWidth = PH(0.0011);
  c.lineCap = 'round';
  c.beginPath();
  c.moveTo(M - lw * 0.92, yM - PH(0.0002));
  c.quadraticCurveTo(M, yM + PH(0.0018), M + lw * 0.92, yM - PH(0.0002));
  c.stroke();
  // the highlight on the lower lip, one short bright dash
  c.strokeStyle = 'rgba(255,236,226,0.50)';
  c.lineWidth = PH(0.0009);
  c.beginPath();
  c.moveTo(M - lw * 0.34, yM + PH(0.0030));
  c.quadraticCurveTo(M, yM + PH(0.0038), M + lw * 0.34, yM + PH(0.0030));
  c.stroke();

  for (const sx of [-1, 1]) { drawLidAndLashes(c, sx); drawBrow(c, sx); }
}

/* the drawn face is uploaded straight into its own slot of the material
   array, so nothing else in the renderer has to know it came from a canvas */
function bakeFaceLayer(arrA, arrB, res, layer) {
  const cv = document.createElement('canvas');
  cv.width = cv.height = res;
  const c = cv.getContext('2d');
  drawAnimeFace(c, res);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
  gl.bindTexture(gl.TEXTURE_2D_ARRAY, arrA);
  gl.texSubImage3D(gl.TEXTURE_2D_ARRAY, 0, 0, 0, layer, res, res, 1,
    gl.RGBA, gl.UNSIGNED_BYTE, cv);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
  // flat normal, matte, no height: the face must not pick up relief
  const b = new Uint8Array(res * res * 4);
  for (let i = 0; i < res * res; i++) {
    b[i * 4] = 128; b[i * 4 + 1] = 128; b[i * 4 + 2] = 126; b[i * 4 + 3] = 128;
  }
  gl.bindTexture(gl.TEXTURE_2D_ARRAY, arrB);
  gl.texSubImage3D(gl.TEXTURE_2D_ARRAY, 0, 0, 0, layer, res, res, 1,
    gl.RGBA, gl.UNSIGNED_BYTE, b);
}

/* ---------------- the head that carries it ----------------
   One smooth surface from chin to crown, with a FRONT PLANAR uv so the
   drawing lands on the face undistorted. Vertices behind the ear line have
   their uv pushed off the edge of the drawing and clamp to plain skin,
   which the hair covers anyway. */
const HEAD_RINGS = [
  //  y       rx      rz      cz
  [-0.0570, 0.0105, 0.0195,  0.0140],
  [-0.0490, 0.0232, 0.0348,  0.0128],
  [-0.0380, 0.0378, 0.0480,  0.0114],
  [-0.0250, 0.0530, 0.0592,  0.0098],
  [-0.0080, 0.0662, 0.0692,  0.0074],
  [ 0.0120, 0.0748, 0.0762,  0.0052],
  [ 0.0360, 0.0800, 0.0818,  0.0030],
  [ 0.0610, 0.0753, 0.0906,  0.0006],
  [ 0.0870, 0.0744, 0.0940, -0.0020],
  [ 0.1115, 0.0714, 0.0928, -0.0044],
  [ 0.1340, 0.0652, 0.0846, -0.0064],
  [ 0.1512, 0.0552, 0.0672, -0.0078],
  [ 0.1616, 0.0336, 0.0386, -0.0086],
  [ 0.1660, 0.0000, 0.0000, -0.0090]
];
const FACE_U = 0.2060, FACE_V = 0.2660, FACE_CY = 0.0450;

/* every feature that sits on the face — lids, nose, lips, brow ridge —
   takes the SAME front planar uv as the head, so one painted drawing lands
   correctly across all of them instead of each mesh inventing its own */
function faceUV(x, y) {
  return [clamp(0.5 + x / FACE_U, 0.012, 0.988),
          clamp(0.5 + (y - FACE_CY) / FACE_V, 0.012, 0.988)];
}
function planarFaceUV(g) {
  for (let i = 0; i < g.vcount; i++) {
    const uv = faceUV(g.p[i * 3], g.p[i * 3 + 1]);
    g.uv[i * 2] = uv[0]; g.uv[i * 2 + 1] = uv[1];
  }
  return g;
}

/* ---- the two things that separate a head from an egg ----
   (1) The cross-section is not a circle. A face is FLAT across the front
       and flat at the sides; the turn happens at the temple. A circular
       section is precisely what makes CG heads read as mannequins.
   (2) There is relief on it: temples in, cheekbones out, the maxilla
       carrying the mouth forward, the orbit slightly sunk.                */
const HEAD_N = 2.16;                                  // superellipse exponent
const _hp = e => (e < 0 ? -1 : 1) * Math.pow(Math.abs(e), 2 / HEAD_N);

function headRingAt(y) {
  const R = HEAD_RINGS;
  if (y <= R[0][0]) return R[0];
  for (let i = 1; i < R.length; i++) if (y <= R[i][0]) {
    const f = (y - R[i - 1][0]) / (R[i][0] - R[i - 1][0]);
    return [y, lerp(R[i - 1][1], R[i][1], f), lerp(R[i - 1][2], R[i][2], f),
            lerp(R[i - 1][3], R[i][3], f)];
  }
  return R[R.length - 1];
}
function headRelief(x, y) {
  const ax = Math.abs(x);
  /* The skull's own planes, at the depth the reference actually carries.
     The previous pass cut these to a third on the theory that an anime
     face is flat; put side by side with a real stylised model that theory
     is simply wrong. */
  const ox = (ax - 0.0347) / 0.0310, oy = (y - 0.0600) / 0.0240;
  let d = -0.0022 * Math.exp(-ox * ox - oy * oy);                  // 眼窩上縁
  const kx = (ax - 0.0432) / 0.0182, ky = (y - 0.0232) / 0.0158;
  d += 0.0032 * Math.exp(-kx * kx - ky * ky);                      // 頬骨
  const gx = (ax - 0.0398) / 0.0138, gy = (y + 0.0252) / 0.0150;
  d += 0.0024 * Math.exp(-gx * gx - gy * gy);                      // 下顎角
  const mx = x / 0.0300, my = (y + 0.0210) / 0.0300;
  d += 0.0026 * Math.exp(-mx * mx - my * my);                      // 上顎
  const tx = (ax - 0.0648) / 0.0230, ty = (y - 0.0900) / 0.0290;
  d -= 0.0026 * Math.exp(-tx * tx - ty * ty);                      // 側頭
  return d;
}
/* z of the shell at a given (x,y). The eyelids and the face patch need it
   so their edges land ON the skull instead of stopping in mid air. */
function headZ(x, y) {
  const R = headRingAt(y);
  const q = Math.min(1, Math.abs(x) / Math.max(1e-6, R[1]));
  const sn = Math.pow(q, HEAD_N / 2);
  const cs = Math.sqrt(Math.max(0, 1 - sn * sn));
  return R[3] + R[2] * Math.pow(cs, 2 / HEAD_N) + headRelief(x, y);
}

/* ---------------- the face, as relief rather than as parts ----------------

   The nose, the lips and the brow were separate lofted solids sitting on
   the head. Two renders said the same thing: wherever a solid meets the
   shell there is a normal discontinuity, and a nose that meets the cheek
   at a crease reads as a fin glued to a mask no matter what its
   measurements are. Faces do not have seams.

   So the front of the head is one continuous height field over (x,y):
   the shell, plus this relief, faded to nothing at the border so it
   merges back into the skull with no edge at all. Every feature below is
   a form with a measured height in millimetres.                          */
const FP_X = 0.0760, FP_Y0 = -0.0545, FP_Y1 = 0.0880;

function faceRelief(x, y) {
  const ax = Math.abs(x);
  const G = (v, s) => Math.exp(-(v / s) * (v / s));
  let d = 0;
  /* An anime nose is 3mm of form and a shadow. The realistic one was
     9.6mm with wings and a columella — every millimetre of it correct, and
     all of it wrong for this face: the moment a nose casts a real shadow
     the drawing stops working. The mouth goes the same way: small, soft,
     and with no vermilion mass to catch light. */
  /* Landmark heights are the reference's, as fractions of head height:
     nose tip 0.343, mouth 0.155, brow 0.61. Ours had the nose at 0.265 and
     the eyes at 0.410 — the entire face was sitting a fifth of a head too
     low, which no amount of work on the individual features can fix. */
  /* 鼻. 0.0763 of head height = 17.0mm here, against the 6.0mm it had.
     Widened with it — a 17mm ridge 8mm across is a blade, not a nose. */
  const dy = y - 0.0195;
  const nz = 0.0148 * G(dy, dy > 0 ? 0.0310 : 0.0108);
  const nw = 0.0062 + 0.0056 * clamp((0.0560 - y) / 0.0460, 0, 1);
  d += nz * G(x, nw);                                             // 鼻背
  d += 0.0034 * G(ax - 0.0106, 0.0052) * G(y - 0.0116, 0.0044);   // 小鼻
  d -= 0.0016 * G(ax - 0.0092, 0.0028) * G(y - 0.0016, 0.0062);   // 鼻翼溝
  d -= 0.0032 * G(ax - 0.0062, 0.0032) * G(y - 0.0022, 0.0030);   // 鼻孔
  /* the column between the nose and the lip: without it the underside
     of the nose runs straight into a trough and reads as a blob */
  d += 0.0017 * G(x, 0.0092) * G(y + 0.0058, 0.0072);             // 人中稜
  d -= 0.0013 * G(x, 0.0026) * G(y + 0.0026, 0.0054);             // 人中溝
  const LX = w => Math.exp(-Math.pow(ax / w, 3.0));
  d += 0.0042 * G(y + 0.0192, 0.0050) * LX(0.0150);               // 上唇
  d += 0.0048 * G(y + 0.0272, 0.0056) * LX(0.0138);               // 下唇
  d -= 0.0020 * G(y + 0.0230, 0.0020) * LX(0.0156);               // 口裂
  d -= 0.0022 * G(y + 0.0362, 0.0072) * LX(0.0158);               // 頤唇溝
  d += 0.0036 * G(y + 0.0452, 0.0114) * G(x, 0.0168);             // 頤
  d += 0.0014 * G(ax - 0.0082, 0.0044) * G(y + 0.0470, 0.0090);   // 頤結節
  // 鼻唇溝 : from the ala down and out to the corner of the mouth
  const fu = clamp((0.0140 - y) / 0.0340, 0, 1);
  d -= 0.0018 * G(ax - (0.0132 + 0.0086 * fu), 0.0044) * G(y - 0.0140 + 0.0170, 0.0150);
  d += 0.0028 * G(ax - 0.0330, 0.0215) * G(y - 0.0742, 0.0072);   // 眉弓
  d -= eyeSink(x, y);                                             // 眼窩
  return d;
}
function facePatchLimit(y) { return Math.min(FP_X, headRingAt(y)[1] * 0.86); }
function facePatchFade(x, y) {
  const XL = facePatchLimit(y), ty = (y - FP_Y0) / (FP_Y1 - FP_Y0);
  return smoothstep(1.0, 0.74, Math.abs(x) / XL) *
         smoothstep(0.0, 0.10, ty) * smoothstep(1.0, 0.88, ty);
}
/* the head's actual surface — the shell and this are now the same thing */
function faceZ(x, y) {
  return headZ(x, y) + faceRelief(x, y) * facePatchFade(x, y);
}

/* ---------------- the forms a texture cannot carry ----------------
   With the eyes off the texture they have to exist: a real eyeball is a
   24mm sphere with a 12mm iris and a cornea that stands proud of the lid
   plane. And a nose is a form, not a shadow — the one place the anime
   approach and the realistic approach genuinely disagree.                 */
/* ---------------- 眼 ----------------

   Two renders were spent learning the same thing twice: an anime eye is
   not a sphere. A 37mm aperture on a 24mm globe puts the inner corner
   14mm BEHIND the face, so the cheek closes over the eye and what is left
   is a slot. Enlarging the globe only moves the problem — the face itself
   falls away 5.8mm across the width of one eye, and no sphere centred on
   the eye axis can follow that.

   So the eye is built the way an anime model actually builds it: the face
   is SUNK by a shallow socket, and the eye is a sheet that follows the
   face's own surface into it. Everything here — sclera, iris, lid — is a
   patch over (x,y) sharing one height field with the head, which is the
   same rule the nose and the mouth already live by.                       */
/* Aperture 0.158 x 0.088 of head height, centres 0.311 apart, eye line at
   exactly 0.500 — all four straight off the reference. Ours was the right
   width and far too round (0.112 tall), which is why it read as a doll
   rather than as a drawing. */
const EYE_HW = 0.0182, EYE_HU = 0.0114, EYE_HD = 0.0098;  // 瞼裂 half-extents
const IRIS_R = 0.0112;
const EYE_P = [0.0347, 0.0545, 0];
const EYE_SINK = 0.0074;                                  // 眼窩の彫り込み
const BROW_X = 0.0347, BROW_Y = 0.0730;

/* the aperture radius, in metres, in a given direction round it */
function eyeRad(ct, st) {
  const v = st > 0 ? EYE_HU : EYE_HD;
  return 1 / Math.sqrt((ct / EYE_HW) * (ct / EYE_HW) + (st / v) * (st / v));
}
/* how deep the socket is carved at (x,y). faceRelief subtracts it, and the
   eye adds it straight back, so the eye sheet is always parallel to the
   face it sits in — by construction, not by tuning. */
function eyeSink(x, y) {
  const dx = Math.abs(x) - EYE_P[0], dy = y - EYE_P[1];
  const r = Math.hypot(dx / EYE_HW, dy / (dy > 0 ? EYE_HU : EYE_HD));
  return EYE_SINK * Math.exp(-r * r * 0.80);
}
function eyeSurfZ(x, y) { return faceZ(x, y) + eyeSink(x, y) - 0.0009; }

/* a radial patch over the aperture: (angle, radius) → a point on whatever
   surface fn returns. Every piece of the eye is one of these. */
function eyePatch(sx, seg, rn, extent, mat, fn, uvfn) {
  const g = new Geo(), P = [];
  for (let k = 0; k <= rn; k++) {
    const row = [];
    for (let i = 0; i <= seg; i++) {
      const th = (i / seg) * TAU, ct = Math.cos(th), st = Math.sin(th);
      const t = k / rn, r = eyeRad(ct, st) * extent * t;
      const x = sx * EYE_P[0] + r * ct, y = EYE_P[1] + r * st;
      row.push([x, y, fn(x, y, t, ct, st)]);
    }
    P.push(row);
  }
  const idx = [];
  for (let k = 0; k <= rn; k++) {
    const row = [];
    for (let i = 0; i <= seg; i++) {
      const a = P[k][(i + seg - 1) % seg], b = P[k][(i + 1) % seg];
      const c = P[Math.max(0, k - 1)][i], e = P[Math.min(rn, k + 1)][i];
      let nr = cross(sub(b, a), sub(e, c));
      if (len(nr) < 1e-12) nr = [0, 0, 1];
      nr = norm(nr);
      if (nr[2] < 0) nr = scl(nr, -1);
      const p = P[k][i];
      const th = (i / seg) * TAU;
      const uv = uvfn ? uvfn(k / rn, Math.cos(th), Math.sin(th)) : faceUV(p[0], p[1]);
      row.push(g.push(p[0], p[1], p[2], nr[0], nr[1], nr[2], uv[0], uv[1], mat));
    }
    idx.push(row);
  }
  for (let k = 0; k < rn; k++) for (let i = 0; i < seg; i++)
    g.quad(idx[k][i], idx[k + 1][i], idx[k + 1][i + 1], idx[k][i + 1]);
  return g;
}

/* 白目 : a sheet on the eye surface, run a little past the aperture so its
   rim is always under the lid */
function mikoEyeball(detail) {
  const g = new Geo();
  for (const sx of [-1, 1])
    g.merge(eyePatch(sx, detail ? 44 : 15, detail ? 6 : 2, 1.16, MAT.SCLERA,
      (x, y) => eyeSurfZ(x, y),
      (t, ct, st) => [0.5 - sx * t * ct * 0.5, 0.5 + t * st * 0.5]));
  return g;
}

/* 虹彩 : its own radial patch, so the polar drawing in hEye lands square on
   it, with a cornea bulge over the middle */
function mikoIris(detail) {
  const g = new Geo();
  const SEG = detail ? 38 : 14, RN = detail ? 5 : 3;
  for (const sx of [-1, 1]) {
    const cx = sx * (EYE_P[0] + sx * 0.0008), cy = EYE_P[1] - 0.0006;
    const P = [];
    for (let k = 0; k <= RN; k++) {
      const row = [];
      for (let i = 0; i <= SEG; i++) {
        const th = (i / SEG) * TAU, t = k / RN;
        const x = cx + IRIS_R * t * Math.cos(th), y = cy + IRIS_R * 1.03 * t * Math.sin(th);
        row.push([x, y, eyeSurfZ(x, y) + 0.0007 + 0.0032 * Math.sqrt(Math.max(0, 1 - t * t))]);
      }
      P.push(row);
    }
    const idx = [];
    for (let k = 0; k <= RN; k++) {
      const row = [];
      for (let i = 0; i <= SEG; i++) {
        const a = P[k][(i + SEG - 1) % SEG], b = P[k][(i + 1) % SEG];
        const c = P[Math.max(0, k - 1)][i], e = P[Math.min(RN, k + 1)][i];
        let nr = cross(sub(b, a), sub(e, c));
        if (len(nr) < 1e-12) nr = [0, 0, 1];
        nr = norm(nr);
        if (nr[2] < 0) nr = scl(nr, -1);
        const p = P[k][i], th = (i / SEG) * TAU, t = k / RN;
        row.push(g.push(p[0], p[1], p[2], nr[0], nr[1], nr[2],
          0.5 + Math.cos(th) * t * 0.5, 0.5 + Math.sin(th) * t * 0.5, MAT.EYE));
      }
      idx.push(row);
    }
    for (let k = 0; k < RN; k++) for (let i = 0; i < SEG; i++)
      g.quad(idx[k][i], idx[k + 1][i], idx[k + 1][i + 1], idx[k][i + 1]);
  }
  return g;
}

/* 睫毛 : a ribbon rooted on the upper margin, curling up and outward,
   longest over the outer third. Emitted twice with opposite normals — a
   lash is a sheet and has to be lit from both sides. */
function mikoLash(detail) {
  const g = new Geo();
  const SEG = detail ? 36 : 13, KN = 3;
  for (const sx of [-1, 1]) {
    const P = [];
    for (let i = 0; i <= SEG; i++) {
      const th = (i / SEG) * PI;              // 0 = 外眼角 … PI = 内眼角
      const ct = Math.cos(th), st = Math.sin(th);
      const r0 = eyeRad(ct, st);
      const bx = sx * EYE_P[0] + r0 * ct, by = EYE_P[1] + r0 * st;
      const bz = faceZ(bx, by) + 0.0009;
      const u = 1 - th / PI;                  // 1 at the outer corner
      const L = (0.0024 + 0.0098 * Math.pow(u, 1.18)) * (0.40 + 0.60 * Math.pow(st, 0.45));
      const d = norm([sx * (0.40 + 0.34 * u), 0.74, 0.30]);
      const row = [];
      for (let k = 0; k <= KN; k++) {
        const t = k / KN, c = t * t * 0.40;   // the tip curls up more than the root
        row.push([bx + d[0] * L * t * (1 - c * 0.5),
                  by + d[1] * L * t + c * L * 0.55,
                  bz + d[2] * L * t * (1 - c)]);
      }
      P.push(row);
    }
    for (const flip of [false, true]) {
      const idx = [];
      for (let i = 0; i <= SEG; i++) {
        const row = [];
        for (let k = 0; k <= KN; k++) {
          const a = P[Math.max(0, i - 1)][k], b = P[Math.min(SEG, i + 1)][k];
          const c = P[i][Math.max(0, k - 1)], e = P[i][Math.min(KN, k + 1)];
          let nr = cross(sub(b, a), sub(e, c));
          if (len(nr) < 1e-12) nr = [0, 0, 1];
          nr = norm(nr);
          if (nr[2] < 0) nr = scl(nr, -1);
          if (flip) nr = scl(nr, -1);
          const p = P[i][k];
          row.push(g.push(p[0], p[1], p[2], nr[0], nr[1], nr[2],
            i / SEG, k / KN, MAT.CHAR));
        }
        idx.push(row);
      }
      for (let i = 0; i < SEG; i++) for (let k = 0; k < KN; k++) {
        if (flip) g.quad(idx[i][k], idx[i][k + 1], idx[i + 1][k + 1], idx[i + 1][k]);
        else      g.quad(idx[i][k], idx[i + 1][k], idx[i + 1][k + 1], idx[i][k + 1]);
      }
    }
  }
  return g;
}

/* 涙線 : the wet meniscus along the whole margin. Two millimetres of
   low-roughness geometry that does nothing but catch a glint — which is
   most of why a rendered eye looks alive. */
function mikoTearLine(detail) {
  const g = new Geo();
  const SEG = detail ? 48 : 18;
  for (const sx of [-1, 1])
    g.merge(eyePatch(sx, SEG, 2, 1.0, MAT.EYE,
      (x, y, t) => {
        const k = smoothstep(0.86, 1.0, t);   // only the outermost sliver
        return lerp(eyeSurfZ(x, y), faceZ(x, y) + 0.0011, k) + k * 0.0004;
      },
      t => [0.5, 0.5 + (t - 0.93) * 3.0]));
  return g;
}

/* 瞼 : a ring of skin running outward from the aperture rim, standing a
   couple of millimetres proud at the margin and thinning into the face.
   The heavy lash line that reads as an anime lid is PAINTED on it; the
   geometry only has to set the eye into the head. */
function mikoLid(detail) {
  const g = new Geo();
  const OUT = 1.72;
  for (const sx of [-1, 1])
    g.merge(eyePatch(sx, detail ? 44 : 16, detail ? 4 : 2, OUT, MAT.FACE,
      (x, y, t, ct, st) => {
        // t runs 0 at the eye centre; the lid only exists past the aperture
        const u = clamp((t * OUT - 1.0) / (OUT - 1.0), 0, 1);
        const th = (0.0016 + 0.0016 * clamp(st, 0, 1)) * (1 - u) * (1 - u);
        return faceZ(x, y) + th + 0.0004;
      }));
  return g;
}

/* mikoFacePatch used to live here: a dense (x,y) grid laid over the front
   of the skull. It bought resolution for the nose and the mouth at the cost
   of a visible border, which is a bad trade — the head shell carries the
   relief directly now and there is no second surface at all. */

/* linear resample of the ring table — the authored rings stay put */
function densifyHeadRings(rings, mult) {
  const out = [];
  for (let i = 0; i < rings.length - 1; i++)
    for (let k = 0; k < mult; k++) {
      const t = k / mult, a = rings[i], b = rings[i + 1];
      out.push([lerp(a[0], b[0], t), lerp(a[1], b[1], t),
                lerp(a[2], b[2], t), lerp(a[3], b[3], t)]);
    }
  out.push(rings[rings.length - 1]);
  return out;
}

function mikoHead(detail) {
  const g = new Geo();
  const SEG = detail ? 88 : 20;
  /* The reference meshes the face at a 4.0mm median edge; our shell ran at
     9.6mm around and 16mm up. Most of the front is covered by the face
     patch, but the jaw, the temples and the back of the skull are this
     mesh, and they were faceting. */
  const R = detail ? densifyHeadRings(HEAD_RINGS, 4) : HEAD_RINGS, N = R.length;
  const P = [], UV = [];
  for (let i = 0; i < N; i++) {
    const [y, rx, rz, cz] = R[i], row = [], urow = [];
    for (let j = 0; j <= SEG; j++) {
      /* 3x denser at the front and the back than at the sides: the flat
         front is where the features are and where a superellipse's own
         parameterisation puts the fewest vertices. */
      const u = (j / SEG) * TAU;
      const a = u - 0.36 * Math.sin(2 * u);   // 0 = dead front
      const s = Math.sin(a), co = Math.cos(a);
      const x = rx * _hp(s);
      // relief only on the face; the back of the skull stays a clean shell
      const fr = clamp(co * 2.2 + 0.55, 0, 1);
      const z = cz + rz * _hp(co)
              + (headRelief(x, y) + faceRelief(x, y) * facePatchFade(x, y) * fr) * fr;
      row.push([x, y, z]);
      // front planar projection; the back is pushed past the border and clamps
      const back = Math.max(0, -co);
      const k = 1 + back * back * 3.2;
      urow.push([
        clamp(0.5 + (x / FACE_U) * k, 0.012, 0.988),
        clamp(0.5 + ((y - FACE_CY) / FACE_V) * (1 + back * back * 0.9), 0.012, 0.988)
      ]);
    }
    P.push(row); UV.push(urow);
  }
  const idx = [];
  for (let i = 0; i < N; i++) {
    const row = [];
    for (let j = 0; j <= SEG; j++) {
      const a = P[i][(j + SEG - 1) % SEG], b = P[i][(j + 1) % SEG];
      const c = P[Math.max(0, i - 1)][j], d = P[Math.min(N - 1, i + 1)][j];
      let nr = cross(sub(b, a), sub(d, c));
      if (len(nr) < 1e-9) nr = [0, i === 0 ? -1 : 1, 0];
      nr = norm(nr);
      const p = P[i][j];
      // force outward, the way loft does; a concave ring can flip the cross
      if (nr[0] * p[0] + nr[2] * (p[2] - R[i][3]) < 0 && (p[0] || p[2] - R[i][3]))
        nr = scl(nr, -1);
      row.push(g.push(p[0], p[1], p[2], nr[0], nr[1], nr[2], UV[i][j][0], UV[i][j][1], MAT.FACE));
    }
    idx.push(row);
  }
  /* These rings run +Z toward +X, the opposite way round from loft's, so the
     winding is the mirror of loft's. Getting it wrong culls the whole head
     and leaves its own outline shell showing as a blank mask. */
  for (let i = 0; i < N - 1; i++) for (let j = 0; j < SEG; j++)
    g.quad(idx[i][j], idx[i][j + 1], idx[i + 1][j + 1], idx[i + 1][j]);
  return g;
}

/* The anime eye builders that used to live here — sclera, iris disc, pupil,
   catchlight, lash and brow as separate meshes — are gone. For a realistic
   face the eye is an actual sphere (mikoEyeball) and the lashes and brows
   are drawn into the skin texture, which is where they belong. */

/* ---------------- hair ----------------
   Rebuilt around a parting. A fringe of equal lobes hanging off the crown
   reads as a helmet with teeth; real anime hair springs from a parting,
   sweeps OUTWARD in an S, and leaves the middle of the forehead visible.
   Every lock here is a swept curve, not a straight drop.                  */

/* a lock with a real sweep: cubic through the control points, so the
   silhouette curves instead of hanging */
function sweptLock(pts, w0, w1, thick, mat, n) {
  n = n || 11;
  const out = [];
  for (let i = 0; i <= n; i++) {
    const t = i / n, seg = t * (pts.length - 1);
    const k = Math.min(pts.length - 2, Math.floor(seg)), f = seg - k;
    const p0 = pts[Math.max(0, k - 1)], p1 = pts[k], p2 = pts[k + 1];
    const p3 = pts[Math.min(pts.length - 1, k + 2)];
    const f2 = f * f, f3 = f2 * f, p = [];
    for (let a = 0; a < 3; a++)                       // catmull-rom
      p.push(0.5 * ((2 * p1[a]) + (-p0[a] + p2[a]) * f +
        (2 * p0[a] - 5 * p1[a] + 4 * p2[a] - p3[a]) * f2 +
        (-p0[a] + 3 * p1[a] - 3 * p2[a] + p3[a]) * f3));
    const taper = Math.pow(1 - t, 0.55);
    out.push({ p, rx: lerp(w0, w1, t) * (0.30 + 0.70 * taper), ry: thick * (0.35 + 0.65 * taper) });
  }
  return loft(out, 14, { mat: mat === undefined ? MAT.HAIR : mat, uScale: 0.6, vScale: 1.0, up: [0, 0, 1] });
}

function mikoHair(detail) {
  const g = new Geo(), m = M4.create();
  const S = detail ? 40 : 13;
  const PART = -0.016;                        // the parting, slightly off centre

  /* the reference's hair mass stands 0.151 of head height past the skull
     on each side; ours stood 0.057, which is a swim cap */
  g.merge(ellipsoid(0.1128, 0.1120, 0.0925, S, { rows: detail ? 22 : 8, mat: HAIR, uScale: 1.0, vScale: 1.0 }),
    M4.compose(m, [0, 0.0790, -0.0125], 0, [1, 1, 1]));

  /* 前髪. Two things were wrong before. The locks were round tubes, and a
     round tube of hair is a straw; a lock is a RIBBON, wide across and
     nearly flat through. And every lock started at the parting, so
     seventeen of them fanned out of one point like a hedgehog. Here each
     root sits at its own place on the scalp — on the hair cap's own
     ellipse, so no root floats — and the sweep carries it forward over the
     brow before it falls. */
  /* Anime hair is read as a few LARGE clean shapes with sharp points, not
     as strands. The realism pass went to seventeen thin ribbons and the
     fringe turned into string; this goes the other way — eleven wide, flat
     locks that overlap into one mass, each tapering to an actual point
     (w1 is 4% of w0, so the tip is a spike rather than a stub). */
  const NB = detail ? 24 : 9;
  const RX = 0.0700, RZ = 0.0740, RC = -0.019;      // the cap, at the hairline
  for (let i = 0; i < NB; i++) {
    const u = ((i + 0.5) / NB) * 2 - 1, sg = u < 0 ? -1 : 1, a = Math.abs(u);
    const ph = sg * (0.20 + a * 1.10);
    const xr = RX * Math.sin(ph), zr = RC + RZ * Math.cos(ph);
    const x1 = PART * 0.5 + sg * (0.034 + a * 0.098);
    // ends just above the brow in the middle, at the cheek at the sides
    // the eye line moved to 0.500 of head height, so the fringe has to
    // end higher too — it was hanging over the whole eye
    const L = 0.034 + 0.98 * Math.abs(x1) + ((i % 3) - 1) * 0.013;
    // 0.185 of head height proud of the face, per the reference
    const fz = 0.1190 - 0.088 * Math.pow(Math.min(1, Math.abs(x1) / 0.128), 2);
    const w = 0.0205 + 0.0100 * (1 - a);
    g.merge(sweptLock([
      [xr, 0.156, zr],
      [lerp(xr, x1, 0.30), 0.136, fz * 0.94],
      [lerp(xr, x1, 0.68), 0.156 - L * 0.56, fz],
      [x1, 0.156 - L, fz * 0.86],
      [x1 + sg * 0.013, 0.156 - L * 1.08, fz * 0.58]
    ], w, w * 0.04, 0.0068, HAIR));
  }
  // short strands over the parting, so it is not a bald gap
  for (const [x0, x1, L] of [[PART + 0.006, 0.030, 0.062], [PART - 0.006, -0.024, 0.058],
                             [PART + 0.012, 0.050, 0.044], [PART - 0.012, -0.042, 0.040]])
    g.merge(sweptLock([
      [x0, 0.150, 0.050], [x0 * 0.5 + x1 * 0.5, 0.132, 0.084],
      [x1, 0.150 - L, 0.082], [x1 * 1.1, 0.150 - L * 1.15, 0.068]
    ], 0.022, 0.003, 0.007, HAIR));

  /* 横髪. Long, and curved: out at the cheek, in at the jaw, out again at
     the tip. Six flat locks a side rather than three fat ones. */
  const SIDE = [
    [[0.070, 0.150, 0.020], [0.098, 0.062, 0.048], [0.104, -0.036, 0.040],
     [0.086, -0.146, 0.014], [0.096, -0.244, -0.010], [0.078, -0.320, -0.026]],
    [[0.064, 0.152, 0.006], [0.092, 0.058, 0.036], [0.100, -0.052, 0.030],
     [0.082, -0.170, 0.006], [0.090, -0.262, -0.014]],
    [[0.060, 0.152, -0.026], [0.094, 0.058, -0.020], [0.102, -0.058, -0.004],
     [0.084, -0.180, 0.010], [0.090, -0.268, 0.004]],
    [[0.052, 0.154, -0.046], [0.086, 0.062, -0.044], [0.096, -0.048, -0.028],
     [0.080, -0.156, -0.008], [0.086, -0.232, -0.018]],
    [[0.046, 0.150, 0.048], [0.076, 0.086, 0.076], [0.084, 0.006, 0.068],
     [0.070, -0.078, 0.046]],
    [[0.038, 0.150, 0.058], [0.066, 0.092, 0.084], [0.074, 0.020, 0.076],
     [0.062, -0.050, 0.056]]
  ];
  const SW = [0.048, 0.037, 0.044, 0.033, 0.031, 0.025];
  /* interleaved half-width copies, offset along the path, so the mass is
     built from overlapping cards instead of from six tubes */
  const SIDE2 = SIDE.map((pts, i) => pts.map((p, k) =>
    [p[0] * (0.94 - 0.02 * (i % 2)), p[1] - 0.014 - 0.006 * (i % 3), p[2] + 0.012 * ((i % 2) ? 1 : -1)]));
  for (const sx of [-1, 1]) {
    SIDE.forEach((pts, i) =>
      g.merge(sweptLock(pts.map(p => [sx * p[0], p[1], p[2]]), SW[i], SW[i] * 0.05, 0.0080, HAIR)));
    if (detail) SIDE2.forEach((pts, i) =>
      g.merge(sweptLock(pts.map(p => [sx * p[0], p[1], p[2]]), SW[i] * 0.62, SW[i] * 0.03, 0.0062, HAIR)));
  }

  // 後ろ髪 : the mass, then locks of differing length and sweep
  g.merge(loft([
    { p: [0, 0.130, -0.056], rx: 0.088, ry: 0.058 },
    { p: [0, 0.044, -0.080], rx: 0.100, ry: 0.066 },
    { p: [0, -0.070, -0.086], rx: 0.106, ry: 0.062 },
    { p: [0, -0.200, -0.082], rx: 0.100, ry: 0.054 },
    { p: [0, -0.330, -0.070], rx: 0.084, ry: 0.043 }
  ], S, { mat: HAIR, uScale: 1.2, vScale: 1.2, up: [0, 0, 1] }));
  for (const [bx, L, sw] of [[-0.086, 0.26, -0.028], [-0.070, 0.40, -0.022],
                             [-0.054, 0.32, -0.016], [-0.038, 0.50, -0.010],
                             [-0.022, 0.36, -0.006], [-0.006, 0.58, -0.001],
                             [ 0.010, 0.42, 0.004], [0.026, 0.34, 0.008],
                             [ 0.042, 0.54, 0.013], [0.058, 0.38, 0.018],
                             [ 0.074, 0.28, 0.023], [0.088, 0.22, 0.027]])
    g.merge(sweptLock([
      [bx, -0.250, -0.072],
      [bx + sw * 0.5, -0.250 - L * 0.34, -0.062],
      [bx + sw, -0.250 - L * 0.72, -0.044],
      [bx + sw * 1.6, -0.250 - L, -0.020]
    ], 0.034, 0.002, 0.0105, HAIR));

  // アホ毛
  g.merge(sweptLock([
    [0.004, 0.176, -0.008], [0.024, 0.222, 0.010],
    [0.006, 0.248, 0.040], [-0.026, 0.238, 0.062]
  ], 0.011, 0.002, 0.008, HAIR));
  return g;
}

/* fox ear: fur outside, pink inside */
function mikoEar(detail) {
  const g = new Geo();
  const S = detail ? 26 : 9;
  g.merge(loft([
    { p: [0, 0, 0], rx: 0.0345, ry: 0.0205 },
    { p: [0, 0.035, 0.003], rx: 0.0335, ry: 0.0185 },
    { p: [0, 0.070, 0.004], rx: 0.0275, ry: 0.0145 },
    { p: [0, 0.100, 0.003], rx: 0.0180, ry: 0.0095 },
    { p: [0, 0.122, 0.001], rx: 0.0060, ry: 0.0040 }
  ], S, { mat: FUR, uScale: 0.8, vScale: 3.0, up: [0, 0, 1] }));
  return g;
}
function mikoEarIn(detail) {
  const S = detail ? 14 : 7;
  return loft([
    { p: [0, 0.008, 0.0135], rx: 0.0250, ry: 0.0080 },
    { p: [0, 0.044, 0.0155], rx: 0.0225, ry: 0.0070 },
    { p: [0, 0.080, 0.0150], rx: 0.0160, ry: 0.0052 },
    { p: [0, 0.108, 0.0110], rx: 0.0060, ry: 0.0022 }
  ], S, { mat: CHAR, uScale: 0.8, vScale: 3.0, up: [0, 0, 1] });
}

function mikoNeck(detail) {
  const S = detail ? 26 : 8;
  return loft([
    { p: [0, -0.034, 0], rx: 0.0455, ry: 0.0450 },
    { p: [0, 0.006, 0.002], rx: 0.0432, ry: 0.0424 },
    { p: [0, 0.040, 0.003], rx: 0.0416, ry: 0.0408 },
    { p: [0, 0.066, 0.004], rx: 0.0412, ry: 0.0402 }
  ], S, { mat: SKIN, uScale: 0.6, vScale: 2.0, up: [0, 0, 1] });
}

/* torso, mostly under cloth: shoulders and the upper chest are all that show */
function mikoChest(detail) {
  const g = new Geo();
  const S = detail ? 32 : 11;
  /* The torso used to start at the ribs, so there were 176mm of nothing
     between it and the hips. The 白衣 covered it and nobody could see —
     which is the whole argument for looking at the model undressed. It now
     runs down past the waist and overlaps the pelvis. */
  g.merge(loft([
    { p: [0, -0.290, -0.002], rx: 0.073, ry: 0.050 },
    { p: [0, -0.228, -0.001], rx: 0.079, ry: 0.054 },

/* slim arms; the hand is small, which reads as young */
/* Scaling a built Geo, normals included. A non-uniform scale takes the
   inverse transpose on the normal or the shading tilts with it. */
/* Recomputing vertex normals from the faces, averaging across duplicated
   seam vertices by position — a loft repeats its first column, and without
   the merge every garment gets a bright line down one side. */
function recalcNormals(g) {
  const acc = new Float64Array(g.p.length);
  const key = i => (Math.round(g.p[i * 3] * 1e5) + ',' +
                    Math.round(g.p[i * 3 + 1] * 1e5) + ',' +
                    Math.round(g.p[i * 3 + 2] * 1e5));
  const share = new Map();
  for (let i = 0; i < g.vcount; i++) {
    const k = key(i);
    if (!share.has(k)) share.set(k, []);
    share.get(k).push(i);
  }
  for (let t = 0; t < g.idx.length; t += 3) {
    const a = g.idx[t] * 3, b = g.idx[t + 1] * 3, c = g.idx[t + 2] * 3;
    const ux = g.p[b] - g.p[a], uy = g.p[b + 1] - g.p[a + 1], uz = g.p[b + 2] - g.p[a + 2];
    const vx = g.p[c] - g.p[a], vy = g.p[c + 1] - g.p[a + 1], vz = g.p[c + 2] - g.p[a + 2];
    const nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx;
    for (const k of [a, b, c]) { acc[k] += nx; acc[k + 1] += ny; acc[k + 2] += nz; }
  }
  for (const ids of share.values()) {
    let sx = 0, sy = 0, sz = 0;
    for (const i of ids) { sx += acc[i * 3]; sy += acc[i * 3 + 1]; sz += acc[i * 3 + 2]; }
    const l = Math.hypot(sx, sy, sz) || 1;
    for (const i of ids) { g.n[i * 3] = sx / l; g.n[i * 3 + 1] = sy / l; g.n[i * 3 + 2] = sz / l; }
  }
  return g;
}

/* ---------------- シワ ----------------
   Cloth without creases is paper, and no amount of weave in the material
   fixes it: a crease is a FORM, several millimetres deep, and it has to be
   in the geometry to catch light along its length. Displacement along the
   normal by a sharpened sum of three waves in (height, angle) — sharpened
   because a sine is a ripple and cloth folds are ridges with flat panels
   between them. */
function wrinkleGeo(g, amp, fy, fa, seed) {
  for (let i = 0; i < g.vcount; i++) {
    const x = g.p[i * 3], y = g.p[i * 3 + 1], z = g.p[i * 3 + 2];
    const a = Math.atan2(x, z);
    let w = Math.sin(y * fy + a * fa * 0.6 + seed) * 0.60
          + Math.sin(y * fy * 1.87 - a * fa * 1.31 + seed * 2.3) * 0.28
          + Math.sin(y * fy * 3.71 + a * fa * 2.57 + seed * 4.1) * 0.12;
    /* Exponent 4, not 1.55. On the reference garment the median vertex
       sits 1.3mm off the local average and the 99th percentile sits
       8.8mm off — most of the cloth is flat and a few creases are deep.
       A gentle power gives every vertex the same middling displacement,
       which is quilting. This gives the same heavy tail: median ~0.3mm,
       p90 ~4.9mm, p99 ~9.7mm at amp = 12mm. */
    w = (w < 0 ? -1 : 1) * Math.pow(Math.abs(w), 4.0);
    const d = amp * w;
    g.p[i * 3] += g.n[i * 3] * d;
    g.p[i * 3 + 1] += g.n[i * 3 + 1] * d;
    g.p[i * 3 + 2] += g.n[i * 3 + 2] * d;
  }
  return recalcNormals(g);
}

/* Catmull-Rom resample of a loft profile. The authored rings stay exactly
   where they were put; this only fills in between them, so raising the
   density of a garment does not change its shape. */
function densifyRings(rings, mult) {
  const N = rings.length, total = (N - 1) * mult, out = [];
  const at = (arr, k) => arr[Math.max(0, Math.min(N - 1, k))];
  for (let i = 0; i <= total; i++) {
    const t = (i / total) * (N - 1);
    const k = Math.min(N - 2, Math.floor(t)), f = t - k, f2 = f * f, f3 = f2 * f;
    const cr = (a, b, c, d) => 0.5 * ((2 * b) + (-a + c) * f +
      (2 * a - 5 * b + 4 * c - d) * f2 + (-a + 3 * b - 3 * c + d) * f3);
    const g = pick => cr(pick(at(rings, k - 1)), pick(at(rings, k)),
                         pick(at(rings, k + 1)), pick(at(rings, k + 2)));
    out.push({
      p: [g(r => r.p[0]), g(r => r.p[1]), g(r => r.p[2])],
      rx: g(r => r.rx),
      ry: g(r => (r.ry === undefined ? r.rx : r.ry))
    });
  }
  return out;
}

function scaleGeo(g, sx, sy, sz) {
  for (let i = 0; i < g.vcount; i++) {
    g.p[i * 3] *= sx; g.p[i * 3 + 1] *= sy; g.p[i * 3 + 2] *= sz;
    const nx = g.n[i * 3] / sx, ny = g.n[i * 3 + 1] / sy, nz = g.n[i * 3 + 2] / sz;
    const l = Math.hypot(nx, ny, nz) || 1;
    g.n[i * 3] = nx / l; g.n[i * 3 + 1] = ny / l; g.n[i * 3 + 2] = nz / l;
  }
  return g;
}

/* 緋袴 : pleated. A 袴 is a stack of flat panels folded at hard lines, and
   the pleats are the entire reason it reads as 袴 rather than as a skirt.
   The ring radius is modulated by a triangle wave with sharp minima, which
   gives exactly that fluting. */
function mikoHakama(detail) {
  const g = new Geo();
  const SEG = detail ? 180 : 44, NP = 11;      // 11 pleats
  const SUB = detail ? 5 : 1;                  // rows between authored rings
  /* Widened at the hip: the thighs are human width now and were coming
     through the crease of every pleat, where the radius is at its minimum.
     Lengthened too — the legs are shorter, and a 袴 hem sits about 10cm
     off the floor, not at mid-shin. */
  const prof = [
    [ 0.150, 0.104, 0.078, 0.00],
    [ 0.108, 0.112, 0.084, 0.03],
    [ 0.052, 0.136, 0.102, 0.10],
    [-0.070, 0.196, 0.150, 0.17],
    [-0.240, 0.232, 0.176, 0.23],
    [-0.420, 0.258, 0.194, 0.27],
    [-0.600, 0.280, 0.210, 0.30],
    [-0.710, 0.294, 0.221, 0.31],
    [-0.745, 0.296, 0.222, 0.31]
  ];
  /* the authored profile, resampled — a pleat crease can only be as sharp
     as the rows it is sampled on, and eight rows over 900mm is 112mm
     between them */
  const rows = [];
  for (let i = 0; i < prof.length - 1; i++)
    for (let k = 0; k < SUB; k++) {
      const t = k / SUB, a = prof[i], b = prof[i + 1];
      rows.push([lerp(a[0], b[0], t), lerp(a[1], b[1], t),
                 lerp(a[2], b[2], t), lerp(a[3], b[3], t)]);
    }
  rows.push(prof[prof.length - 1]);
  const P = [];
  for (const [y, rx, rz, depth] of rows) {
    const row = [];
    for (let j = 0; j <= SEG; j++) {
      const a = (j / SEG) * TAU;
      // triangle wave, sharpened, so the fold lines are creases not waves
      const t = Math.abs(((a / TAU) * NP % 1) * 2 - 1);
      const k = 1 - depth * Math.pow(1 - t, 2.4);
      row.push([rx * k * Math.sin(a), y, rz * k * Math.cos(a)]);
    }
    P.push(row);
  }
  const idx = [];
  for (let i = 0; i < P.length; i++) {
    const row = [];
    for (let j = 0; j <= SEG; j++) {
      const a = P[i][(j + SEG - 1) % SEG], b = P[i][(j + 1) % SEG];
      const c = P[Math.max(0, i - 1)][j], d = P[Math.min(P.length - 1, i + 1)][j];
      let nr = cross(sub(b, a), sub(d, c));
      if (len(nr) < 1e-9) nr = [0, 1, 0];
      nr = norm(nr);
      if (nr[0] * P[i][j][0] + nr[2] * P[i][j][2] < 0) nr = scl(nr, -1);
      const p = P[i][j];
      g.push(p[0], p[1], p[2], nr[0], nr[1], nr[2], (j / SEG) * 3.0, (0.15 - p[1]) * 1.6, CLOTH);
      row.push(g.vcount - 1);
    }
    idx.push(row);
  }
  /* These rings descend, so +u × +v points INWARD — the mirror of the head's
     case. Getting it wrong culls the front of the skirt and renders the
     inside of its back, with the legs apparently in front of the cloth. */
  for (let i = 0; i < P.length - 1; i++) for (let j = 0; j < SEG; j++)
    g.quad(idx[i][j], idx[i + 1][j], idx[i + 1][j + 1], idx[i][j + 1]);
  // finer creases riding on top of the pleats
  return wrinkleGeo(g, 0.0105, 44.0, 23.0, 5.3);

}

  // the 足袋 split, cut as a shallow groove between big toe and the rest
  g.merge(loft([
    { p: [-0.0055, -0.030, 0.086], rx: 0.0030, ry: 0.0044 },
    { p: [-0.0060, -0.034, 0.126], rx: 0.0026, ry: 0.0036 }
  ], 8, { mat: CLOTH, uScale: 0.3, vScale: 2.0, up: [0, 1, 0] }));
  // 草履 : sole in two layers with a slight upsweep at the toe
  g.merge(loft([
    { p: [0, -0.049, -0.052], rx: 0.0330, ry: 0.0092 },
    { p: [0, -0.052, 0.006], rx: 0.0392, ry: 0.0100 },
    { p: [0, -0.052, 0.070], rx: 0.0388, ry: 0.0098 },
    { p: [0, -0.046, 0.134], rx: 0.0316, ry: 0.0086 },
    { p: [0, -0.038, 0.158], rx: 0.0210, ry: 0.0066 }
  ], S, { mat: MAT.BARK, uScale: 0.8, vScale: 1.2, up: [0, 1, 0] }));
  // 鼻緒 : the thong, from between the toes out to each side
  for (const sx of [-1, 1])
    g.merge(loft([
      { p: [sx * 0.030, -0.043, 0.048], rx: 0.0058, ry: 0.0044 },
      { p: [sx * 0.020, -0.028, 0.086], rx: 0.0062, ry: 0.0046 },
      { p: [0, -0.026, 0.116], rx: 0.0058, ry: 0.0042 }
    ], 8, { mat: CLOTH, uScale: 0.3, vScale: 2.0, up: [0, 1, 0] }));
  return g;
}

/* the tail: four fat segments, cream with a white tip */
function mikoTail(i, detail) {
  const g = new Geo();
  const S = detail ? 26 : 9;
  const R = [0.052, 0.070, 0.066, 0.046][i];
  const R2 = [0.070, 0.070, 0.055, 0.012][i];
  const L = [0.135, 0.140, 0.130, 0.120][i];
  const mat = i === 3 ? CRM : FUR;
  g.merge(ellipsoid(R, R, R, S, { rows: 6, mat, uScale: 0.6, vScale: 0.6 }));
  g.merge(loft([
    { p: [0, 0, 0], rx: R, ry: R },
    { p: [0, 0, -L * 0.5], rx: (R + R2) * 0.54, ry: (R + R2) * 0.54 },
    { p: [0, 0, -L], rx: R2, ry: R2 }
  ], S, { mat, uScale: 0.8, vScale: 1.6, up: [0, 1, 0] }));
  return g;
}

/* ---------------- assembly ---------------- */
const KIT = { mesh: {}, parts: [], world: M4.create() };

/* Line weight per part. Thinner on the face, where a heavy line coarsens
   the features, heavier on the body and the hair mass where it has to
   survive being seen from across a courtyard. */
const OUTLINE_W = {
  head: 0.0020, hair: 0.0030, ear: 0.0022, neck: 0.0020,
  chest: 0.0028, hips: 0.0028, upArm: 0.0024, loArm: 0.0022,
  handL: 0.0016, handR: 0.0016, thigh: 0.0028, shin: 0.0024, foot: 0.0022,
  top: 0.0030, sleeve: 0.0032, hakama: 0.0026, obi: 0.0028,
  tail0: 0.0030, tail1: 0.0030, tail2: 0.0028, tail3: 0.0026
};

/* How much each piece moves in the breeze. Negative = hangs off its joint.
   A 袖 is a bag of air and moves most; an 帯 is bound and barely moves. */
const KIT_WIND = {
  sleeve: -0.085, hakama: -0.050, top: -0.014, obi: -0.016, hair: -0.034
};

function initKitsune(detail) {
  const M = KIT.mesh;
  const G = {
    head: mikoHead(detail), hair: mikoHair(detail), ear: mikoEar(detail),
    neck: mikoNeck(detail), chest: mikoChest(detail), hips: mikoHips(detail),
    upArm: mikoUpArm(detail), loArm: mikoLoArm(detail),
    handL: mikoHand(detail, -1), handR: mikoHand(detail, 1),
    thigh: mikoThigh(detail), shin: mikoShin(detail), foot: mikoFoot(detail),
    top: mikoTop(detail), sleeve: mikoSleeve(detail), hakama: mikoHakama(detail),
    obi: mikoObi(detail),
    earIn: mikoEarIn(detail),
    eyeball: mikoEyeball(detail), iris: mikoIris(detail), lid: mikoLid(detail),
    lash: mikoLash(detail), tear: mikoTearLine(detail)
  };
  for (let i = 0; i < 4; i++) G['tail' + i] = mikoTail(i, detail);
  for (const k in G) M[k] = new Mesh(G[k]);
  // no ink line: a realistic character is separated by light, not by a
  // drawn contour, and an inverted hull on flesh reads as a rubber seam
  if (CFG.inkLine) for (const k in OUTLINE_W) if (G[k]) M[k + '_o'] = new Mesh(shellOf(G[k], OUTLINE_W[k]));

  KIT.parts = [
    ['head', 'head'], ['head', 'eyeball'], ['head', 'iris'],
    ['head', 'lid'], ['head', 'lash'], ['head', 'tear'],
    ['head', 'hair'], ['neck', 'neck'],
    ['earL', 'earIn'], ['earR', 'earIn'],
    ['chest', 'chest'], ['hips', 'hips'],
    ['earL', 'ear'], ['earR', 'ear'],
    ['chest', 'top'], ['hips', 'hakama'], ['hips', 'obi'],
    ['tail0', 'tail0'], ['tail1', 'tail1'], ['tail2', 'tail2'], ['tail3', 'tail3']
  ];
  for (const k of ['L', 'R']) {
    KIT.parts.push(['upArm' + k, 'upArm'], ['loArm' + k, 'loArm'], ['hand' + k, 'hand' + k]);
    KIT.parts.push(['upArm' + k, 'sleeve']);
    KIT.parts.push(['thigh' + k, 'thigh'], ['shin' + k, 'shin'], ['foot' + k, 'foot']);
  }
  // every outlined part gets its shell on the same joint
  if (CFG.inkLine) {
    const base = KIT.parts.slice();
    for (const [j, mk] of base) if (OUTLINE_W[mk]) KIT.parts.push([j, mk + '_o']);
  }
  for (const k in M) { M[k].setInstances([{ m: M4.create(), tint: TINT[k] || [1, 1, 1, 0.3] }]); M[k].instT = null; }
  const seen = {};
  for (const [j, mk] of KIT.parts) {
    if (seen[mk]) continue;
    seen[mk] = 1;
    R.scene.draws.push({ mesh: M[mk], name: 'kit_' + mk, zMax: 62, wind: KIT_WIND[mk] || 0 });
    R.scene.shadowDraws.push({ mesh: M[mk], zMax: 62, wind: KIT_WIND[mk] || 0 });
  }
  poseKitsune();
  groundKitsune();
  poseKitsune();
}

const _kitM = {}, _kitW = {};
function poseKitsune() {
  const W = {};
  const solve = name => {
    if (W[name]) return W[name];
    const J = JOINTS[name];
    const local = _kitM[name] || (_kitM[name] = M4.create());
    const rs = J.rest, an = KIT.pose && KIT.pose[name];
    M4.compose(local, J.p, (rs ? rs[1] : 0) + (an ? an[1] : 0), J.s || ONE3,
      (rs ? rs[0] : 0) + (an ? an[0] : 0), (rs ? rs[2] : 0) + (an ? an[2] : 0));
    const out = _kitW[name] || (_kitW[name] = M4.create());
    if (J.parent) M4.mul(out, solve(J.parent), local); else M4.mul(out, KIT.world, local);
    W[name] = out;
    return out;
  };
  const byMesh = {};
  for (const [j, mk] of KIT.parts)
    (byMesh[mk] || (byMesh[mk] = [])).push({ m: solve(j), tint: TINT[mk] || [1, 1, 1, 0.3] });
  for (const mk in byMesh) KIT.mesh[mk].updateInstances(byMesh[mk]);
  KIT.joints = W;
  updateHairRing();
}

/* the band of light sits a little above the crown line and follows her */
function updateHairRing() {
  const H = KIT.joints && KIT.joints.head;
  if (!H) { R.hairRing = null; return; }
  R.hairRing = R.hairRing || new Float32Array(3);
  R.hairRing[0] = H[13] + 0.088;
  R.hairRing[1] = 0.045;
  R.hairRing[2] = 1.0;
}

function groundKitsune() {
  let lo = 1e9;
  for (const k of ['footL', 'footR']) {
    const W = KIT.joints[k];
    if (W) lo = Math.min(lo, W[13] - 0.055);
  }
  if (lo < 1e8) JOINTS.root.p[1] -= lo;
}

function placeKitsune(x, y, z, yaw) {
  M4.compose(KIT.world, [x, y, z], yaw || 0, [1, 1, 1]);
  poseKitsune();
}

/* ==== e_char.js ==== */
/* =========================================================================
   VIEWER : boot, orbit camera, UI
   ========================================================================= */

const QUALITY = [
  { name: '低', scale: 0.62, shadow: 1024, mat: 512, ao: true, ssr: false, vol: true, taa: true, dof: false },
  { name: '中', scale: 0.82, shadow: 1536, mat: 512, ao: true, ssr: true, vol: true, taa: true, dof: true },
  { name: '高', scale: 1.00, shadow: 2048, mat: 1024, ao: true, ssr: true, vol: true, taa: true, dof: true },
];

function isMobile() {
  return /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) ||
    (navigator.maxTouchPoints > 1 && Math.min(screen.width, screen.height) < 900);
}

function resize() {
  const q = QUALITY[R.quality];
  const dpr = Math.min(window.devicePixelRatio || 1, 2.0);
  const cw = R.canvas.clientWidth || window.innerWidth;
  const ch = R.canvas.clientHeight || window.innerHeight;
  const w = Math.max(320, Math.round(cw * dpr * q.scale * R.userScale));
  const h = Math.max(200, Math.round(ch * dpr * q.scale * R.userScale));
  R.canvas.width = Math.round(cw * dpr);
  R.canvas.height = Math.round(ch * dpr);
  if (w !== R.w || h !== R.h) allocTargets(w, h);
}

function applyQuality(qi, rebuildShadows) {
  R.quality = qi;
  const q = QUALITY[qi];
  CFG.ao = q.ao; CFG.ssr = q.ssr ? 1.0 : 0.0; CFG.volumetric = q.vol;
  CFG.taa = q.taa; CFG.dof = q.dof && CFG.dofUser;
  if (rebuildShadows) {
    for (const s of R.shadow) { gl.deleteTexture(s.tex); gl.deleteFramebuffer(s.fb); }
    R.shadow = [makeShadowRT(q.shadow), makeShadowRT(q.shadow), makeShadowRT(Math.max(1024, q.shadow >> 1))];
  }
  resize();
}

/* ---------------- orbit camera ----------------
   The character is the subject, so the camera goes round it rather than
   through it. Distance and target height are damped; a hard cut between
   framings makes it impossible to tell whether a change is in the model or
   in the shot.                                                             */
const ORB = {
  yaw: 0.24, pitch: -0.03,
  dist: 3.3, distT: 3.3,
  ty: 0.86, tyT: 0.86,
  spin: false, spinSpeed: 0.35
};

/* named framings. Heights are the character's own landmarks, so they stay
   correct when the model changes underneath them. */
const SHOTS = {
  full:  { dist: 3.30, ty: 0.86, fov: 30 },
  half:  { dist: 1.55, ty: 1.24, fov: 30 },
  face:  { dist: 0.50, ty: 1.575, fov: 30 },
  hand:  { dist: 0.46, ty: 0.80, fov: 30 },
  foot:  { dist: 0.60, ty: 0.16, fov: 32 },
  wide:  { dist: 5.60, ty: 0.90, fov: 34 }
};
function shot(k, yaw) {
  const s = SHOTS[k]; if (!s) return;
  ORB.distT = s.dist; ORB.tyT = s.ty;
  CAM.fovTarget = s.fov * PI / 180;
  if (yaw !== undefined) ORB.yaw = yaw;
  R.expoSnap = true; R.histValid = false;
}

function updateCamera(dt) {
  CAM.fov += (CAM.fovTarget - CAM.fov) * Math.min(1, dt * 11);
  if (ORB.spin) ORB.yaw += dt * ORB.spinSpeed;
  ORB.dist += (ORB.distT - ORB.dist) * Math.min(1, dt * 8);
  ORB.ty += (ORB.tyT - ORB.ty) * Math.min(1, dt * 8);
  ORB.pitch = clamp(ORB.pitch, -1.15, 1.15);

  const cp = Math.cos(ORB.pitch);
  CAM.pos = [Math.sin(ORB.yaw) * cp * ORB.dist,
             ORB.ty + Math.sin(ORB.pitch) * ORB.dist,
             Math.cos(ORB.yaw) * cp * ORB.dist];
  const dir = norm(sub([0, ORB.ty, 0], CAM.pos));
  CAM.yaw = Math.atan2(dir[0], -dir[2]);
  CAM.pitch = Math.asin(clamp(dir[1], -1, 1));

  M4.copy(CAM.prevViewProj, CAM.viewProj);
  M4.lookAt(CAM.view, CAM.pos, add(CAM.pos, dir), [0, 1, 0]);
  M4.perspective(CAM.projNoJitter, CAM.fov, R.w / R.h, CAM.near, CAM.far);
  M4.copy(CAM.proj, CAM.projNoJitter);
  if (CFG.taa) {
    const i = R.jitterIdx % 8;
    CAM.proj[8] += (HALTON2[i] - 0.5) * 2 / R.w;
    CAM.proj[9] += (HALTON3[i] - 0.5) * 2 / R.h;
    R.jitterIdx++;
  }
  M4.mul(CAM.viewProj, CAM.proj, CAM.view);
  M4.invert(CAM.invViewProj, CAM.viewProj);
  M4.invert(CAM.invProj, CAM.proj);
  if (CFG.dof) CFG.focusDist += (ORB.dist - CFG.focusDist) * Math.min(1, dt * 3);
}

/* ---------------- part visibility ----------------
   Stripping the costume off is the only way to judge the body, and hiding
   the hair is the only way to judge the skull. The draw lists are rebuilt
   from a master copy rather than flagged, so nothing in the renderer has to
   learn about visibility. */
const GROUPS = {
  clothes: ['top', 'sleeve', 'hakama', 'obi'],
  hair: ['hair'],
  ears: ['ear', 'earIn'],
  tail: ['tail0', 'tail1', 'tail2', 'tail3']
};
const HIDDEN = {};
function setGroup(name, on) {
  HIDDEN[name] = !on;
  const dead = new Set();
  for (const k in HIDDEN) if (HIDDEN[k]) for (const p of GROUPS[k]) dead.add('kit_' + p);
  const live = R.kitDraws.filter(d => !dead.has(d.name));
  R.scene.draws.length = 0;
  R.scene.draws.push(...R.baseDraws, ...live);
  R.scene.shadowDraws.length = 0;
  R.scene.shadowDraws.push(...R.shadowBase);
  for (const d of live) R.scene.shadowDraws.push({ mesh: d.mesh, zMax: d.zMax });
  R.histValid = false;
}

/* ---------------- sun controls ---------------- */
function setHour(v, snap) {
  CFG.hourTarget = ((v % 24) + 24) % 24;
  const el = document.getElementById('hour');
  if (el && snap) el.value = CFG.hourTarget;
}
function setSekki(v, snap) {
  CFG.sekkiTarget = ((Math.round(v) % 24) + 24) % 24;
  const el = document.getElementById('sekki');
  if (el && snap) el.value = CFG.sekkiTarget;
}
function refreshLiveReadout() {

  set('a_el', (CFG.sunElev * 180 / PI).toFixed(1) + '°');

/* ---------------- input ---------------- */
function setupInput() {
  const c = R.canvas;
  let drag = null;
  const pos = e => ({ x: e.touches ? e.touches[0].clientX : e.clientX,
                      y: e.touches ? e.touches[0].clientY : e.clientY });
  let pinch = 0;
  const dist2 = e => Math.hypot(e.touches[0].clientX - e.touches[1].clientX,
                                e.touches[0].clientY - e.touches[1].clientY);
  const down = e => {
    if (e.touches && e.touches.length > 1) { pinch = dist2(e); drag = null; return; }
    drag = pos(e);
  };
  const move = e => {
    if (e.touches && e.touches.length > 1) {
      const d = dist2(e);
      if (pinch) ORB.distT = clamp(ORB.distT * (pinch / d), 0.28, 14);
      pinch = d; e.preventDefault(); return;
    }
    if (!drag) return;
    const p = pos(e);
    ORB.yaw -= (p.x - drag.x) * 0.006;
    ORB.pitch += (p.y - drag.y) * 0.005;
    drag = p;
    if (e.touches) e.preventDefault();
  };
  const up = () => { drag = null; pinch = 0; };
  c.addEventListener('mousedown', down);
  addEventListener('mousemove', move);
  addEventListener('mouseup', up);
  c.addEventListener('touchstart', down, { passive: true });
  c.addEventListener('touchmove', move, { passive: false });
  addEventListener('touchend', up);
  c.addEventListener('wheel', e => {
    e.preventDefault();
    ORB.distT = clamp(ORB.distT * Math.exp(e.deltaY * 0.0012), 0.28, 14);
  }, { passive: false });

  addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    KEYS[k] = true;
    if (k === '1') shot('full');
    if (k === '2') shot('half');
    if (k === '3') shot('face');
    if (k === '4') shot('hand');
    if (k === '5') shot('foot');
    if (k === '6') shot('wide');
    if (k === 'f') shot(null, ORB.yaw = 0);
    if (k === 'g') ORB.yaw = PI;
    if (k === 'r') { ORB.spin = !ORB.spin; syncUI(); }
    if (k === 'h') foldPanel(!document.getElementById('panel').classList.contains('collapsed'));
    if (k === 'u') { CFG.showUI = !CFG.showUI; document.getElementById('ui').style.display = CFG.showUI ? '' : 'none'; }
    if (k === ' ') e.preventDefault();
  });
  addEventListener('keyup', e => { KEYS[e.key.toLowerCase()] = false; });
}

/* ---------------- UI ---------------- */
function bindSlider(id, get, set, fmt) {
  const el = document.getElementById(id); if (!el) return;
  const out = document.getElementById(id + '_v');
  const sync = () => { if (out) out.textContent = fmt ? fmt(+el.value) : el.value; };
  el.value = get();
  sync();
  el.addEventListener('input', () => { set(+el.value); sync(); });
}
function bindToggle(id, get, set) {
  const el = document.getElementById(id); if (!el) return;
  el.checked = get();
  el.addEventListener('change', () => set(el.checked));
}
function syncUI() {
  const el = document.getElementById('spin'); if (el) el.checked = ORB.spin;
}
/* The panel must always be closeable. It filled a phone screen with no way
   out, which is worse than shipping no panel at all. */
function foldPanel(on) {
  const p = document.getElementById('panel');
  p.classList.toggle('collapsed', on);
  document.getElementById('fold').textContent = on ? '▸' : '▾';
}
function setupUI() {
  bindSlider('sekki', () => CFG.sekkiTarget, v => setSekki(v, false), v => SEKKI[Math.round(v) % 24]);
  bindSlider('hour', () => CFG.hourTarget, v => setHour(v, false), fmtHM);
  bindSlider('expo', () => CFG.exposure, v => CFG.exposure = v,
    v => (v >= 1 ? '+' : '') + ((v - 1) * 100).toFixed(0) + '%');
  bindSlider('fovs', () => CAM.fovTarget * 57.3, v => CAM.fovTarget = v / 57.3, v => v.toFixed(0) + '°');
  bindSlider('rscale', () => 1.0, v => { R.userScale = v; resize(); }, v => (v * 100).toFixed(0) + '%');
  bindToggle('spin', () => ORB.spin, v => ORB.spin = v);
  bindToggle('g_cloth', () => true, v => setGroup('clothes', v));
  bindToggle('g_hair', () => true, v => setGroup('hair', v));
  bindToggle('g_ears', () => true, v => setGroup('ears', v));
  bindToggle('g_tail', () => true, v => setGroup('tail', v));
  bindToggle('dof', () => CFG.dof, v => { CFG.dofUser = v; CFG.dof = v && QUALITY[R.quality].dof; });
  const q = document.getElementById('qual');
  if (q) { q.value = R.quality; q.addEventListener('change', () => applyQuality(+q.value, true)); }
  for (const b of document.querySelectorAll('[data-shot]'))
    b.addEventListener('click', () => shot(b.dataset.shot));
  for (const b of document.querySelectorAll('[data-yaw]'))
    b.addEventListener('click', () => { ORB.yaw = +b.dataset.yaw * PI / 180; R.histValid = false; });
  const head = document.getElementById('phead');
  head.addEventListener('click', () =>
    foldPanel(!document.getElementById('panel').classList.contains('collapsed')));
  foldPanel(window.innerWidth < 760 || window.innerHeight < 520);
}

/* ---------------- boot ---------------- */
async function boot() {
  const canvas = document.getElementById('gl');
  R.canvas = canvas;
  R.userScale = 1.0;
  CFG.dofUser = true;
  gl = canvas.getContext('webgl2', {
    antialias: false, depth: true, stencil: false, alpha: false,
    powerPreference: 'high-performance', preserveDrawingBuffer: true
  });
  if (!gl) { document.getElementById('err').style.display = 'block'; return; }
  if (!gl.getExtension('EXT_color_buffer_float')) {
    document.getElementById('err').textContent = 'このデバイスは EXT_color_buffer_float に対応していません。';
    document.getElementById('err').style.display = 'block'; return;
  }
  gl.getExtension('OES_texture_float_linear');
  gl.getExtension('EXT_float_blend');

  const status = document.getElementById('status');
  const step = async (msg, fn) => { status.textContent = msg; await new Promise(r => setTimeout(r, 12)); fn(); };

  const QS = new URLSearchParams(location.search);
  R.quality = QS.has('q') ? clamp(parseInt(QS.get('q')), 0, 2) : (isMobile() ? 1 : 2);
  const q = Object.assign({}, QUALITY[R.quality]);
  if (QS.has('mat')) q.mat = parseInt(QS.get('mat'));
  if (QS.has('shadow')) q.shadow = parseInt(QS.get('shadow'));
  R.sceneDetail = QS.has('sd') ? parseInt(QS.get('sd')) : 2;

  fullscreenInit();
  await step('シェーダをコンパイル中…', () => initPrograms());
  await step('質感をベイク中…', () => {
    bakeMaterials(q.mat);
    // no decals in the studio, but the g-buffer pass still binds the slot
    const t = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, t);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 1, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE,
      new Uint8Array([0, 0, 0, 0]));
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    R.decalTex = t;
  });
  await step('空と環境光を計算中…', () => {
    R.skyCube = makeCube(256, 7);
    R.irrCube = makeCube(32, 1);
    R.prefCube = makeCube(128, 6);
    R.shadow = [makeShadowRT(q.shadow), makeShadowRT(q.shadow), makeShadowRT(Math.max(1024, q.shadow >> 1))];
    R.cascadeVP = [M4.create(), M4.create(), M4.create()];
    R.meter = [makeRT(1, 1, { format: 'rgba16f' }), makeRT(1, 1, { format: 'rgba16f' })];
    R.expoTex = R.meter[1].tex;
    updateSun(0);
  });
  await step('床を敷いています…', () => { R.scene = buildScene(R.sceneDetail); });
  await step('狐人を彫っています…', () => {
    initKitsune(R.sceneDetail >= 1);
    placeKitsune(0, 0.075, 0, 0);
    R.kitDraws = R.scene.draws.filter(d => d.name && d.name.startsWith('kit_'));
    R.baseDraws = R.scene.draws.filter(d => !(d.name && d.name.startsWith('kit_')));
    const kitMesh = new Set(R.kitDraws.map(d => d.mesh));
    R.shadowBase = R.scene.shadowDraws.filter(d => !kitMesh.has(d.mesh));
    let t = 0;
    for (const k in KIT.mesh) t += KIT.mesh[k].count / 3;
    R.triCount = Math.round(t);
  });
  await step('準備完了', () => {
    applyQuality(R.quality, false);
    resize();
    bakeSky();
    setSekki(15, true); CFG.sekki = 15;
    setHour(11.0, true); CFG.hour = 11.0;
    updateSun(0);
    R.expoSnap = true;
  });

  document.getElementById('loading').style.opacity = '0';
  setTimeout(() => document.getElementById('loading').style.display = 'none', 700);

  addEventListener('resize', resize);
  setupInput();
  setupUI();
  if (QS.get('ui') === '0') { document.getElementById('ui').style.display = 'none'; CFG.showUI = false; }

  let last = performance.now(), acc = 0, frames = 0;
  function loop(now) {
    const dt = Math.min((now - last) / 1000, 0.06);
    last = now;
    R.time += dt;
    acc += dt; frames++;
    if (acc > 0.5) {
      const el = document.getElementById('fps');
      if (el) el.textContent = Math.round(frames / acc) + ' fps';
      acc = 0; frames = 0;
    }
    updateSun(dt);
    updateCamera(dt);
    if (R.frame % 6 === 0) refreshHUD();
    renderFrame(dt);
    R.frame++;
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  window.__exposure = function () {
    if (!R.expoTex || !R.meter) return null;
    gl.bindFramebuffer(gl.FRAMEBUFFER, R.meter[R.meterIdx ^ 1].fb);
    gl.readBuffer(gl.COLOR_ATTACHMENT0);
    const b = new Float32Array(4);
    try { gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.FLOAT, b); }
    catch (e) { gl.bindFramebuffer(gl.FRAMEBUFFER, null); return null; }
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    return { e: b[0], L: b[1] };
  };
  window.__DBG = { CFG, R, CAM, ORB, QUALITY, updateSun, sunENU, shot, setGroup,
                   KIT, JOINTS, poseKitsune, placeKitsune, resize };
  window.__ready = true;
}
addEventListener('load', boot);
</script>
